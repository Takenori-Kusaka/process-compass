claims:
  - id: c1
    quote: "agency must use voluntary consensus standards in lieu of government-unique standards, unless inconsistent with applicable law or otherwise impractical"
    text: "連邦機関は、法に反するか実行不能でない限り、政府固有の標準に代えて自発的合意標準を使わなければならない。"
    locator: "序文・質疑(Q&A の「When must my agency use voluntary consensus standards?」)"
  - id: c2
    quote: "In all cases, your agency has the discretion to decline to use existing voluntary consensus standards if your agency determines that such standards are inconsistent with applicable law or otherwise impractical"
    text: "いかなる場合も、機関は、法に反するか実行不能と判断すれば、既存の自発的合意標準を使わない裁量を持つ(= 適合の優先は、逸脱を認める裁量つきの規定)。"
    locator: undefined
