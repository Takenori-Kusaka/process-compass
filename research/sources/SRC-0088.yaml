summary: 欧州委員会の高リスク分類ドラフトガイドライン(2026年5〜6月)の法律事務所による解説(二次)。人の関与は高リスク分類を変えず、人間の監視は分類を免れる手段ではなく第14条遵守の前提だと整理。Annex III の適用は 2027-12-02、Annex I は 2028-08-02 に延期。
claims:
  - id: c1
    text: ドラフトガイドラインは、人の関与はシステムの意図された目的・領域を変えないため高リスク分類に影響しないと明確化。「人を挟めば規制を外れる」構成は認められない。
    quote: The Draft Guidelines clarify that since human involvement cannot change the purpose and area in which a system is intended to be used, it has no effect on high-risk classification.
    locator: Human involvement does not remove high-risk status
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q1]
    issues: [248, 249]
    stance: qualifies
  - id: c2
    text: 人間の監視は高リスク分類を回避する要素ではなく、第14条遵守の前提条件であり高リスク系の必須要件である。
    quote: human oversight is a prerequisite for compliance with the rules for high-risk AI systems pursuant to Article 14 AI Act and a necessary requirement for systems classified as high-risk.
