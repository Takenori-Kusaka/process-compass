summary: SQiP 2026 の講演概要。単独開発者＋AI ペアの実践でテスト失敗のノイズが品質ゲートを壊す危険と、RCA・ポカ除けによる対策を報告する講演がある。大規模自治体案件で生成 AI を QA へ組み込み、判断責任の曖昧化を新リスクとした講演も含む。
claims:
  - id: c1
    text: AI の生成速度と人のレビュー速度の非対称で CI/E2E の品質ゲートが安全網になるが、「環境差で稀に落ちる」ノイズが混じるとアラート疲れと対症療法の蓄積を招き、開発体制が崩壊しかねない(熊川、単独開発者＋AI の実践報告)。
    quote: 「環境差で稀に落ちる」等のノイズが混入すると、アラート疲れや対症療法の蓄積を招き、開発体制そのものが崩壊しかねない。
    locator: A2-4 経験発表 概要
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q3, TH02-Q5]
    issues: [267, 270]
    stance: supports
  - id: c2
    text: 予期しない E2E 失敗を 6 パターンに分類し、RCA に基づく改善を行った。手段は、AI が新規セッションで必読する教訓集、伝統的なポカ除けとしての自動チェック、対症療法の禁忌化の 3 つで、約 4 週間で CI 失敗率が大きく下がった(自己報告)。
    quote: 伝統的な「ポカ除け」としての自動チェックへの組み込み
    locator: A2-4 経験発表 概要
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q5, TH07-Q6]
    issues: [270, 275]
    stance: supports
  - id: c3
    text: AI はセッションごとに文脈をリセットするため、改善の適用ポイントを教訓集とポカ除けへ移す必要がある、と発表者は結論している。
    quote: 改善の「適用ポイント」を教訓集とポカ除けへ移す必要がある
    locator: A2-4 経験発表 概要
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q5, TH03-Q3]
    issues: [269, 275]
    stance: supports
  - id: c4
    text: 日立システムズは生成 AI エージェントを QA に組み込み、69 名で 6 か月に約 5,920 時間の効果を報告した。一方で、判断責任の所在が曖昧になり、AI 任せによる確認不足という新たな品質リスクが顕在化した(自己報告)。
    quote: 判断責任の所在が曖昧になりやすく、AI任せによる確認不足など「人の判断品質」に起因する新たな品質リスクが顕在化した。
