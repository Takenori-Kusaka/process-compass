summary: 監査法人(Big4)の公認会計士による、財務・会計領域の AI エージェント利用と監査への影響の論考。人は目標設定・結果レビュー・承認へ移ると述べ、Human in the Loop の厚さはリスクアペタイトで決めるとする。職務分掌を AI 同士で満たせるかには触れていない。
claims:
  - id: c1
    text: AI エージェント導入後のファイナンス人材の役割を、AI エージェントへの目標設定・結果レビュー・承認と位置づける。承認は人側に置く見解である。
    quote: AIエージェントの導入に伴い、ファイナンス人材は仕訳入力や決算資料作成といったオペレーション業務から、AIエージェントへの目標設定、結果レビュー、承認を担う役割へとシフトしていきます。
    locator: Ⅱ 2.(表の直後の段落)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: supports
  - id: c2
    text: Human in the Loop を厚くすると安全性は上がるが速度と自律性を失うため、経営が許容できるリスク(リスクアペタイト)に照らして均衡を決めるべきとする。統制の厚さを費用対効果で決める立場。
    quote: もちろん「Human in the Loop」を厚くすれば安全性は高まりますが、その分スピードと自律性は失われます。経営が許容できるリスク（リスクアペタイト）に照らし、「安全性と統制」及び「スピードと自律性」のバランスを決定することが重要となります。
    locator: Ⅲ 1. AI活用リスクに必要な対応とは(ガバナンスの強化)
