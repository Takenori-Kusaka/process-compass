summary: '37号告示の運用についての厚生労働省の疑義応答集(第1集、全 15 問)。発注者から請負事業主への要求と、請負労働者への直接の指示を区別する。Issue #309 の調査が全問を読んだ。'
claims:
- id: c1
  text: 発注者が請負事業主に対して、発注に関わる要求や注文を行うことは、請負労働者への直接の指揮命令ではなく、偽装請負に当たらないとされている。
  quote: 発注者から請負事業主に対して、作業工程の見直しや欠陥商品を製作し直すことなど発注に関わる要求や注文を行うことは、業務請負契約の当事者間で行われるものであり、発注者から請負労働者への直接の指揮命令ではないので労働者派遣には該当せず偽装請負にはあたりません。
  locator: 2. 発注者からの注文(クレーム対応)の A
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 309
  stance: context
- id: c2
  text: 発注者が直接、請負労働者に作業工程の変更や再製作を指示した場合は、直接の指揮命令に当たり、偽装請負と判断されるとされている。
  quote: ただし、発注者が直接、請負労働者に作業工程の変更を指示したり、欠陥商品の再製作を指示したりした場合は、直接の指揮命令に該当することから偽装請負と判断されることになります。
  locator: 同上
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 309
  stance: context
- id: c3
  text: 発注者が作業の内容・順序・方法を文書等で詳細に示し、請負事業主がそのとおりに作業を行う場合も、発注者による指示その他の管理に当たり、偽装請負と判断されるとされている。
  quote: また、こうした指示は口頭に限らず、発注者が作業の内容、順序、方法等に関して文書等で詳細に示し、そのとおりに請負事業主が作業を行っている場合も、発注者による指示その他の管理を行わせていると判断され、偽装請負と判断されることになります。
  locator: 問7(作業工程の指示)の A
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 317
  stance: context
- id: c4
  text: 発注者が請負労働者に行う技術指導等のうち例示に当たるものは、行われたことをもって偽装請負とは判断されないとされている。
  quote: 一般的には、発注者が請負労働者に対して行う技術指導等とされるもののうち次の例に該当するものについては、当該行為が行われたことをもって、偽装請負と判断されるものではありません。
  locator: 問10(請負業務において発注者が行う技術指導)の A
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 317
  stance: context
- id: c5
  text: 業務に必要な機械・設備・機材を発注者から借り入れるか購入する場合は、別個の双務契約を締結することが必要とされている。
  quote: 当該組み込み、塗装、梱包等の業務に必要な機械、設備又は機材は、請負事業主の責任で準備するか、発注者から借り入れる又は購入するのであれば、別個の双務契約を締結することが必要になります。
  locator: 問14(双務契約が必要な範囲)の A
  quant: null
  evidenceKind: normative
  rqs: []
