summary: DS-920 改定案を審議した会議の議事要旨(開催 2026-03-10)。人がガイドラインのルールを全量守る運用の負担と、ルールをシステム側で実装する方向が発言された。発言は個人の意見である。
claims:
  - id: c1
    text: デジタル大臣政務官が、生成 AI のリスクを人が見る運用が膨大になり、人がルールを全量対応するのは負担になると述べ、「要機密情報をプロンプトに入力しない」は最初からシステム上で実装することを検討すべきとした。
    quote: 今後、人がガイドラインのルールを全量対応することが負担になるとも考える。例えば、利活用ルールひな形の「要機密情報をプロンプトに入力しない」の件に関しては、最初からプロンプト規制をシステム上で実装するようなことも検討が必要になってくる。
    locator: 議事要旨(1)各府省庁生成AIシステム定期報告概要への質疑
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q5, TH12-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 産業界の構成員が、重大な影響に当たるかの判断を個々の CAIO に委ねすぎると、府省庁間・案件間でばらつきが生じると懸念した。
    quote: 運用の段階において、重大な影響の該当の判断を個々のCAIOに委ねすぎてしまうと、府省庁間や案件間でばらつきが生じるのではないかと懸念している。
