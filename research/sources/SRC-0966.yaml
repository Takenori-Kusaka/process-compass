summary: '受託・自社製品の Web・モバイル開発会社の品質保証部長が語る部の役割。2025年度に品質管理部から品質保証部へ改編され、結合テスト対応とフェーズゲート運用を担う。開発センター長の直下に置かれ、運用方針はセンター長と品質保証部の間で決まるため意思決定が速い、と自社採用向けに書く(自社報告であり、好意的に書かれる傾向がある)。悩みとして、AI 検証でベテランの領域を AI が想像以上に代替したこと、担うべき本質的な作業の模索、若手の育成を挙げる。出荷・リリース判断とアジャイル・スクラムの記述は無い。'
