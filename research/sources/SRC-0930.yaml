    text: '管理監督者は、品質管理監督システムに係る業務を最上位で管理監督する役員等である。'
    quote: 'この省令で「管理監督者」とは、製造販売業者等の品質管理監督システムに係る業務を最上位で管理監督する役員等をいう。'
    locator: '第2条第10項'
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [461]
    stance: context
  - id: c2
    text: '管理監督者は、品質管理監督システムの実施及び維持の責任者(管理責任者)を任命する。'
    quote: '管理監督者は、製造販売業者等の役員、管理職の地位にある者その他これに相当する者のうちから製造販売業者等の品質管理監督システムの実施及び維持の責任者（以下「管理責任者」という。）を任命しなければならない。'
    locator: '第16条第1項'
    quant: null
    evidenceKind: normative
