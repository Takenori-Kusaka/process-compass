summary: 'QMS 省令(医療機器)の条文。管理監督者(最上位の役員等)、管理責任者、医療機器等総括製造販売責任者、国内品質業務運営責任者(品質保証部門の責任者であること)、設計開発の変更の照査・検証・バリデーション・承認、品質管理監督システムに使うソフトウェアのバリデーションを定める。e-Gov の API の応答(約31万字)を WebFetch の要約モデル経由で読み、条文の引用を取り出した。第71条・第72条は前半、他は別の範囲から取得した。条文の全文照合は未了。'
claims:
