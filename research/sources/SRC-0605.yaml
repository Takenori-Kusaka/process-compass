summary: GitHub Docs のリポジトリ指示ファイルの手順書(日付表記なし、2026-09-30 取得)。リポジトリ全体(copilot-instructions.md)、パス別(.github/instructions/*.instructions.md、applyTo)、エージェント指示(AGENTS.md ほか)の 3 種を定める。長さの数値は、指示ファイルを cloud agent に生成させる推奨プロンプト内の「2 ページ以内」だけで、根拠の測定は示されない。
