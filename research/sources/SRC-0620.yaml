summary: AI 法第13条に基づく指針(全9ページ)。活用事業者にライフサイクル全体の組織的なリスク管理プロセスを含む AI ガバナンスの構築・運用を求めるが、水準は各主体に委ね、人が占めるべき役割は定めていない。
claims:
  - id: c1
    text: 人間中心の要素として、人が最終的に判断する対象を「AI を活用する範囲や条件」に置く。個々の作業や役割を人が占めることは述べていない。
    quote: ＡＩを活用する範囲や条件については、人間自らが最終的な判断を行うこと。
    locator: 1(2) 本指針における適正性確保の考え方 — 人間中心(p.3)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2, TH01-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: 活用事業者と研究開発機関に、設計・開発・提供・実装のライフサイクル全体でリスクを特定・評価・対処する組織的なプロセスを含む AI ガバナンスの構築・運用・継続改善を求める。例示は経営層の関与した監視・評価、情報開示、教育・研修で、開発工程やロール配分は示していない。
    quote: ＡＩの設計・開発・提供・実装等のライフサイクル全体で、リスクの特定・評価・対処をするための組織的なプロセス（経営層の関与したモニタリングや評価の仕組み、情報の適切な開示、教育・研修の実施等）を含むＡＩガバナンスを構築
    locator: 2(1) ＡＩガバナンスによる俯瞰的な適正性の確保(p.5)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: supports
  - id: c3
    text: AI ガバナンスは新規に作るものに限らず、既存の IT システムに適用しているガバナンスプロセスの活用も有用とする(脚注15)。
    quote: ゼロベースからＡＩガバナンスを構築することに限らず、既存のＩＴシステム等に適用されているガバナンスプロセスを活用することも有用である。
    locator: 脚注15(p.5)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c4
    text: 取り組むべき事項の水準は一律に定めず、各主体の規模・立場とリスクに応じ、その時点で適用できる技術と知見を踏まえた適切な水準での対応を求める。
    quote: 取り組むべき事項について、各主体の規模や立場、ＡＩがもたらすリスクに応じて、その時点で適用し得る技術や知見を踏まえて適切な水準で対応することが求められる。
    locator: 1(1) 本指針の位置付け(p.2)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c5
    text: 国は指針と各種ガイドラインをアジャイルかつ継続的に見直し、ガイドラインが指針の趣旨と整合するよう適宜点検するとしている(改訂周期の数値は無い)。
    quote: 本指針及び各種ガイドライン等も、ＡＩの技術進歩による社会の変化をとらえ、アジャイルかつ継続的に見直す。
    locator: 3(3) ＡＩガバナンスの在り方の検討(p.7)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
