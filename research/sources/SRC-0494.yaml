summary: 供給網セキュリティ仕様 SLSA の段階(Draft/Candidate/Approved/Retired)と版番号の規則。既存レベルへの要求追加は MAJOR 版とし、レベルの大意は変えない。現行は v1.2(Source Track を追加)。日付は slsa-framework/slsa の spec-stages.md 最終コミット日。
claims:
  - id: c1
    text: 各仕様ページは、どの段階(Draft/Candidate/Approved/Retired)にあるかを定義へのリンク付きで目立つ位置に表示しなければならない。
    quote: Every specification page should prominently display a Status section stating which stage the specification is in with a link to its definition.
    locator: Specification Stages
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 既存レベルへ新しい要求を加える変更は MAJOR 版に当たる。後方互換の追加(新トラック・新レベル・意味を変えない修正)は MINOR 版とする。
    quote: MAJOR version when making backwards incompatible changes to an Attestation Format or adding new requirements to an existing level in the Core Specification.
    locator: Versioning
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4, TH02-Q4]
    issues: []
    stance: context
  - id: c3
    text: "公開後にレベルの大意は変えない。精密に参照するときは版番号を付ける(例: SLSA Build L3 (v1.0))。"
    quote: Although we can revise the contents of level, we will never change a level’s high-level meaning after publication
    locator: Versioning
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
