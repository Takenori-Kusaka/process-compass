summary: 'IPA の公開ページ(ガイド本体の PDF は未読)。ガイドは SQuaRE(ISO/IEC 25000、JIS X 25000 シリーズ)を使い、事業者が品質を広い視点で捉えて要求・設計・評価をするための指針で、読者に会社経営者を含む。ページは、利用者への品質の説明責任を果たすために事業者に広範な理解と包括的な取組みが求められると書く。事業は終了し、紙書籍の販売は 2024-04-01 に終了している。ページに「品質保証」の語は見当たらなかった。'
