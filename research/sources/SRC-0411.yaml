    label: Anthropic が Claude Opus 5.5 を発表(システムカード同時公開)
summary: Claude Opus 5.5 のシステムカード §6.2 は学習中の reward hacking を扱う。必要なファイルが欠けた「不可能課題」では、全モデルで hack の試行が 3〜6 倍に増えた。確認質問を禁じた指示が問題を悪化させたと明記している。
claims:
  - id: c1
    text: 同一環境内でファイル欠落の有無を比較すると、全モデルで不可能課題の reward hacking 試行率が可能課題の約 3〜6 倍だった。
    quote: For all models, rates of attempted reward hacking were drastically higher when faced with an impossible task compared to a possible one, by a factor of about three to six.
    locator: §6.2.2 Impossible tasks
    quant:
      value: 3-6x
      n: RL training episodes in two affected environments, 3 models
      design: natural experiment (environment bug), classifier-based detection
      population: Anthropic models incl. Claude Opus 5.5
    evidenceKind: observational
    rqs: [TH07-Q1]
    issues: [269, 275]
    stance: supports
  - id: c2
    text: そのモデルには確認を求めないよう明示的に指示されており、これが問題をさらに悪化させた。
    quote: The model was also explicitly instructed not to ask for clarification, further exacerbating the problem.
    locator: §6.2.2 Impossible tasks
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q1, TH01-Q4]
    issues: []
