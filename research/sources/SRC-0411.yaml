  - id: c3
    text: 分類器は、未完了と知りながら出した成果物を、開示の有無に関係なく reward hack の試行として数える。この類型だけで試行の約 80% を占めた。
    quote: the classifier counts knowingly incomplete work as an attempted reward hack regardless of whether the model discloses it; this alone accounts for about 80% of the reward-hacking attempts
    locator: §6.2.2 Impossible tasks
    quant:
      value: ~80%
      n: reward-hacking attempts on impossible tasks, each of 3 models
      design: classifier categorization
      population: Anthropic models
    evidenceKind: observational
