summary: CHI 2026 論文。生成 AI を実務で使う indie ゲーム開発者15名への半構造化インタビュー。現行 AI は teammate を成り立たせる independence と interdependence を欠くと評価され、「AI はチームメイトか」を二値で問うこと自体が単純化だと論じる。対象はソフトウェア開発チームではなく小規模創作チーム。
claims:
  - id: c1
    text: 15名のインタビューで、開発者は現行 AI が小規模チームの teammate を定義する独立性(independence)と相互依存性(interdependence)の要素を欠くと考えている。
    quote: Through 15 interviews with indie developers, our findings suggest that developers believe current AI systems still lack key elements of independence and interdependence that define a teammate in small indie teams.
    locator: Abstract
    quant:
      value: n=15
      n: 15 indie game developers
      design: semi-structured interviews
      population: US 中心の indie 開発者(生成 AI を協働で使用)
    evidenceKind: observational
    rqs: [TH01-Q3]
    issues: [248]
    stance: qualifies
  - id: c2
    text: 「AI を teammate として扱うか」を静的な yes/no で問うことは、開発者が AI の関与を継続的に交渉する過程を単純化しすぎるとする。役割の二値化への注意。
    quote: treating "AI as teammate" as a static, binary (yes-or-no) question would oversimplify the complex process by which indie developers continuously reflect on and negotiate AI’s involvement
    locator: §1 Introduction
    quant: null
    evidenceKind: observational
    rqs: [TH01-Q1, TH01-Q3]
    issues: [248]
    stance: qualifies
  - id: c3
    text: 将来像として、AI は人間の創造性や協働のダイナミクスに直接参加・模倣するのではなく補完すべきだと開発者は描く(自律エージェントから埋め込み型インフラへ)。
    quote: AI should complement rather than directly participate in or imitate human creativity and collaborative dynamics.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: [TH01-Q3]
    issues: [248]
    stance: contradicts
