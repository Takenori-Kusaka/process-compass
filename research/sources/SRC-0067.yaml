summary: Claude Code と API の数百万件の対話から、人がエージェントに与える自律度と、エージェント自身が止まって確認する頻度を測定。経験で auto-approve が20%→40%超に増え、複雑なタスクでは Claude が人の割込みの2倍以上の頻度で確認質問する。
claims:
  - id: c1
    text: 新規ユーザーではセッションの約20%が full auto-approve だが、経験を積む(約750セッション)と40%超に増える。与えられる自律度は能力より遅れて上がる。
    quote: Among new users, roughly 20% of sessions use full auto-approve, which increases to over 40% as users gain experience.
    locator: Findings 箇条書き / Figure 2
    quant:
      value: 20% → 40%超
      n: Claude Code 対話セッション(数百万件、内訳非開示)
      design: observational (privacy-preserving analysis)
      population: Claude Code users, <50 sessions vs ~750 sessions
    evidenceKind: observational
    rqs: [TH01-Q1, TH01-Q3]
    issues: [248]
    stance: qualifies
  - id: c2
    text: 最も複雑なタスクでは、Claude Code が確認のために止まる頻度は人が割り込む頻度の2倍以上。エージェント発の停止が監視の一形態になっている。
    quote: On the most complex tasks, Claude Code stops to ask for clarification more than twice as often as humans interrupt it.
    locator: Findings / Figure 4
    quant:
      value: 2倍以上
      n: 500k interactive Claude Code sessions
      design: observational
      population: Claude Code interactive sessions, by goal complexity
    evidenceKind: observational
    rqs: [TH01-Q4]
    issues: [248]
    stance: supports
  - id: c3
    text: Anthropic 自身が、Claude が適切なタイミングで止まっているとは限らず不要な質問をしている可能性があり、Plan Mode 等の製品機能の影響も受けると留保している。
    quote: "However, it’s important not to overstate this finding: Claude may not be stopping at the right moments, it may ask unnecessary questions, and its behavior might be affected by product features such as Plan Mode."
    locator: Figure 4 直後の段落
    quant: null
    evidenceKind: observational
    rqs: [TH01-Q4]
    issues: [248]
    stance: qualifies
  - id: c4
    text: Claude が自ら止まる理由の 1 位は「案の選択を提示」(35%)で、「実行前の承認・確認」は 11% で最下位。「不足する技術文脈や訂正の提供」(32%)は人が割り込む理由の 1 位であり、Claude が止まる理由ではない。50万件の人の割込みと50万件の完了ターンの標本で、理由の分類は Claude による判定。
    quote: Table 1. Common reasons why Claude stops itself and why humans interrupt Claude, as determined by Claude, based on a sample of 500k human interruptions and 500k completed turns in interactive Claude Code sessions.
    locator: Table 1
    quant:
      value: 35% / 11%(Claude が止まる理由の 1 位と最下位)、32%(人が割り込む理由の 1 位)
      n: 500k completed turns
      design: LLM-classified sample
      population: interactive Claude Code sessions
    evidenceKind: observational
    rqs: [TH01-Q4]
    issues: [248]
    stance: context
