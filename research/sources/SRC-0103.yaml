summary: Anthropic 公式の Claude Code 費用構造の解説(2026-08-14)。1 ターンの請求 = 履歴のキャッシュ読み取り + 新規分のフル入力 + 出力、と分解し、入力が出力の桁違いに多いことを明示する。
claims:
  - id: c1
    text: 典型的なターンでは入力が数万トークン、出力が数百トークンと偏っており、フル価格でプリフィルされるのはそのターンで新しく加わった分だけで、履歴はキャッシュ読み取りとして課金される。
    quote: "A typical turn is lopsided: tens of thousands of tokens going in, a few hundred coming out. But only what's new in that turn gets prefilled at full price."
    locator: Prompt caching 節直前の 5 リクエスト例の直後(What decides the price of a token 内)
