  - id: c2
    text: キャッシュ読み取りは入力の 0.1 倍、書き込みは最大 2 倍。書き込みは 1 トークンにつき一度、読み取りは以後毎ターン発生する。
    quote: Reading from the cache costs 0.1x the input price, because the server loads the state instead of computing it. Writing tokens into the cache costs a bit more than normal input, up to 2x
    locator: Prompt caching 節
    quant:
      value: 0.1x read / up to 2x write
      n: null
