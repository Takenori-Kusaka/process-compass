    issues: [274]
    stance: supports
  - id: c3
    text: サブスク経由の Claude Code ではプロンプトキャッシュは 1 時間で失効する。離席前に /compact、新規セッションで /context を実行して CLAUDE.md や MCP 定義の常時ロード量を確認するよう促す。
    quote: /compact before you take a break from your keyboard. The prompt cache expires after an hour, and summarizing a conversation is much cheaper while it's still cached.
    locator: Maximizing value 節
    quant:
