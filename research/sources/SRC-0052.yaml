  - id: c2
    text: AWS は自動化が進むと開発者が受動的実行に流れ「AI に全部決めさせる」プロセス萎縮が起きると警告する。
    quote: "As AI tools automate more of the Software Development Life Cycle (SDLC), a new risk has emerged: process atrophy. Developers, excited by automation, often drift into passive execution—allowing AI to “decide everything.”"
    locator: 3. Tools that Reduce the Emphasis on Human Oversight
    quant: null
