claims:
  - id: c1
    text: AI-DLC は全ステージで協調的な human-in-the-loop を要求し、AI が計画を生成し関係者が集まって検証する。
    quote: AI-DLC addresses this challenge by requiring a collaborative human-in-the-loop cycle at every stage of the workflow. In this loop, AI generates a plan to execute a task, and relevant stakeholders assemble, review, and validate it.
    locator: 3. Tools that Reduce the Emphasis on Human Oversight
    quant: null
    evidenceKind: vendor-guidance
