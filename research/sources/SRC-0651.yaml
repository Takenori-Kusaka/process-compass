summary: Copier のテンプレートの設定。版を持つ移行の列(_migrations)を宣言し、跨いだ版の移行だけを走らせる。道具の最低の版を下回れば生成と更新を止める。生成元のコミット(_commit)を回答ファイルへ自動で記録する。#315 で、形式の版と版ごとの移行、未知の版を黙って通さない型の前例として引いた。
claims:
  - id: c1
    text: _migrations の各項目は version を指定でき、指定したときは「新しい版 >= 宣言した版 > 古い版」のときだけ走る。version を指定しなければ毎回の更新で走る。移行は更新のときだけ走り、初回の複製では走らない。
    quote: When version is given they will only run when new version >= declared version > old version. Your template will only be marked as unsafe if this condition is true. Migrations will also only run when updating (not when copying for the 1st time).
    locator: migrations
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: supports
  - id: c2
    text: 生成または更新のとき、導入された Copier が _min_copier_version を下回れば、生成を中止してエラーを示す。Git で版管理されたテンプレートから複製・更新するとき、テンプレートの版(vcs_ref)は回答ファイルへ _commit として自動で保存される。
    quote: Upon generating or updating a project, if the installed version of Copier is less than the required one, the generation will be aborted and an error will be shown to the user.
    locator: min_copier_version / vcs_ref
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: supports
