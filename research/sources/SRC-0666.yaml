summary: GitHub の CODEOWNERS の文書。.github/・ルート・docs/ の順に探して最初に見つけたものを使い(ほかを無視するとの明文は無い。#364)、不正な構文の行は飛ばす(誤りは API で取得できる)。#315 で、CODEOWNERS の置き場の重なりと雛形の所有者 @OWNER の残りが失敗ではなく無効化として現れることを、事前点検・契約検査・env-check で確かめる判断の根拠として引いた。
claims:
  - id: c1
    text: CODEOWNERS は .github/・ルート・docs/ のいずれかに置く。複数の場所にあるとき、GitHub はこの順に探し、最初に見つけたものを使う。
    quote: To use a CODEOWNERS file, create a new file called CODEOWNERS in the .github/, root, or docs/ directory of the repository, in the branch where you'd like to add the code owners. If CODEOWNERS files exist in more than one of those locations, GitHub will search for them in that order and use the first one it finds.
    locator: CODEOWNERS file location
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: supports
  - id: c2
    text: 不正な構文の行は飛ばされ、誤りは画面で強調され、API で一覧を取得できる。
    quote: If any line in your CODEOWNERS file contains invalid syntax, that line will be skipped. When you navigate to the CODEOWNERS file in your repository, you can see any errors highlighted. A list of errors in a repository's CODEOWNERS file is also accessible via the API.
    locator: CODEOWNERS syntax
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: supports
