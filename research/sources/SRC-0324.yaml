summary: CLAUDE.md などエージェント向け指示書が際限なく膨らむ現象を、1,867リポジトリ・247,694本の指示の寿命で測定した。理由が失われた指示は消せなくなる(catastrophic remembering)と名づけ、理由をコメントで残すと膨張が止まることを示す。
claims:
  - id: c1
    text: エージェント向け指示書は際限なく育ち、生涯で3倍超(+226%)になり、コミットごとに正味+4.9本の指示が増える。
    quote: agentic prompts grow without bound, more than tripling over their lifetime (+226%), gaining +4.9 net instructions every commit
    locator: Abstract; Figure 1(b)
    quant:
      value: +226% / +4.9 instructions per commit
      n: 247,694 instruction lifetimes / 1,867 GitHub repos
      design: observational(repository mining, survival analysis)
      population: CLAUDE.md などエージェント向け README
    evidenceKind: observational
    rqs: [TH03-Q4, TH05-Q3]
    issues: [269, 274, 272]
    stance: supports
  - id: c2
    text: 指示は古くなるほど削除されにくい(対数ハザード −0.032/コミット)。追加は安いが、理由を失った指示の削除は回帰の危険を伴う。
    quote: the older an instruction gets, the less likely it is to be deleted (log-hazard -0.032/commit)
    locator: Abstract
    quant:
      value: log-hazard −0.032/commit
      n: 同上
      design: observational
      population: 同上
    evidenceKind: observational
    rqs: [TH05-Q5, TH03-Q4]
    issues: [272]
    stance: supports
  - id: c3
    text: 検証可能な環境(IFEval の逆問題)では、潜在的な理由を記したコメントが余剰指示の99.3%を除き(+211.3%→+1.4%)、実世界の指示遵守を最大23.1%改善した。
    quote: comments encoding latent reasoning remove 99.3% of excess instructions (+211.3% to +1.4%)
    locator: Abstract; experiments on inverted IFEval / WildIFEval
    quant:
      value: 余剰の99.3%除去、遵守 最大+23.1%
      n: 184 IFEval worlds ほか
      design: controlled experiment(synthetic verifiable worlds)
      population: IFEval / WildIFEval
    evidenceKind: controlled-experiment
    rqs: [TH03-Q3, TH05-Q5]
    issues: []
    stance: supports
  - id: c4
    text: 指示の同定器は手作業注釈50件でしか検証しておらず、コーパス側の唯一の非自動値だと著者が限界を述べる。
    quote: We validated it once, on 50 hand-annotated transitions, reaching 1.000 precision and 0.933 recall
    locator: Limitations; Table 3
    quant:
      value: precision 1.000 / recall 0.933
      n: 50 transitions(vs 299,440 tracked)
      design: validation
      population: 同上
    evidenceKind: observational
    rqs: [TH03-Q4]
    issues: []
    stance: qualifies
