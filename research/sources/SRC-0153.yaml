summary: Goodpatch による日本企業の生成 AI 新規事業の失敗パターン整理。チャットボットを作ったが使われない、それらしいプロトタイプはできたが売れる目処がない、技術的ハードルで検討が止まる、の 3 類型を示し、技術先行で「誰のどんな行動を変えるか」が抜ける共通点を指摘。PoC 成功で満足し収益化の道筋を描かず停滞する例も挙げる。
