summary: EARS 考案者 Mavin の公式解説ページ(掲載日不明、2026-09 取得。EARS の初出は2009年とページに記載)。節の順序・規則と5パターン(unwanted behaviour を含む)を示す。反例の併記や禁止節についての記述はページ内に見当たらない。
claims:
  - id: c1
    text: EARS の規則は、要求が0個以上の事前条件、0か1個のトリガ、1つのシステム名、1つ以上のシステム応答を持つことを定める。
    quote: "The EARS ruleset states that a requirement must have: Zero or many preconditions; Zero or one trigger; One system name; One or many system responses."
    locator: The EARS Patterns / Generic EARS syntax
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: [269]
    stance: context
  - id: c2
    text: 望まれない状況への応答は If-Then の unwanted behaviour パターンで書く。公式ガイドが扱うのは構文であり、反例の併記や『この基準を満たしても未完成とみなす』類の禁止節には触れていない(ページ全文を確認)。
    quote: Unwanted behaviour requirements are used to specify the required system response to undesired situations and are denoted by the keywords If and Then.
    locator: Unwanted behaviour requirements
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: []
    stance: context
