summary: ISO 26262-2:2018 を修正採用する中国国家規格の改訂の意見募集草案。6.4.9 表1 に確認措置の独立性 I0〜I3 の定義と ASIL 別の要求を載せる。独立性は人数ではなく作成者からの組織上の距離(別人・直属の上長が別・管理と資源とリリース権限の点で別部門)で段階づけられる。#318 は、組織上の距離の段(標準 第1章 1.4)の3軸の比較の材料として引いた。ISO 原文は有償で未読。
claims:
- id: c1
  text: I2 は、作成チームから独立した人、すなわち同じ直属の上長に報告しない人が確認措置を行う段とされている。
  quote: 认可措施应由独立于负责创建工作成果的团队的人员执行，即由不向同一个直接上级报告的人员执行
  locator: 6.4.9.1 表1 脚注 a(I2)
