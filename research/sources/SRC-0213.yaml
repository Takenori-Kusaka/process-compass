claims:
  - id: c1
    text: 各サブエージェントが独自にモデルとツールを使うため、同等の単一エージェント実行よりトークンを多く消費する。
    quote: Because each subagent does its own model and tool work, subagent workflows consume more tokens than comparable single-agent runs.
    locator: Availability
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2, TH04-Q4]
    issues: [274]
    stance: context
  - id: c2
    text: 並列エージェントはまず探索・テスト・トリアージ・要約などの読み取り中心の作業に使い、書き込み中心の並列化は競合と調整負荷を生むので注意せよと推奨する。
    quote: Be more careful with parallel write-heavy workflows, because agents editing code at once can create conflicts and increase coordination overhead.
    locator: Why subagent workflows help
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3, TH10-Q1]
    issues: []
