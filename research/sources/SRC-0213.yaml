  - id: c3
    text: 主スレッドに探索ログやテスト出力を流し込むと「context pollution」「context rot」で信頼性が落ちるため、雑多な作業をサブエージェントへ逃がし要約だけを返させる。
    quote: Subagent workflows help by moving noisy work off the main thread
