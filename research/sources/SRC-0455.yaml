summary: PR数を2倍にせよという企業の指示の前後を追った縦断研究(プレプリント)。1人あたりPRは約2倍になったが、実質的な人のレビューの待ち行列は解消せず、レビューを迂回する経路が増えて見かけのサイクルタイムが下がった。
claims:
  - id: c1
    text: 稼働開発者1人あたりの平均PR数は、指示前(2025年1〜4月)の21.2から2026年4月の44.3へ約2.09倍になった。
    quote: mean PRs per active developer rose from 21.2 in the pre-mandate baseline (Jan–Apr 2025) to 44.3 in Apr 2026
    locator: Overview(Figure 4 の説明)
    quant:
      value: 21.2 → 44.3 PR/人(2.09倍)
      n: 1社・3か月以上稼働の開発者(推定標本)
      design: longitudinal observational(開発者固定効果モデル)
      population: PR倍増指示を出した1企業
    evidenceKind: observational
    rqs: [TH10-Q3, TH11-Q2]
    issues: [273]
    stance: context
  - id: c2
    text: マージ済みPRのうち実質的な人のレビューを受けた割合は、指示前のピーク約48%から約21%へ下がった。実質レビューを受けたPRの P90 サイクルタイムは2026年も約73時間(指示前 約63時間)で、待ち行列は解消していない。
    quote: substantive-review coverage among merged pull requests drops from a pre-mandate peak of ∼48% to ∼21%, and the fast bypassed lanes pull the aggregate down even as the queue stays slow.
    locator: Figure 12 の説明
    quant:
      value: 実質レビュー率 約48% → 約21%
      n: 1社のマージ済みPR(月次)
      design: longitudinal observational
      population: PR倍増指示を出した1企業
    evidenceKind: observational
    rqs: [TH10-Q3, TH11-Q2]
    issues: [273]
    stance: supports
  - id: c3
    text: 著者らは、この企業が速くレビューすることでではなく、実質的な人のレビューを迂回させることで待ち行列を吸収したと結論している(時系列は観察的でノイズがあると留保)。
    quote: it absorbed the queue by routing work around substantive human review, not by reviewing faster.
    locator: Figure 12 の説明
    quant: null
    evidenceKind: observational
    rqs: [TH10-Q3, TH11-Q2]
    issues: [273]
    stance: supports
