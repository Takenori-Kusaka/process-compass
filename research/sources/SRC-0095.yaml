summary: AI事業者ガイドライン(第1.1版→更新)の令和7年度更新内容。AIエージェントを「特定の目標を達成するために、環境を感知し自律的に行動するAIシステム」と定義し、自律的に動作するため「人間の判断を介在させる仕組みの構築」「最小権限」「定期的な操作履歴確認」を留意事項として追記。主体区分(開発者/提供者/利用者)の役割も見直し。
claims:
  - id: c1
    text: AIエージェント・フィジカルAIは自律的に動作するため、人間の判断を介在させる仕組みの構築が重要である旨を留意事項として追記。要求は「仕組み」であり役割を人が占めることではない。
