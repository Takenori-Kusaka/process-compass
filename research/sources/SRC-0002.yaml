    text: 代替案を落とした LocObs(位置・観測値のみ)は生診断に近い(Qwen 18/50、Llama 9/50 対 14/50、8/50)。代替案を足すと +36(Qwen)/+40(Llama)。
    quote: LocObs omits admissible alternatives and performs close to RawDiag. Adding those alternatives increases success by 36 points for Qwen and 40 for Llama.
    locator: §4.2; Table 2 (LocObs 18 (36%) / 9 (18%)); Table 3 (Typed vs. LocObs +36 [20,52] / +40 [26,54])
    quant:
