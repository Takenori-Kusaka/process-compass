summary: 外部検証器が候補を棄却した後に何を返すべきかを、TextWorld 50 課題・4 呼び出し上限で比較。位置・観測値・許容代替案を返すと成功が Qwen で +44pp、Llama で +42pp。利得の大半は代替案にあり、散文と JSON の差は 0〜2pt。#257 の引用は全て原典と一致。
claims:
  - id: c1
    text: 失敗位置・観測値・許容代替案の3要素を返すと、生の診断メッセージのみに対し Qwen2.5-Coder-14B の終了成功が 14/50→36/50(+44pp、95%CI 28〜60)。
    quote: feedback containing all three fields improves terminal success by 44 percentage points for Qwen2.5-Coder-14B (95% paired-bootstrap interval 28–60)
    locator: Abstract; §4.1 Table 2 (RawDiag 14 (28%) / TypedFields 36 (72%)); §7
    quant:
      value: +44pp (14/50 → 36/50)
      n: 50 paired games, budget 4
      design: controlled experiment (paired, McNemar + Holm)
      population: Qwen2.5-Coder-14B-Instruct-AWQ, TextWorld 3-room games, greedy decoding
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [257]
    stance: supports
  - id: c2
    text: 同条件で Llama-3.1-8B は 8/50→29/50(+42pp、95%CI 28〜56)。
    quote: and by 42 percentage points for Llama-3.1-8B (95% interval 28–56)
    locator: Abstract; Table 2 (RawDiag 8 (16%) / TypedFields 29 (58%)); §7 (from 8/50 to 29/50 for Llama)
    quant:
      value: +42pp (8/50 → 29/50)
      n: 50 paired games, budget 4
      design: controlled experiment (paired)
      population: Meta-Llama-3.1-8B-Instruct-AWQ-INT4
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [257]
    stance: supports
  - id: c3
    text: 同じ3つの値を散文で返す SameNL と鍵付き JSON の TypedFields の差は Qwen +2pt、Llama 0pt で、区間は 0 を含み補正後 p=1.0。書式ではなく値が効く。
    quote: TypedFields differs from the repair-value-matched SameNL by only +2 points for Qwen and 0 for Llama; both intervals include zero and both adjusted p-values are 1.
    locator: "§4.2; Table 3 (Typed vs. SameNL: +2 [−8,12] / 0 [−12,12])"
    quant:
      value: +2pt / 0pt (prose vs JSON)
      n: 50 paired games per model
