summary: 倫理綱領を参照するよう指示しても、ソフトウェア開発者の倫理的判断に効果が観測されなかったという統制実験(学生 63・実務者 105、11 の事例)。規範文書を読ませるだけでは実務が変わらないことを示す反証側の古典。
claims:
  - id: c1
    text: 学生 63 名と実務者 105 名に 11 の倫理的事例を判断させ、ACM 倫理綱領の考慮を明示的に指示した群と対照群の間に効果は観測されなかった。
    quote: We found that explicitly instructing participants to consider the ACM code of ethics in their decision making had no observed effect when compared with a control group.
    locator: Abstract
    quant:
      value: 効果なし(対照群と差が観測されず)
      n: 168(学生 63、実務者 105)
      design: controlled experiment(ビネット 11 件、指示群と対照群)
      population: ソフトウェア工学の学生と米国の経験5年以上の開発者
    evidenceKind: controlled-experiment
    rqs: [TH12-Q1]
    issues: []
    stance: contradicts
  - id: c2
    text: 述べられた目的に反し、ACM 倫理綱領が倫理的意思決定に影響する証拠は見つからなかったと結論した。
    quote: Despite its stated goal, we found no evidence that the ACM code of ethics influences ethical decision making.
