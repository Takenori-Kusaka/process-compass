    text: プロセスが望む結果の代理(proxy)になると、成果を見ずにプロセスを正しく回すことだけを確認するようになる。ゲート形骸化の原型的記述。
    quote: The process becomes the proxy for the result you want. You stop looking at outcomes and just make sure you’re doing the process right.
