summary: one-way/two-way door と「情報 70% で決める」の原典。可逆な決定には軽量なプロセスを使い、待ちすぎるより誤りを素早く訂正する方が安いとする。「プロセスが結果の代理になる」Day 2 の兆候も記す。ページに発表日の記載なし(2016 年度書簡)。
claims:
  - id: c1
    text: 画一的な意思決定プロセスを使わない。多くの決定は可逆な two-way door であり、軽量プロセスで済ませる。
    quote: First, never use a one-size-fits-all decision-making process. Many decisions are reversible, two-way doors. Those decisions can use a light-weight process.
    locator: High-Velocity Decision Making
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: context
  - id: c2
    text: ほとんどの決定は欲しい情報の 70% 程度で下すべきで、90% を待つと遅い。誤りの訂正が速ければ、誤りより遅さの方が高くつく。
    quote: Second, most decisions should probably be made with somewhere around 70% of the information you wish you had. If you wait for 90%, in most cases, you’re probably being slow.
    locator: High-Velocity Decision Making
    quant:
      value: ~70% of desired information
      n: n/a
      design: executive heuristic
      population: Amazon
    evidenceKind: expert-opinion
