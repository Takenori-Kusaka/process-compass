summary: Claude Code をモノレポ・大規模コードベースで使うための公式手引き(ページに日付なし、2026-09-24 取得)。--worktree による隔離と、sparsePaths でサブエージェントの worktree を軽量化する設定を示す。
claims:
  - id: c1
    text: --worktree フラグは新しい git worktree でセッションを始め、変更をメインのチェックアウトから隔離する。既定ではリポジトリ全体をチェックアウトする。
    quote: The --worktree flag starts a session in a new git worktree so changes stay isolated from your main checkout. By default it checks out the entire repository.
    locator: Scope worktrees and file access / Check out only the directories you need
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q1]
    issues: [272]
    stance: context
  - id: c2
    text: worktree.sparsePaths は git sparse-checkout で指定ディレクトリだけを書き出し、並列に起動したサブエージェントが worktree で動くときに全体ではなく軽量なチェックアウトを得られる。
    quote: Subagents are parallel Claude instances spawned for subtasks, and each one that runs in a worktree gets a lightweight checkout instead of the full tree.
    locator: Check out only the directories you need
