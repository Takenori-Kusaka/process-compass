summary: Google の社内コード移行に LLM を使った経験報告(著者自身が研究ではないと明記)。移行 CL の変更の 80% が完全に AI 作成、所要時間は技術者の見積もりで約 50% 減。一方でレビューと段階的展開は人の工程のままで、レビュー側を溢れさせないため移行を意図的に減速したと記す。
claims:
  - id: c1
    text: 本論文は研究ではなく経験報告で、他手法との比較や仮説の検証は行っていないと著者自身が明記する。
    quote: It is not a research study, in the sense that we do not carry out comparisons against other approaches or evaluate research questions/hypotheses.
    locator: Abstract
    quant: null
    evidenceKind: case-report
    rqs: [TH11-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: マージされた CL の変更の 80% が完全に AI 作成で、残りは人が書くか AI 提案を編集したものだった。CL の状態遷移を追跡して算出した。
    quote: We found that 80% of the code modifications in the landed CLs were fully AI-authored, and the rest were human-authored or edited from the AI suggestions.
    locator: §IV(Ads の 32→64bit ID 移行)
    quant:
      value: 80%
      n: 移行で landed した CL 群(件数は本文の該当節)
      design: changelist state tracking
      population: Google Ads の ID 移行
    evidenceKind: case-report
    rqs: [TH11-Q1, TH11-Q2]
    issues: []
    stance: context
  - id: c3
    text: 移行の総所要時間は、移行担当技術者の見積もりで LLM 支援なしの類似作業より約 50% 減った。
    quote: The total time spent on the migration was reduced by an estimated 50% as reported by the engineers doing the migration, when compared to a similar exercise carried out without LLM assistance.
    locator: §V 以降(移行事例)
    quant:
      value: 約-50%
      n: 1 移行事例
      design: engineer self-estimate
      population: Google 社内のコード移行
    evidenceKind: case-report
    rqs: [TH11-Q2]
    issues: []
    stance: context
  - id: c4
    text: レビューと展開は依然として人が担い、ボトルネックになった。レビューするチームを溢れさせず段階的に展開するため、移行作業を意図的に減速した。
    quote: We needed to slow down some of the migration work to avoid overwhelming the teams that had to do the reviews and to make sure that the rollouts happened in a gradual and responsible way.
    locator: "§VIII-D Landing the changes: a human process"
