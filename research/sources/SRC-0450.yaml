summary: 日本の事業会社が、Sub-issue をAIエージェントが並列実装する仕組みに GitHub のスタック型PRを組み込み、人のマージ待ちで生じていた同期待機を解消した運用報告。
claims:
  - id: c1
    text: ファインディでは、自作していた同期の仕組みをスタック型PRへ置き換えて削除した。記事の例(4つの Sub-issue を Layer 0〜2 の3層に分けた場合)では、レイヤーの間にあった2回の待機がなくなり、レビューとマージを人間の都合で進められるようになった。
    quote: レイヤーの間にあった2回の待機はなくなり、レビューとマージは人間の都合で進められるようになりました。自作していた同期の仕組みは削除しています。
    locator: ファインディでの活用
    quant:
      value: 人のマージ待ち 2回→0回
      n: 1社・1運用
      design: case report
      population: 親Issue配下の Sub-issue をAIエージェントが並列実装する仕組み
    evidenceKind: case-report
    rqs: [TH10-Q2, TH10-Q1]
    issues: [273]
    stance: supports
  - id: c2
    text: エージェントは依存順に作業すること自体は得意で、待ち時間を作っていたのは人のレビューとマージのタイミングだったと総括している。
    quote: エージェントは依存の順に手を動かすこと自体は得意で、待ち時間を作っていたのは人間のレビューとマージのタイミングでした。
    locator: まとめ
