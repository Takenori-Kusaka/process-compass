    issues: [273]
    stance: supports
  - id: c3
    text: 互いに依存しない作業は並列で実装し、後から依存の順に直列化して1本のスタックにするという、実装順とPRの積み方を分ける運用をとる。
    quote: "#202と#203は互いに依存していないので並列で同時に実装し、あとから依存の順に直列化して1本のStackにします。"
    locator: ファインディでの活用
