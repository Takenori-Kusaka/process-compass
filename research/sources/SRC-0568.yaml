summary: SEBoK v2.14(2026-05-18 公開)のライフサイクルステージ解説。ISO/IEC/IEEE 15288・24748-1 と INCOSE ハンドブック第5版に基づき、決定ゲートの選択肢として『別のステージへ行く・やり直す』を挙げる。規格本文ではなく知識体系の解説で、15288 / 24748-1 本文は未読。
claims:
  - id: c1
    text: 各ステージの決定の選択肢は、別ステージの開始・現ステージの継続・別のステージへ行くかやり直す・活動の一時停止・終了の 5 つ。前のステージへ戻ることは決定ゲートの正規の選択肢として挙げられている。
    quote: Go to or restart another stage
    locator: Decision Options for each stage(箇条書き 3 番目)
    quant: null
    evidenceKind: normative
    rqs: [TH09-Q2]
    issues: [250]
    stance: supports
  - id: c2
    text: 対象システムのすべての部分が同時に同じ成熟度・決定ゲートへ達するわけではないため、中間の成熟度レビューが必須とされる。部分ごとに判定時点がずれることを前提にしている。
    quote: It is important to note that not all parts of an SOI will reach the same maturity and therefore decision gate at the same time.
    locator: 本文 第2段落
    quant: null
    evidenceKind: normative
    rqs: [TH09-Q2]
    issues: [250]
    stance: supports
  - id: c3
    text: ゲートの入口・出口基準はテーラリングする必要があり、画一の基準は合わないと明記する。
    quote: Also, it is necessary to be clear about tailoring the entry/exit criteria - one size does not fit all.
    locator: 本文 第2段落
