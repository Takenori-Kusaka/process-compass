summary: SLSA v1.2 Source Track の要求。Level 4 で保護ブランチへの変更に信頼された 2 名の合意を要求し、「信頼された人」を人間と定義する。自動化は「trusted robot」として別に扱い、例外付与を認めている。
claims:
  - id: c1
    text: Level 4 では、保護ブランチの変更は提出前に 2 名以上の信頼された人の合意を必要とする。
    quote: Changes in protected branches MUST be agreed to by two or more trusted persons prior to submission.
    locator: Requirements > Two-party review
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q2, TH01-Q2]
    issues: [269]
    stance: supports
  - id: c2
    text: 信頼された人は、組織が変更の提案・承認を認可した「人間」と定義される。自動化は別区分の trusted robot で、明示された文脈でのみ動く。
    quote: Trusted person A human who is authorized by the organization to propose and approve changes to the source.
    locator: Source Roles
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q2, TH01-Q2]
    issues: []
    stance: context
  - id: c3
    text: "組織は trusted robot に方針の恒久的な例外を与えてよい(例: 2 者レビューを経ない変更のマージ)。"
    quote: An organization MAY choose to grant a Trusted Robot a perpetual exception to a policy (e.g. a bot may be able to merge a change that has not been reviewed by two parties).
    locator: Requirements > Trusted Robot Contributions
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q2, TH01-Q2]
    issues: []
    stance: qualifies
