summary: LayerX のエンジニアによる長編エッセイ。2025 年末以降、実装力がコモディティ化し価値が「何を作るべきかを決めること」「ちゃんと動くかを確かめること」へ移ったと構造的に論じ、Michael Jackson の World/Machine を引いて要求(optative)は人間からしか生まれないとする。第 4 幕以降は未読。
