    text: 最も希少だった「実装する力」がコモディティ化し、価値は「何を作るべきかを決めること」と「ちゃんと動くかを確かめること」へ移った。企画と検証の重みが増した。
    quote: 長らくソフトウェアづくりでいちばん希少だった「実装する力」が、ありふれた汎用品（commodity）に成り下がり、値打ちは、それを取り巻く希少なもの、すなわち「何を作るべきかを決めること」や「ちゃんと動くかを確かめること」のほうへ、どっさりと移っていったのです。
