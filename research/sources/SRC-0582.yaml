summary: Meta の Sapling を GitHub で使うときの公式手引き。スタックを PR 化する sl pr は「重なり合う PR」を作り GitHub の PR 画面では読みにくいため、専用ビューア ReviewStack でのレビューを勧める。ページに日付は無く、最新リリースは 2026-08-11(GitHub API)。
claims:
  - id: c1
    text: Sapling のスタック提出(sl pr)は、各 PR が下位のコミットも含む「重なり合う PR」を作るため、GitHub の PR 画面を使うレビュアには分かりにくいと公式が認めている。
    quote: Creates "overlapping" pull requests that may be confusing to reviewers using the GitHub pull request UI.
    locator: Pull requests / sl pr (aka "Sapling stack") / Cons
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: qualifies
  - id: c2
    text: 公式は、レビューを GitHub ではなく ReviewStack で行うよう強く勧めている。スタックの読み方が標準の PR 画面の外に出る設計である。
    quote: Reviewers are strongly encouraged to use ReviewStack for code review instead of GitHub.
    locator: Pull requests / sl pr (aka "Sapling stack") / Cons
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: qualifies
  - id: c3
    text: ワークフロー定義(.github/workflows/)に触れる PR は、OAuth トークンに workflow スコープが無いと GitHub が作成・更新を拒否し、sl pr submit が途中で中断する。
    quote: GitHub refuses to create or update those files through an OAuth token without the workflow scope
    locator: 冒頭の note
