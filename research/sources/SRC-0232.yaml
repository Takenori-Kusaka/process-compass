claims:
  - id: c1
    text: Agentic Workflows では PR は決して自動マージされず、人が必ずレビューし承認する。
    quote: With GitHub Agentic Workflows, pull requests are never merged automatically, and humans must always review and approve.
    locator: Practical guidance for teams
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q2, BASE-Q2]
    issues: []
    stance: supports
  - id: c2
    text: ワークフローは既定で読み取り専用権限で動き、書き込みは safe outputs（PR 作成・コメント追加など事前承認済みでレビュー可能な操作）経由の明示承認を要する。
    quote: Workflows run with read-only permissions by default. Write operations require explicit approval through safe outputs, which map to pre-approved, reviewable GitHub operations
    locator: Let’s talk guardrails and control
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH07-Q2, TH07-Q5]
    issues: []
    stance: supports
  - id: c3
    text: 導入はコメント・下書き・レポートなど低リスクの出力から始め、PR 作成はその後に有効化するよう勧める。
    quote: Start with low-risk outputs such as comments, drafts, or reports before enabling pull request creation.
    locator: Practical guidance for teams
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q4]
    issues: [254]
    stance: supports
  - id: c4
    text: Copilot 既定設定では1回の実行で premium request が通常2件（エージェント作業1件＋safe outputs のガードレール検査1件）消費される。
    quote: "each workflow run typically incurs two premium requests: one for the agentic work and one for a guardrail check through safe outputs."
    locator: Practical guidance for teams
    quant:
      value: 2 premium requests per run
      n: not stated
      design: vendor pricing description
      population: gh-aw runs with Copilot default settings
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2]
    issues: []
    stance: context
  - id: c5
    text: Agentic Workflows を CI/CD の YAML ワークフローの代替に使うなと明記し、決定的な CI/CD と主観的・反復的な作業を分ける。
    quote: Don’t use agentic workflows as a replacement for GitHub Actions YAML workflows for CI/CD.
    locator: Practical guidance for teams
