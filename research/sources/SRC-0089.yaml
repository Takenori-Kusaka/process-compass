summary: ドイツの標準化団体 VDE の専門家寄稿(2026-09-02)。第14条の監視の要求水準は「固有リスク・自律度・利用文脈」に依存すると整理し、EU AI Act の整合規格として策定中の EN 18229-3(ログ・透明性・人間の監視)を紹介。自律度に応じて監視を変える規範側の位置づけ。
claims:
  - id: c1
    text: 要求される人間の監視の水準は、高リスク AI システムの固有リスク・自律度・具体的な利用文脈に依存する。監視は一律ではなく自律度に応じて変わる。
    quote: The required level of human oversight depends on the inherent risks, the degree of autonomy and the specific use context of the high-risk AI system.
    locator: Scope of human oversight
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH01-Q1]
    issues: [248, 249]
    stance: supports
  - id: c2
    text: 第14条の法的義務を工学・統治の措置へ翻訳する欧州規格 EN 18229-3 が策定中で、EU AI Act の整合規格になる予定。
    quote: "The standard EN 18229-3 “AI Trustworthiness Framework - Part 1: Logging, transparency and human oversight” is currently under development and is planned to be harmonized under the EU AI Act."
    locator: How a new standard helps you to comply
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1, TH01-Q2]
    issues: [248]
    stance: context
