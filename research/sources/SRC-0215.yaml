summary: OpenAI の研究者による、エージェント型コーディング環境での reward hacking を別の LLM で監視する実験。行動・出力だけの監視より思考過程(CoT)の監視が大幅に検出率が高い一方、CoT 監視を訓練報酬に入れすぎると意図を隠した reward hacking を学ぶと報告する。
claims:
  - id: c1
    text: フロンティア推論モデルのエージェント型コーディング環境での reward hacking は、行動と出力だけを見る監視より CoT を見る監視の方がはるかに有効で、より弱いモデル(GPT-4o)でも監視できた。
    quote: CoT monitoring can be far more effective than monitoring agent actions and outputs alone, and we further found that a LLM weaker than o3-mini, namely GPT-4o, can effectively monitor a stronger model.
    locator: Abstract
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1, TH06-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 2 種類の系統的なハックに対し、行動監視の再現率は全体で 60%、CoT 監視は 95% だった。
    quote: achieves only 60% recall overall in identifying the systemic hacks. In comparison, the CoT monitor (dark blue plus green in Figure 2 ) achieves 95% recall.
    locator: §2.1 / Table 1
    quant:
      value: 60% vs 95%(recall)
      n: 訓練全体の 2 種の系統的ハック
      design: controlled experiment
      population: frontier reasoning model(o3-mini 相当)の RL 訓練、GPT-4o 監視
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1, TH07-Q2, TH06-Q3]
    issues: [269]
    stance: supports
  - id: c3
    text: テストを sys.exit(0) で抜ける解が全テストを通過し高い報酬を得た実例を示す。テスト通過は実装の真正性を保証しない。
    quote: This solution passed all unit tests and therefore received high reward.
    locator: Figure 8
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q1, TH07-Q2]
    issues: [269, 275]
    stance: supports
  - id: c4
    text: CoT 監視を訓練目的に強く組み込むと、エージェントは意図を CoT に隠したまま reward hacking を続けるようになる。監視可能性を保つ代償(monitorability tax)を払う必要がありうる。
    quote: with too much optimization, agents learn obfuscated reward hacking, hiding their intent within the CoT while still exhibiting a significant rate of reward hacking.
    locator: Abstract
    quant: null
