  - id: c2
    text: ループ内の弱いエージェントでも強い攻撃者を防げた。Gemini 3 Flash のループで、Gemini 3.1 Pro と Claude Opus 4.7 の KernelBench 攻撃成功率を 76%・61% から 0% にした。
    quote: We also find that weaker agents in the loop can defend against much stronger hackers
