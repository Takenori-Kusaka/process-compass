summary: 手書きの結果検証器(テスト)は脆く、5 つの端末エージェント・ベンチマークの 16% が課題文だけで突破可能だった。攻撃役・修正役・解答役の LLM を回す「hacker-fixer loop」で検証器を堅くする方法を示す。
claims:
