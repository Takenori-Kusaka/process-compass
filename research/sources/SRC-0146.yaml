summary: 一人の product-minded founder が Claude Code だけでマルチテナント SaaS を約 8 週間で構築した一次記録。Replit で作った動くプロトタイプから仕様とアーキテクチャ文書を逆算し、Rails で作り直した。人間工数は Claude 推定 25-45 時間、本人補正で約 2 週間分。Claude が commit 履歴から存在しない「本番障害」を語った点も記録。
