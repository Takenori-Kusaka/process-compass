  - id: c3
    text: 登壇者は、技術面の実現可能性の検証、マーケティング戦略、販売後の保守体制の整備など AI にはできない領域が厳然と存在すると強調した。後段の技術検証は人間側に残る。
    quote: 同時に、技術面の実現可能性の検証、マーケティング戦略の構築、販売後の保守体制の整備など、AIにはできない領域が厳然として存在することも強調した。
    locator: 1時間で10億円のビジネスプラン企画書を作成 末尾
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q2]
    issues: [250]
    stance: qualifies
  - id: c4
    text: 新規事業失敗の最大原因は、要素のつながりが崩れた「取っ散らかったビジネス仮説」を作ること。5 段階(強み→市場→課題→解→事業計画)を精度高く回す難しさを AI が補う。
    quote: 新規事業がうまくいかない最大の原因は、事業開発に必要な要素のつながりが崩れた「取っ散らかったビジネス仮説」を作ってしまうことにある
