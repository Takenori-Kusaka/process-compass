summary: 大塚商会の上席執行役員とフィラメント CEO が、生成 AI が人間へ段階的に質問して新規事業仮説を組み上げる「AI 起点」のプロンプトを実演。自社の強み分析→業界選定→課題→ソリューション→事業計画(3 年 100 施設・10 億円)と 13 枚の提案書を約 1 時間で生成。技術的実現性の検証や保守体制は AI にできない領域と登壇者が明言。
claims:
  - id: c1
    text: 通常と逆に、生成 AI が人間へ段階的に質問し回答に応じて選択肢を動的に生成する設計で、質問に答えるだけで新規事業仮説が組み上がる(方針が定まらない局面の手順の一例)。
    quote: 生成AIが人間に対して段階的に質問を投げかけ、人間からの回答に応じて次の選択肢を動的に生成していく。ユーザーは質問に答え続けるだけで、気づけば新規事業の仮説が組み上がっているというAI起点の設計だ。
    locator: AIへの「問い方」が成否を分ける
    quant: null
    evidenceKind: case-report
    rqs: [TH09-Q1, TH09-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 3 年で累計 100 施設・売上 10 億円規模の事業計画と 13 枚の提案書スライドを約 1 時間で生成した(公開実演 1 件)。
    quote: 3年で累計100施設、売上10億円規模のビジネスプランが提示された。さらに、13枚の提案書スライドが自動生成された。この一連の作業プロセスにかかった時間は約1時間である。
    locator: 1時間で10億円のビジネスプラン企画書を作成
    quant:
      value: ~1 hour for plan + 13 slides
      n: 1 live demo
      design: demonstration
      population: 大塚商会(介護施設向け新規事業)
    evidenceKind: news-fact
    rqs: [TH09-Q1]
    issues: []
