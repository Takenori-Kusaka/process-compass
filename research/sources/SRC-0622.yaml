summary: J-AISI の評価観点ガイド改訂版の本文(概要版は台帳に既にある)。読んだのは 3.6、3.11 と巻末の AI エージェントシステムの分類・リスク表。自律性を3段階に分け、評価項目例に人の介入・停止を挙げる。
claims:
  - id: c1
    text: AI エージェントシステムを自律性レベル(補助型・半自律型・全自律型)と外部連携レベルの2軸で分類する。半自律型は、リスクが高い判断と重要な外部システムの操作に人間の承認を前提とする。承認の要否を役割ではなく判断・操作のリスクで切っている。
    quote: 通常のタスクでは自ら判断し複数のアクションを実行するが、リスクが高い判断や重要な外部システムに対する操作は人間の承認を前提とするレベルである。
    locator: AI エージェントシステムの分類 (1) 自律性レベル — 半自律型(p.55)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1, TH12-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 全自律型も無制限の自律ではなく、事前に定義された目的・制約・監督メカニズムの下での運用を前提とすると定義している。
    quote: 人間の継続的な監督や指示を必要とせず、自律的に知覚、判断、及び実行するレベルである。ただし、事前に定義された目的、制約、監督メカニズムのもとで運用されることを前提とする。
    locator: AI エージェントシステムの分類 (1) 自律性レベル — 全自律型(p.55)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1, BASE-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 「自律的な挙動」の評価項目例として、リスクの高いタスクで異常や当初目標からの乖離を検知した場合の人間による介入・停止ができるかを挙げる。リスクの高いタスクの例はファイルの書き込み・削除、権限の昇格、高負荷な計算である。
    quote: リスクの高いタスクの実行時に異常を検知した場合における人間による介入・停止。
    locator: 3.11.1 自律的な挙動 — 評価項目例(p.36)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2, TH01-Q2]
    issues: []
    stance: supports
  - id: c4
    text: 「3.11.1 自律的な挙動(AI エージェントシステム)」の想定され得るリスクの例として、AI エージェントシステムがタスク遂行を優先するあまり、説得力のある応答等を通じてエンドユーザーの信頼を操作し、保護対策の回避や権限の奪取につながる行動を起こす可能性を挙げる。当該リスクを OWASP の特定の ASI 項目に対応づける記述は原典に無い。
    quote: 加えて、AI エージェントシステムがタスク遂行を優先するあまり、説得力のある応答等を通じてエンドユーザーの信頼を操作し、保護対策の回避や権限の奪取につながる行動を起こす可能性がある。
    locator: 3.11.1 自律的な挙動(AI エージェントシステム)— 想定され得るリスクの例(p.35)
    quant: null
