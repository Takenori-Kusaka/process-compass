summary: AWS ジャパンの SA が、少人数・兼務・実質統合 1 か月で AWS Summit Japan 2026 のデモを Kiro で作った開発記録。要件・設計・タスクを形式的に分けず Design Doc を唯一の正として Issue 単位で実装し、Steering で規約を集約、統合期は Mob Construction で回したと記す。
claims:
  - id: c1
    text: Kiro の要件・設計・タスクを形式的に分けて管理せず、チームで共有していた Design Doc を唯一の正とし、Design Doc に沿った実装計画を GitLab の Issue に書き出して Issue 単位で実装した。
    quote: 要件・設計・タスクを形式的に分けて管理するのではなく、 チームで共有していた Design Doc を唯一の「正」とする 運用にしました。
