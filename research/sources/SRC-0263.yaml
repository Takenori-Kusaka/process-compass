  - id: c2
    text: AI生成のPR説明は変更の羅列で詳細すぎ、本質的な変更を読み解くのに時間がかかる。完成度が高く見える文書にも未検証の仮説や未合意の内容が混ざる。
    quote: PRの説明、仕様書、設計メモなどには、ぱっと見では完成度が高そうに見えても、実際には未検証の仮説、AIが補完したそれっぽい説明、人間がまだ合意していない内容が混ざっていることがあります。
