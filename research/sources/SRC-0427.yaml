summary: Radar Vol.34 で GitHub Spec Kit を Assess に置いた blip。社内チームの brownfield 適用を観察し、constitution の中身、instruction bloat と context rot、冗長な Markdown による認知負荷を報告している。
claims:
  - id: c1
    text: SDD をめぐって2つの陣営が生まれている。改善し続けるエージェント能力に頼り最小限の構造で進める陣営と、定義済みワークフローと詳細な仕様を好む陣営である。
    quote: "Two broad camps are emerging: teams that rely on the continually improving capabilities of coding agents with minimal structure, and those that favor defined workflows and detailed specifications."
    locator: blip 本文(Assess, Apr 2026)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH08-Q1]
    issues: []
    stance: context
  - id: c2
    text: brownfield では手戻りの多くが、不明確な意図・隠れた前提・制約の遅い発見から生じる。spec→plan→tasks→coding→review の流れで問題を早く見つけられたチームがある。
    quote: In brownfield systems, much rework stems from unclear intent, hidden assumptions and late discovery of constraints.
    locator: blip 本文
    quant: null
    evidenceKind: case-report
    rqs: [TH08-Q1, TH08-Q3]
    issues: [256]
    stance: supports
  - id: c3
    text: プロジェクト文脈を足し続けた結果、指示が肥大化し context rot に至った。冗長な Markdown 出力と不要な防御的チェックが認知負荷を上げたとの報告もある。
    quote: Teams also encountered challenges such as instruction bloat, where continually adding project context led to a growing agent instruction set and eventually context rot.
    locator: blip 本文
    quant: null
    evidenceKind: case-report
    rqs: [TH08-Q1, TH03-Q3, TH05-Q3]
    issues: []
    stance: qualifies
