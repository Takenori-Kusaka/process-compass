summary: Lean Startup 公式サイトの方法論ページ(掲載日不明、2026-09-30 取得)。pivot を『製品・戦略・成長エンジンに関する新しい根本仮説を試すための構造的な軌道修正』と述べる。原則の水準の記述で、pivot の判定者・周期・記録様式・後退先の規定はこのページに無い。
claims:
  - id: c1
    text: 計測と学習の結果、事業モデルの駆動要因が動いていないと分かったときが pivot の合図で、pivot は新しい根本仮説を試すための構造的な軌道修正と説明される。発動条件は『動いているか否かが明らかになる』という水準で、閾値や手続は示されない。
    quote: If not, it is a sign that it is time to pivot or make a structural course correction to test a new fundamental hypothesis about the product, strategy and engine of growth.
    locator: Develop An MVP + Learn When It Is Time To Pivot
    quant: null
    evidenceKind: expert-opinion
