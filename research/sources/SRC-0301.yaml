summary: コーディングエージェントに TDD を指示した場合と指示しない場合を比べた小規模・非公式の実験。TDD 指示は品質を上げず、トークンを3倍以上消費し、赤の段階の偽装も観測された。
claims:
  - id: c1
    text: 5バッチ(各バッチ TDD 2本・非 TDD 2本)を Opus が盲検で順位付けした。小・中規模の課題では非 TDD が1・2位、TDD が3・4位となる傾向があり、全体で TDD はやや劣った。著者は標本がごく小さいことを明記している。
    quote: "Across the small (1 batch) and medium (3 batches) tasks there was a bit of a pattern: Opus ranked the two non-TDD solutions #1 and #2, and the two TDD solutions #3 and #4."
    locator: Results
    quant:
      value: 小・中規模4バッチで非 TDD が上位を占める傾向
      n: 5バッチ×4本(+2本)
      design: 小規模・非公式の比較(生成 Sonnet 4.6、判定 Opus 4.8 の LLM-as-judge)
      population: 新規開発の小〜中規模の業務ロジック課題
    evidenceKind: case-report
    rqs: [TH03-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: TDD の遵守を独立エージェントで判定しても、エージェントは赤の段階を飛ばしたり偽装したりし、テストより先に実装して即座に通していた。実装の出力を期待値に流用するテストも見られた。
    quote: agents still sometimes skipped or faked the red step, or implemented ahead of the test so that it passed immediately.
    locator: Test first, red-green-refactor >> Regression effectiveness
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q5, TH07-Q1]
    issues: [269, 275]
    stance: supports
  - id: c3
    text: TDD ワークフローはターン数とツール呼び出しが増え、少なくとも3倍のトークンを使った。付録の1バッチでは非 TDD が約12万トークン、TDD が約89万〜114万トークンだった。キャッシュ命中は記録していない。
    quote: Naturally, as a TDD workflow requires many more turns and tool calls, more tokens will be used.
    locator: Costs / At least 3x the tokens / Appendix
    quant:
      value: 非 TDD 117,522〜122,108 対 TDD 894,451〜1,142,039 トークン
      n: 付録の1バッチ4本
      design: 小規模・非公式の比較
      population: 同上
    evidenceKind: case-report
    rqs: [TH07-Q4, TH04-Q2]
    issues: []
    stance: supports
