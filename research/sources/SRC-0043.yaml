summary: 前回メモが引いた LinearB の一次ブログ。810 万 PR、32.7% 対 84.5%、着手待ち 16 時間超対約 200 分などは記載どおり。ただし 32.7% は「30 日以内にマージされた PR の割合(acceptance rate)」であり、前回メモの「無修正マージ率」という定義は誤り。
claims:
  - id: c1
    text: 32.7% / 84.5% の指標は「PR 受入率 = 30 日以内にマージされた PR の割合」である。前回メモの「無修正マージ率」という表現は原典の定義と異なる。
    quote: "the benchmark report introduces a more meaningful measure: pull request acceptance rate. This measures the percentage of pull requests that get merged within 30 days."
    locator: Why most AI-generated pull requests never reach production
    quant: null
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: qualifies
  - id: c2
    text: 人手のみの PR は約 84.5% がマージされるのに対し、AI 生成 PR は 32.7%。
    quote: AI-generated pull requests, by contrast, merge at just 32.7%, less than half the rate of human-authored code.
    locator: Why most AI-generated pull requests never reach production
    quant:
      value: 32.7% vs 84.5%
      n: 8.1M PRs / 4,800 teams / 42 countries
      design: observational (platform data)
      population: LinearB customer repositories
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c3
    text: AI 生成 PR のレビュー着手待ちは平均 16 時間超、人手のみは約 200 分で 5 倍超の遅延。
    quote: AI-generated pull requests wait more than 16 hours on average before a reviewer picks them up, compared to approximately 200 minutes for unassisted work, a delay more than five times longer.
    locator: Code review delays erase AI productivity gains
    quant:
      value: ">16h vs ~200min (>5x)"
      n: 8.1M PRs
      design: observational
      population: LinearB customer repositories
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c4
    text: 着手後のレビュー所要時間は AI 生成 PR の方が短い(約 194 分対 252 分)。LinearB 自身はこれを「表層的な検証」の兆候と解釈する。
    quote: once review begins, AI-generated pull requests move through the review cycle faster, approximately 194 minutes compared to 252 minutes for manual work.
    locator: Code review delays erase AI productivity gains
    quant:
      value: 194 vs 252 min
      n: 8.1M PRs
      design: observational
      population: LinearB customer repositories
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: []
    stance: qualifies
  - id: c5
    text: PR サイズ(p75)は AI 支援 400 行超、人手 157 行、エージェント型約 290 行。
    quote: Looking at the 75th percentile, AI-assisted pull requests contain over 400 lines of code compared to 157 lines for unassisted work. Agentic pull requests fall in the middle at approximately 290 lines.
    locator: AI-generated pull requests create larger changes and more new code
    quant:
      value: 400+ / 157 / ~290 lines (p75)
      n: 8.1M PRs
      design: observational
      population: LinearB customer repositories
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c6
    text: リファクタ率(p75)は人手 PR 約 37% に対し AI 支援 PR はほぼゼロ。
    quote: unassisted PRs show approximately 37% refactoring at the 75th percentile. AI-assisted pull requests show nearly zero.
    locator: AI-generated pull requests create larger changes and more new code
    quant:
      value: ~37% vs ~0% (p75)
      n: 8.1M PRs
      design: observational
      population: LinearB customer repositories
    evidenceKind: observational
