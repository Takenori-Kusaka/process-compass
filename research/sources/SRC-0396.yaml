summary: AIDev の AI エージェント PR と同一リポジトリの人間 PR のレビューを比較。エージェント PR の 6 割はレビュー記録がなく、レビューされてもエージェントが主で、人間の関与は『エージェントへの指示』の形をとると示した。
claims:
  - id: c1
    text: 人気リポジトリのエージェント作成 PR 33,596 件のうち 61.38% にレビュー記録がなく、レビューされた PR の 58.77% はエージェントだけがレビューしていた。
    quote: 61.38% (20,621) receive no recorded review activity, while 38.62% (12,975) receive at least one review.
    locator: §5.1 / Table 1
    quant:
      value: レビュー記録なし 61.38%、エージェントのみ 58.77%(レビュー済みのうち)
      n: エージェント作成 PR 33,596 件
      design: observational (repository mining)
      population: AIDev の人気リポジトリ
    evidenceKind: observational
    rqs: [TH06-Q4, TH11-Q3]
    issues: [268]
    stance: supports
  - id: c2
    text: AI 生成 PR のレビューは自動化を介したやり取りが多く、人間の関与は独立した評価ではなくエージェントへの指示として現れる。レビュー指標を人間による監督の指標として読むことに注意を促す。
    quote: reviews of AI-generated PRs more often take the form of automation-mediated interaction, with human involvement frequently expressed through agent steering rather than standalone evaluation.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: [TH06-Q4]
    issues: [268]
    stance: supports
  - id: c3
    text: レビュー記録がないことは人間の監督がないことを意味しない(痕跡を残さず確認している可能性)と著者は留保している。
    quote: We note that the absence of recorded review activity does not imply the absence of human oversight; maintainers may inspect pull requests without leaving traceable comments.
    locator: §5.1
    quant: null
    evidenceKind: observational
    rqs: [TH11-Q3]
    issues: [268]
    stance: qualifies
  - id: c4
    text: エージェント作成PRの 61.38% は記録上のレビュー活動がなく、22.6% はエージェントのみがレビューし、人の関与が観測できるのは 15.9% だった。
    quote: 61.38% of agent-authored PRs receive no recorded review activity.
    locator: RQ1 結果
    quant:
      value: レビュー記録なし 61.38% / エージェントのみ 22.6% / 人の関与 15.9%
      n: 33,596 エージェントPR
      design: observational(マイニング、規則ベースの分類)
      population: AIDev-POP(100スター以上のリポジトリ)
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
  - id: c5
    text: 両方の種類のPRがあるリポジトリに限ると、人のPRも 69.2% が記録上レビューなしかエージェントのみのレビューで、エージェントPR(69.9%)とほぼ同じだった。レビューの薄さはエージェントPR固有ではない。
    quote: For human-authored PRs in the same repositories, 69.2% (3856/5574) either receive no recorded review or are reviewed exclusively by agents
    locator: RQ1(R∩ の比較)
    quant:
