summary: Opus 5.5 の発表文(日付はページに無く、報道と X の投稿時刻 2026-09-22 に基づく)。Anthropic 自身が「キャッシュ読み取りがエージェント・コーディング作業の費用の過半を占める」と明言し、その単価を 60% 下げた。
claims:
  - id: c1
    text: Anthropic はキャッシュ読み取りが「エージェント・コーディング作業の費用の過半」を占めると述べる。#274 の「費用の 57% がキャッシュ読み取り」はベンダーの一般論と整合する。
    quote: Cache reads (which make up the majority of agentic and coding work costs) are $0.20 per million tokens, 60% less than Opus 5.
    locator: Cost and speed 段落
    quant:
      value: majority(>50%)
      n: null
      design: vendor statement, no sample disclosed
      population: agentic and coding work on Claude
    evidenceKind: vendor-guidance
    rqs: [TH04-Q1]
    issues: [274, 282]
    stance: supports
  - id: c2
    text: 既定設定の典型ワークロードで Opus 5 比 40% 安いとするが、これは Anthropic 自社テストの値で、max effort ではトークン増で相殺されるという外部計測がある(latent.space カード参照)。
    quote: Our tests show that at default settings it will cost 40% less than Opus 5 on typical workloads. Input and output tokens are $4 and $20 per million, 20% less than Opus 5.
    locator: Cost and speed 段落
    quant:
      value: -40%
      n: null
      design: vendor internal test
      population: typical workloads at default settings
    evidenceKind: vendor-guidance
    rqs: [TH04-Q4, TH02-Q3]
    issues: []
    stance: context
  - id: c3
    text: 定額プランの 5 時間枠を引き上げ、利用者が任意のタイミングで使える「レート制限リセット」を配った。上限の運用は 2026 年を通じて頻繁に変わっている。
    quote: In addition to the price drop, we're increasing five-hour usage limits on Pro, Max, Team, and seat-based Enterprise plans. We're also providing subscription users a rate limit reset, which you can now save and use whenever you choose.
    locator: Cost and speed 段落
    quant: null
    evidenceKind: news-fact
    rqs: [TH04-Q3]
    issues: [274]
    stance: context
  - id: c4
    text: Anthropic は、現在の能力水準ではベンチの差が実世界の差の指標として信頼性を失いつつあると明言した。前回 §2-3 の「ベンチのスコアで導入判断をしない」を支える一次の言明。
    quote: at these levels of capability we’ve found that benchmark margins have become a less reliable guide to real-world differences
    locator: Performance and cost-effectiveness
    quant: null
    evidenceKind: vendor-guidance
    rqs: [BASE-Q3, TH11-Q2]
    issues: [282]
    stance: supports
  - id: c5
    text: 価格表では Opus 5.5 がキャッシュ読み取り $0.20・入力 $4・出力 $20・キャッシュ書き込み $5、Opus 5 が $0.50・$5・$25・$6.25(百万トークンあたり)。
    quote: Cache reads $0.20 $0.50 Input tokens $4 $5 Output tokens $20 $25 Cache writes $5 $6.25
    locator: Pricing 表
    quant:
