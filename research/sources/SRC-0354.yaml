summary: 87タスク×18構成でスキルの有無を対照比較したベンチマーク(v4)。人手のスキルは平均+16.6pt だが、4本以上や網羅的な長文スキルでは効果が縮む。
claims:
  - id: c1
    text: 人手で整備したスキルは平均合格率を33.9%から50.5%へ+16.6pt 上げるが、構成により+4.1〜+25.7pt と幅がある。
    quote: Curated Skills raise the average pass rate from 33.9% to 50.5% (+16.6 percentage points; 25.5% normalized gain), with configuration-level gains ranging from +4.1 to +25.7 pp.
    locator: Abstract
    quant:
      value: +16.6 pp (33.9%→50.5%)
      n: 87 tasks x 18 model-harness configurations
      design: paired controlled benchmark (no-Skills vs curated-Skills)
      population: Claude Code, Codex, Gemini CLI, OpenHands 等
    evidenceKind: benchmark
    rqs: [TH03-Q1]
    issues: []
    stance: context
  - id: c2
    text: 1タスクに付けるスキルが1本で+18.0pt、2〜3本で+19.0pt、4本以上では+10.1pt に縮む。過剰な内容が負荷や指示の衝突を生むと著者は解釈する。
    quote: tasks paired with one Skill gain +18.0 pp, 2–3 Skills gain +19.0 pp, and ≥4 Skills give only +10.1 pp, suggesting excess content creates overhead or conflicting guidance.
    locator: §5 / Appendix F.1 Skill Quantity
    quant:
      value: +18.0 / +19.0 / +10.1 pp (1 / 2–3 / ≥4 skills)
      n: 87 tasks
      design: stratified analysis of paired benchmark
      population: curated Skills bundles
    evidenceKind: benchmark
    rqs: [TH03-Q1, TH03-Q3]
    issues: []
    stance: supports
  - id: c3
    text: 簡潔・標準長のスキル(+19.0/+21.5pt)が、詳細(+14.5pt)・網羅的文書(+0.7pt)を上回る。網羅的に書くほど効果が消える。
    quote: compact and standard-length Skills (+19.0 and +21.5 pp) outperform detailed (+14.5 pp) and comprehensive documentation (+0.7 pp)
    locator: Appendix F.2 Skill Complexity
    quant:
      value: +19.0 / +21.5 / +14.5 / +0.7 pp
      n: 87 tasks
      design: stratified analysis of paired benchmark
      population: curated Skills by length class
    evidenceKind: benchmark
    rqs: [TH03-Q1, TH03-Q3]
    issues: []
    stance: supports
  - id: c4
    text: スキルの発見は多くの場合ボトルネックではなく、スキル呼び出し率が高くても高い解決率は保証されない(残る失敗はタスクとスキルの接続後に起きることが多い)。タスク同梱スキルの呼び出し率は 18 構成で 46.4%〜99.2% だった。
    quote: High Skill Invocation Rate does not guarantee high resolution, so the remaining failures often occur after task-Skill access.
    locator: §5.1.1 Finding 4 / Appendix K Table 14
    quant:
      value: invocation rate 46%–99% across configurations
      n: 18 configurations
      design: trajectory audit
      population: task-specific Skills
    evidenceKind: benchmark
    rqs: [TH03-Q1]
    issues: []
    stance: qualifies
