summary: Graphite のマージキューがスタックを原子的な単位として扱い、投機実行で CI を並列化する仕組みの公式説明。並列 CI 経由でマージした PR が GitHub 上は merged ではなく closed と記録される点を明記する。ページに日付は無い(取得 2026-09-30)。
claims:
  - id: c1
    text: Graphite のマージキューは PR ではなくスタックを単位とし、スタック内の1本でも失敗するとスタック全体がマージされない。
    quote: If any PR in the stack encounters a failure, the whole stack will fail to merge, allowing you to treat stack merges as atomic operations.
    locator: Trading off speed vs. correctness
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
  - id: c2
    text: 並列 CI を使うと、キュー経由でマージした PR は GitHub 上で merged ではなく closed と記録される。PR の merged 状態を数える計測や連携は、そのままでは成立しなくなる。
    quote: When an enqueued PR merges, it will be marked as closed in GitHub instead of merged.
    locator: End-user experience when using parallel CI
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2, TH10-Q3, TH11-Q3]
    issues: [273]
    stance: qualifies
  - id: c3
    text: 並列 CI は「キュー内の CI は通る」前提の投機実行であり、flaky なテストがあると後続の CI をやり直すため CI 実行数が増える。
    quote: However, because parallel CI assumes that your CI tests in the merge queue will pass, be careful with flaky tests.
    locator: Example of running CI in parallel
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: qualifies
  - id: c4
    text: Graphite は並列 CI の導入企業でマージが 1.5 倍速くなった(p95 で 33%、p75 で 26% 短縮)と述べるが、対象社数と測定方法は示していない。
    quote: Companies who have enabled Parallel CI on their Graphite Merge Queues have seen 1.5x faster merges, which includes time spent running CI (33% decrease for p95, 26% for p75).
    locator: Running CI on multiple stacks in parallel
    quant:
      value: 1.5x(p95 -33%、p75 -26%)
      n: 不明
      design: ベンダーの自社顧客データ(測定方法の記載なし)
      population: Graphite Merge Queue で Parallel CI を有効にした企業
    evidenceKind: expert-opinion
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
