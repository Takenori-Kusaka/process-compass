summary: NCDC の非エンジニア IT コンサル 3 名が Gemini・NotebookLM・Figma Make・Firebase Studio で 2 日間 MVP リリースを試みた一次記録。企画〜設計のリードタイムは劇的に短縮したが、実装はエラー修正ループに陥り、無料枠ではデプロイできず、リリースに到達しなかった。
claims:
  - id: c1
    text: NCDC の IT コンサルタント 3 名が、非エンジニアの立場で無料範囲のツール(Firebase Studio 等)を使い、実際の顧客向けクローズドコミュニティアプリを 2 日間で開発する AI 駆動開発を試みた。それらしいアプリは生成できたが、リリースまでは辿り着けなかった(自己報告)。
    quote: NCDCのITコンサルタント3名がAIを駆使して2日間で実際のお客様向けのクローズドコミュニティアプリを開発するAI駆動開発を実施しました / それっぽいアプリの生成はできたものの、リリースまでは辿り着くことができないという何とも残念な結果に終わっています
