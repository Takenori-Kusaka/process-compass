    text: 簡易的な PoC は非エンジニアでも現実的になりつつあるが、商用レベルには専門家の支援が必要という状況は変わらない。
    quote: 簡易的なPoCアプリであれば、非エンジニアでも作成することが現実的な選択肢になりつつありますが、商用レベルのアプリを作成するには、専門的なプロフェッショナルからのサポートが必要な状況は依然変わりません。
