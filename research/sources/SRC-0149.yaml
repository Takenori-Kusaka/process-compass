  - id: c4
    text: 設計書を与えて一気に作らせると「エラー→修正指示→別エラー」の無限ループになり、段階的に進めても同様の反復が続いた。
    quote: 「エラー→FIXをするように指示→FIXせず別のエラーが発生→FIXをするように指示」を延々とループする流れになり、このままでは2日間でリリースまで辿り着けないだろうと感じる状況でした。
    locator: 1. 逐次の指示が煩雑
    quant: null
    evidenceKind: case-report
    rqs: [TH09-Q3]
