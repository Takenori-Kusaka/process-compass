    text: Figma Make の生成画面はプロトタイプとしては十分だが、デザインの方向性やコンセプトはほぼ意思疎通できなかった。
    quote: ※デザインの方向性やコンセプトに関してはほぼ意思疎通が取れなかったので、あまり期待しないほうが良いです
    locator: AI駆動開発の良いところ
