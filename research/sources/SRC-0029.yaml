summary: DESMET 特徴分析で 5 テンプレート(Tyree/Akerman・Nygard・arc42・Y-statements・MADR)を専門家 2 名が絞り込み、Nygard と MADR を学部生 33 名のクロスオーバー制御実験で比較。Overall Score は Nygard が有意に高い(W=84.0, p=0.002)。139 メモが同論文に帰した「生きた決定ログ・決定の健全性の監視」はこの論文には無く(ReflectRally 由来)、「AK は設計判断・前提・文脈・根拠を含む」は背景節の Kruchten (2006) 孫引き。
claims:
  - id: c1
    text: 比較対象は Tyree/Akerman・Nygard・arc42・Y-statements・MADR の 5 テンプレート。理解・使いやすさ・採用しやすさの 3 次元で評価。
    quote: "this paper aims to identify which ADR template best supports comprehension, usability, and ease of adoption: Tyree/Akerman’s template, Nygard’s ADR, arc42, Y-statements, and MADR."
    locator: Abstract (Goal)
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH05-Q1]
    issues: [139]
    stance: context
  - id: c2
    text: 学部生 33 名のクロスオーバー実験で、Nygard テンプレートの Overall Score が MADR より有意に高かった(Wilcoxon 符号順位 W=84.0、p=0.002)。
    quote: The Wilcoxon signed-rank test revealed a statistically significant difference between the Nygard and MADR templates in terms of Overall Score ( W=84.0 , p=0.002 )
    locator: §5 Results (Quantitative)
    quant:
      value: W=84.0, p=0.002
      n: 33 undergraduate students (crossover)
      design: controlled experiment (DESMET FA)
      population: software architecture 講義受講の学部生
    evidenceKind: controlled-experiment
    rqs: [TH05-Q1]
    issues: [139]
    stance: context
  - id: c3
    text: "定性: MADR の粒度は根拠の深さを支え、Nygard は軽量で時間制約下で適用しやすいと受け止められた。"
    quote: MADR’s granularity better supports rationale depth, whereas Nygard’s was perceived as more lightweight and easier to apply under time constraints.
    locator: §7 Conclusion
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH05-Q1]
    issues: [139]
    stance: context
  - id: c4
    text: 背景節で、アーキテクチャ知識は設計判断・前提・文脈・根拠を含む(Kruchten et al. 2006 の引用)。139 メモ §3.5 の同趣旨の記述はこの背景記述の孫引きに相当し、本論文の実験結果ではない。
    quote: Architectural Knowledge (AK) constitutes the comprehensive representation of the design logic, extending beyond static artifacts to include the design decisions, assumptions, context, and rationale
