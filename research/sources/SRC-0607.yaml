summary: 公開の Web 開発スキル 31 本を Web-Bench 50 プロジェクト・1,000 課題で、スキルなし/対象スキル/同じ長さの無関係スキル/部分削除の 4 条件で比べた統制実験(査読前)。4 モデル(Claude Sonnet 4、GPT-5.1 を含む)でスキル注入は平均 Pass@2 を下げトークン費用を 72〜394% 増やした。スキルの選択精度の測定ではない。
claims:
  - id: c1
    text: 対象スキルの注入は 4 モデルで平均 Pass@2 を 1.3〜4.2% 下げ、トークン費用を 72〜394% 増やし、改善したスキル×プロジェクトの組は 17〜36% にとどまった。
    quote: target Skill injection reduces mean Pass@2 by 1.3% to 4.2%, lowers task completion depth, and increases token cost by 72% to 394%, with gains in only 17% to 36% of Skill-project pairs
    locator: Abstract
    quant:
      value: Pass@2 -1.3% to -4.2%; token cost +72% to +394%; gains in 17-36% of pairs
      n: 31 Skills x 50 Web-Bench projects, 1,000 ordered tasks, 4 models
      design: controlled experiment with 4 matched conditions incl. length-matched irrelevant control
      population: Claude Sonnet 4, GPT-5.1, DeepSeek-V4-flash, Qwen3-Coder-30B
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1, TH04-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 劣化の機序はモデルで分かれる。同じ長さの無関係スキルで損失の大半が再現するモデル(長さに気を取られる)と、長さは中立でも内容が Pass@2 を 1.1〜1.4% 下げるモデルがある。常時注入する文書の「量」だけで品質低下を説明できない。
    quote: prompt length is neutral, yet Skill content still lowers Pass@2 by 1.1% to 1.4%
    locator: Abstract(HTML 版)
    quant:
      value: -1.1% to -1.4% Pass@2 (content-misled models)
      n: 4 models; per-model results in Table 1-2
      design: length-matched irrelevant control (C2) vs target skill (C1)
      population: Web-Bench
    evidenceKind: controlled-experiment
    rqs: [TH04-Q2, TH03-Q3]
    issues: []
    stance: qualifies
  - id: c3
    text: 測定対象は Claude Sonnet 4 と GPT-5.1 を含む 4 モデルで、GPT-5 世代の値はあるが、Claude は 2025-05 版の Sonnet 4 にとどまる(2026 年世代の Claude での再現は含まない)。
    quote: closed frontier (Sonnet 4, GPT-5.1) versus open-weight (DeepSeek-V4-flash, Qwen3-Coder-30B)
    locator: Models and metrics
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1]
    issues: []
    stance: qualifies
  - id: c4
    text: スキルの効用はスキル単体の性質ではなく(スキル、プロジェクト、モデル)の組の性質で、注入は配備ごとのルーティング判断だと結論する。
    quote: reframing injection as a per-deployment routing decision
    locator: Abstract
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1, TH03-Q2]
    issues: []
