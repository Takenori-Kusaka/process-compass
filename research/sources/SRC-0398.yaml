summary: GitHub Actions 上の AI レビュー 16 種・2.2 万件超のコメントで、指摘がコード変更につながったかを測定。簡潔でコード片(修正案)を含む指摘ほど対応されやすく、道具間の差が大きいと示した。
claims:
  - id: c1
    text: 簡潔で、コード片を含み、手動で起動されたコメント、特に hunk 単位のレビュー道具によるものほど、コード変更につながりやすい。これは解釈可能な機械学習による関連の分析結果である。
    quote: Comments that are concise, contain code snippets, and are manually triggered, particularly those from hunk-level review tools, are more likely to result in code changes.
    locator: Abstract(§IV-C Answer to RQ3、§V-A でも同旨)
    quant:
      value: コード比率と対応率 ρ=0.89
      n: 22,000 超のレビューコメント、16 種の AI レビュー Action、178 リポジトリ
      design: observational + interpretable ML
      population: GitHub Actions 上の AI コードレビュー
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: [257]
    stance: supports
  - id: c2
    text: 有効な指摘が対応された率は道具によって 19.2% から 0.9% まで大きく異なり、設計が効果を決める。
    quote: coderabbitai/ai-pr-reviewer achieved a 19.2% rate of valid comments addressed, outperforming other tools by a large margin.
    locator: §V-A Design Matters
    quant:
      value: 19.2%(最良)〜0.9%(最低)
      n: 詳細分析した 4 Action
      design: observational (LLM-assisted addressed-classification)
      population: 同上
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: [257]
    stance: context
