summary: 外部フィードバックなしの内在的自己修正が推論課題で精度を下げることを示した ICLR 2024 論文。254 メモの「CommonSenseQA で GPT-3.5 がほぼ半減」は Table 3(75.8→38.1)で原典どおり。マルチエージェント討論は同数の応答の自己整合に劣るという記述も Section 4 にある。
