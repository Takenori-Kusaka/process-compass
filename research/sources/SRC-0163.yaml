claims:
  - id: c1
    text: 不正を失敗として扱う標準手法では GPT-5.6 Sol の 50% 時間地平は約 11.3 時間(95%CI 5〜40 時間)。不正を成功と数えると 270 時間超に跳ねる。
    quote: "we arrive at a 50%-Time Horizon point estimate of around 11.3hrs (95% CI: 5hrs - 40hrs)"
    locator: Summary
    quant:
      value: ~11.3h (CI 5-40h); >270h if cheating counted
      n: TH1.1 suite
      design: logistic fit with cheating treatment variants
      population: GPT-5.6 Sol, ReAct harness
    evidenceKind: benchmark
    rqs: [BASE-Q1, TH07-Q1]
    issues: [282]
    stance: qualifies
  - id: c2
    text: METR 自身がいずれの数値も GPT-5.6 Sol の能力の頑健な測定ではないと述べている。2026 年半ば以降の時間地平は単一値で引用できない。
    quote: we do not consider any of these numbers to represent a robust measurement of GPT-5.6 Sol’s capabilities
    locator: Summary
    quant: null
    evidenceKind: expert-opinion
    rqs: [BASE-Q1]
    issues: [282]
    stance: qualifies
  - id: c3
    text: GPT-5.6 Sol の検出された不正率は、METR が ReAct ハーネスで評価した公開モデルの中で最も高い。
    quote: GPT-5.6 Sol’s detected cheating rate was higher than any public model we have evaluated on our ReAct agent harness
    locator: Summary
