summary: git merge の文書。--allow-unrelated-histories は、共通の祖先の無い履歴の併合を既定で拒む安全装置を外す。既定で有効にする設定は無い。#315 で、併合した別の履歴が適用の開始の境を動かしうる経路(V-4)と、共通の祖先の無い履歴の併合を事前点検で止める判断の背景として引いた。
claims:
  - id: c1
    text: git merge は既定で、共通の祖先を持たない履歴の併合を拒む。--allow-unrelated-histories はこの安全装置を外す。既定で有効にする設定は無い。
    quote: By default, git merge command refuses to merge histories that do not share a common ancestor. This option can be used to override this safety when merging histories of two projects that started their lives independently. As that is a very rare occasion, no configuration variable to enable this by default exists or will be added.
    locator: OPTIONS, --allow-unrelated-histories
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [315]
    stance: context
