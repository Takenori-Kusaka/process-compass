summary: 異動で人数が減ったWEAR Webチームが、リスクに応じて必要Approve数を1/2件に動的判定し、低リスクPRはAIレビューで自動Approveする仕組みを入れた報告。AIのレビュー基準の変更には人間2名の承認を必須にした。
claims:
  - id: c1
    text: 体制の変化点(異動によるメンバー減)が起点で、少人数で全PRをレビューする負荷とApprove待ちが問題になった。
    quote: Webブロックでは、異動によりメンバーが減ったことで、開発ワークフローのさまざまな工程で効率化が求められていました。
    locator: はじめに
    quant: null
    evidenceKind: case-report
    rqs: [TH02-Q2]
    issues: []
    stance: context
  - id: c2
    text: 必要Approve数をパスルール・AI判定・人のラベルで1件か2件に決める。AIは引き上げのみ可能で、判定に失敗した場合は2件を必須にする(fail-closed)。
    quote: AIによる判定：パスルールだけでは判定できない意味的なリスクをAIが評価する。必要なApprove数の引き上げのみを許可し、判定に失敗した場合は2件のApproveを必須にする。
    locator: レビュー負荷の分散(必要なApprove数の動的な判定)
    quant: null
    evidenceKind: case-report
    rqs: [TH02-Q4, TH01-Q1]
    issues: [254]
    stance: supports
  - id: c3
    text: AIのマルチエージェントレビューで重要度の高い指摘がなければ自動Approveするが、.claude/配下などレビュー基準を変えるPRは人間2名の承認を必須にし、AIが自身の基準変更を承認できないようにした。
    quote: .claude/ 配下などレビュー基準を変更するプルリクエストには、人間2名のApproveを必須にしています。これにより、AIレビューの基準を変更するプルリクエストをAIのApproveだけでマージできないようにしています。
    locator: AIコードレビュー
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q1, TH07-Q1]
    issues: []
    stance: context
  - id: c4
    text: 施策後、遅いときに30時間以上かかっていたマージまでのリードタイムが20時間以内に収まったと図で示している(期間・件数は非開示)。
    quote: 濃い青の実線がリードタイム。遅い時はマージまで30時間以上かかっていたのが、20時間以内に収まっている。
