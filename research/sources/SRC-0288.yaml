summary: GitHub アカウント100万件の一様標本から、稼働中リポジトリの AGENTS.md/CLAUDE.md 等の指示ファイルを全件収集し、普及率・内容・危険な指示を数えた個人の観察調査。
claims:
  - id: c1
    text: 稼働中(2025年7月以降に push、非フォーク)のリポジトリの8.4%が AI エージェント向け指示ファイルを持ち、2026年9月に push されたものに限ると19.8%だった。
    quote: 稼働中のリポジトリの 8.4% が指示ファイルを持つ。2026年9月に push されたものだけなら 19.8%、5件に1件
    locator: "「先に全部」表 #1"
    quant:
      value: 8.4%(2026-09 push 分は19.8%)
      n: 100万アカウント標本のうち直近1年に push のある118,582人、指示ファイル保有31,902件
      design: GitHub GraphQL による全件収集(1人1問い合わせ)
      population: GitHub の一様標本(第1弾と同じ100万人)
    evidenceKind: observational
    rqs: [TH03-Q1]
    issues: []
    stance: context
  - id: c2
    text: CLAUDE.md の29%は /init の定型文で始まり、59%のファイルに禁止文、56%にビルド・テストのコマンドが書かれていた。
    quote: 59% のファイルに禁止文、56% にビルド・テストのコマンド
    locator: "「先に全部」表 #7"
    quant:
      value: /init 定型29%、禁止文59%、ビルド・テスト56%
      n: 指示ファイル本文のある34,920件
      design: 全件の本文分類
      population: 同上
    evidenceKind: observational
    rqs: [TH03-Q4]
    issues: []
    stance: context
  - id: c3
    text: 指示ファイルは起動時に確認なしで文脈に入り、初回の信頼ダイアログにも CLAUDE.md の中身は表示されない。一方、明示的に悪意ある指示ファイルは31,902件中1件(概念実証)で、権限確認をすべて切らせる指示は約90件、認証情報そのものの記載は9件だった。
    quote: 明示的に悪意ある指示ファイルは 1 件（概念実証）。
    locator: "「先に全部」表 #9〜#12 / 「そもそも、いつ読まれるのか」"
    quant:
      value: 悪意1/31,902、確認全解除 約90、認証情報記載9
      n: 34,920件を判定専用モデルで全件走査し危険クラス242件は全件人手確認
      design: 判定モデル(9択)による走査+人手確認
      population: 同上
    evidenceKind: observational
    rqs: [TH03-Q5]
    issues: []
