summary: Copilot code review・cloud agent・CLI・SDK・app の責任ある利用を記すアプリケーションカード。新モデル投入時の段階評価と go/no-go 判定、人のレビューの補完としての AI レビュー、レビューのモデル固定を記す。
claims:
  - id: c1
    text: 新モデルは面ごとのベンチマークで基準線と比較し、解決率・トークン効率・遅延で基準以上でなければ次段階へ進めず、部門横断のレビュー委員会が正式な go/no-go を決める。モデル更新を変更管理として扱うベンダー側の手順。
    quote: A cross-functional review board makes a formal go/no-go decision before any model is approved for user-facing deployment.
    locator: 8. Evaluations / Performance and quality evaluation methods
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q3]
    issues: []
    stance: supports
  - id: c2
    text: Copilot code review は人のレビューを補うものであって置き換えるものではないと明記する（同時期に承認機能が追加されており、両者の関係は利用組織側の設定に委ねられる）。
    quote: Use Copilot code review to supplement human reviews, not to replace them
    locator: Best practices (Copilot code review)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6, TH01-Q2]
    issues: []
    stance: context
  - id: c3
    text: Copilot code review はモデル切り替えを許さない（信頼性・品質を損なうため）。利用者がレビュアーのモデル系統を作成側と変えることはこの製品内では選べない。
    quote: Model switching is not supported, as changing the model is likely to compromise reliability, user experience, and the quality of review comments.
    locator: Copilot code review（モデル）
    quant: null
