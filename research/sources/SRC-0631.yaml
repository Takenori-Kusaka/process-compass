summary: IPA が 2026-06-08〜08-10 の AI セキュリティ事例を一次情報源から要約した定期刊行物(要約作成に AI を使用と明記)。読んだのはエグゼクティブサマリー(p.5-11)と 1.14。コーディングエージェントで人の確認が機能しなかった事例を動向として挙げる。
claims:
  - id: c1
    text: 動向の一つに、コーディングエージェントで開発者の通常操作に紛れて不正動作が起動し、判断に必要な情報が示されないため Human-in-the-Loop が機能しなかったという指摘を挙げる。
    quote: 開発者の通常操作に紛れて不正動作が起動する事例が報告されており、判断に必要な情報が提示されない中で Human-in-the-Loop が機能しなかったとの指摘がある。
    locator: エグゼクティブサマリー ② AI コーディングエージェントの浸透と開発工程全般のアタックサーフェス化(p.7)
    quant: null
    evidenceKind: review
    rqs: [TH12-Q3, TH07-Q1, TH06-Q4]
    issues: []
    stance: supports
  - id: c2
    text: Wiz の報告の要約として、6製品に共通する欠陥では、AI が内部推論で危険な書き込み先を認識しながら確認ダイアログに元のファイル名しか示さない例があり、人の同意が形だけになるとする。ベンダー間で脆弱性として扱うかの判断が分かれた。
    quote: AI の内部推論では危険な解決先を認識しながら、確認ダイアログには元のファイル名しか示さない例があり、同意が形だけになる（CWE-451）。
    locator: 1.14 [2026-07-09] AI コーディング支援 6 製品に共通の承認迂回欠陥(p.22)
    quant: null
    evidenceKind: news-fact
    rqs: [TH07-Q1, TH12-Q3]
    issues: []
    stance: supports
  - id: c3
    text: 評価環境から逸脱して外部組織へ無許可の行動に及んだ AI エージェントの事例群を、OWASP の枠組みでは ASI10(Rogue Agents)に当たると整理している。
    quote: なお逸脱したエージェントは、前掲の OWASP の枠組みでも ASI10（Rogue Agents）として整理されている。
    locator: エグゼクティブサマリー ⑥ 逸脱した AI エージェントという新たな脅威アクター類型(p.11)
    quant: null
    evidenceKind: review
    rqs: [TH12-Q3]
    issues: []
    stance: supports
  - id: c4
    text: AI が生成した脆弱性修正パッチの完全解消率は限定的という検証結果(6,080件のうち平均26.0%、残存または新規混入が53.9%)を引き、専門家による最終レビューが依然必要とまとめる。値はベンダー調査の二次引用である。
    quote: 他方、AI が生成したパッチが脆弱性を完全に解消できる割合は限定的だとする検証結果があり、専門家による最終レビューは依然必要とされる。
    locator: エグゼクティブサマリー ④ 防御側 AI の可能性・限界と「Human-in-the-Loop」の必要性(p.9)
    quant:
