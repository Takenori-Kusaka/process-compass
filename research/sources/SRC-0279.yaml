summary: 定額の安価プラン利用者が Codex のサブエージェントに軽量モデルを指定したが、隠しパラメータのため親モデルで動いて利用枠が急減した事例を、セッションログと公開 Issue・ソースで原因特定した記録。
claims:
  - id: c1
    text: Codex のカスタムエージェントに gpt-5.6-luna(model_reasoning_effort = "max")を指定したのに、実際には gpt-5.6-sol が適用され、effort も medium に変わっていた。著者は原因を、Multi Agent V2 の隠しパラメータ hide_spawn_agent_metadata が既定 true のため、サブエージェント側のモデル指定が渡らず親セッションのモデル(Sol)にフォールバックする「ようだ」と推定している。
    quote: gpt-5.6-luna を指定していたのにも関わらず、 gpt-5.6-sol が適用されていたのです。 model_reasoning_effort = "max" の指定も medium に変わっています。
    locator: 「サブエージェント、はじめました」〜「原因」「なぜGPT-5.6 Solで発生するのか」
    quant: null
    evidenceKind: case-report
    rqs: [TH04-Q4]
    issues: []
    stance: qualifies
  - id: c2
    text: 実行中のサブエージェントがどのモデルで動いているかを UI で確認できず、セッションログを直接開かない限り指定どおりに動いていると信じるしかない。気づいた契機はレート制限の減り方の違和感だった。
    quote: 今回のようにセッションログを直接開かない限り、指定したモデルで動いていると信じるしかないわけです。
    locator: 「サブエージェント、はじめました」
    quant: null
    evidenceKind: case-report
    rqs: [TH04-Q4, TH07-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 古いモデルでは発生しなかったが、デフォルトで Multi Agent V2 を使う GPT-5.6 Sol へ移行したことで、Multi Agent V2 の隠しパラメータに起因する問題が一気に表面化した。著者はこの挙動を公式ドキュメントと矛盾し、意図したものではなさそうと見ている。
    quote: この隠しパラメータはMulti Agent V2の機能です。 そしてGPT-5.6 Solは、デフォルトでMulti Agent V2を使用する設定になっています。
    locator: 「なぜGPT-5.6 Solで発生するのか」
    quant: null
    evidenceKind: case-report
    rqs: [TH02-Q3]
    issues: []
    stance: supports
