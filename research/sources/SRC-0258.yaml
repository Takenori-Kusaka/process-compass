  - id: c3
    text: セキュリティのPreToolUseフックは想定外の終了コードでブロックを返すfail-closed、計測フックはエージェントを妨げないfail-openとし、層ごとに設計思想を逆にしている。
    quote: このフックは想定外の終了コードで落ちた場合に「黙って許可」ではなく「ブロック」を返す fail-closed 設計にしてあります。
    locator: 多層防御(PreToolUse hook)
