    text: LLMには「何をやりたいか」を任せ、「やってよいか」「どう繋ぐか」はコードと基盤で固める責務分離を設計の要点とする。
    quote: LLM には「何をやりたいか」を任せ、「やってよいか」「どう繋ぐか」はコードと基盤で固める、という責務分離です。
    locator: Claude Code を核に remote-claude で包む
