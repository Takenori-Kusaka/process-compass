summary: メルペイ決済基盤チームに常駐する Claude Code ベースの自律エージェント(半年運用)の設計。CLAUDE.md は誘導、強制は決定的なフック・ACL・コンテナ隔離に置き、DX Core 4 で利用を計測する。
claims:
  - id: c1
    text: 書き込み可能なリポジトリをCLAUDE.mdに明示して振る舞いを誘導するが、強制は短命トークン・ACLなどLLMの外側の決定的な層で行う。
    quote: CLAUDE.md には writable repo を明示してエージェントの振る舞いを誘導しますが、強制するのは上記の決定的な層です。
    locator: アーキテクチャ(権限管理)
    quant: null
