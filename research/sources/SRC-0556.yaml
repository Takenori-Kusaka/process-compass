summary: Amazon 公式サイトが掲載した PR/FAQ の説明(元社員の著書の抜粋、2021-02-09)。PR は1ページ未満・FAQ は5ページ以下と長さを様式で縛り、会議では全員が黙読する。承認後も書き換える文書とされ、他の文書から派生させて一致を保つ仕組みの記述は無い。
claims:
