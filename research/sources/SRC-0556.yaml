    quote: At the meeting, they distribute the PR/FAQ in either soft or hard copy, and everyone reads it to themselves.
    locator: The Features and Benefits of the PR/FAQ
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH05-Q4]
    issues: []
