  - id: c2
    text: AI エージェントを「特定の目標を達成するために、環境を感知し自律的に行動する AI システム」と定義し、自律は高度な自律に限らず、ある程度の自律性を持つものを含むとした。
    quote: 自律については、高度な自律状態だけを指しているのではなく、ある程度の自律性を持つものも含む。
    locator: 第1部 関連する用語(脚注19)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2, TH01-Q1]
    issues: []
    stance: context
  - id: c3
    text: 公平性の指針として、AI に単独で判断させず適切なタイミングで人間の判断を介在させることを検討し、その人間の判断が自動化バイアスに左右されない対策を講じるべきとする。
    quote: AI に単独で判断させるだけでなく、適切なタイミングで人間の判断を介在させる利用を検討する。なおその際には、人間の判断が自動化バイアスに左右されないような対策
