summary: 法的拘束力のない日本の統一的な AI ガバナンス指針の第1.2版。本編から AI エージェントの定義、Living Document としての更新方針、人間の判断の介在と自動化バイアス対策の記述を読んだ(PDF は curl で取得できず tavily で本文抽出)。
