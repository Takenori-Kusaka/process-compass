  - id: c3
    text: SVPG の build to learn / build to earn を引き、使い捨てプロトタイプは安く有用だが、実際に捨てることが条件だとする。
    quote: "Build to learn vs. build to earn (via SVPG): throwaway prototypes for discovery are dirt cheap and great — as long as you actually throw them away"
    locator: Show Notes
