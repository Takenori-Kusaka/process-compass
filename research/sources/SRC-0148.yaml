  - id: c4
    text: 「デリバリーは無料」は「だからテイスト/ディスカバリーだけが重要」と続くが、どちらも誤りで両方が重要であり続ける。
    quote: 'The real hidden sentence: "Delivery is free" is almost always followed by "…so taste is all that matters" or "…so discovery is all that matters." Both are wrong.'
