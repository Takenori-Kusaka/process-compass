summary: Teresa Torres と Petra Wille が「AI でデリバリーは無料になった」という言説を検討する 2026-09 のエピソード(ショーノートと Notable Moments を取得、全文文字起こしは会員限定)。単機能は安くなったが本番品質の製品は安くなっておらず、プロトタイプは 60-70% で止まり残り 30% に数か月〜数年かかると述べる。
claims:
  - id: c1
    text: Torres はデリバリーは無料ではなく、これからも無料にはならないと明言する。
    quote: "\"I don't think delivery is free. I don't think delivery will ever be free.\""
    locator: Notable Moments
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1, TH09-Q3]
    issues: []
    stance: contradicts
  - id: c2
    text: 最初の 60-70% は簡単でそれはプロトタイプだが、信頼できる製品へ残り 30% を閉じるのは数か月から数年の仕事。
    quote: "\"The first 60 to 70% is easy. It's a prototype… Closing that last 30% is months to years of work.\""
    locator: Notable Moments
    quant:
      value: 60-70% easy / last 30% = months to years
      n: not stated
