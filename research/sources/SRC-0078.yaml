  - id: c2
    text: 失敗モードには FM-1.2「役割指定への不服従」と FM-2.2「確認質問の欠落」が含まれる。ロールを与えても守られないこと、聞くべき時に聞かないことが、実測される失敗として分類されている。
    quote: Example for FM-1.3 Step repetition, FM-2.1 Conversation reset, FM-1.2 Disobey role specification
