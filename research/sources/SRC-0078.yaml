summary: 7つの MAS フレームワークの 1,600+ トレースを注釈し、14 の失敗モードを3分類(システム設計・エージェント間不整合・タスク検証)に整理。「役割指定への不服従」「確認質問の欠落」「検証の欠落・不備」が名指しされ、モデル能力よりシステム設計が主因だと論じる。
claims:
  - id: c1
    text: 14 の失敗モードを、システム設計の問題・エージェント間の不整合・タスク検証の3分類にまとめた。注釈者間一致 κ=0.88。
    quote: "This process identifies 14 unique modes, clustered into 3 categories: (i) system design issues, (ii) inter-agent misalignment, and (iii) task verification."
    locator: Abstract
    quant:
      value: 14 failure modes / 3 categories, κ=0.88
      n: 150 traces (taxonomy 開発) + 1600+ annotated traces (MAST-Data)
      design: qualitative annotation + LLM-as-a-judge
      population: 7 popular MAS frameworks (coding, math, general agent)
    evidenceKind: observational
