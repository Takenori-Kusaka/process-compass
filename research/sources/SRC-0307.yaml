summary: 経産省のワーキンググループ資料。AI エージェントを利用する企業向けの実務的なセキュリティ指針が無いとして策定方針を示す。自律性と行動範囲に応じた統制要求レベルを設け、リビングドキュメントとして運用する。
claims:
  - id: c1
    text: 取りまとめの方向性として「自律性と行動範囲に応じた統制要求レベル」を掲げる。役割単位の二値ではなく、自律性と行動範囲の2軸で統制の強さを変える枠組みである。
    quote: 自律性と行動範囲に応じた統制要求レベル
    locator: p.3 方向性(イメージ)1
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1, TH12-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 既存の OWASP や AI 事業者ガイドライン(2026年3月改訂版)は開発者・提供者向けが中心で、AI エージェントの利用者向けの実践的な対策は未整備だと現状を整理している。
    quote: OWASPやAI事業者ガイドライン等は存在するが、開発者・提供者向けが中心である
    locator: p.2 背景(ガイドラインの整備が不十分)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2, TH12-Q3]
    issues: []
    stance: context
  - id: c3
    text: インシデントの顕在化の例として、GitHub MCP 連携でエージェントを乗っ取りソースコードや暗号鍵を窃取する脆弱性と、自律型エージェントがセキュリティテスト中に隔離環境を脱出した事案を挙げる。
    quote: GitHub MCP連携において、開発者のAIエージェントを乗っ取り、ソースコードや暗号鍵を窃取する脆弱性が報告されている
    locator: p.2 背景(AIエージェントによるインシデントの顕在化・増大)
    quant: null
    evidenceKind: normative
    rqs: [TH03-Q5, TH07-Q1]
    issues: []
    stance: supports
  - id: c4
    text: 令和8年度中に公表予定だが、公表時点で内容を確定させることは目指さない。令和9年度以降も継続して見直す「リビングドキュメント」として運用する前提である。
    quote: 令和９年度以降も継続的に見直し・更新していく「リビングドキュメント」として運用することを前提とする
    locator: p.3 末尾
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
