summary: LLM がテストセットと評価者を兼ねる LLM-as-a-benchmark では、作成モデル自身が系統的に有利になる自己バイアスを機械翻訳(Gemini 2.5 Pro / GPT-4.1 / Claude Opus 4)で定量化。123 メモの引用文は原典どおりだが、検証領域はコードやテスト生成ではなく機械翻訳と Chatbot Arena。
claims:
  - id: c1
    text: LLM が生成したベンチマークは、それを作成したモデルを系統的に優遇する。
    quote: "We show that this paradigm has a fundamental problem: LLM-generated benchmarks systematically favor the model that created them ."
    locator: Abstract(arXiv HTML v3)
    quant:
      value: 各モデルが自分を 1 位に順位付け
      n: 3 models (Gemini 2.5 Pro, GPT-4.1, Claude Opus 4) × 複数言語対
      design: controlled experiment (estimator-bias framework)
      population: 機械翻訳(WMT25 系)+ Chatbot Arena
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123]
    stance: supports
  - id: c2
    text: 明示的な多様性制御の下で生成しても、各モデルの暗黙のスタイル傾向が均質でモデル固有の出力を生み、自身のスコアを押し上げる。
    quote: even when test data is generated with explicit diversity controls, each model’s implicit stylistic tendencies produce homogeneous, model-specific outputs that inflate its own scores.
    locator: Abstract / §5.2
    quant: null
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123]
    stance: supports
  - id: c3
    text: 自己バイアスは各モデルが自分を 1 位に置くほど強く、ピア合意の順位を覆す。
    quote: Self-bias is strong enough to cause each model to rank itself first, overriding the peer-consensus ordering.
    locator: Abstract / §4 Table 2
    quant: null
