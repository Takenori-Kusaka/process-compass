    rqs: []
    issues: [123]
    stance: supports
  - id: c4
    text: 検証対象は機械翻訳を主とし、モデルは Gemini 2.5 Pro・GPT-4.1・Claude Opus 4 の 3 つ。ソフトウェアテスト生成への転用はメモ側の推論。
    quote: We select Gemini 2.5 Pro, GPT-4.1, and Claude Opus 4 for two reasons.
