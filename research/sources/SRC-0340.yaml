summary: ホスト型 LLM が版番号を変えずに更新される「静かな更新」を供給網の統治問題として扱い、本番契約・リスク区分別の回帰スイート・互換性ゲートの3点からなる利用者側の枠組みを提案する4頁の workshop 論文。検証は探索的。
claims:
  - id: c1
    text: ホスト型 LLM は明示的な版の変更なしにプロバイダ側で継続的に更新され、機能・書式・安全制約の回帰を起こしうる。利用者が何も変えていなくても変化点が生じる。
    quote: However, the hosted LLM services evolve continuously through provider-side updates without explicit version changes.
    locator: Abstract
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 定めた安全・性能基準を満たさない限り更新を通さないリリース関門(互換性ゲート)を、モデル更新の統治手段として提案する。
    quote: release checkpoints that block updates unless they meet defined safety and performance standards (compatibility gates)
    locator: Abstract
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q3, TH02-Q4]
    issues: []
    stance: supports
  - id: c3
    text: 3領域25プロンプトによる探索的検証で、リスク区分ごとの分析は集計指標に隠れた回帰を見つけられ、正式な版の移行がなくても drift が起こりうることを示したとする。
    quote: risk category-level analysis can reveal regressions masked by aggregate metrics and that silent drift may occur even without formal model version transitions
    locator: Conclusion
    quant:
      value: null
      n: 25 prompts x 3 task domains, multiple LLM versions
      design: exploratory validation
      population: authentication, data validation, structured output tasks
    evidenceKind: case-report
    rqs: [TH02-Q3]
    issues: []
    stance: supports
  - id: c4
    text: 回帰スイートは実行ごとにモデル識別子と実行時刻のスナップショットを記録し、再現性と drift の帰属を可能にする設計である。
    quote: The suite also logs LLM snapshots, each with a model identifier and execution timestamp, to enable reproducibility and drift attribution.
    locator: §3 Risk-Category-Based Regression Suite
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q3, TH02-Q4]
    issues: []
    stance: supports
