summary: エージェント型アプリ固有の10リスク(ASI01 目標乗っ取り〜ASI10 暴走エージェント)。PDF 本文を読んだ。Least-Agency(不要な自律を与えない)を原則に掲げ、ASI09 で人が独立検証なしに承認する過信を独立したリスクとして扱う。
claims:
  - id: c1
    text: 最小権限と Excessive Agency を拡張して Least-Agency を掲げ、必要のない所にエージェント的振る舞いを置かないよう勧める。分類は ASI01 Goal Hijack、ASI02 Tool Misuse、ASI03 Identity & Privilege Abuse、ASI04 Agentic Supply Chain、ASI05 Unexpected Code Execution、ASI06 Memory & Context Poisoning、ASI07 Insecure Inter-Agent Communication、ASI08 Cascading Failures、ASI09 Human-Agent Trust Exploitation、ASI10 Rogue Agents。
    quote: We expand on the concepts of Least-Privilege and Excessive Agency by citing Least-Agency. This captures our advice to organizations to avoid unnecessary autonomy
    locator: Letter from The Agentic Top 10 Leaders(p.6-7)/ Agentic Top 10 At A Glance
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH01-Q1]
    issues: []
    stance: supports
  - id: c2
    text: ASI09 は、人が自律的な推奨や検証できない根拠に過度に依拠し、独立した検証なしに承認することでリスクが増幅するとし、自動化バイアスと権威バイアスを悪用経路に挙げる。
    quote: In agentic systems, this risk is amplified when humans over-rely on autonomous recommendations or unverifiable rationales, approving actions without independent validation.
    locator: "ASI09: Human-Agent Trust Exploitation — Description(p.33)"
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH06-Q4, TH01-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 機微な操作に最終確認の段がないと、利用者の信頼がそのまま即時実行に変わり、不可逆な送金・削除・権限昇格につながるとする。
    quote: "Missing Confirmation for Sensitive Actions: Lack of a final verification step converts user trust into immediate execution."
    locator: ASI09 — Common Examples of the Vulnerability 2(p.33)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH07-Q1]
    issues: []
    stance: supports
