summary: 個人開発(著者はKDDIアジャイル開発センター所属、個人アカウントでの投稿)で、常駐コンテキスト(CLAUDE.md・メモリ索引・Skills説明文)を索引化して削った前後を36日・238セッションで計測した記録。キャッシュ読み出しがコストの65.5%を占めた実測値を含む。
claims:
  - id: c1
    text: 2026-08の usage 実測で、月34,125リクエスト、コンテキストに入れた1トークンは平均50.8回読み直され、キャッシュ読み出しがコスト全体の65.5%を占めた(単価比で重み付けしたトークン量で比較)。
    quote: 私のプロジェクトの実測では、1 か月のリクエストが 34,125 回、コンテキストに入れた 1 トークンは平均 50.8 回読み直され、キャッシュからの読み直しがコスト全体の 65.5% を占めていました。
    locator: §1 何に困っていたのか / §0 前提情報
    quant:
      value: キャッシュ読み出し=コストの65.5%、再読倍率50.8倍
      n: 34,125リクエスト(2026-08の1か月)
      design: Claude Code の usage 値の実測。input/キャッシュ書き込み/キャッシュ読み出し/output を単価比で重み付け
      population: 個人開発1プロジェクト、定額プラン、プロンプトキャッシュ1時間TTL
    evidenceKind: observational
    rqs: [TH04-Q1, TH04-Q2]
    issues: [274]
    stance: supports
  - id: c2
    text: CLAUDE.md をトリガー表に分けたことで常駐コンテキストは 15.0K トークンとなり、本文を CLAUDE.md に書いていた場合の推計 36.4K(15.0K+ルール本文21.4K の反実仮想)より小さくなった。公式単価(2026-06-24時点、$1=¥155)での参考試算では、改善しなかった場合の月額 $703.7 に対して $290.0(約41%)の節約で、/clear を 1M の 50% で行う点は仮定である。
    quote: CLAUDE.md をトリガー表に分けたことで、常駐コンテキストは 36.4K → 15.0K トークンに減りました。…改善しなかった場合の月額 $703.7（¥109,075）に対して、約 41% の削減です。(表の合計「$290.0（¥44,948）」)
    locator: 2. 節約できた料金の概算（参考値）と「前提条件」
    quant:
      value: 常駐 36.4K→15.0K tokens; 試算 月$413.7(約41%)削減
      n: 月31,554ターン・166セッション(2026-08実測)
      design: 実測ターン数×差分トークン×公式単価(2026-06-24時点)の試算。/clear を1Mの50%で行う点は仮定
      population: 同上。Opus 81.0%/Fable 14.8%/Sonnet 4.2%の使用比率
    evidenceKind: observational
    rqs: [TH04-Q2, TH03-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 置いてある知識2.03Mトークンのうち36日で読まれたのは1.12Mで、約半分は一度も読まれなかった。ルール本文は238セッション中42回しか読まれず、progressive disclosure で未読分のコストを払わずに済んだ。
    quote: 約半分は一度も読まれていませんが、その分のコストは掛かっていません。
    locator: §2 改善後、1 か月の計測でわかったこと / §4 表
    quant:
      value: 2.03M中1.12M読まれた; ルール本文 42/238セッション
      n: 36日・238セッション
      design: ファイル文字量からのトークン換算(1字≒0.5トークン)による推定
      population: 同上
    evidenceKind: observational
    rqs: [TH03-Q1, TH05-Q3]
    issues: []
    stance: supports
  - id: c4
    text: 外したつもりの外部フレームワークの残骸1,061トークンが常駐に残り、36日で33.5Mトークンの読み直しを生んでいた。常駐の内訳を数える仕組みが無かったことが原因とし、以後の棚卸しは『減らす方向の判定だけ』を持たせた。
    quote: 外し方が完全ではなかったため、1,061 トークンの残骸として常駐コンテキストに残り続け、36 日で 33.5M トークンの読み直しを生んでいました。
    locator: §4.1 前後で比べられた1例 / §3.5
    quant:
      value: 1,061 tokens × 36日 → 33.5M tokens 再読
      n: 1件
      design: 常駐内訳の事後集計
      population: 同上
    evidenceKind: case-report
    rqs: [TH04-Q2, TH07-Q4]
    issues: []
    stance: context
  - id: c5
    text: 指示・ルール・索引・Skills は放置すると日常作業で増え続けるため、棚卸しは『削る/必要時読み込みへ移す/残す』の3択とし、増やす判定を入れていない。
    quote: 上の 4 か所は、放っておくと指示やルールは増え、索引内容は伸び、Skills は増えます。
    locator: §3.5 増え続けないようにどう見張るのか
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3, TH03-Q3]
