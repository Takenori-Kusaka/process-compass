summary: RAND の Assumption-Based Planning 原典(1993)。計画が依拠する前提のうち崩れうるものを特定し、前提ごとに signpost(脆弱性の変化を示す事象・閾値)と shaping / hedging の行動を定める 5 段階。PDF は画像のみで文字層が無く、要約(pp. xi–xiii)を画像で読んだ(quote は目視転記)。本文の章は未読。
claims:
  - id: c1
    text: ABP は、計画が依拠する前提のうち計画期間内に崩れうるものを特定し、その脆弱性を監視する signpost と、前提を守る行動・崩れた場合に備える行動を定義する。前提を『観測する対象』として扱う手続の原典である。
    quote: signposts can be developed to monitor their vulnerability and actions can be defined both to protect the assumptions and to prepare for the possibility that they may fail in any event.
    locator: Summary, p. xi
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
  - id: c2
    text: signpost は、前提の脆弱性が変化していることを明確に示す事象または閾値と定義される。前提ごとに観測条件を先に決めておく様式である。
    quote: A signpost is an event or threshold that clearly indicates the changing vulnerability of an assumption.
    locator: "Summary, Step 3: Define Signposts, p. xiii"
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
  - id: c3
    text: hedging action は、重要な前提が崩れたものとして計画を考え直す再計画の行為を要する。前提の失敗が上位の計画の再訪へつながる手続を、前提の側から定めている。
    quote: Fundamentally different from a shaping action, a hedging action requires an act of replanning.
    locator: "Summary, Step 5: Define Hedging Actions, p. xiii"
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3, TH09-Q2]
    issues: [256, 250]
    stance: supports
