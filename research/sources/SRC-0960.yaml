  - id: c4
    text: 'レビューが形式化(形骸化)すると、開発者の負担になるだけで品質向上に結び付かない。形骸化の防止策として、利害関係者以外のクロスレビュアを選ぶ事例が挙がっている。'
    quote: '属人性が高く、形式化(形骸化)してしまった「レビュー」は、開発者の負担・苦痛になるばかりであり、真の品質向上に結び付かない。'
    locator: 'p.7 第3期 ② レビューの質の向上'
    quant: null
