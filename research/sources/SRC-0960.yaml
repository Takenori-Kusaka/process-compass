summary: '日本のソフトウェア品質保証部門長が各社から集まる会(2009-11 発足、10 年で 78 社 104 名)の 10 年間の活動記録(32 ページ)。部長自身が書いた、悩み・出荷許可の権限・アジャイル・経営視点・品質事故再発防止の討議の要約である。第1期に出荷許可の権限とその方法を実態アンケートの項目に挙げたが、結果の数値は本書に載っていない。アジャイルについては、プロセス確認型の品質保証が機能しなくなる懸念、組込系ではチームに入り、エンタープライズ系では外から監視するという結論が書かれている。PDF のテキスト層には字間の空白が入るため、quote はページの描画から取った。'
claims:
