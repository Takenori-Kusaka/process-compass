    text: '品質保証部門のミッションを、ルールを作ることではなく競争力の向上に置く。建前(統制する部門)から実運用の望み(頼りにされる部門)への動きが、第4期と第2期の進化論に書かれている。'
    quote: '品質保証部門のミッションはプロセス(ルール)を作ることではなく、チーム／組織の競争力向上にある。'
    locator: 'p.8 第4期 ④、p.21 付録C-1(「管理する品質保証部門から、ありがたがれる、頼りにされる品質保証部門」への進化)'
