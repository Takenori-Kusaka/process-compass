    text: 'アジャイルについて部長の会は、従来の品質保証がウォーターフォール前提でプロセス準拠性の確認に重きを置き、それがアジャイルでは機能しなくなる、と書いた。最後の合否判定テストも、仕様書が無いか最後では遅いという懸念がある。'
    quote: 'プロセス準拠性の確認、各工程でのアウトプットの確認などプロセスの確認を重視してきたが、これらがアジャイルでは機能しなくなる。'
