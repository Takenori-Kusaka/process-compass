    text: '第6期の結論は、組込系ではチームに入るのが有効でも、エンタープライズ系受託では人数や業務知識の限界でチームに入るのは現実的でないという意見が多く、外からプロセスと成果物品質を監視する、というものだった。'
    quote: 'エンタープライズ系受託開発では適用が難しいという意見が多くあった。'
