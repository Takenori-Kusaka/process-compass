    text: '品質保証部門の組織の在り方にベストプラクティスはなく、自社の機能を当然と思いがちだが、あるべき姿の掘り下げが要るとまとめている。'
    quote: '組織としての在り方は機能・位置付けとも幅広く、ベストプラクティスはない'
