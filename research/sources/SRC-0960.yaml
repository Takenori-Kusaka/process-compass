    text: '品質事故の再発防止策として、プロセス遵守の啓蒙や、未熟な品質保証を品質管理の番人とするケースが現にあると書く。「正しいプロセスで開発すれば正しいソフトが出来る」という通念と、品質保証の実力育成の遅さの乖離を示す。'
    quote: '世の中の多くの人は正しいプロセスで開発すれば正しいソフトウェアが完成すると信じているため、品質事故の再発防止策としてプロセス順守の啓蒙や未熟な品質保証を品質管理の番人とするケースを目の当たりにすることがある。'
