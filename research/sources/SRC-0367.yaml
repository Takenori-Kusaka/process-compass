summary: AWS の ADR 手順(初版 2022-03-16、文書履歴で確認)。ADR はチームのレビューで Accepted/Rejected を決め、承認後は不変で supersede により置き換える。承認済み ADR はコードレビューで違反を指摘する根拠として使う。
claims:
  - id: c1
    text: チームが承認した ADR は不変になる。新しい知見で別の決定が要るときは新しい ADR を提案し、承認されたら旧 ADR を supersede する。
    quote: When the team accepts an ADR, it becomes immutable. If new insights require a different decision, the team proposes a new ADR. When the team accepts the new ADR, it supersedes the previous ADR.
    locator: Architectural decision record process 冒頭
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH05-Q1]
    issues: [272]
    stance: context
  - id: c2
    text: ADR レビューの目的は、チームがその ADR を承認するか、手直しを求めるか、却下するかを決めることである(判定はチーム内で行い、外部のゲートではない)。
    quote: The goal of the ADR review process is to decide whether the team accepts the ADR, determines that it needs rework, or rejects the ADR.
    locator: ADR adoption process
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH05-Q2]
    issues: [253]
    stance: context
  - id: c3
    text: レビュー会ではまず ADR を読む時間を取り、1本あたり平均10〜15分で足りるとする(測定根拠は示されていない)。
    quote: The review meeting should start with a dedicated time slot to read the ADR. On average, 10 to 15 minutes should be enough.
    locator: ADR adoption process
    quant:
      value: 10-15 minutes per ADR
      n: not stated
      design: practitioner guidance
      population: project team ADR review meetings
    evidenceKind: expert-opinion
    rqs: [TH05-Q3]
    issues: [252]
    stance: context
  - id: c4
    text: 承認済み ADR はコードレビューの判定根拠になる。ADR に違反する変更を見つけたレビュアは、ADR へのリンクを示して修正を求める(ADR 自体ではなくコード変更の判定に ADR を使う)。
    quote: During the code review, a code reviewer might find changes that violate one or more ADRs.
    locator: ADR adoption process(コードレビューでの適用)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH05-Q2]
    issues: [253]
    stance: qualifies
  - id: c5
    text: 却下した ADR にも却下理由を書き、同じ議論の蒸し返しを防ぐ(採らないと決めたことの記録)。
    quote: In this case, the ADR owner adds a reason for the rejection to prevent future discussions on the same topic.
    locator: ADR adoption process
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH05-Q1]
    issues: [251]
    stance: context
