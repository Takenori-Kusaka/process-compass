summary: 化学プロセス安全管理(PSM)の変更管理(MOC)条項を、組織・人員・予算の変更に適用する際の OSHA の解釈。人員削減や予算削減が手順・設備に波及するなら MOC が必要、波及しないなら不要という判定フローを示す。
claims:
  - id: c1
    text: 合併・再編・人員変更・予算改定といった組織変更は、プラント水準の PSM に影響しうるため MOC 手続を起動しうる。体制の変化を変更管理の起点として扱う公的解釈である。
    quote: Some organizational changes, such as changes resulting from mergers, acquisitions, reorganizations, staffing changes, or budget revisions, may affect PSM at the plant level
    locator: paragraph 2
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 運転要員を減らす場合、既存の運転手順を維持できない可能性があるため、MOC を実施して手順を新しい人員水準に合わせて改めることを求める。
    quote: when the number of employees operating a process is to be reduced due to an organizational change, operators may not be able to continue implementation of existing operating procedures.
    locator: paragraph 4 (staffing example)
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 5要素(化学物質・技術・設備・手順・施設)に影響しない組織変更は MOC を起動しない。起動条件を「体制変更そのもの」ではなく「手順・設備への波及」で限定している。
    quote: Other organizational changes may not impact any of the five elements listed in 29 CFR 1910.119 (l)(1) and therefore would not trigger PSM MOC.
    locator: paragraph 6 / flowchart
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q2]
    issues: []
    stance: qualifies
  - id: c4
    text: 本メモは MOC の対象となる変更の種類を追加・変更するものではなく、既存条項の適用を明確にする位置づけである。
    quote: It does not add to or modify the types of changes subject to MOC
    locator: paragraph 1
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q2]
    issues: []
    stance: context
