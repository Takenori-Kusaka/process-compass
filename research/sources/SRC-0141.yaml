summary: 2022 年版ガイドを AI 時代に書き直した記事。「同日出荷できるからこそ何を出すかの判断が重要」「安全で可逆な案は 1-2 プロンプトで作れるので作ること自体が検証になる」とし、OST に実験と機能の両方を置く運用へ変えたと述べる。有料部分は未読。
claims:
  - id: c1
    text: 思いついた日に出荷できる今、何を出荷するかの判断がかつてなく重要になり、速度は無駄を増幅する。
    quote: When you can ship an idea the same day you have it, deciding what to ship becomes more important than ever. And speed multiplies waste
    locator: 冒頭
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: supports
  - id: c2
    text: 安全で可逆な案が 1-2 プロンプトで実装できるなら、作ること自体が検証になり、すべての案に事前実験は不要。ディスカバリーは「検証済みバックログ」を生まなくなった。
    quote: Today, when a safe, reversible idea takes 1-2 prompts to implement, building it can be the test, and not every idea needs a formal experiment first.
    locator: 3. Continuous Product Discovery in 2026
    quant: null
