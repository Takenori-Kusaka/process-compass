summary: 九州大学の単著の実践論文。LLM 支援の仕様駆動開発で、生成物やレビュー所見をどの仕様階層・責務・承認状態へ帰属させるかという判断を「裁定負荷」と定義した。三役レビュー(主役・敵対役・判定役)の所見122論点を、7つの LLM 判定者と人間で裁定比較した。本文は有償で、抄録のみ読んだ。
claims:
  - id: c1
    text: 仕様駆動開発を入れると、開発者の主な負担は実装から、所見や生成物を仕様階層・責務境界・承認状態へ帰属させる管理的判断(裁定負荷)へ移ると定義する。
    quote: 生成物やレビュー所見を仕様階層，責務境界，承認状態へ帰属させる管理的判断を「裁定負荷」と定義し
    locator: 論文抄録
    quant: null
    evidenceKind: case-report
    rqs: [TH08-Q1]
    issues: [255]
    stance: context
  - id: c2
    text: 7機能・5段階(意図・要件・設計・作業分解・実装)の仕様駆動開発で、各段階に主役・敵対役・判定役の三役レビューを適用し、作業分解段階の対処対象所見127件を122の裁定論点に整理した。
    quote: 作業分解段階で得られた127件の対処対象所見を122件の裁定論点へ整理した
    locator: 論文抄録
    quant:
      value: 127所見 → 122論点
      n: 7機能・5段階、判定者 = 7 LLM + 人間
      design: self-applied case study(ReviewCompass)
      population: 著者自身の開発
    evidenceKind: case-report
    rqs: [TH08-Q1, TH06-Q3]
    issues: [254]
    stance: context
  - id: c3
    text: 裁定比較で観察されたのは次の現象である。重大度では説明できない裁定難度、不一致時にも高い自己申告の確信度、モデル間の判断分岐、起草に関与したモデルが起草時の方針を支持しやすい傾向、別案生成、質問返し。
    quote: 重大度だけでは説明できない裁定難度，不一致時にも高い確信度を示す自己申告，モデル間の判断分岐，起草に関与したモデルが起草時の方針を支持しやすい傾向，別案生成，質問返しなどが観察された
    locator: 論文抄録
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q3, TH06-Q4]
    issues: [256, 258]
    stance: supports
  - id: c4
    text: 裁定を重大度だけで LLM に委譲するのは難しく、モデル間の分岐・別案生成・質問返しを人間承認へ戻すエスカレーション信号として使うのが有効だと結論する。
    quote: 裁定を重大度のみで委譲することは難しく，モデル間分岐，別案生成，質問返しなどを人間承認へ戻すエスカレーション信号として利用することが有効であることを示した
    locator: 論文抄録
    quant: null
    evidenceKind: case-report
    rqs: [TH01-Q4, TH06-Q3]
    issues: [248]
    stance: supports
