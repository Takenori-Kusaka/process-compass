summary: Cooper の Stage-Gate 公式サイトによる第 5 世代の 8 更新。Iterative Stage-Gate では開発段階開始時に製品定義が 50% 未満でもよく、開発中に定義が進化する。AI Agentic Stage-Gate では AI エージェントが Stage 2(事業計画)を自律実行しゲート判定を半自動化する構想を示す。AI 導入案件向けに PoC を Stage 2 に置く 4 段階も提示する。ページは無日付だが 2025 年データを引用。
