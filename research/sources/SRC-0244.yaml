summary: AI が作った PR を AI がレビューする閉ループを GitHub イベントデータ（CodAGE）から構成し規模と挙動を記述した研究。同一製品によるレビューが異製品より大幅に多いことを示す。観察研究で因果は主張しない。
claims:
  - id: c1
    text: AI レビューを1件以上受けた AI 作成 PR 248,641 件のうち、同一製品レビューが 208,145 件、異製品レビューが 45,269 件（両方 4,773 件）。作成と同じ製品によるレビューが主流である。
    quote: Among these, 45,269 received cross-product review and 208,145 received same-product review; 4,773 PRs received both.
    locator: Abstract
    quant:
      value: same-product 208,145 vs cross-product 45,269
      n: 248,641 AI-attributed PRs with ≥1 AI review
      design: observational mining of GitHub events (signature-based attribution)
      population: public GitHub, CodAGE dataset
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [258]
    stance: context
  - id: c2
    text: 異製品間の AI-to-AI レビューは識別できたエージェント作成 PR の約 1.6% にとどまるが、2025-Q1 から Q3 に2桁以上増えた。
    quote: cross-product AI-to-AI code review occurs in only about 1.6% of identified agent-authored PRs but is substantial in absolute terms
    locator: Abstract
    quant:
      value: ≈1.6% of agent-authored PRs
      n: agent-authored PRs in CodAGE
      design: observational
      population: public GitHub 2025
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: []
    stance: context
  - id: c3
    text: 4つの二役レビュアーのうち3つで、同一製品グループの PR あたり平均コメント数が 58〜65% 多かったが、効果量は小〜無視できる程度で上位の裾に集中していた。同一製品レビューが甘いという単純な仮説は支持されない。
    quote: For three of four dual-role reviewers, mean comments per PR were 58–65% higher in the same-product group, though effect sizes were small or negligible
    locator: Abstract
    quant:
      value: +58–65% mean comments/PR (same-product)
      n: 4 dual-role reviewers
      design: observational, Cliff's delta small/negligible
      population: AI-to-AI reviewed PRs
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: []
    stance: qualifies
  - id: c4
    text: 製品の境界はモデルの境界と一致しない（異なる製品が同じ基盤モデルを共有しうる）ため、製品の違いを系統の独立性とみなせない。
    quote: Product boundaries also need not match model boundaries, since different products may share a foundation model and one product may run several.
    locator: 6 Discussion
    quant: null
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: []
    stance: qualifies
