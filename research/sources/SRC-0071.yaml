summary: Claude Code の agent teams 公式ドキュメント(2026-09-23 取得版、日付記載なし)。実験的機能で既定は無効。リード1セッション+独立文脈のチームメイトが共有タスクリストとメッセージで協調する。並列探索に向き、逐次作業や同一ファイル編集には不向きと明記。
claims:
  - id: c1
    text: agent teams は実験的機能で既定では無効。環境変数で明示的に有効化しない限りチームメイトは生成・提案されない。セッション再開・タスク調整・終了に既知の制限がある。
    quote: Agent teams are experimental and disabled by default. Enable them by setting CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 in your settings.json or environment.
    locator: ページ冒頭の注意書き
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3]
    issues: [248]
    stance: qualifies
  - id: c2
    text: 構成は、リードが作業を調整・割当・統合し、チームメイトは各自の文脈窓で独立に動き相互に直接通信する。人はどのチームメイトにも直接話せる。役割は「並列の作業者」であってロール保持者ではない。
    quote: One session acts as the team lead, coordinating work, assigning tasks, and synthesizing results. Teammates work independently, each in its own context window, and communicate directly with each other.
    locator: 冒頭 / How agent teams work
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3]
    issues: [248]
    stance: qualifies
  - id: c3
    text: チームは調整オーバーヘッドと大幅なトークン増を伴い、独立に動ける場合のみ有効。逐次タスク・同一ファイル編集・依存の多い作業は単一セッションかサブエージェントが良い。
    quote: Agent teams add coordination overhead and use significantly more tokens than a single session. They work best when teammates can operate independently.
    locator: When to use agent teams
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3, TH04-Q4]
    issues: [248]
    stance: qualifies
