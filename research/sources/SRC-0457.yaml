summary: エージェントPR 31,268 件と人のPR 6,135 件の変更規模・マージ率を比べた MSR'26 採択論文。エージェントPRは規模がむしろ小さく、変更行数の中央値に有意差はない。『AIのPRは巨大』という一般化を限定する。
claims:
  - id: c1
    text: エージェントPRは人のPRよりマージ率が低く(76.80% 対 82.82%)、コミット・ファイル・ディレクトリの中央値はむしろ小さい。変更行数には有意差がない(p=0.131)。
    quote: "APRs have a lower merge rate than HPRs (76.80% vs. 82.82%, p<0.001) and smaller footprints: fewer commits (median 1 vs. 2, p<0.001), files (median 3 vs. 4, p<0.001)"
    locator: Results(Table 1)
    quant:
      value: マージ率 76.80% vs 82.82%、行数中央値 90 vs 88(有意差なし)
      n: エージェントPR 31,268 / 人のPR 6,135
      design: observational(ロジスティック回帰)
      population: AIDev データセットのクローズ済みPR
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: qualifies
  - id: c2
    text: コミット数はマージの強い負の予測子で、1コミット増えるごとにマージのオッズが約5%下がる(OR=0.95)。ファイル数・ディレクトリ数は有意な関連がない。
    quote: Logistic regression indicates that the number of commits is a strong negative predictor of merging (OR = 0.95, p<0.001), with each additional commit reducing merge odds by about 5%
    locator: Results
    quant:
      value: OR=0.95/コミット
      n: エージェントPR 31,268
      design: observational(多変量ロジスティック回帰)
      population: AIDev データセット
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: context
