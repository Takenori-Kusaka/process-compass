summary: '認証機関 DQS の発表。ISO 9001:2026 が 2026-09-16 に発行され、2015 年版の認証は 3 年の移行の後、2029-09-30 まで有効(GAC Inc. の最終の決定による)。調和構造に従うこと、品質文化と倫理的な行動の推進をトップマネジメントに求めること等を変更点に挙げる。二次情報で、規格の本文ではない。#336 で、附属書H H.10 の追随の期限を考えるために登録した。'
