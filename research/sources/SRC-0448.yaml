summary: スタック型PRでの GitHub Actions の発火規則。pull_request トリガーは各PRがスタック基底を向いているものとして発火し、CI 回数がスタック段数倍になるため、stack メタデータで絞る方法を示す。日付は github/docs のコミット履歴による。
claims:
  - id: c1
    text: main を対象とする pull_request ワークフローは、ネイティブのスタックでは最下段だけでなく全段で発火し、ワークフローの変更は不要とされる(手動スタックで上段にCIが掛からない base 制約を解消)。
    quote: A workflow configured to run on pull_request events targeting main runs for every pull request in the stack, not just the bottom one
    locator: How workflows run for a stack
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: contradicts
  - id: c2
    text: ワークフローはPRごとに1回走るため、大きなスタックは CI 使用量を段数倍に増やす。公式は最下段(未マージの最下位)と最上段(全変更を含む)に重い処理を限る条件式を示す。
    quote: Because a workflow runs once per pull request, a large stack multiplies your CI usage. However, you can use stack metadata to run expensive jobs only where they are needed.
    locator: How workflows run for a stack / Reducing CI usage
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: qualifies
  - id: c3
    text: stack の位置・段数・基底ブランチは github.event.pull_request.stack として式から参照でき、スタックに属する場合にのみ存在する。
    quote: Stack metadata is available in workflow expressions via github.event.pull_request.stack. This property is present only when the pull request belongs to a stack
    locator: Accessing stack metadata
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: []
    stance: context
