summary: SWE-bench Verified で自動採点合格した AI の PR を実際のメンテナがレビューした研究。合格 PR の約半数はマージされない水準で、ベンチ値と実務の差を直接測った一次資料。
claims:
  - id: c1
    text: 2024 年半ばから 2025 年半ば〜後半のエージェントが書いた、SWE-bench Verified のテストに合格した PR のおよそ半数は、リポジトリのメンテナによって main へマージされないと推定される。
    quote: roughly half of test-passing SWE-bench Verified PRs written by mid-2024 to mid/late-2025 agents would not be merged into main by repo maintainers
    locator: Summary
    quant:
      value: ~50% of test-passing PRs not mergeable
      n: 296 AI PRs + 47 golden PRs, 4 maintainers, 3 repos
      design: maintainer review, golden-baseline adjusted
      population: SWE-bench Verified agents mid-2024 to late-2025
    evidenceKind: observational
    rqs: [BASE-Q2, TH11-Q2]
    issues: [282]
    stance: qualifies
  - id: c2
    text: メンテナのマージ判定は自動採点のスコアより平均約 24 ポイント低く、年あたりの伸びも 9.6 ポイント遅い。
    quote: on average maintainer merge decisions are about 24 percentage points lower than SWE-bench scores supplied by the automated grader
    locator: Introduction / Figure 1
    quant:
      value: -24 pp (and -9.6 pp/yr slower)
      n: 296 PRs
      design: maintainer review vs automated grader
      population: SWE-bench Verified repos
    evidenceKind: observational
    rqs: [TH11-Q2]
    issues: [282]
    stance: qualifies
