summary: Anthropic Labs による長時間自律開発のハーネス設計記事(2026-03-24)。自己評価は甘くなるため生成と評価を別エージェントに分け、着手前に「done」を合意する sprint contract を置く。費用は単独の20倍超。ハーネスの各部品はモデルの進化で陳腐化する前提とする。
claims:
  - id: c1
    text: 自分の成果物を評価させると、エージェントは人が見て凡庸な品質でも自信を持って称賛する(自己評価の甘さ)。
    quote: When asked to evaluate work they've produced, agents tend to respond by confidently praising the work—even when, to a human observer, the quality is obviously mediocre.
    locator: Why naive implementations fall short
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q4, TH06-Q5]
    issues: [268]
    stance: supports
  - id: c2
    text: 生成者に自己批判させるより、独立した評価者を懐疑的に調整する方がはるかに扱いやすい。ただし評価者も LLM で、LLM 生成物に甘い傾向は残る。
    quote: tuning a standalone evaluator to be skeptical turns out to be far more tractable than making a generator critical of its own work
    locator: Why naive implementations fall short
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH06-Q5, TH06-Q3]
    issues: []
    stance: supports
  - id: c3
    text: 分離しても評価者は LLM であり、LLM 生成物に寛大な傾向を持つ(同系統評価の限界を当事者が認める)。
    quote: the evaluator is still an LLM that is inclined to be generous towards LLM-generated outputs.
    locator: Why naive implementations fall short
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH06-Q3]
    issues: []
    stance: qualifies
  - id: c4
    text: 各スプリント前に生成者と評価者がコードを書く前に「done」の定義を合意する sprint contract を置き、高水準の仕様とテスト可能な実装の間を埋めた。
    quote: 'Before each sprint, the generator and evaluator negotiated a sprint contract: agreeing on what "done" looked like for that chunk of work before any code was written.'
    locator: Scaling to full-stack coding
    quant: null
    evidenceKind: case-report
    rqs: [TH08-Q1, TH08-Q2]
    issues: []
    stance: context
  - id: c5
    text: 同じ課題で単独実行 20 分 $9 に対しフルハーネスは 6 時間 $200 と20倍超の費用だが、品質差は明白だった(1課題の事例)。
    quote: The harness was over 20x more expensive, but the difference in output quality was immediately apparent.
    locator: Scaling to full-stack coding(Solo vs Full harness)
    quant:
      value: $9 (20 min) vs $200 (6 hr)
      n: 1 prompt, Opus 4.5
      design: single case comparison
      population: retro game maker build
    evidenceKind: case-report
    rqs: [TH07-Q4, TH04-Q4]
    issues: []
    stance: context
  - id: c6
    text: ハーネスの各部品は「モデルが単独でできないこと」の仮定を符号化しており、モデルの進化で急速に陳腐化するため定期的に検証すべきだとする。
    quote: every component in a harness encodes an assumption about what the model can't do on its own, and those assumptions are worth stress testing
    locator: Iterating on the harness
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q3]
    issues: []
    stance: supports
