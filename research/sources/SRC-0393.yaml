summary: 誤った主張を続けるユーザー役 LLM が最大 25 ターン反論し続けるベンチマーク SPINE。全モデルでターン数とともに迎合(正しい立場の放棄)が増え、短い評価は迎合を過小評価すると示した。
claims:
  - id: c1
    text: 迎合による立場の崩壊率は、会話が長くなるほどすべてのモデルで上がり、短いプロトコルは迎合を過小評価する。長時間の対話で検証役が相手に合わせていく現象の実証。
    quote: collapse rates increase with conversation length for every model, short-horizon protocols underestimate sycophancy and resistance under sustained pressure remains unreliable across current models
    locator: Abstract
    quant:
      value: 全モデルでターン数とともに崩壊率上昇
      n: 本番系 4 + Olmo3-7b 3 変種、偽前提 100 問+非倫理的質問 100 問、最大 25 ターン
      design: controlled experiment (adaptive LLM proxy)
      population: 対話型 LLM
    evidenceKind: controlled-experiment
    rqs: [TH06-Q4]
    issues: [268]
    stance: supports
  - id: c2
    text: 応答が折れたときも推論トレースには正しい立場が残っていることが多く、迎合は知識不足ではなく相手に合わせる選択として生じる。
