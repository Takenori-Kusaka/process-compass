summary: Copilot code review の概念文書。レビュー努力水準（Lite/Balanced）とその費用目安、Copilot 承認、指示・スキルの読み込み元（head ブランチ）、人のレビューで補うべきことを定める。
claims:
  - id: c1
    text: レビューの努力水準を変更の重要度で選ぶよう推奨する。セキュリティ上重要なコードや複数サービスにまたがる PR には Balanced、定型変更には Lite。
    quote: Use Balanced for security-sensitive code, multi-service pull requests, or repositories with strict quality standards.
    locator: Review effort level
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q1, TH04-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 1回のレビューの費用目安は Lite で約 $0.05〜$1、Balanced で約 $0.25〜$5 の AI credits（ベンダーの推定値、標本・測定方法の記載なし）。
    quote: A review typically consumes an estimated $0.05 USD to $1 USD worth of AI credits with "Lite" effort, and $0.25 USD to $5 USD worth of AI credits with "Balanced" effort.
    locator: Estimated consumption
    quant:
      value: $0.05–$1 (Lite) / $0.25–$5 (Balanced) per review
      n: not stated
      design: vendor estimate
      population: Copilot code review runs
    evidenceKind: vendor-guidance
    rqs: [TH04-Q4]
    issues: []
    stance: context
  - id: c3
    text: Copilot code review はカスタム指示・エージェント指示・スキルを base ではなく head ブランチ（レビュー対象の変更側）から読む。レビュー対象の PR 自身がレビュアーの規則を書き換えられる構成であり、検証の独立性の観点で注意を要する。
    quote: When reviewing a pull request, Copilot reads repository custom instructions, agent instructions, and agent skills from the head branch (the branch with your changes), not the base branch.
    locator: Agent skills
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q3, TH07-Q2]
    issues: [258]
    stance: context
  - id: c4
    text: Copilot はすべての問題を見つける保証がなく誤りもあるため、指摘を検証し人のレビューで補うよう明記する（承認機能の追加後も同じ文書に併記）。
    quote: Always validate Copilot's feedback carefully. Supplement Copilot's feedback with a human review.
    locator: 末尾（Further reading の直前）
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6]
    issues: []
    stance: context
