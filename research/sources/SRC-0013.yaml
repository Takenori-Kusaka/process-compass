summary: 検索 API・Python インタプリタ・毒性分類器と対話して検証・修正する CRITIC。ツール除去(w/o Tool)で QA の改善は text-davinci-003 で -0.03 F1、ChatGPT で +2.33 F1 に縮む(CRITIC 本体は +5.6 / +7.7)。254 メモの「ほぼゼロ」は text-davinci-003 では正確、ChatGPT では約 3 割残る。
