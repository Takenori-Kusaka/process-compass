summary: Renovate の構成の移行。旧い構成は使う前に内部で読み替えられ、書き換えは任意の PR として人へ出す。構成に版の欄は無く、旧い構成は無期限に動く。#315 で、緩める向きの黙った読み替えを採らない判断の比較の対象として引いた。
claims:
  - id: c1
    text: 旧い構成は使う前に内部で移行され、デバッグログのほかには見えない。configMigration を有効にすると、構成ファイルを書き換える PR を作る。
    quote: Config migration works by migrating legacy config internally, before the config is used. If done right, config migration "just works" silently and legacy configs continue working indefinitely. The only sign that "config migration" is needed is the debug message in the Renovate logs, noting the old and newly migrated configs.
