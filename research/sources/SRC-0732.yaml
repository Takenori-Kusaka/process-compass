summary: 'SARIF 2.1.0(正誤表1 を含む OASIS 標準)の抑止の定め。抑止は「結果を一覧・件数から外す要求」で、kind は抑止の仕組み(inSource / external)、status は審査の状態(accepted / underReview / rejected)を表す。却下の理由は列挙ではなく、利用者が書く自由な文字列(justification)である。#336 で、外部の書式が却下の理由を構造化しているかを確かめるために登録した。公開の日は頁から確かめていない。'
claims:
  - id: c1
    text: SARIF の抑止の kind は抑止の仕組みを表し、inSource(言語の構文による)と external(外部の永続の保存先による)の2値である。却下の理由の分類ではない。
    quote: '"inSource" : The result is suppressed by a syntactic construct offered by the programming language.'
    locator: §3.35.2 kind property
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [336]
    stance: qualifies
  - id: c2
    text: status は任意の欄で、accepted(抑止を受け入れた)・underReview(抑止するかを討議中)・rejected(抑止しないと決めた)の3値である。
    quote: '"underReview" : The engineering team is discussing the result to decide if they will suppress it.'
    locator: §3.35.3 status property
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [336]
    stance: context
  - id: c3
    text: 抑止の理由は justification で、利用者が書く自由な文字列である。理由の値の列挙は無い。
    quote: a user-supplied string that explains why the result was suppressed.
    locator: §3.35.6 justification property
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [336]
    stance: qualifies
  - id: c4
    text: 抑止の目的として、方針が求めるすべての結果を見て、直したか直さないと明示に決めたかを監査人へ示す場面を挙げ、kind が技術者の合意を記録に明示するレビューの工程を可能にすると書く。
    quote: teams must show an auditor that they have looked at all results that corporate policy requires, and either fixed them or explicitly decided not to fix them.
    locator: §3.35.1 General NOTE 1
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [336]
    stance: context
  - id: c5
    text: suppressions が無い(null)結果は抑止の情報が無いものとし、抑止されていないものとして扱う。空の配列も抑止されていないものとして扱う。
    quote: A SARIF consumer SHALL treat such a result as not suppressed.
    locator: §3.27.23 suppressions property
    quant: null
    evidenceKind: normative
    rqs: []
    issues: [336]
    stance: context
