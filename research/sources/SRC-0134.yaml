summary: "Wharton らによる新製品アイデア生成の 8 研究。GPT-4 の案は購買意向で人間(MBA 学生 50 名の案から 200 件)より高く上位 10% に 7 倍入りやすいが、集合としての多様性は有意に低く、5 データセットの再分析でも再現。人間が課題を選び AI が解を出す分業やベンダー横断プールで多様性がほぼ回復する。PDF 本文に「Received: January 2026; accepted: July 2026」(POM) の記載あり。"
claims:
  - id: c1
    text: LLM 生成の製品アイデアは購買意向で人間より平均品質が高く、上位 10% に入る確率が 7 倍である(人間 200 件対 GPT-4 200 件、Prolific の大学生年代が 1 案あたり平均 20 名評価)。
    quote: Our first study shows that LLM-generated product ideas have higher average quality than human ideas, based on purchase intent, and are 7 times more likely to rank in the top 10%.
    locator: Abstract; §2.2 Study 1a
    quant:
      value: "7x (top 10%: humans 5 / zero-shot 15 / few-shot 20 of 40); mean purchase intent 40.4% vs 46.4% / 49.3%"
      n: 200 human ideas (50 MBA students, 2021) vs 100+100 GPT-4 (gpt-4-0314, May 2023); ~20 raters per idea, 200 respondents
      design: controlled experiment, linear mixed-effects, quantile regression
      population: physical product ideas for US college students under $50
    evidenceKind: controlled-experiment
    rqs: [TH09-Q1, TH09-Q4]
    issues: []
    stance: context
  - id: c2
    text: GPT-4 の案は互いの類似度が人間の案より有意に高い(ペア余弦類似度 人間 0.221 対 zero-shot 0.414 / few-shot 0.428)。スタイル標準化後も差の 80-90% が残り、話題の均質化が実体。
    quote: GPT-4 zero-shot ideas were significantly more similar to each other than human outputs (B = 0.193; 95% CI [0.182, 0.204]; t(298) = 33.89, p < .001
    locator: §3.1 Study 2a Results; E-Companion E
    quant:
      value: cosine similarity 0.221 (human) vs 0.414 / 0.428 (GPT-4)
      n: 400 ideas (200 human, 200 AI)
      design: controlled experiment, embedding similarity (USE 512-dim)
      population: same as Study 1
    evidenceKind: controlled-experiment
    rqs: [TH09-Q1, TH09-Q4]
    issues: []
    stance: contradicts
  - id: c3
    text: 著者自身のデータを含む 4 研究 5 データセット(著者データ、Boussioux et al. 2024 の 2 データセット、Hubert et al. 2024、Stevenson et al. 2022)の再分析では、AI(GPT-3、GPT-4)の生成案は人間より類似度が高く多様性が低かった。効果量は d=0.380(小)から d=5.538(非常に大)。著者は、多様性の低下は LLM の一般的な性質かもしれないと推量している。
    quote: AI systems (GPT-3, GPT-4) produced ideas with higher similarity scores, indicating reduced diversity, with effect sizes ranging from small (Cohen's d = 0.380) to very large (d = 5.538).
    locator: §3.2 Study 2b Results; Table 1; Discussion
    quant:
      value: Cohen's d 0.380–5.538; 32/32 comparisons significant
      n: 5 datasets (own; Boussioux 2024 x2; Hubert 2024 N=1,781 vs 1,710; Stevenson 2022 774 vs 781)
      design: meta-analysis with 3 diversity metrics, mixed-effects pooling
      population: creative ideation tasks
    evidenceKind: review
    rqs: [TH09-Q1]
    issues: []
    stance: contradicts
  - id: c4
    text: 単一モデルは人間の多様性に届かないが、4 ベンダー(GPT-4 Turbo、Gemini Pro 2.0、DeepSeek R1、Claude Sonnet 3.5)の案を混ぜた複合プールは人間と統計的に区別できない多様性に達した。
    quote: Notably, no single model came close to human diversity. However, the composite approach was as good as humans (B = -0.010; 95% CI [-0.022, 0.002]; t(198) = -1.69, p = .092).
    locator: §4.1 Study 3a Results; Table 2
    quant:
      value: diversity 0.773 (human) vs 0.763 (composite) vs 0.756 (best single, GPT-4 Turbo)
      n: 100 ideas per condition sampled from 2,000
      design: controlled experiment
      population: same task, 9 models
    evidenceKind: controlled-experiment
    rqs: [TH09-Q4, TH06-Q3]
    issues: []
    stance: qualifies
  - id: c5
    text: 人間が課題(ペインポイント)を選び AI が解を生成する分業(Agent 2)は全戦略中 2 位の多様性を示し、AI に反復して「大胆に」磨かせる Agent 1 は逆に多様性を大きく下げた。無監督のアイデア精緻化への警告。
    quote: Against our expectations, the "Bold Ideas" agent, which iteratively refined ideas to make them bolder, greatly reduced diversity.
    locator: §4.2 Study 3b Results; Table 3
    quant:
      value: "diversity: Agent 2 0.739, Agent 1 0.575, GPT-4o zero-shot 0.679, humans 0.773"
      n: 100 ideas per condition
      design: controlled experiment
      population: GPT-4o (2024-08)
    evidenceKind: controlled-experiment
    rqs: [TH09-Q4]
    issues: []
