summary: 個人開発者が Claude Code で要件定義→設計→開発→テストを回した率直な記録。AI が自分の実力以上の設計書を出し、理解が曖昧なまま進んで結局自分で書き直した。型定義からではなく画面から作るべきだったと反省し、別チャットの AI にレビューさせる工夫も記す。
