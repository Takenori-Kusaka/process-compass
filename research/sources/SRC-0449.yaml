summary: コーディングエージェントに作業を層別のスタックへ分解させる GitHub 公式の手引き。Web UI の rebase ボタンが committer を書き換え署名を失わせる落とし穴も明記する。
claims:
  - id: c1
    text: 既存のコードの書かれ方で学習したエージェントにとって、データ・API・UI を1本の巨大PRにまとめるのが既定の出し方だとベンダー自身が述べている。
    quote: For agents largely trained on how code has traditionally been written over the years, this pattern is their default way of shipping.
    locator: "A closer look: Adding product search to a shopping assistant"
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q2, TH10-Q3]
    issues: [273]
    stance: context
  - id: c2
    text: GitHub の Web 上の Rebase stack ボタンはサーバー側で rebase するため committer がボタンを押した人に変わり、コミットは署名されず、署名付きコミットを要求するブランチ保護を黙って破る。公式はローカルの gh stack rebase を推奨する。
    quote: it resets the committer to whoever clicked the button, the resulting commits aren’t signed, and if branch protection expects signed commits, that one click quietly breaks.
    locator: Reviewing and updating the stack
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2, TH07-Q2]
    issues: [273, 271]
    stance: qualifies
  - id: c3
    text: 巨大PRに付くAI生成の説明文を『長いが浅い』と表現し、レビュアが後回しにして十分にレビューされないまま入る流れを典型として描く。
    quote: push and open a pull request with its long-yet-shallow AI generated description, ensure CI checks are green, and self-review diff then request reviewers.
    locator: A closer look(本文)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q4]
    issues: [271]
    stance: context
  - id: c4
    text: 層を関心事(データ・API・配線・UX)で切ると、層ごとに別のレビュア(データ所有者、UI 所有者)を割り当てられるとする。
    quote: "Now the independent concerns are clear: data, API, wiring, UX, making it possible to allocate different reviewer audiences for each."
    locator: The stack structure
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: supports
