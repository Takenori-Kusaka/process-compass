    text: リポジトリの自動化水準（Full control / Cautious / Balanced / Full automation）が確信度の閾値を決める。既定の Cautious は高確信度の変更のみ自動適用し、残りを人のレビューへ回す。作業単位・確信度単位で自律度を切り替える先例。
    quote: "Cautious (default): Only high-confidence changes are applied automatically. Everything else is held for your review."
