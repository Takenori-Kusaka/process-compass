summary: 7 系統 9 モデルの判定パネルを ChaosNLI 3 データセット(各 100 人注釈)で測り、Kish 実効標本数で実効独立票 2.18、合議の利得 0.2pp、系統内外の相関差 0.047 を示す。#256/#258/254 メモの引用値は全て一致。ただし著者は Limitations でコードレビューへの一般化を留保している。
claims:
  - id: c1
    text: 7 系統 9 モデルの判定パネルを、各項目 100 人注釈の NLI 3 データセット(ChaosNLI-MNLI/SNLI/AlphaNLI、各 1,000 項目)で評価し、実効的な独立票は約 2 票分。
    quote: Testing a panel of 9 frontier LLMs from 7 model families on three natural language inference datasets (each with 100 human annotations per item)
    locator: Abstract; §3.1 Datasets; §3.2 Judge Panel
    quant:
      value: ≈2 effective votes from 9 judges
      n: 1,000 items per dataset × 3 datasets; 9 judges
      design: observational measurement (Kish n_eff + Condorcet null model)
      population: ChaosNLI, temperature 0.0
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [256, 258]
    stance: supports
  - id: c2
    text: MNLI で Kish 実効独立票数 2.18(95% ブートストラップ CI 2.07〜2.31)、固有値法 2.16、独立性比 24.2%。
    quote: The 9-judge panel provides only 2.18 effective independent voters.
    locator: §4.1 Table 2 (n_eff (Kish) 2.18 [2.07, 2.31]; n_eff (eigenvalue) 2.16; Independence ratio 24.2%)
    quant:
      value: n_eff 2.18 [2.07, 2.31] = 24.2% of nominal 9
      n: 1,000 MNLI items, 10,000 bootstrap resamples
      design: observational measurement
      population: ChaosNLI-MNLI
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [256, 258]
    stance: supports
  - id: c3
    text: 独立投票なら達成できたはずの精度(Condorcet 予測)に対する不足は MNLI 22.0pp、SNLI 14.0pp、AlphaNLI 7.6pp。
    quote: Condorcet gaps decrease with base accuracy (22.0pp → 14.0pp → 7.6pp), as expected when higher accuracy leaves less room for correlated errors.
    locator: §4.5 Cross-Dataset Replication; Table 3 (Cond. gap 22.0 [19.5, 24.1] / 14.0 [11.9, 16.1] / 7.6 [6.0, 9.1])
    quant:
      value: 22.0 / 14.0 / 7.6 pp
      n: 1,000 items each
      design: Condorcet null-model simulation vs observed majority vote
      population: MNLI / SNLI / AlphaNLI
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c4
    text: MNLI ではパネル 72.0% 対 最良単体(Qwen3-32B)71.8% で合議の利得 0.2pp(11 件の同票処理の範囲内)。SNLI では最良単体 84.2% がパネル 77.7% を上回り(−6.5pp)、AlphaNLI も −2.5pp。
    quote: On MNLI, the panel (72.0%) barely edges the best judge (Qwen3-32B, 71.8%) by 0.2pp — within noise; on SNLI, the best judge dominates (Claude Sonnet 4.5, 84.2% vs. panel 77.7%)
    locator: §1 Introduction; Table 2 (Panel lift 0.2pp); Table 3 (Panel lift +0.2 / −6.5 / −2.5 pp)
    quant:
      value: +0.2pp (MNLI); −6.5pp (SNLI); −2.5pp (AlphaNLI)
      n: 1,000 items each
      design: majority vote vs best individual
      population: 9-judge panel
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c5
    text: 同系統ペアの誤り相関 φ=0.437(OpenAI 同士)・0.435(Meta 同士)は系統横断平均 0.389 よりわずかに高いだけ(差 0.047)。最も相関の高い 3 組は全て系統横断(Claude×Gemini 0.603、GPT-4o×Claude 0.588、Mistral×DeepSeek 0.564)。
    quote: "Same-family pairs (OpenAI-OpenAI: φ=0.437; Meta-Meta: φ=0.435) are only slightly more correlated than the cross-family mean (φ̄_cross=0.389, difference = 0.047)."
    locator: §5.3 Same-Family vs. Cross-Family Correlation; App. B Figure 3
    quant:
      value: φ 0.435–0.437 vs 0.389 (Δ 0.047)
      n: 36 judge pairs, 1,000 MNLI items
      design: pairwise phi correlation of errors
      population: 9 judges
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c6
    text: 系統ごとに最良 1 体を選んだ 7 判定者パネルでは実効独立票が 1.93 へ低下する。系統の多様性だけでは独立性は回復しない。
    quote: When restricted to one judge per family (7 judges, selecting the best in each), n_eff decreases to 1.93 — a selection effect where the best judges concentrate errors on the same hard items
    locator: §5.3
    quant:
      value: n_eff 1.93 (7 judges, one per family)
      n: 1,000 MNLI items
      design: subset analysis
      population: best judge per family
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c7
    text: 人間注釈者パネルの実効独立票は 4.0〜5.8(MNLI 5.79 / SNLI 4.78 / AlphaNLI 4.03)で LLM の 2.2〜2.5 の約 2 倍。ただし人間側は各項目の集計分布から 10 ラベルを抽出した推定値。
    quote: Human annotator panels achieve roughly 2× higher n_eff (4.0 – 5.8 vs. LLMs’ 2.2 – 2.5), suggesting the deficit is specific to LLM judges.
    locator: §4.5; Table 3 (Human n_eff 5.79 / 4.78 / 4.03); footnote 1 (sampling 10 labels per item)
    quant:
      value: human n_eff 4.0–5.8 vs LLM 2.2–2.5
      n: 10 sampled labels per item from 100-annotator distributions
      design: estimate treating annotators as exchangeable
      population: ChaosNLI annotators
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c8
    text: "判定者を増やしても高度な集約法でも解けない: 正解ラベルを使える集約でも Condorcet ギャップの最大 11% しか埋まらない。"
    quote: Neither adding more judges nor using smarter aggregation algorithms helps -- established methods close at most 11% of this gap, even with access to the correct answers.
    locator: Abstract; §5.4 Table 5
    quant:
      value: ≤11% of gap closed
      n: 4 datasets (incl. RewardBench)
      design: aggregation comparison (Dawid-Skene, accuracy-weighted CV, phi-optimal)
      population: 9-judge panel
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [258]
    stance: supports
  - id: c9
    text: 著者自身がコードレビューや開放的生成の評価では判定者間相関の程度が異なりうると留保している。TH06-Q2 の「転用を原典は許しているか」への答えは「未検証と明記」。
    quote: The degree of inter-judge correlation may differ on open-ended generation evaluation or code review, where output structure differs fundamentally.
    locator: "Limitations: Classification tasks"
    quant: null
    evidenceKind: benchmark
    rqs: [TH06-Q2]
    issues: [256, 258]
    stance: qualifies
