summary: Microsoft CAF の単一/マルチエージェント選択指針。境界・チーム・将来拡張が要請する場合のみマルチから始め、それ以外は単一エージェントで検証してから移行するよう求め、役割の分離がマルチエージェントを正当化しないと述べる。
claims:
  - id: c1
    text: 計画者・レビュアー・実行者などの役割の違いは、それだけではマルチエージェント構成を正当化しない。単一エージェントのペルソナ切替・ツール権限・文脈制御で役割を満たせるか先に検証せよとする。
    quote: Distinct roles (such as planner, reviewer, executor) might suggest multiple agents, but they don't automatically justify a multi‑agent architecture.
    locator: When to test a single agent system first / Clear roles involved
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3, TH06-Q3]
    issues: []
    stance: qualifies
  - id: c2
    text: 金融では取引を準備するエージェントと検証するエージェントを分け、職務分離をアーキテクチャで強制する例を挙げる（規制・ポリシーがデータ分離を要求する場合のマルチエージェント開始条件）。
    quote: Financial services often require one agent to prepare transactions while another validates them, enforcing separation of duties through architecture.
    locator: When to start with a multi-agent system / Crossing security and compliance boundaries
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q2]
    issues: []
    stance: context
  - id: c3
    text: マルチエージェントは冗長な文脈処理と通信のため費用が増え、エージェント数に比例して通信オーバーヘッドが増える。
    quote: Cost structures increase because each agent processes redundant context and communication overhead multiplies with agent count.
    locator: Multi-agent system trade-offs
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2]
    issues: []
    stance: supports
  - id: c4
    text: マルチエージェントは複雑さや性能についての未検証の前提で選ばれがちだと警告する。
    quote: While multi-agent architectures are sometimes necessary, they are often chosen based on untested assumptions about complexity or performance.
    locator: When to test a single agent system first
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3]
    issues: []
    stance: supports
  - id: c5
    text: 3〜5を超える機能を持つソリューションはモジュール型マルチエージェントの恩恵を受けるとする（根拠の提示なし）。
