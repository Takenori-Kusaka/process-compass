summary: AI 法の条文全文(全28条と附則)。事業者に直接掛かるのは第7条の活用努力と国・自治体施策への協力義務だけで、開発プロセス・体制・人の関与を定める条項も罰則も無い。
claims:
  - id: c1
    text: 第7条は、AI を使った製品・サービスを開発・提供する者に加え事業活動で AI を活用しようとする者を「活用事業者」とし、活用に努めることと、国・地方公共団体の施策に協力することを課す。条文を通読した範囲で、事業者の開発プロセスや体制、人の関与を定める条項は無い。
    quote: 基本理念にのっとり、自ら積極的な人工知能関連技術の活用により事業活動の効率化及び高度化並びに新産業の創出に努めるとともに、第四条の規定に基づき国が実施する施策及び第五条の規定に基づき地方公共団体が実施する施策に協力しなければならない。
    locator: 第七条(活用事業者の責務)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: 適正性の確保は、事業者への直接の義務ではなく、国が国際的な規範の趣旨に即した指針を整備する形で定められている(第13条)。事業者への実体的な要求は指針とガイドラインの側にある。
    quote: 国は、人工知能関連技術の研究開発及び活用の適正な実施を図るため、国際的な規範の趣旨に即した指針の整備その他の必要な施策を講ずるものとする。
    locator: 第十三条(適正性の確保)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c3
    text: 国は権利利益の侵害が生じた事案を分析し、その結果に基づいて活用事業者らへ指導・助言・情報提供などの措置を講ずる(第16条)。是正命令や罰則の規定は条文に無い。
    quote: その結果に基づいて、研究開発機関、活用事業者その他の者に対する指導、助言、情報の提供その他の必要な措置を講ずるものとする。
    locator: 第十六条(調査研究等)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c4
    text: 見直しは附則第2条が定めるが、周期は置かず、国際的動向と社会経済情勢の変化を勘案して施行状況を検討するとするにとどまる。
    quote: この法律の施行の状況について検討を加え、必要があると認めるときは、その結果に基づいて所要の措置を講ずるものとする。
    locator: 附則 第二条(検討)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
