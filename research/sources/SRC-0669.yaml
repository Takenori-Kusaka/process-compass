summary: CMMI の導入の手引き(v4.0)。現行の業務プロセスを CMMI の実践へ写して差を特定し、プロセスが実際に使われているかを確かめ、差を優先付けして段階的に展開する。#315 で、既存の統制の資産の一覧と扱いを適用の開始の記録に含める要求事項の型として引いた。段階的な展開は、本標準では採らない。
claims:
  - id: c1
    text: 手順3 で、現行の業務プロセスを CMMI の実践へ写し、差を特定する。よく作られたプロセスでも使われなければ価値は小さく、使われ続けているかを確かめる。
    quote: This analysis does more than just identifying gaps in the processes being used. It also involves determining if the processes are utilized, persistent, and habitual. A well-crafted business process is of little value if it is not used.
    locator: "Step 3: Map current organizational processes to CMMI, Figure 8. Step 3 Activities and Considerations Table (Page 27)"
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [315]
    stance: supports
  - id: c2
    text: 手順5 では、改善の試行と展開を通例は反復して行い、しばしば段階的に展開する。利害関係者を圧倒しないため、組織の部分ごとに異なる改善を異なる時期に展開する必要が生じることがある。
    quote: This step involves piloting and deploying the performance and process improvements identified in action plans from the previous step, typically an iterative process. Improvements are often rolled out gradually to assess performance. Piloting improvements enables an organization to evaluate the impact of performance improvements to ensure they are successful before wider deployment.
    locator: "Step 5: Deploy improvements and measure results (Page 32) / Additional Information (Page 34)"
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [315]
    stance: contradicts
