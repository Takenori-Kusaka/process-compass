summary: デジタル庁クラウドエンジニアの講演資料。PO兼エンジニア1名+AIエージェントで小規模機能を実装した検証(見積720H→実績約120H)と、ボトルネックが実装から判断・承認へ移ることを示す。
claims:
  - id: c1
    text: エンジニア出身のPOがAIコーディングエージェントで小規模機能を実装した検証で、従来見積り720H前後(576〜864H)に対し実績は120H前後+LLM利用料約20万円だった。見積り比較であり単一事例。
    quote: 従来見積り(PO +エンジニア)：720 H 前後(576 〜864 H) → 実験結果：120 H 前後＋LLM 利用料約20 万
    locator: p.10 AI コーディングエージェント導入による効果検証
    quant:
      value: 720H→120H(+LLM利用料約20万円)
      n: 1機能(小規模・限定ドメイン)
      design: 既存チーム見積りとの比較(単一事例)
      population: エンジニア出身のPO兼エンジニア1名+AIコーディングエージェント
    evidenceKind: case-report
    rqs: [TH02-Q5, TH11-Q2]
    issues: [267]
    stance: supports
  - id: c2
    text: 同検証の知見として、AIエージェントの導入で見積りがより困難になったと報告し、再現条件として自分で仕様調整やコード修正ができるエンジニアの存在を挙げている。
    quote: AI コーディングエージェントで見積りはより困難になっている
    locator: p.10 わかったこと
    quant: null
    evidenceKind: case-report
    rqs: [TH11-Q3, TH02-Q5]
    issues: []
    stance: qualifies
  - id: c3
    text: コード作成は開発サイクルの一工程にすぎず、承認・テスト・リリースを含むプロセス全体が最適化されなければ機能がユーザーに届く速度は変わらない、としてDevSecOpsの実現を前提条件に置いている。
    quote: 開発サイクル全体のうち、コード作成はあくまで一工程に過ぎない。承認・テスト・リリースを含むプロセス全体が最適化されなければ、機能がユーザーに届く速度は変わらない
    locator: p.24 DevSecOps の普及
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q2]
    issues: []
    stance: qualifies
  - id: c4
    text: 開発のボトルネックが実装から判断へ移り、受発注・ユーザー企業とSIer・POと開発者という体制全般の変革が必要になるとしている。
    quote: 開発速度は劇的に向上している、開発のボトルネックは実装から判断へ
    locator: p.6 開発生産性の向上とボトルネックの移動
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH01-Q1, TH02-Q5]
    issues: []
    stance: context
  - id: c5
    text: AIエージェント任せにすると不要なテストが増大するため、テストの効果やシンプル化を並行して検討するとし、プロジェクトごとのスキル・MCPの利用制御は別途管理が必要で検証中としている。
    quote: AI エージェント任せの場合不要なテストが増大するので、効果的なテストなのか、シンプル化などを並行して検討
    locator: p.28 品質強化のための静的解析、セキュリティテスト
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q3, TH03-Q1]
