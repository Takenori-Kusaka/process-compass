summary: 5〜200本の統制されたスキル群で選択精度を測り、ある本数を超えると急落する相転移、意味の紛らわしさが主因であること、階層的ルーティングで回復することを示した予備研究。
claims:
  - id: c1
    text: スキル選択精度は緩やかに低下するのではなく、臨界的なライブラリ規模までは安定し、それを超えると急落する相転移を示す。ただし著者は、この劣化ではライブラリ規模だけでなく、類似スキル間の意味的な紛らわしさが中心的な役割を果たすとしている。
    quote: Rather than degrading gradually, selection accuracy remains stable up to a critical library size, then drops sharply, indicating a phase transition reminiscent of capacity limits in human cognition.
    locator: Abstract
    quant:
      value: library 5–200 skills
      n: controlled skill libraries, GPT-4o / GPT-4o-mini
      design: controlled experiment
      population: synthetic skill libraries on reasoning benchmarks
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1]
    issues: []
    stance: supports
  - id: c2
    text: 精度が最大値の半分に落ちる本数(容量パラメータ κ)は GPT-4o-mini で91.8、GPT-4o で83.5と推定された。検証モデルは GPT-4o 系のみ。
    quote: The fitted capacity parameter κ is 91.8 for GPT-4o-mini and 83.5 for GPT-4o, representing the library size at which accuracy drops to half its maximum
    locator: §5 scaling results
    quant:
      value: κ=91.8 (GPT-4o-mini), 83.5 (GPT-4o)
      n: 2 models
      design: curve fitting on controlled experiment
      population: GPT-4o family only
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 劣化の主因は本数そのものより、似たスキル同士の意味の紛らわしさである。
    quote: semantic confusability among similar skills, rather than library size alone, plays a central role in this degradation.
    locator: Abstract
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1]
    issues: []
    stance: supports
  - id: c4
    text: 粗→細の階層的ルーティング(第1段10〜40群、第2段は群内3本)で選択精度が回復し、GPT-4o-mini で+37〜40pt 改善した。
    quote: hierarchical routing restores reliable selection by organizing skills into structured categories.
    locator: Figure 1 caption / §6
    quant:
      value: +37–40% absolute (GPT-4o-mini)
      n: GPT-4o family
      design: controlled experiment
      population: large skill libraries beyond κ
    evidenceKind: controlled-experiment
    rqs: [TH03-Q1, TH03-Q2]
    issues: []
    stance: supports
