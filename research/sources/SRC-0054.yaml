summary: 前回「タイトルのみ確認」だった MSR '26 論文。AIDev の 33,707 件のエージェント PR を分析。28.3% は即時マージされる一方、反復的な修正要求で放棄(ghosting)が起きる二極構造。作成時の静的特徴だけで高コスト PR を AUC 0.96 で予測し、レビュー予算 20% で高負荷 PR の 69% を捕捉できると報告。
claims:
  - id: c1
    text: 33,707 件のエージェント PR は「狭い自動化には強い(28.3% が即時マージ)」が「反復的な修正には弱く放棄(ghosting)に至る」二極構造を示す。
    quote: "Analyzing 33,707 agent-authored PRs, we uncover a stark two-regime reality: agents excel at narrow automation (28.3% of PRs merge instantly), but frequently fail at iterative refinement"
    locator: Abstract
    quant:
      value: 28.3% instant merge
      n: 33,707 PRs / 2,807 repos (>100 stars)
      design: observational (repository mining)
      population: AIDev v1.0 agent-authored PRs
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c2
    text: ファイル種別やパッチサイズなどの静的特徴だけで高負荷 PR を AUC 0.96 で予測でき、レビュー予算 20% で高負荷 PR の 69% を捕捉する「サーキットブレーカ」型トリアージを提案する。
    quote: our model identifies the “expensive tail” of contributions with AUC 0.96, enabling a gated triage process. At a 20% review budget, this approach captures 69% of the high-effort PRs
    locator: Abstract
    quant:
      value: AUC 0.96; 69% captured at 20% budget
      n: 33,707 PRs
      design: predictive model (observational data)
      population: AIDev v1.0
    evidenceKind: observational
    rqs: [TH10-Q1, TH06-Q6]
    issues: []
    stance: supports
  - id: c3
    text: データは AIDev v1.0、スター 100 超の 2,807 リポジトリから、決定的ボットを除いた生成エージェント(Codex, Claude, Devin, Copilot)の PR。
    quote: "We use the AIDev dataset v1.0 (Li et al., 2025a): 33,707 agent-authored PRs from 2,807 repositories (>100 stars)"
