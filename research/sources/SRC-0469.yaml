summary: DX の四半期報告(500超の組織、2026年4〜6月、テレメトリ+調査、DX Core 4 と AI Measurement Framework で集計)の発表。AI支出が約28倍に増えた一方でイノベーション比率は横ばい、スループット+37%に対し DXI と変更への確信は低下した。全文は顧客向け資料で、発表記事を読んだ。
claims:
  - id: c1
    text: テック業界の四半期AI支出の中央値は1年で約1.5千ドルから4.4万ドルへ約28倍になったが、新機能に使う時間の比率(innovation ratio)は約57〜58%のまま動かなかった。
    quote: Median quarterly AI spend grew from roughly $1.5K to $44K in a year, a nearly 28x increase in the Tech sector alone.
    locator: Key findings
    quant:
      value: ~28x spend; innovation ratio 57–58% flat
      n: 500+ engineering organizations
      design: telemetry + survey, quarterly trend (Q3 2025–Q2 2026)
      population: DX customer organizations
    evidenceKind: observational
    rqs: [TH11-Q1, TH11-Q2]
    issues: []
    stance: supports
  - id: c2
    text: エンジニア1人週あたりの PR スループットは4四半期で37%増えたが、開発者体験指数(DXI)は67から65へ下がった。
    quote: Median weekly TrueThroughput rose 37% over four quarters, from 1.42 to 1.94 PRs per engineer per week. But the Developer Experience Index (DXI) fell from 67 to 65
    locator: Key findings
    quant:
      value: +37% PR throughput; DXI 67 -> 65
      n: 500+ organizations
      design: telemetry + survey
      population: DX customer organizations
    evidenceKind: observational
    rqs: [TH11-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 変更が何かを壊さないという開発者の確信(change confidence)は同期間に6.1%低下し、変更失敗率の組織間のばらつきも広がった。
    quote: But change confidence, developers’ trust that their changes won’t break something, fell 6.1% in the same period.
    locator: Key findings
    quant:
      value: -6.1% change confidence
      n: 500+ organizations
      design: survey component
      population: DX customer organizations
    evidenceKind: observational
    rqs: [TH11-Q3]
    issues: []
    stance: supports
  - id: c4
    text: DX は、速度と支出の指標には必ず品質と体験の対になる指標を組にしてから成功を判断すべきだと提言する。
    quote: pairing every speed and spend metric with a quality and experience counterweight before declaring AI investments a success.
    locator: Key findings 末尾
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q1, TH11-Q3]
    issues: []
    stance: context
