summary: 30名規模の B2G GovTech スタートアップの EM による2年後の振り返り(2026-07-19)。ADR は事前レビューの関所ではなく継続検証される仮説の記録になり、最初の読者は AI になった。可逆/不可逆で決定の重さと決定者を変える。
