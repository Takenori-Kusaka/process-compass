summary: CircleCI 報告書への批評(反証・限定)。スループット=パイプライン実行回数であり出荷や本番デプロイではないこと、上位 5% の平均パイプライン 6 秒や 1 チーム 13 万件/日の外れ値が集計を歪めうることを指摘。統合ボトルネック自体は信用できるとする。
claims:
  - id: c1
    text: 報告書の主指標「スループット」は CI パイプラインの実行回数であり、本番デプロイ数や出荷機能数ではない。
    quote: The report’s primary metric is “throughput” – the number of times a CI pipeline runs per day. A CI pipeline is the automated process teams use to build, test and progress code toward production.
    locator: What the report is measuring
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q1]
    issues: []
    stance: qualifies
  - id: c2
    text: 「上位 5% が AI で出荷を増やした」という結論は、その群の平均パイプライン時間が 6 秒という不自然なデータに支えられており、確信を持って教訓を引き出せない。
    quote: But the summary data for that group is odd. Their average CI pipeline duration is 6 seconds.
    locator: The 1 in 20 claim
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: []
    stance: contradicts
  - id: c3
    text: 一方で「生成速度がレビュー・統合能力を上回る」という統合ボトルネックの所見はデータと整合し信用できる、と評価する。
    quote: The integration bottleneck finding is credible. If you’re generating code faster than your team can review and integrate it (safely), that’s a genuine problem this data is consistent with.
    locator: What to take from it
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q1]
    issues: []
    stance: supports
