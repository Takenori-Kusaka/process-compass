summary: Google SRE がポストモーテムの再発防止アクション(action item)の作り方と追跡を述べた記事。再発防止を課す条件は発生件数ではなく影響で、利用者に見えた事象は 1 件目から高優先度の対策を必須とする。「同種 N 件で恒久対策」という件数閾値は書かれていない。社内データの図はあるが標本数の記載は無い。
claims:
  - id: c1
    text: 利用者に見える事象(user-visible event)から生じたポストモーテムには、すべて P0 または P1 の action item を最低 1 つ必須とする。条件は利用者への影響であり、原文は発生件数や何件目から適用するかには触れていない。
    quote: We require every postmortem stemming from a user-visible event to have at least one P0 or P1 action item.
    locator: Prioritizing Action Items (p.42)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q6]
    issues: [275]
    stance: contradicts
  - id: c2
    text: 優先度は「対策しない場合に同じ事象が軽減されず再発するリスク」の高・中・低・軽微で P0〜P3 に分ける。閾値は再発リスクの見積りで、過去の発生回数ではない。
    quote: "P0: High risk of unmitigated recurrence of the incident if this AI is not resolved."
    locator: Prioritizing Action Items (p.41)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q6]
    issues: [275]
    stance: qualifies
  - id: c3
    text: 人手の継続的な介入を要する予防・軽減よりも、可能な限り自動化された修正を実装することを勧める。例に、スキーマ変更への自動の提出前検査を挙げる。
    quote: We recommend implementing automated fixes when possible, as opposed to prevention/mitigation that requires ongoing manual intervention.
    locator: Wording Action Items (p.41)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q6, TH07-Q5]
    issues: [275]
    stance: supports
  - id: c4
    text: 1 件の事象だけを見ると対策が過剰適合するため、類似事象のポストモーテムと action item を見直すことを求める。類型として扱う発想はあるが、何件で類型とみなすかは定めていない。
    quote: Review postmortems for similar incidents and their accompanying action items.
    locator: Action Item Anti-Patterns – Thinking Only of the Current Incident (Missing Patterns) (p.43)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q6]
    issues: [275]
    stance: qualifies
  - id: c5
    text: 着手する見込みのない action item は残し続けず閉じるよう勧める。対策を置かない判断を、未了の放置ではなく明示的な終了として扱う。
    quote: Encourage action item owners to close AIs that you'll never have time to address
    locator: Action Item Closure Tracking (p.42)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: supports
