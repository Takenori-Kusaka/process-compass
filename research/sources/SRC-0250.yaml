summary: 政府情報システムで遵守すべき Normative 文書。CAIO がユースケースのリスクレベルを判断し、出力結果の適切さを職員が判断せず利活用する設計を高リスク側に置く。
claims:
  - id: c1
    text: 各府省庁のCAIOが企画者と連携してユースケースごとにリスク評価を行い、リスクレベルを判断する。判断の責任主体を役職として明示している。
    quote: 各府省庁のAI 統括責任者（CAIO）は、企画者と連携しつつ、ユースケースにあわせたリスク評価を行い、そのリスクレベル（高リスクの可能性が高いか否か）を適切に判断する。
