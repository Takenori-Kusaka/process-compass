    quote: 出力結果の適切さの判断を行わずにタスクを実行するもの（リスク判定ロジックのＣ①に相当）の作成を制限するか、又は利用者がこれを作成したときには利用開始前に提供者又はAI 統括責任者（CAIO）に報告を求める旨の利活用ルールを整備し、周知する。
