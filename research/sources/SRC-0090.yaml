summary: "ISO/IEC 42001 の公開プレビュー(14頁: 序文・0 Introduction・1 Scope・目次)。組織は AI システムに対する自らの役割(provider / producer / customer 等)について責任と説明責任の証拠を生成できるとし、役割は組織単位で宣言する。附属書 A.3.2「AI の役割と責任」は本文有償部分でプレビュー外。"
claims:
  - id: c1
    text: 本規格に適合する組織は、AI システムに対する自らの「役割」に関する責任と説明責任の証拠を生成できる。責任の単位は組織の役割であり、個々の作業を人と AI のどちらが行うかは規定しない。
    quote: An organization conforming with the requirements in this document can generate evidence of its responsibility and accountability regarding its role with respect to AI systems.
    locator: 0 Introduction, 0.1 General
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q1]
    issues: [248, 249]
    stance: qualifies
  - id: c2
    text: 組織の役割は AI provider / producer(developer, operator, tester, deployer 等を含む)/ customer などで、一組織が複数を兼ねうる。
    quote: "These roles can include, but are not limited to, one or more of the following: — AI providers, including AI platform providers, AI product or service providers;"
