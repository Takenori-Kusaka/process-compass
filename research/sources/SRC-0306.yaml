summary: AIDev データセットで、人とエージェントの PR の受理とレビュー負荷を、提出時点の情報だけから予測できるかを調べた論文。受理は高精度で予測できるが、レビュー負荷は提出時点の特徴では説明しきれない。
claims:
  - id: c1
    text: 提出時点の特徴だけで PR の受理を予測でき、木系モデルは F1 0.95 超を達成した。影響の大きい予測子は本文の明瞭さとメタデータだった。
    quote: "Our results show that acceptance prediction is feasible from early signals: tree-based models achieve F1 scores above 0.95, with textual clarity and metadata among the most influential predictors."
    locator: Abstract
    quant:
      value: F1 > 0.95
      n: AIDev データセットの人・エージェント作成 PR(件数は要旨に無し)
      design: observational(リーク対策をした予測パイプライン)
      population: AIDev(OSS の PR)
    evidenceKind: observational
    rqs: [TH10-Q4]
    issues: [271]
    stance: qualifies
  - id: c2
    text: コメント数やマージまでの時間は提出時点の特徴では中程度しか説明できず、レビュアの空きやプロジェクトの流れが大きく効く。早期予測モデルは自動判定ではなく助言として使うべきだとする。
    quote: These findings indicate that early PR models can support triage and reviewer prioritization, but should be used as advisory tools rather than automated decision-makers.
    locator: Abstract
