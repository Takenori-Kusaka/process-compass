summary: 18 モデル(GPT-4.1、Claude 4、Gemini 2.5、Qwen3 等)で入力長だけを変えて性能を測った 2025-07 の技術報告。Anthropic の context engineering 記事が「context rot」の出典として引く。単純な課題でも入力長とともに性能が不均一に低下する。
claims:
  - id: c1
    text: 18 モデルで、課題の難度を固定し入力長だけを変えても、性能は入力長とともに不均一かつ不安定に低下した。文脈は一様に処理されない。
    quote: Our results reveal that models do not use their context uniformly; instead, their performance grows increasingly unreliable as input length grows.
    locator: 冒頭要約
    quant:
      value: 18 LLMs
      n: 18 models, 複数タスク
      design: controlled experiment (input length isolated)
      population: GPT-4.1, Claude 4, Gemini 2.5, Qwen3 ほか
    evidenceKind: benchmark
    rqs: [TH04-Q2, TH03-Q3]
    issues: [274, 269]
    stance: supports
  - id: c2
