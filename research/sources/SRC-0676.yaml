summary: RTCA の FAS トピックペーパー。DO-178C/ED-12C の用語集の independence の定義を引く。独立性は作成者以外の者が検証する職責の分離の一段で、ツールが人の検証と同等になりうるとする。#318 は、AI の確認を段に数えない判断(DO-330 型の適格性の経路を採らない)の比較の材料として引いた。DO-178C 本文は有償で未読。
