summary: テンプレートから生成した案件の更新の手順(Copier)。回答ファイルを手で書き換えないことを求める(書き換えると、変更後の回答が現在の案件を生んだと Copier が誤認し、更新の差分が予測できなくなる)。更新の前に git status の清浄を確かめるよう利用者へ指示する(Copier が拒むとは書いていない)。テンプレートの版の記録(_commit)はこの頁ではなく SRC-0651 にある(#364 の照合で改めた)。#315 で、構成(process.config.json)を手で編集しない規則と、取り込んだテンプレートのコミットを道具だけが書く型の前例として引いた。
claims:
  - id: c1
    text: 回答ファイル(.copier-answers.yml)を手で更新してはならない。手で更新すると、変更後の回答が現在のサブプロジェクトを生んだと Copier が誤認し、更新に使う smart diff の挙動が予測できなくなる(支持されない更新の方法である)。
    quote: Never update .copier-answers.yml manually. This will trick Copier, making it believe that those modified answers produced the current subproject, while it was produced by a different answers set. This will produce unpredictable behavior of the smart diff algorithm used for updates, which may work under certain circumstances, but not always.
    locator: Updating a project > Never change the answers file manually
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: supports
  - id: c2
    text: 更新は、現行の版で新規に生成した結果との差分を取り、事前の移行、最新の変更の適用、差分の再適用、事後の移行の順に行う。衝突は人が解く。
    quote: It regenerates a fresh project from the current template version. Then, it compares both version to get the diff from "fresh project" to "current project". Now, it applies pre-migrations to your project, and updates the current project with the latest template changes (asking for confirmation). Finally, it re-applies the previously obtained diff and then runs the post-migrations.
    locator: Updating a project > How the update works
    quant: null
    evidenceKind: vendor-guidance
    rqs: []
    issues: [315]
    stance: context
