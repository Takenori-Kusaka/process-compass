summary: FAA が DO-178B と DO-178C の差分と認証担当者(ASE)への影響を節ごとに整理した資料。DO-178C で追加された §5.5・§6.5 のトレーサビリティ節と、独立した成果物『Trace Data』(§11.21)を説明する。DO-178C 本文は有償で未読。
claims:
  - id: c1
    text: DO-178C は §6.5 を新設し、テスト結果・テスト手順・テストケースから要求までのトレーサビリティが必要であることを明示した。
    quote: This has made explicit that traceability is required for test results, test procedures, and test cases through to requirements.
    locator: "Table: 6.5 Software Verification Process Traceability"
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
  - id: c2
    text: 双方向トレーサビリティは DO-178B から存在したが不明瞭で、実務では常に両方向で評価されていた。DO-178C での主な変化は、トレースデータを独立したライフサイクル成果物として捕捉させる点にある。
    quote: Bidirectional traceability was already part of DO-178B but obscured and in practice was always evaluated in both directions.
    locator: "Table: 5.5 / 6.5 / 11.21 ASE impact 欄"
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c3
    text: §5.5 はトレーサビリティが双方向であることを明確化し、トレースデータを新しいライフサイクルデータ項目として導入した。
    quote: introduced trace data as a new life cycle data item.
    locator: "Table: 5.5 Software Development Process Traceability"
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
