summary: Beko(家電メーカー)で Qodo PR Agent ベースの AI レビューを導入した産業事例。指摘の 73.8% が解決済みとされた一方、PR のクローズまでの平均時間は 5 時間 52 分から 8 時間 20 分に延びた。
claims:
  - id: c1
    text: AI レビューの指摘の 73.8% が解決済みとラベル付けされた一方、PR クローズまでの平均時間は 5 時間 52 分から 8 時間 20 分へ延びた(プロジェクトにより傾向は異なる)。
    quote: 73.8% of automated code review comments were labeled as resolved. However, the overall average pull request closure duration increased from five hours 52 minutes to eight hours 20 minutes
    locator: Abstract (Results)
    quant:
      value: 解決 73.8%、クローズ時間 5h52m→8h20m
      n: 3 プロジェクト 4,335 PR(うち AI レビュー 1,568 件)、利用可能者 238 人
      design: industrial case study (PR data + surveys)
      population: Beko の社内開発
    evidenceKind: case-report
    rqs: [TH06-Q6]
    issues: [257]
    stance: qualifies
  - id: c2
    text: バグ検出や品質意識の向上に役立った一方、誤ったレビュー・不要な修正・無関係な指摘という欠点も生じた。
    quote: it also led to longer pull request closure times and introduced drawbacks such as faulty reviews, unnecessary corrections, and irrelevant comments.
    locator: Abstract (Conclusion)
