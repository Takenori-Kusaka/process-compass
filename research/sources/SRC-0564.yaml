summary: PMI 大会論文(2010)。PMBOK 第4版の前提の定義(証明なしに真とみなす要素)を引いたうえで、PMBOK も関連文献も前提を一覧にして定期的に見直せと言うだけで手引きが乏しいと批判し、RAND の Assumption-Based Planning をプロジェクトへ適用する。PMBOK 本体(assumption log の様式)は未読。
claims:
  - id: c1
    text: PMBOK 第4版は前提を『計画のために、証明や実証なしに真・現実・確実とみなす要素』と定義する。定義上、前提は未検証のものとして扱われる。
    quote: Assumptions are “factors that, for planning purposes, are considered to be true, real, or certain without proof or demonstration” (PMI, 2008, p 148).
    locator: 本文 PMBOK の定義を引く段落
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: context
  - id: c2
    text: 著者は、PMBOK の Assumptions Analysis には用語の説明も技法の詳述もなく、文献は前提を冒頭で一覧にし定期的に見直せと言うにとどまると指摘する。前提の検証状態を区別する様式が実務に定着していないという側の証言である。
    quote: Some authors will then say that they should be reviewed periodically during the project, but rarely offer any more guidance.
    locator: Shortcomings in Practice
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH08-Q3]
    issues: [256]
    stance: contradicts
  - id: c3
    text: ABP の分類を引き、崩れると計画の大きな変更が要る前提(load-bearing)と、期間中に崩れうる前提(vulnerable)を区別する。区別の軸は検証済みか否かではなく、計画への影響と脆弱さである。
    quote: A load-bearing assumption is one whose failure would necessitate significant changes to the plan. Vulnerable assumptions are those that could fail or be proven invalid during the project.
    locator: Taxonomy of Assumptions (Exhibit 3 の説明)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH08-Q3]
    issues: [256]
    stance: qualifies
