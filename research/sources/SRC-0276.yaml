summary: Claude Code の入れ子既定深さ3化(v2.1.219)を受け、個人の19サブエージェント構成を実測で棚卸しした記録。検品役に Edit を渡さず権限で不可能にする設計と、Bash がその保証を崩すことを示す。
claims:
  - id: c1
    text: 日常運用する19体のサブエージェントはすべて depth 1 のハブ&スポークで、子が孫を起動する箇所はゼロだった。既定深さが3になっても著者の環境では何も起きなかった。
    quote: 19体すべてが depth 1 で、子が孫を起動している箇所はゼロ。
    locator: 「いま動いている構成（19サブエージェント・19スキル・17コマンド）」節
    quant:
      value: 19体中 depth≥2 は0体
      n: サブエージェント19・スキル19・コマンド17
      design: 定義ファイルの grep と ls による計数(2026-08-16時点)
      population: 個人1名の ~/.claude 構成
    evidenceKind: case-report
    rqs: [TH01-Q3, TH03-Q2]
    issues: []
    stance: context
  - id: c2
    text: 書き手にだけ Write/Edit を与え、検品役・計測役には与えない。プロンプトでの依頼は確率的にしか守られないが、渡していないツールは決定論的に使えない、という設計判断をしている。
    quote: プロンプトでのお願いは確率的にしか守られませんが、渡していないツールは決定論的に使えません。
    locator: 「tools 行が責務そのもの」節
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q5, TH06-Q4]
    issues: []
    stance: supports
  - id: c3
    text: ただし Bash を渡すとシェルのリダイレクトで Write の不在を素通りできるため、『書かせない』保証は消え、残るのはプロンプトの禁止文だけになる。著者は権限を定義ファイル・プロンプト・ハーネスの実行時剥奪の3層で整理した。
    quote: つまり Bash を渡した時点で、Write を渡さないことによる保証は消えている。
    locator: 「権限では縛りきれないものがある」節
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q5]
    issues: []
    stance: qualifies
  - id: c4
    text: CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=1 で実測したところ、親の定義に Agent ツールを書いても実行時に取り除かれ、ツール呼び出し0回で終わった(v2.1.233で確認)。
    quote: 定義ファイルに書いても剥がされるわけです。
    locator: 「v2.1.219 で変わった5つと、深さの数え方」節
    quant: null
    evidenceKind: case-report
    rqs: [TH03-Q1]
    issues: []
    stance: context
