    text: 経営者は統制の設計・実施で、費用要因を期待便益と比べて考慮する。統制が業務に組み込まれている場合、便益・費用の切り分けは難しい。
    quote: Management considers a variety of cost factors in relation to expected benefits when designing and implementing internal controls.
