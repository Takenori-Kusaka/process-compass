summary: 同一モデル(Sonnet 4.5)・同一タスクで Claude Code と OpenCode の API 境界の全リクエストをログした計測(2026-07-12、HN 706 points)。Claude Code はプロンプト前に約 33k トークン(うち約 24k がツール定義)を送り、接頭辞が不安定でキャッシュ再書き込みが最大 54 倍。
claims:
  - id: c1
    text: Claude Code は利用者のプロンプトが届く前に約 33,000 トークン(システムプロンプト・ツールスキーマ・足場)を送る。OpenCode は約 7,000。ハーネス自体の常時ロード量の実測。
    quote: When we asked both harnesses for a one-line reply, Claude Code used roughly 33,000 tokens of system prompt, tool schemas, and injected scaffolding before the prompt even arrived. OpenCode used about 7,000.
    locator: 冒頭の要約
    quant:
      value: ~33,000 vs ~7,000 tokens
      n: 同一タスク群、Sonnet 4.5、ゲートウェイ経由の全リクエスト
      design: controlled measurement at API boundary
      population: Claude Code vs OpenCode
    evidenceKind: controlled-experiment
    rqs: [TH04-Q2, TH03-Q1]
    issues: [274]
    stance: supports
  - id: c2
    text: 指示書(CLAUDE.md)を置かない最小構成で、一行で返答するタスクの初回リクエストを測ると、Claude Code の約 33,000 トークンのうち約 24,000 がツール定義だった(OpenCode は約 6,900 のうち約 4,800)。この条件では両者ともツールスキーマが支配項である。
    quote: Tool schemas are the dominant term for both. Roughly 24,000 of Claude Code's ~33,000 tokens are tool definitions, versus roughly 4,800 of OpenCode's ~6,900.
    locator: Part I. The floor > The fixed overhead of saying OK(ページに 'Where the tokens go' という見出しは無い)
    quant:
      value: ~24,000 / ~33,000 (73%)
      n: null
      design: measurement
      population: Claude Code baseline request
    evidenceKind: controlled-experiment
    rqs: [TH04-Q2, TH03-Q1]
    issues: [274]
    stance: qualifies
  - id: c3
    text: Claude Code はセッション中に数万トークンのキャッシュを再書き込みし、同一タスクで OpenCode の最大 54 倍のキャッシュ書き込みトークンを発生させた。キャッシュ前提の費用構造は接頭辞の安定性に依存する。
    quote: Claude Code on the other hand re-wrote tens of thousands of prompt-cache tokens mid-session, run after run, and on the same task wrote up to 54x more cache tokens than OpenCode.
