summary: Anthropic 社内の AI R&D を Epoch AI の Automation Level(AL0〜AL5)で測り、2026-08 時点で Claude が「主導(AL4)」する作業は26%、完全自律(AL5)はゼロと報告。約3万エージェント同時稼働、10億超の判断のうち0.002%(1/47,000)を監視が遮断。自己申告値。
claims:
  - id: c1
    text: 採用した自律度尺度は AL0(AI 関与なし)〜AL5(完全自律)の6段階で、AL3=協働、AL4=主導(高レベル指示から大半を完遂し人が監督)。作業(タスク)のバスケット単位で測る。
    quote: "It runs from AL0 (no AI involvement) to AL5 (AI operates fully autonomously, with no human in the loop). In AL3, AI “collaborates”: it can do large chunks of work under close human direction. In AL4, AI “leads”"
    locator: Automation of AI R&D, What we found
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q1]
    issues: [248]
    stance: qualifies
  - id: c2
    text: 2026 年 8 月時点で、Claude は Anthropic 社内の AI R&D 作業のうち測定したどの部分でも完全自律では動いておらず、作業の 26% を「主導」し、「協働」以上に当たる割合は 90% を超える。
    quote: Claude is not operating fully autonomously for any measured subset of AI R&D work. Claude “leads” 26% of Anthropic’s AI R&D work. The share of work at or above “AI collaborates” is above 90%.
    locator: (1) Measuring AI-led AI R&D > What we found
    quant:
      value: 26% (AL4), >90% (≥AL3), 0% (AL5)
      n: Anthropic 社内 AI R&D タスクバスケット(2026-07 基準)
      design: self-assessed automation index
      population: Anthropic internal AI R&D work, Aug 2026
    evidenceKind: observational
    rqs: [TH01-Q3, TH01-Q1]
    issues: [248]
    stance: supports
  - id: c3
    text: 監視指標として coverage・review latency・escalation rate を提案。2026-08 の10億超の判断のうち0.002%(約1/47,000)がオンライン監視で遮断され、千件に1〜2件が追加レビューに回った。
    quote: We analyzed over a billion decisions from our research & engineering agents over August 2026 and found that 0.002% of them (about 1 in 47,000) were blocked by this monitor.
    locator: Oversight of agents, Blocking / escalation rate
    quant:
      value: 0.002% (1/47,000)
      n: ">1 billion decisions"
      design: 自動監視ログ集計
      population: Anthropic internal research & engineering agents, Aug 2026, 単一プラットフォーム
    evidenceKind: observational
    rqs: [TH01-Q4, TH11-Q3]
    issues: [248]
    stance: context
