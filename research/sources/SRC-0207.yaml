summary: Anthropic 主催 Code w/ Claude Tokyo(2026-06-10)の DMM エンジニアによる参加記(2026-06-25)。Anthropic の「AI-native engineering org」講演(設計文書先行の儀式を減らし検証の自動化へ倍賭け)と、メルカリ・サイバーエージェント・NRI・Canva の事例をスライド撮影付きで伝える二次情報。
claims:
  - id: c1
    text: Anthropic の講演では、AI を本格導入すると計画・所有・レビュー等の旧来プロセスが壊れ、「コードの前にまず設計ドキュメント」という儀式を減らし、検証の自動化に倍賭けしたと紹介された(参加者による伝聞)。
    quote: 減らしたのは「コードの前にまず設計ドキュメント」という儀式。逆に倍賭けしたのが検証の自動化でした。
    locator: 任せた成果を「資産」として積み上げる発想(楽天・Anthropic)
    quant: null
