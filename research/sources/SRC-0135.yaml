summary: 2023-03 から 2026-07 に公開された 12 プロバイダ 68 モデルに Alternate Uses Task と Infinity-Chat100 を与え、文埋め込み類似度で出力多様性の経年変化を測った予備的分析。多様性は統計的に有意に低下しており、モデル間で創造的内容が収束していると示唆する。
