summary: 前回「タイトルのみ確認」だった論文。AIDev の 19,450 PR から 3,109 PR を分析し、コードレビューエージェント(CRA)のみがレビューした PR のマージ率は 45.20%(人間のみ 68.37%)、閉じられた CRA-only PR の 60.2% は指摘の信号率 0〜30%。CRA は人の代替でなく補助であるべきと結論。
claims:
  - id: c1
    text: CRA のみがレビューした PR のマージ率は 45.20% で、人間のみ(68.37%)より 23.17 ポイント低く、放棄も有意に多い。
    quote: CRA-only PRs achieve a 45.20% merge rate, 23.17 percentage points lower than human-only PRs (68.37%), with significantly higher abandonment.
    locator: Abstract
    quant:
      value: 45.20% vs 68.37%
      n: 3,109 PRs (from AIDev 19,450)
      design: observational (repository mining)
      population: GitHub PRs in commented review state
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: []
    stance: supports
  - id: c2
    text: 閉じられた CRA-only PR 98 件のうち 60.2% は指摘の信号率 0〜30% で、13 種の CRA のうち 12 種は平均信号率 60% 未満。自動レビューの指摘はノイズが多い。
    quote: 60.2% of closed CRA-only PRs fall into the 0-30% signal range, and 12 of 13 CRAs exhibit average signal ratios below 60%, indicating substantial noise in automated review feedback.
    locator: Abstract
    quant:
      value: 60.2% in 0-30% signal; 12/13 CRAs <60%
      n: 98 closed CRA-only PRs; 13 CRAs
      design: observational
      population: AIDev
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: []
    stance: supports
  - id: c3
    text: 著者は CRA を人のレビュアーの代替ではなく補助として使うべきと結論する。
    quote: our results indicate that CRAs should augment rather than replace human reviewers and that human involvement remains critical for effective and actionable code review.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: [TH06-Q6, TH01-Q1]
    issues: []
    stance: supports
  - id: c4
    text: CRA のみのレビューの PR はマージ率 45.20% で、人間のみの 68.37% より有意に低く、放棄率は 34.88% 対 21.60% と高い。『AI レビューで 80% の PR は人間のコメント不要』という業界の主張と逆の結果。
    quote: CRA-only reviewed PRs achieve a 45.20% merge rate, significantly lower than the 68.37% rate for human-only reviewed PRs, with substantially higher abandonment rates (34.88% vs 21.60%).
    locator: §8 Conclusion
    quant:
      value: マージ率 45.20% vs 68.37%、放棄率 34.88% vs 21.60%
      n: 3,109 PR
      design: observational (repository mining)
      population: Agentic PR(AIDev 系)
    evidenceKind: observational
    rqs: [TH06-Q6]
    issues: [257]
