  - id: c5
    text: 閉じられた CRA のみの PR 98 件の 60.2% は有効指摘率 0〜30% に入り、13 の CRA のうち 12 が平均有効指摘率 60% 未満だった。
    quote: 60.2% fall into the 0-30% signal range, and 12 of 13 unique CRAs (92.31%) exhibit average signal ratios below 60%.
