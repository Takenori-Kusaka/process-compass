    text: "レビュー品質(SWE-PRBench)では naive な往復が最下位 F1 0.457: R が曖昧な懸念を並べ、C がそれを追認して薄い指摘が増える(偽合意)。反対意見と根拠の明示を課した版は 0.533 で最高。#257 の「懸念があるだけの指摘を不成立にする」と整合。"
