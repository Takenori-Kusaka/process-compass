summary: 反証候補。主エージェント＋レビュア R＋批評者 C の往復ループ(AR)が LiveCodeBench 87%(ゼロショット 77%、MARS 82%)、SWE-bench Verified 75.2%(71.6%)で最良。#258 の「往復させると正味で悪化」に対する反例。ただし SWE-PRBench では naive AR が証拠なしの偽合意で最下位(F1 0.457)となり、反対意見と証拠を明示的に要求する版で最高(0.533)。R と C が同一モデルかは本読解では未確認。
claims:
  - id: c1
    text: LiveCodeBench(105 題)で往復ループ AR は 87% と 6 手法中最高。ゼロショット 77%、Self-Refine 77%、単一レビュア 77%、レビュア 2 体(非対話)75%、MARS(5 体)82%。対話する 2 体が非対話の 4 体に勝った。
    quote: On LCB, AR has the highest pass-rate of all six methods we test (pass-rate is 87%. Pass-on-hard is 43/57). In particular, AR scores +5pp over MARS while using fewer reviewing roles
    locator: §3.5; Table 1 (Zero-shot 77% / Self-Refine 77% / Single-reviewer 77% / Two-reviewers 75% / MARS 82% / AR 87%)
    quant:
