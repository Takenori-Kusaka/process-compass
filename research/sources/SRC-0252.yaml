summary: IPAの定点調査(日本企業1,799社)。AI利活用は業務効率化中心で、プログラム・システム開発支援は効果が出ている割合が高い一方「効果が出ていない」も3割弱ある。
claims:
  - id: c1
    text: 調査は19業種の企業の経営層またはICT関連部門を対象に2026年4月中旬〜6月中旬に実施し、1,799社から有効回答を得た。
    quote: 日本企業へのアンケートは、日本標準産業分類の19 業種（製造業、非製造業、「公務」を除く）の企業の経営層またはICT 関連事業部門を対象として実施し、1,799 社からの有効回答を得た。
    locator: 6.1 調査概要(p.67)
    quant:
      value: 1,799社
      n: 1,799
      design: アンケート調査
      population: 日本企業19業種の経営層またはICT関連部門
    evidenceKind: survey
    rqs: [TH11-Q2]
    issues: []
    stance: context
  - id: c2
    text: AIの用途のうち「プログラムコードやシステム開発支援」は効果が出ている割合が高いが、「効果が出ていない」も3割弱ある。
    quote: 「データ分析・予測・インサイト抽出」および「プログラムコードやシステム開発支援」は効果が出ている割合が高いが、ともに「効果が出ていない」も3 割弱ある。
    locator: 3章 図表3-10 AI 利活用の用途(AI 導入効果別・抜粋)
    quant:
      value: 効果が出ていない 3割弱
      n: AI導入効果の設問で「わからない」以外を回答した企業
      design: アンケート(自己申告)
      population: AI導入・試験利用・検討中の日本企業
    evidenceKind: survey
    rqs: [TH11-Q2, BASE-Q2, TH12-Q2]
    issues: []
    stance: qualifies
  - id: c3
    text: 「プログラムコードやシステム開発支援」への利活用は情報通信業で76.3%と他業種を大きく上回る。
    quote: 「プログラムコードやシステム開発支援」では「情報通信業」が76.3%と他業種を大きく上回っており
    locator: 3章 図表3-11 AI 利活用の用途(業種別・抜粋)
    quant:
      value: 76.3%
      n: 情報通信業の回答企業(件数は図表参照)
      design: アンケート
      population: AI導入・試験利用・検討中の情報通信業
    evidenceKind: survey
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c4
    text: AI導入・運用上の課題は「専門人材が不足」50.1%、「効果やリスクの理解不足」45.8%、「適切な利用を管理するルールや基準の作成が難しい」39.7%の順。
    quote: 「専門人材が不足している」が50.1%と最も高く、次いで「生成AI の効果やリスクに関する理解が不足している」が45.8%、「適切な利用を管理するためのルールや基準の作成が難しい」が39.7%となっている
    locator: 3章 図表3-16 AI 導入・運用上の課題(p.37)
    quant:
      value: 50.1% / 45.8% / 39.7%
      n: AI導入・検討企業(件数は図表参照)
      design: アンケート(複数回答)
      population: 日本企業
    evidenceKind: survey
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c5
    text: AI導入の効果は業務効率化・迅速化(91.6%)が中心で、顧客満足度向上4.5%、売上・利益向上3.9%と外向きの成果に至る企業は少ない。
    quote: 「顧客満足度が向上した」が 4.5%、「売上や利益が向上した」が 3.9%と、外向きの成果創出に至っている企業は少ない状況にある。
    locator: 3章 図表3-14 AI導入による具体的効果
    quant:
