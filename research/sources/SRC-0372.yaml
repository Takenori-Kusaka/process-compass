summary: エージェント駆動開発でリポジトリの文書を4階層(AGENTS.md/参照文書/仕様/コード)に分ける実務報告。常時注入される第0層は薄くし、各事実は1文書にだけ置いて他はリンクとする。重複が陳腐化の最大要因とする。
claims:
  - id: c1
    text: 第0層(AGENTS.md)は全セッションに注入されるので、ビルド・lint コマンド、深い文書への参照、共通規約だけの薄い振り分け役に保つ。
    quote: Level 0 is the thin dispatcher — build commands, lint commands, pointers to deeper documents, and universal conventions. It must be concise because it is injected into every context window.
    locator: A Documentation Hierarchy for Agents
    quant: null
    evidenceKind: case-report
    rqs: [TH05-Q4, TH03-Q1]
    issues: [269, 274]
    stance: supports
  - id: c2
    text: 各事実はちょうど1つの文書にだけ置き、他の参照はすべてリンクにする。同じ表が複数階層にあると陳腐化した重複が生まれ、エージェントは古い情報で動く。
    quote: "The most important rule governing this hierarchy: each fact lives in exactly one document. All other references are links."
    locator: A Documentation Hierarchy for Agents
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3]
    issues: [252]
    stance: supports
  - id: c3
    text: エージェントは文書を予測可能な順で読み、階層化すると初回成功率が上がったと報告する(数値・標本は示されていない)。
    quote: We found that agents consume documentation in a predictable order and structuring it as a hierarchy improves first-attempt success rates.
    locator: A Documentation Hierarchy for Agents
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q4]
    issues: []
    stance: supports
