summary: Google の変更説明(CL description)の書き方の指針。日付は google/eng-practices リポジトリのコミット履歴による。説明は恒久的な公開記録で、将来の読み手に向けて What と Why を書き、ツール生成の説明も同じ基準に従い、提出前に実態と一致するか見直すよう求める。
claims:
  - id: c1
    text: CL の説明は変更の公開記録であり、バージョン管理履歴の恒久的な一部として長年にわたり多数の人に読まれるとする(読み手に将来の開発者を置く)。
    quote: The CL description will become a permanent part of our version control history and will possibly be read by hundreds of people over the years.
    locator: 冒頭
    quant: null
    evidenceKind: normative
    rqs: [TH10-Q4]
    issues: [271]
    stance: context
  - id: c2
    text: ツールが生成した CL の説明も、可能な限り人の説明と同じ指針(独立した1行目、背景を含む本文)に従うべきとする。
    quote: Some CLs are generated by tools. Whenever possible, their descriptions should also follow the advice here.
    locator: Generated CL descriptions
    quant: null
    evidenceKind: normative
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c3
    text: レビュー中に CL は大きく変わりうるため、提出前に説明が CL の実際の内容を反映しているか見直すことを勧める(説明と実体の一致)。
    quote: It can be worthwhile to review a CL description before submitting the CL, to ensure that the description still reflects what the CL does.
    locator: Review the description before submitting the CL
    quant: null
    evidenceKind: normative
    rqs: [TH10-Q4, TH07-Q2]
    issues: [271]
    stance: supports
  - id: c4
    text: 本文には解いている問題、その方法が最善である理由、方法の欠点を含めるよう求める。
    quote: It might include a brief description of the problem that’s being solved, and why this is the best approach. If there are any shortcomings to the approach, they should be mentioned.
    locator: Body is Informative
    quant: null
    evidenceKind: normative
    rqs: [TH10-Q4]
    issues: [271]
    stance: context
