summary: 実運用エージェント50件のシステムプロンプト由来の指示(平均1,723語・11.9制約)で遵守を測った査読済みベンチマーク。最良モデルでも完全遵守は30%未満で、指示が長いほど悪化する。
claims:
  - id: c1
    text: 全モデルの成績が低く、最良モデルでも指示を完全に守れたのは30%未満である。
    quote: all LLMs perform poorly and even the best-performing model only follows fewer than 30% of the instructions perfectly.
    locator: §1 Introduction
    quant:
      value: <30% instruction success rate (best model)
      n: 707 instructions from 50 agentic applications
      design: benchmark
      population: thinking / non-thinking LLMs (2025)
    evidenceKind: benchmark
    rqs: [TH03-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 指示長や制約数が増えるほど成績は下がり、指示が6,000語を超えると全モデルの完全遵守率はほぼ0になる。著者は短い指示への分割を推奨する。
    quote: Notably, when instruction length exceeds 6,000 words, the ISR scores of all models are nearly 0.
    locator: §4.4 Analysis of Instruction Length and Constraint Quantity
    quant:
      value: ISR ≈ 0 above 6,000 words
      n: 707 instructions
      design: bucketed analysis
      population: agentic system prompts
    evidenceKind: benchmark
    rqs: [TH03-Q3, TH03-Q4]
    issues: [274]
    stance: supports
