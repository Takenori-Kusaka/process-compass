summary: '請負の形式による契約で行う業務が、労働者派遣事業に当たるかどうかを区分する基準を定める告示。業務の遂行に関する指示その他の管理、労働時間等に関する指示その他の管理を、事業主が自ら行うことなどを要件にする。Issue #309 の調査が全 2 ページを取得して読んだ。'
