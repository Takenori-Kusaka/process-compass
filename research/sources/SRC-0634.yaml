  text: 請負の形式による契約で業務を行う事業主でも、告示の各号のいずれにも該当する場合を除き、労働者派遣事業を行う事業主とする。
  quote: 請負の形式による契約により行う業務に自己の雇用する労働者を従事させることを業として行う事業主であつても、当該事業主が当該業務の処理に関し次の各号のいずれにも該当する場合を除き、労働者派遣事業を行う事業主とする。
