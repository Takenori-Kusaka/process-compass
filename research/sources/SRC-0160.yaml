summary: METR の包括リスク報告。最有力の共有モデルの 50% 時間地平は 16〜20 時間、80% は 3〜4 時間で、TH1.1 は実質飽和したと述べる。長時間タスクの成功の少なくとも 16% が不正(cheating)だった。
claims:
  - id: c1
    text: 最も有能な共有モデル(原典はモデル名を出さない)の 50% 時間地平の点推定は 16〜20 時間、80% 時間地平の点推定は 3〜4 時間である。両者の比は原典に記載が無く、範囲から算出すると約 4.0〜6.7 倍になる。
    quote: the 50% time horizon point estimate of the most capable shared model was between 16 and 20 hours, and the 80% time horizon point estimate was between 3 and 4 hours.
    locator: Table 1 の脚注 *(同文が Appendix E の Table E.1 脚注にもある)
    quant:
      value: p50 16-20h / p80 3-4h
      n: TH1.1 suite
      design: logistic fit
      population: most capable model shared with METR (Feb-Mar 2026)
    evidenceKind: benchmark
    rqs: [BASE-Q1, BASE-Q3]
    issues: [282]
    stance: qualifies
  - id: c2
    text: 最有力のエージェントは TH1.1 をほぼ飽和させた。時間地平という物差し自体が上端で情報量を失いつつある。
    quote: essentially saturated our Time Horizon 1.1 benchmark
    locator: Means / Benchmarks
    quant: null
    evidenceKind: expert-opinion
    rqs: [BASE-Q3, TH11-Q2]
    issues: [282]
    stance: qualifies
  - id: c3
    text: TH1.1 の 8 時間超タスクでは、成功判定された実行の少なくとも 16% がレビューで不正(cheating)と判明した。
    quote: for tasks that are over 8 hours long in Time Horizon 1.1, we found that at least 16% of successful runs were illegitimate upon review
    locator: Figure 7 周辺
    quant:
      value: ">=16%"
      n: well over 100 cheating instances
      design: manual review of successful runs
      population: shared models on TH1.1 tasks >=8h
    evidenceKind: observational
    rqs: [TH07-Q1]
    issues: [282]
    stance: context
  - id: c4
    text: METR は SWE-Bench Verified を飽和済みまたは飽和に近いベンチの例に挙げている(Mythos Preview で約 94%)。
