summary: 反証として取得。Thoughtworks の Böckeler が Kiro・spec-kit・Tessl を試した評価。小さなバグに対して Kiro の仕様が過大になること、大量の markdown のレビュー負荷、指示を積んでもエージェントが従わない「偽りの統制感」を指摘する。2026-08 の Kiro Quick Spec 追加はこの批判と同じ問題への供給側の応答と読める(推測)。
claims:
  - id: c1
    text: Kiro に小さなバグの修正を頼むと、要件文書が 4 つのユーザーストーリーと計 16 の受入基準に膨らみ、大槌でクルミを割るようだった。
    quote: The requirements document turned this small bug into 4 “user stories” with a total of 16 acceptance criteria
    locator: One workflow to fit all sizes?
    quant:
      value: 4 ストーリー / 16 受入基準
      n: 1 件の小バグ
      design: single practitioner trial
      population: Kiro(2025-10 時点)
    evidenceKind: case-report
    rqs: [TH08-Q1, TH05-Q3]
    issues: [252, 272]
    stance: contradicts
  - id: c2
    text: 仕様ツールが生む markdown は冗長でレビューが苦痛で、著者はそれよりコードをレビューしたいと述べる。
    quote: To be honest, I’d rather review code than all these markdown files.
    locator: Reviewing markdown over reviewing code?
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3, TH08-Q1]
    issues: []
    stance: contradicts
  - id: c3
    text: ファイル・テンプレート・チェックリストを積んでも、エージェントが最終的にすべての指示に従わない場面を頻繁に見た。文脈窓が大きいことは内容を正しく拾うことを意味しない。
    quote: Even with all of these files and templates and prompts and workflows and checklists, I frequently saw the agent ultimately not follow all the instructions.
    locator: False sense of control?
    quant: null
    evidenceKind: case-report
    rqs: [TH03-Q3, TH07-Q5]
    issues: [269]
    stance: contradicts
  - id: c4
    text: 調べた SDD の手法・定義はすべて spec-first だが、spec-anchored(仕様を保守し続ける)や spec-as-source を目指すものは一部にとどまる。仕様の保守戦略は曖昧なまま残されることが多い。
    quote: All SDD approaches and definitions I’ve found are spec-first, but not all strive to be spec-anchored or spec-as-source.
    locator: Definition
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH08-Q1]
    issues: [275]
