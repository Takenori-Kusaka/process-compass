summary: 誤りの重なりに基づく類似度 CAPA を提案し、(1) LLM 判定者は自分に似たモデルへ高得点(平均 Pearson r=0.84)、(2) 弱→強汎化の利得は相補性と逆相関(r=−0.35)、(3) 能力が上がるほど誤りが似る(130 モデル)を示す。254 メモ §4.2 の 4 主張は全て原典に一致(v1 にも同主張あり)。
claims:
  - id: c1
    text: 誤りの重なりに基づく類似度指標 CAPA(Chance Adjusted Probabilistic Agreement / 本文では Alignment とも表記)を導入。精度による偶然一致を補正し、確率出力を使う。
    quote: "We study how model similarity affects both aspects of AI oversight by proposing Chance Adjusted Probabilistic Agreement (CAPA): a metric for LM similarity based on overlap in model mistakes."
    locator: Abstract; §2.2; §1 (Chance Adjusted Probabilistic Alignment)
    quant: null
    evidenceKind: benchmark
    rqs: [TH06-Q3]
    issues: [258]
    stance: context
  - id: c2
    text: "LLM-as-a-judge の採点は判定者と機能的に似たモデルほど高い: 全判定者で判定スコアと CAPA の間に有意(p<0.01)な正の相関、平均 Pearson r=0.84。精度を統制した偏相関でも r=0.35〜0.65 で全判定者が有意。"
    quote: We find a significant (p<0.01) positive correlation (average Pearson r=0.84) between LLM-as-a-judge scores and model similarity (κp) for all judges.
    locator: §3.2 Results & Discussion (Q1); Figure 3; App. B.6.1 (partial r=0.35 Llama-3.3-70B 〜 0.65 Llama-3.1-8B)
    quant:
      value: mean Pearson r=0.84; partial r 0.35–0.65 controlling accuracy
      n: 9 judges × 39 evaluated models; filtered MMLU-Pro 8,707 questions
      design: observational correlation with regression / partial-correlation controls
      population: open-weight instruct models as judges and candidates
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c3
    text: "能力が上がるほどモデルの誤りは似てくる: OpenLLM Leaderboard 2 の 130 モデルを精度で 5 分位に分け、別開発元同士の平均 CAPA が精度と強い正相関(Figure 6、MMLU-Pro と BBH)。指示調整モデルは基盤モデルより傾きが急。"
    quote: However, we observe a concerning trend – model mistakes are becoming more similar with increasing capabilities, pointing to risks from correlated failures.
    locator: Abstract; §5.2 Q1 (Figure 6 shows a strong positive correlation between model capabilities and κp); App. D.2.1
    quant:
      value: strong positive correlation (figure-based; no single coefficient in main text)
      n: 130 models, 5 accuracy buckets, MMLU-Pro & BBH
      design: observational (leaderboard sample-wise predictions)
      population: official models on OpenLLM Leaderboard 2, cross-developer pairs only
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c4
    text: 12モデル対×15課題で、弱監督者と初期の強生徒の類似度は、弱→強訓練で得られる改善と逆相関する(単純相関 r=−0.85。弱監督者と強生徒の精度差を統制した偏相関は r=−0.35, p<0.01)。相補性を考慮すると、上限推定は従来の +11.2(Ground-truth Elicitation)から +14.1(Elicitation ∪ Complementary)へ上がる(Table 3)。
    quote: similarity between the weak supervisor and initial strong student inversely correlates with the improvement obtained from weak-to-strong training ( r=-0.85) . … partial correlation … ( r=-0.35 )
    locator: §4.1; §4.2 Q1 (Figure 4); §4.2 Q3; Table 3 (15 datasets × 12 model pairs = 180 training runs)
    quant:
      value: r=−0.35 (similarity vs w2s gain)
      n: 12 model pairs × 15 binary NLP tasks (180 runs)
      design: controlled fine-tuning experiment following Burns et al. 2024
      population: weak 1–3B, strong 7–9B open-weight models
    evidenceKind: controlled-experiment
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c5
    text: AlpacaEval の自由生成でも同じ 9 判定者の二者選好 Elo が MMLU-Pro 上の類似度と強く相関し、親和バイアスは QA 以外にも及ぶ。
    quote: the Elo obtained by using the same judges as before to obtain binary preferences still strongly correlates with model similarity on MMLU-Pro.
    locator: §3.2 Q3; App. B.4
    quant:
      value: strong correlation (Elo vs CAPA)
      n: 23 instruction-tuned models, 253 model pairs, AlpacaFarm prompts
      design: observational
      population: same 9 judges
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
