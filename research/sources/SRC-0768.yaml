    label: 保持期間の方針が、成果物とログに加えて、チェック・ワークフローの実行・コミットの状態にも適用される(文書の予告)
summary: 'GitHub の組織設定の文書。既定では、チェック・ワークフローの実行・コミットの状態と、ワークフローが作る成果物・ログが 90 日で自動削除される。文書は「実行の記録は残る」とは書いていない。反対に、2026-10-01 から保持期間の方針がチェック・実行・コミットの状態にも適用され、それまでは 400 日超保持すると書く。保持期間の変更は新しい対象にだけ適用され、既存の対象には遡らないとも書く。2026-11-19 の観測(2026-10-01 より前に作られた 134〜142 日前の実行とジョブの記録が読めた)は、この文書と矛盾しない。新しい方針の下で作られた実行が 90 日を超えて読めるかは、2026-12-30 以降でないと試せない。準拠テンプレートの棚卸しの出力の開示は、実行の記録が無い場合・保持期間で消えた場合・手で削除した場合を区別しないと明記する。'
claims:
