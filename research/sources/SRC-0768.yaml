    text: '既定では、チェック・ワークフローの実行・コミットの状態と、成果物・ログは 90 日の保持の後に自動で削除される。文書は、ワークフローの実行の記録が保持期間の後も残るとは書いていない。'
    quote: 'By default, checks, workflow runs, commit statuses, and the artifacts and log files generated by workflows are retained for 90 days before they are automatically deleted.'
