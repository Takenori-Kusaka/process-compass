summary: 安全ケース記法 GSN の共同体標準 第3版(2021-05、案内ページは https://scsc.uk/r1386)。前提を『立証されていない言明』として正当化と別要素に置き、未展開(undeveloped)の標識と、第3版で加わった弁証法拡張(挑戦・defeated)を定める。前提要素そのものに検証状態の欄は無い。
claims:
  - id: c1
    text: 前提(assumption)は立証されていない言明と定義され、goal に接続すると関連する議論全体に掛かるものとして扱われる。前提要素の中に『検証済み/想定』を分ける属性は定義されていない(読んだ第1部 1:2 の範囲)。
    quote: An assumption is an unsubstantiated statement. Having connected an assumption to a goal G1, the assumption is taken to be connected to the entirety of the relevant argument.
    locator: Part 1, 1:2.2.13
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: qualifies
  - id: c2
    text: 手引き部は、前提を『真であると主張され、それ以上の議論で支えられない命題』と説明する。検証された事項は前提ではなく、証拠(solution)で支える goal の側へ移る構造である。
    quote: Note that an assumption is a proposition that is asserted as true and therefore is not supported by further argument.
    locator: Part 2, 2:3.5.2
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
  - id: c3
    text: 主張や戦略が依存する前提は有効でなければならないとし、前提要素で明示的に文書化できるとする。
    quote: These assumptions must be valid for the claim or the strategy to be valid. Assumptions can be documented explicitly in GSN using the assumption element.
    locator: Part 0, 0:4.6
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
  - id: c4
    text: undeveloped の装飾(中空のひし形)は論証の線が展開されていないことを示し、goal と strategy に適用でき、assumption とは別の要素として定義されている。undeveloped goal は「意図的に未展開のまま残した主張」、assumption は「意図的に立証しない言明」で、どちらも意図的と書かれており、記法上の区別は「展開していない論証の線」対「立証しない言明」である。
    quote: Undeveloped element decorator, rendered as a hollow diamond applied to the bottom centre of an element, indicates that a line of argument has not been developed.
    locator: Part 1, Table 1:2-1 Core GSN Elements(Undeveloped goal の行)
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
  - id: c5
    text: 第3版は弁証法拡張を加え、疑念の発見と残存する疑念の表示を記法で扱う(挑戦する goal / solution、defeated 標識)。
    quote: provides a framework for creating, challenging and questioning Assurance Cases through the discovery and identification of doubt, which can be depicted and the residual doubt exposed.
    locator: Part 1, 1:6.1.1 Dialectic Extension
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q3]
    issues: [256]
    stance: supports
