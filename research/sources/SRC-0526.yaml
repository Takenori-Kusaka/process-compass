summary: ISO 26262 の二輪車向け適応(第 12 部)の公開プレビュー。第 7 章「確認措置」の要求本文と注記までが読め、確認措置の独立性が ASIL に応じて定められ、組織上の独立を指すことが分かる。I0〜I3 の定義を載せる表 1 はプレビュー範囲外。第 2 部(ISO 26262-2:2018)のプレビューは §5.2.2.3 で切れ、§6.4.9 の表 1 に届かない。
