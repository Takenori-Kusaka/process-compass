    quote: 3 \times | 75.6 \pm 2.2 | 74.8 \pm 2.1 \downarrow 0.8 | 81.4 \pm 3.3 | 82.2 \pm 2.7 \uparrow 0.8 | 94.0 \pm 0.9 | 94.4 \pm 1.5 \uparrow 0.4
