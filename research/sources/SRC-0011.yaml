summary: GPT-4o-mini / Llama-3.1-8B / Mistral-7B の 3 体討論(Du et al. 方式、固定役割なし)で、討論後に多数決精度が下がる条件を分析。254 メモが記した 3 類型(説得の優先・同質エージェントの限界・固定役割の系統的バイアス)は原典の分類ではなく、原典は「逐次改訂・社会的影響・迎合」を要因とし、劣化は主に異質構成で報告している。数値は Table 1 にある。
claims:
  - id: c1
    text: 原典は、失敗モードに相関・寄与する要因として逐次改訂・社会的条件付け(social conditioning)・迎合(sycophancy)を「含む」複数の要因を挙げる(§6.1–6.3)。さらにモデルと課題の種類の影響も論じ(§6.4)、単一の原因ではないと明言している。「説得の優先/同質エージェントの限界/固定役割の系統的バイアス」という分類は、原典の見出しにも本文にも出てこない。
    quote: We study a number of correlated and contributing factors to these failure modes in debate, including sequential revision, social conditioning, and sycophancy.
    locator: §7 Discussion(§6.1–6.3 に対応)
    quant:
      value: 3 factors
      n: 3 models × 3 tasks × 100 samples × 5 seeds
      design: controlled experiment
      population: GPT-4o-mini, Llama-3.1-8B-Instruct, Mistral-7B-Instruct-v0.2
    evidenceKind: controlled-experiment
    rqs: [TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c2
    text: 「説得が正しさを上回る」は原典の知見ではなく、関連研究(Agarwal and Khanna 2025、TruthfulQA での 1 ラウンド討論)の紹介として書かれている。
    quote: However, other studies caution that debate can fail when agents emphasize persuasion over truth. Agarwal and Khanna (2025) introduce a single-round debate on factual questions (using TruthfulQA)
    locator: §2 Related Work
    quant:
      value: n/a
      n: n/a
      design: literature citation
      population: n/a
    evidenceKind: review
    rqs: [TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c3
    text: 原典は劣化を「特に異質なエージェント構成で」報告しており、同質構成の限界を主題にしていない。固定役割(賛成/反対)は設定に存在しない(全エージェントが同一の「helpful assistant」システムプロンプト)。
    quote: showing that debate can sometimes harm group performance, particularly with heterogeneous LLM agents engaged in debate.
    locator: "§1 Introduction / §4.3 Prompts(System prompt: You are a helpful assistant that can answer questions and provide helpful information.)"
    quant:
      value: n/a
      n: n/a
      design: controlled experiment
      population: heterogeneous and homogeneous 3-agent groups
