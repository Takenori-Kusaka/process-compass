summary: Claude 3.5 / Nova Premier / Pixtral-Large を MAD・DMAD の役割へ動的に割り当てる Meta-Debate の提案。「最大 74.8% 改善」は Abstract の文言どおりだが、本文の Table 1・2 からは導けない。254 メモの「GPQA 66.29% 対 54.24%」は DMAD の提案手法と MAD の一様割当を跨いだ比較で、同一枠組み内の差は +4.9〜+7.4pt。
