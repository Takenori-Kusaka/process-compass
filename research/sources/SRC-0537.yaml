summary: J-SOX の基準・実施基準の現行版(令和5年改訂)。職務分掌は「複数の者」「別の者」「担当者」の間の分担・分離として書かれ、PDF 全文を検索しても AI・人工知能の語は無い。内部統制の限界として費用と便益の比較衡量を明記し、費用が効果を上回る場合のリスク受容を認める。
claims:
  - id: c1
    text: 職務分掌は職務を複数の者の間で分担・分離することで、承認・記録・資産管理を別の者に担当させ担当者間の相互牽制を働かせる例を示す。担い手は「者」「担当者」で、AI を担い手とする想定は本文に無い(全文検索で AI・ＡＩ・人工知能は 0 件)。
    quote: 職務を複数の者の間で適切に分担又は分離させることが重要である。例えば、取引の承認、取引の記録、資産の管理に関する職責をそれぞれ別の者に担当させることにより、それぞれの担当者間で適切に相互牽制を働かせることが考えられる。
    locator: 実施基準 Ⅰ.2.(3) 統制活動(p.44)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: context
  - id: c2
    text: 内部統制の固有の限界の 1 つとして費用と便益の比較衡量を挙げ、手続の導入・維持の可否は費用とリスク対応の便益を比べて決めるとする。
    quote: 組織は、ある内部統制の手続を導入又は維持することの可否を決定する際に、そのための費用と、その手続によるリスクへの対応を図ることから得られる便益とを比較検討する。
    locator: 実施基準 Ⅰ.3 内部統制の限界(p.55)
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: supports
  - id: c3
    text: 事前の対応費用が効果を上回る、または顕在化後でも対応可能と判断した場合で、リスクが許容水準以下なら、そのまま受容することを認める。受容の記録様式は定めていない(読んだ範囲)。
    quote: リスクへの事前の対応に掛かる費用が、その効果を上回るという判断が行われた場合、又は、リスクが顕在化した後でも対応が可能であると判断した場合、リスクが許容できる水準以下のものであれば組織はリスクをそのまま受容することが考えられる。
    locator: 実施基準 Ⅰ.2.(2) リスクの評価と対応(p.44)
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: supports
  - id: c4
    text: IT の統制は自動化された統制を中心とし手作業の統制を含むと定義する。統制の実行主体として自動化は認められているが、これは IT による統制であって職務の担い手の規定ではない。
    quote: ＩＴの統制とは、ＩＴを取り入れた情報システムに関する統制であり、自動化された統制を中心とするが、しばしば、手作業による統制が含まれる。
    locator: 実施基準 Ⅰ.2.(6)② ＩＴの利用及び統制〔ＩＴの統制〕
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: context
  - id: c5
    text: 自動化された内部統制は、一度設定されると変更やエラーが無い限り一貫して機能する性質を持つことを、評価の簡素化の前提に置く。
    quote: ＩＴを利用して自動化された内部統制に関しては、一度内部統制が設定されると、変更やエラーが発生しない限り一貫して機能するという性質がある。
    locator: 実施基準 Ⅱ.3.(3)⑤ ニ．ＩＴを利用した内部統制の整備状況及び運用状況の有効性の評価
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: context
