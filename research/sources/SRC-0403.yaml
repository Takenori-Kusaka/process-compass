summary: GitHub が Copilot code review の設計方針と実績を述べた公式ブログ。GitHub 上のレビューの 5 件に 1 件超を占め、『雑音より沈黙』を方針に 29% のレビューでは何も言わない。評価は反応ボタンとマージ前の解決で測る。
claims:
  - id: c1
    text: Copilot code review はリリース以来利用が 10 倍に伸び、GitHub 上のコードレビューの 5 件に 1 件超を占める。
    quote: usage has grown 10X, now accounting for more than one in five code reviews on GitHub.
    locator: 冒頭
    quant:
      value: レビューの 5 件に 1 件超
      n: 不明(累計 6,000 万レビュー)
      design: vendor telemetry
      population: GitHub 上のコードレビュー
    evidenceKind: news-fact
    rqs: [TH06-Q6]
    issues: [257]
    stance: context
  - id: c2
    text: 『雑音より沈黙』を方針とし、71% のレビューで対応可能な指摘を出し、残り 29% では何も言わない。1 レビューあたり平均約 5.1 件のコメント。
    quote: Silence is better than noise. In 71% of the reviews, Copilot code review surfaces actionable feedback. In the remaining 29%, the agent says nothing at all.
    locator: Signal
    quant:
      value: 指摘あり 71% / 沈黙 29%、平均 5.1 件/レビュー
      n: 不明
      design: vendor telemetry
      population: 同上
    evidenceKind: news-fact
    rqs: [TH06-Q6]
    issues: [257]
    stance: context
  - id: c3
    text: 本番では、コメントへの賛否の反応と、指摘された問題がマージ前に解決されたかで精度を追う。
    quote: We measure whether flagged issues are resolved before merging.
    locator: Accuracy
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6, TH11-Q3]
    issues: [257]
    stance: context
  - id: c4
    text: より高度な推論モデルに替えると、待ち時間は 16% 延びたが好意的な反応率は 6% 上がり、GitHub は速度より信号を優先した。
    quote: adopting a more advanced reasoning model improved positive feedback rates by 6%, even though review latency increased by 16%
    locator: Speed
    quant:
      value: 好意的反応 +6%、待ち時間 +16%
      n: 不明
      design: vendor experiment (details undisclosed)
      population: 同上
    evidenceKind: news-fact
    rqs: [TH06-Q6]
    issues: [257]
