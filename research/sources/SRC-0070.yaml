    text: in the loop と on the loop の差は不満な出力への対処に現れる。前者は成果物を直し、後者は成果物を生んだハーネス(仕様・テスト・品質チェック・ワークフロー規則)を直す。
    quote: The “on the loop” way is to change the harness that produced the artefact so it produces the results we want.
