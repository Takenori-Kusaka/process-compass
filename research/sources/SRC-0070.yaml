summary: 人の位置を in the loop(各成果物を直す)/on the loop(成果物を生むハーネスを直す)/out of the loop(放任)で整理。人は「なぜループ」を持ち、「どうループ」ではハーネスを管理する側に立つべきだと論じる。ループ階層単位の切り方で、役割単位ではない。
