    label: NTTデータがホワイトペーパー「アカウンタビリティを軸としたAI-Native開発のデザイン戦略」を公開(記事中のリンク先ニュース日付)
summary: NTTデータのホワイトペーパーの要約記事。スリーラインモデルで生成・品質担保・説明責任を切り分け、AI-Generated/AI-Verified/AI-Explainableの3段階で責務がAIへ移っても最終的なアカウンタビリティは人に残るとする。
claims:
  - id: c1
    text: AIが担う範囲は拡大するが、最終的なアカウンタビリティは人に残るとし、責務の担い手を明示的に設計する必要があるとする。
    quote: 問題は、これらの責務を誰が担うかです。AIが担う範囲は拡大していきますが、最終的なアカウンタビリティは依然として人に残ります。
    locator: 3．商用システム開発における4つの責務
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: supports
  - id: c2
    text: 開発への適用に内部統制のスリーラインモデル(執行・監督・監査)を用い、成果物の生成、品質の担保、最終的な説明責任を切り分けている。
    quote: ホワイトペーパーでは、執行（第一ライン）、監督（第二ライン）、監査（第三ライン）という三層で役割分担を捉えるスリーラインモデルを用いています。
    locator: 3．商用システム開発における4つの責務 図3
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q2, TH06-Q3]
    issues: []
    stance: context
  - id: c3
    text: 自律度を役割単位の二値ではなく、どの責務をAIが担うかで3段階(AI-Generated/AI-Verified/AI-Explainable)に分ける。第2段階では人は個々の成果物レビューの比重を下げ品質基準とプロセス設計へ移る。
    quote: 第2段階の「AI-Verified」は、AIが検証や品質判定にも関与する段階です。AIが品質基準に基づいて成果物をチェックするため、人は個々の成果物のレビューにかける比重を下げ、品質基準やプロセス全体の設計・管理にシフトします。
    locator: 4．責務分担の段階的な変化 図4 AI-Native ソフトウェア開発成熟度レベル
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q1]
    issues: [248]
    stance: qualifies
  - id: c4
    text: アカウンタビリティを支えるために、判断理由と変更履歴(どの指示で、どのファイルを、なぜ変更したか)を証跡として残すことを設計ポイントに挙げる。
    quote: 最後に、アカウンタビリティを支えるために、判断理由と変更履歴を証跡として残すことが重要です。
    locator: 5．責務分担を踏まえた設計のポイント
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH07-Q2, TH05-Q1]
    issues: []
    stance: context
