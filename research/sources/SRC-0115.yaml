summary: OpenHands + SWE-bench Verified で 8 つのフロンティアモデルの軌跡を分析した査読前論文。エージェント型コーディングはチャットの 1000 倍のトークンを使い、キャッシュ有効でも入力が費用を支配。同一タスクでも 30 倍のばらつき、モデルは自分の消費量を過小予測する。
claims:
  - id: c1
    text: エージェント型コーディングはコード推論・チャットの 1000 倍のトークンを消費し、キャッシュを有効にしても出力ではなく入力トークンが費用を支配する。#274 の「キャッシュ読み取りが費用の過半」と同じ構造を独立に確認。
    quote: Strikingly, input tokens, not output tokens, dominate the overall cost in agentic coding, even when token caching is enabled
    locator: §1 Introduction(Finding 1)
    quant:
      value: 1000x tokens vs chat; input-dominated cost
      n: 8 frontier LLMs, SWE-bench Verified trajectories
      design: observational analysis of trajectories
      population: OpenHands agent on SWE-bench Verified
    evidenceKind: observational
    rqs: [TH04-Q1, TH04-Q2]
    issues: [274]
    stance: supports
  - id: c2
    text: SWE-bench Verified のタスクでは、同じタスクを再実行しても総トークンが最大 30 倍異なる。トークン使用量が多いほど精度が上がるわけではなく、精度はしばしば中間的な費用で最も高くなり、それ以上の費用では頭打ちになる(本文 §1 では最高費用帯で低下すると記述)。
    quote: runs on the same task can differ by up to 30 × in total tokens, and higher token usage does not translate into higher accuracy; instead, accuracy often peaks at intermediate cost
    locator: Abstract (2)
    quant:
      value: up to 30x variance per task
      n: 8 models
      design: observational
      population: SWE-bench Verified
    evidenceKind: observational
    rqs: [TH04-Q1, TH04-Q4, TH11-Q3]
    issues: [274]
    stance: qualifies
  - id: c3
    text: モデル間のトークン効率差は大きく、同じタスクで Kimi-K2 と Claude Sonnet 4.5 は GPT-5 より平均 150 万トークン以上多く消費した。単価だけでなく消費量で階層の費用差が決まる。
    quote: "models vary substantially in token efficiency: on the same tasks, Kimi-K2 and Claude-Sonnet-4.5, on average, consume over 1.5 million more tokens than GPT-5"
    locator: Abstract(Finding 3)
    quant:
      value: +1.5M tokens avg
      n: 8 models
      design: observational
      population: SWE-bench Verified
    evidenceKind: observational
    rqs: [TH04-Q4]
    issues: []
    stance: qualifies
  - id: c4
    text: モデルは自分のトークン消費を事前に予測できず(相関は最大 0.39)、系統的に過小に見積もる。事前の費用見積りに AI の自己申告を使うのは危うい。
    quote: frontier models fail to accurately predict their own token usage (with weak-to-moderate correlations, up to 0.39) and systematically underestimate real token costs
    locator: Abstract(Finding 5)
    quant:
      value: correlation ≤ 0.39
      n: 8 models
      design: prediction experiment
      population: SWE-bench Verified
    evidenceKind: controlled-experiment
    rqs: [TH04-Q3, TH11-Q3]
    issues: []
    stance: context
