summary: terraform-provider-github の Issue。読めるが管理できないトークンでは、ルールセットの応答から bypass_actors の鍵が欠落し(管理者には空の配列)、プロバイダが欠落と空を区別しないため差分が出続ける。#315 で、env-check がバイパスの主体の欠落を「権限不足で読めない」とし、空(主体なし)と区別する判断の根拠として引いた。
claims:
  - id: c1
    text: 起票者の報告(再現手順つき)によれば、ルールセットを管理できない呼び出し元では、ルールセットの GET の応答から bypass_actors の鍵が欠落し、管理者の呼び出し元では空のときに空の配列が返る。メンテナによる API の挙動の独立の確認は無い。
    quote: 'GitHub omits `bypass_actors` from `GET /repos/{owner}/{repo}/rulesets/{id}` when the caller cannot administer the ruleset. An admin caller gets `"bypass_actors": []` when the list is empty, so a missing key and an empty list mean different things.'
