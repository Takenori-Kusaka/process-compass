summary: 29110 の策定者(WG24)による7件の試行事例の報告。Entry〜Advanced の4段階プロファイルの位置づけと、基本プロファイルの PM/SI 目標(顧客による計画の受入れ、定義済み基準による検証・妥当性確認)を要約している。
claims:
  - id: c1
    text: "ISO/IEC 29110 の Generic Profile Group(critical software を開発しない VSE に適用)は Entry・Basic・Intermediate・Advanced の4プロファイルから成り、世界の VSE の大多数を満たすためのロードマップを示す。Entry は小規模案件(例: 6人月以下)に取り組む VSE と創業期の VSE を、Basic は VSE の単一プロジェクトチームによる単一アプリケーション開発を対象とする。"
    quote: This Profile Group is a collection of four profiles (Entry, Basic, Intermediate, Advanced) providing a roadmap to satisfying a vast majority of VSEs worldwide. VSEs targeted by the Entry Profile are VSEs working on small projects (e.g. at most six person-months effort) and for start-up VSEs.
    locator: §2 THE ISO/IEC 29110 STANDARD FOR VSEs(2.1 の直前の段落)
    quant:
      value: 6 person-months
      n: null
      design: standard definition
      population: Entry profile target
    evidenceKind: normative
    rqs: [TH02-Q1, TH02-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 基本プロファイルの PM 目標は、計画を顧客がレビュー・受入れすること、作業チームと顧客によるレビュー会議を開くことを定める。確認の担い手として社内の独立レビュアではなく顧客を置いている。
    quote: The Project Plan for the execution of the project is developed according to the Statement of Work and reviewed and accepted by the Customer.
    locator: §2.1 PM objectives 1
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [249, 267]
    stance: qualifies
  - id: c3
    text: SI 目標の検証・妥当性確認は「定義済み基準で行う」と規定され、実施者の独立性には触れていない(本論文の要約範囲)。
    quote: Verification and Validation Tasks of all required work products are performed using the defined criteria to achieve consistency among output and input products in each activity.
    locator: §2.1 SI objectives 7
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: []
    stance: qualifies
  - id: c4
    text: 試行企業では、基本プロファイルにない作業は価値がある場合に限り追加し、文書様式も付加価値のない節を載せない方針を取った。
    quote: Regarding processes, the guideline was to add tasks not described in the Basic profile only if they add value to the context and projects of the company
    locator: §3 case study (CSiT)
    quant:
