        note: (1) 『6人月以下』は原文で 'e.g.'(例示)であり、Entry の定義要件ではない。(2) Generic Profile Group は『critical software を開発しない VSE』に適用されると明記されている(ask に無い条件)。(3) Basic は原文どおり 'a single application by a single project team of a VSE'。(4) 『組織の規模・段階に応じてプロファイルを選ぶ設計』は原文の 'roadmap' 表現からの要約・解釈で、同趣旨の直接の一文は無い(Intermediate=複数プロジェクト・複数チーム、Advanced=事業として持続・成長したい VSE)
