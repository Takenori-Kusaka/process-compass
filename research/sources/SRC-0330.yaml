          reason: 4段階と Entry・Basic の対象は抜粋どおり。ただし「6人月以下」は原文では e.g.(例示)で、Entry の定義要件ではない。critical software を開発しない VSE という適用条件も欠けている。「組織の規模・段階に応じてプロファイルを選ぶ設計」は roadmap という表現からの解釈で、同趣旨の直接の記述はないため、roadmap の語に置き換えた。
