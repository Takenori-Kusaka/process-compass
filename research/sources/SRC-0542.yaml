events:
  - date: 2026-09-16
    label: ISO 9001:2026(第6版)発行、ISO 9001:2015 は廃止
summary: 2026-09-16 発行の ISO 9001:2026 箇条 6.3(変更の計画)の解説(二次情報。「発行された本文と 2026-09-27 に照合」と明記)。規格本文は有償で未読。2015 年版の 4 考慮事項(目的と結果、QMS の完全性、資源、責任・権限の割当て)を維持し、変更の伝達・有効性の監視評価・結果のレビューを計画時に決めることが加わったと説明する。対象は QMS の変更で、案件の目的・納期の変更を直接扱う条文ではない。
claims:
  - id: c1
    text: 2026 年版 6.3 は 2015 年版の 4 つの考慮事項を維持し、変更の伝達、有効性の監視・評価の方法、結果のレビュー方法の 3 つを計画時に決める事項として加えたと解説する。
    quote: "Same four considerations, plus three planned up front: communication of the change, how its effectiveness will be monitored and evaluated, and how the results will be reviewed"
    locator: 冒頭 Changed in ISO 9001:2026
    quant: null
    evidenceKind: review
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 2015 年版の時点で、QMS の変更は目的と結果、システムの完全性、資源、責任の 4 点を考慮して計画することが要求されていたと説明する。資源と責任の再割当て(体制)は変更計画の考慮事項に含まれる。
    quote: "2015 already required QMS changes to be planned: purpose and consequences, system integrity, resources, responsibilities."
    locator: Plain-language summary
    quant: null
    evidenceKind: review
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 証跡の例として、変更記録に伝達(誰にどう伝えたか)、有効性確認(実施前に定めた成功の尺度)、日付入りの結果レビューの 3 欄を足した様式を挙げる。変更後の観測と見直しを記録欄として持つ先例(解説者の推奨様式で、規格の要求様式ではない)。
    quote: communication (who was told, how), effectiveness check (the success measure defined before implementation), and a dated review of results.
    locator: Typical evidence
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2, TH07-Q4]
    issues: []
    stance: qualifies
