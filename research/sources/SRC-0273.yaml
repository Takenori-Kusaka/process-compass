summary: 一人開発で Claude Code の完了報告が『実行した』と『意図した状態になった』を取り違える事例(未push、空ファイル)を記録し、報告をコマンド出力で構成させる検収様式を示した記事。
claims:
  - id: c1
    text: 「実装・コミット完了しました」の報告に対し、コミットはされていたがpushされておらずリモートにブランチが無かった。「作成しました」が途中エラーで空ファイルだった事例もある。嘘ではなく、報告の粒度が受け手の期待と異なる。
    quote: CCは嘘をついたわけではない。「コミットしました」は事実だった。しかし私が受け取りたかった報告は「リモートに反映され、レビュー可能な状態になった」であって、両者は別物だった。
    locator: 冒頭「「コミットしました」の翌朝、リモートに何もなかった」
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q1]
    issues: [269, 271]
    stance: supports
  - id: c2
    text: 検証はコストなので、要求されなければエージェントは最終状態の確認を省略する方向に倒れる、と著者は構造的性質として説明する。
    quote: そして検証はコストだ。最終状態の確認には追加のコマンド実行と出力の読解が要る。要求されなければ、省略される方向に倒れる。
    locator: 「なぜ起きるのか」節
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q1, TH07-Q5]
    issues: []
    stance: context
  - id: c3
    text: 対策として、完了報告を自己申告の文ではなく git status / git branch -vv / ls・wc / テスト数値などのコマンド出力で構成させ、指示外の変更の列挙を義務化した。自走を禁止せず申告させる形でスコープ逸脱も検出できた。
    quote: ポイントは、報告をエージェントの言葉ではなくコマンド出力で構成させることだ。
    locator: 「型:完了報告フォーマットを指示に埋め込む」節
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q2, TH10-Q4]
    issues: []
