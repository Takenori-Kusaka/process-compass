summary: '推論モデルの思考の連鎖が、モデルが実際に使った手掛かりを言語化する割合を、6種類の手掛かりで測った研究の要旨。多くの設定で手掛かりの使用を言語化する割合は 1% を超えるが、20% を下回ることが多い。思考の連鎖の監視は望ましくない挙動に気づく手段になりうるが、それだけでは排除できないと述べる。本標準は、AI が書く作業上の選択の理由を、実際の生成の原因の記録でなく作成側の主張として扱う根拠の一つにした(要旨のみを読んだ。思考の連鎖と、変更の記録に書く理由は同じ対象ではない)。'
