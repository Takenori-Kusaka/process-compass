summary: ADR の原典。1決定1ファイル・連番・状態(proposed/accepted/deprecated/superseded)を定め、覆した決定は消さず superseded と印を付けて残すとする。索引と、原則・ポリシーとの分離の規定は本文に無い。
claims:
  - id: c1
    text: 覆した決定は削除せず、superseded と印を付けて残すと定めている。archive を持たず削除する方式は原典の規定と逆向きである。
    quote: If a decision is reversed, we will keep the old one around, but mark it as superseded.
    locator: Decision
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q5, TH05-Q1]
    issues: [272]
    stance: contradicts
  - id: c2
    text: 状態欄は、後の ADR が決定を変更・逆転したとき deprecated または superseded とし、置き換え先への参照を付けるとする。
    quote: If a later ADR changes or reverses a decision, it may be marked as "deprecated" or "superseded" with a reference to its replacement.
    locator: Decision / Status
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q1]
    issues: [251, 272]
    stance: context
  - id: c3
    text: 番号は連番で再利用しない。一覧・索引の作り方は本文に規定が無い(全文を読んだ範囲)。
    quote: ADRs will be numbered sequentially and monotonically. Numbers will not be reused.
    locator: Decision
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q1]
    issues: [272]
    stance: context
  - id: c4
    text: ADR の対象は「アーキテクチャ上重要な」決定に限られ、原則・ポリシーを別の層に置くかどうかには触れていない。
    quote: 'We will keep a collection of records for "architecturally significant" decisions: those that affect the structure, non-functional characteristics, dependencies, interfaces, or construction techniques.'
    locator: Decision
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q1]
    issues: [251]
    stance: context
  - id: c5
    text: proposed / accepted は関係者の合意の有無を表す状態で、承認者・ゲート判定の手続きは定めていない。
    quote: A decision may be "proposed" if the project stakeholders haven't agreed with it yet, or "accepted" once it is agreed.
    locator: Decision / Status
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q2]
    issues: [253]
    stance: context
  - id: c6
    text: 大きな文書は読まれず更新もされないという動機を述べ、仕様書がソースコードよりバイト数で大きかった案件を例に挙げる。測定ではなく経験に基づく記述である。
    quote: Most developers have been on at least one project where the specification document was larger (in bytes) than the total source code size.
    locator: Context
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3]
    issues: [252]
    stance: context
  - id: c7
    text: 根拠は自社の数案件での 8 月初旬からの試用(記事日付 2011-11-15 から換算して約 3 か月半、原文に月数の明記は無い)で、その間に ADR を使う案件を経験した開発者は 6〜10 名である。評価は顧客と開発者の双方からの初期の好意的な感想にとどまる。
    quote: We've been using this format on a few of our projects since early August. ... In that time, we've had six to ten developers rotate through projects using ADRs.
    locator: Experience Report
    quant:
      value: 開発者 6〜10 名
