claims:
  - id: c1
    text: 成果物に導出元などの管理情報を記載して下位から上位の文書への追従性は高くなったが、上位から下位をたどるのが難しく、文書修正時の影響調査に時間がかかる課題が残った。
    quote: その結果、下位のドキュメントから上位のドキュメントをたどれるようになり、上位ドキュメントへの追従性は非常に高く、一定の整合性を担保することができました。一方で、上位ドキュメントから下位のドキュメントをたどることが難しく、ドキュメント修正時の影響調査に時間がかかるなどの課題があります。
    locator: 2．1つ目：ドキュメントを起点に、全体の整合性を保つ
    quant: null
    evidenceKind: case-report
    rqs: [TH08-Q2]
    issues: [255]
    stance: qualifies
  - id: c2
    text: ウォーターフォールの型は変えずにAIエージェントでサイクルを短縮し、半年間で部分的な再実施を含め10回以上V字のサイクルを回した。
    quote: 実際に今回のプロジェクトでは、半年の間に部分的な再実施も含めて10回以上、ウォーターフォール開発のサイクルを回しています。
    locator: 2．3つ目：ウォーターフォールの型は変えず、開発サイクルを高速化する
