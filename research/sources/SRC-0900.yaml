summary: 'JIS Q 9001:2008 と JIS Q 9001:2015 の箇条の対応表(国内委員会の参考訳、全7ページ)。2008 年版の 5.5.1 責任及び権限と 5.5.2 管理責任者は、2015 年版では 5.3 組織の役割,責任及び権限へ対応する。2015 年版の 8.6 製品及びサービスのリリースは、2008 年版の 7.4.3 購買製品の検証と 8.2.4 製品の監視及び測定に対応する。マネジメントレビューは 5.6 から 9.3 へ移った。表は箇条の対応を示すだけで、管理責任者を置くことを求めるかどうかは、表からは読めない。'
