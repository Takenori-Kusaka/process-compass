summary: 'NTT データの品質保証部の技術者による、生成 AI が設計・コーディング・レビュー・テストを担う開発の品質保証の課題の整理(2025-10-16)。見た目は正しくても動かすと失敗する、出力が毎回変わる、生成の経緯を説明しにくい、をリスクに挙げる。バグ検出密度だけでは評価しにくいとして、観点カバレッジや DDP モニタリングを挙げる。生成 AI の出力はたたき台で、最終判断は人間が行う線引きを示す。社内検証の正解率が概ね 60% だったという数値は WebFetch の要約モデルの報告で、原文は未確認。'
