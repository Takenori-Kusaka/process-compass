summary: DORA の5指標(スループット3+不安定性2)の現行定義。不安定性を変更失敗率とデプロイ手戻り率(deployment rework rate)で測ると定め、単一指標化・チーム間競争などの落とし穴を列挙する。手戻り率を外部で比較するときの定義の基準になる。
claims:
  - id: c1
    text: DORA は手戻りを「本番インシデントの結果として生じた計画外デプロイの比率」(deployment rework rate)として定義し、変更失敗率と並ぶ不安定性の指標にしている。
    quote: The ratio of deployments that are unplanned but happen as a result of an incident in production.
    locator: Deployment rework rate の定義
