    label: OpenAI が手書きコード 0 行の社内製品開発(harness engineering)を公開
summary: OpenAI 社内チームが 5 か月間、手書きコード 0 行で製品を作った経験報告。巨大な AGENTS.md の失敗、約 100 行の目次型 AGENTS.md と docs/ への段階的開示、ブロッキングの少ないマージ方針、エージェント間レビューを記す。数値はすべて自己申告。
claims:
  - id: c1
    text: 3 名(のちに 7 名)のエンジニアが Codex を駆動して約 1,500 本の PR を開きマージし、エンジニア 1 人 1 日あたり平均 3.5 本に相当したとする。
    quote: roughly 1,500 pull requests have been opened and merged with a small team of just three engineers driving Codex. This translates to an average throughput of 3.5 PRs per engineer per day
    locator: We started with an empty git repository
    quant:
      value: 約1,500 PR / 3.5 PR/人日
      n: 1 チーム(3→7名)・5 か月
      design: single-team experience report
      population: OpenAI 社内ベータ製品(約100万行)
    evidenceKind: case-report
    rqs: [TH11-Q2, TH10-Q3]
    issues: [273]
    stance: context
  - id: c2
    text: 「巨大な AGENTS.md 1 本」方式は失敗した。文脈を圧迫し、すべてが重要だと何も指示しないのと同じになり、すぐに陳腐化し、機械的に検査できないためである。
    quote: Context is a scarce resource. A giant instruction file crowds out the task, the code, and the relevant docs—so the agent either misses key constraints or starts optimizing for the wrong ones.
    locator: We made repository knowledge the system of record
    quant: null
    evidenceKind: case-report
    rqs: [TH03-Q4, TH03-Q3]
    issues: [269, 274]
    stance: supports
  - id: c3
    text: 約 100 行の短い AGENTS.md を常時注入し、実体は構造化した docs/ に置いて段階的に開示する。知識ベースの鮮度と相互リンクは専用リンタと CI で機械的に検査する。
    quote: A short AGENTS.md (roughly 100 lines) is injected into context and serves primarily as a map, with pointers to deeper sources of truth elsewhere.
    locator: We made repository knowledge the system of record
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH03-Q1, TH04-Q2, TH05-Q1]
    issues: [272]
    stance: supports
  - id: c4
    text: 人は PR をレビューしてもよいが必須ではなく、レビューのほぼすべてをエージェント間に移した。
    quote: Humans may review pull requests, but aren’t required to. Over time, we’ve pushed almost all review effort towards being handled agent-to-agent.
    locator: Redefining the role of the engineer
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q3, TH01-Q3]
    issues: [258]
    stance: context
  - id: c5
    text: エージェントの処理量が人の注意を大きく上回る環境では、ブロッキングするマージゲートを最小にし、flaky なテストは再実行で済ませる方が合理的だとする。低スループット環境では無責任だとも明記する。
    quote: The repository operates with minimal blocking merge gates. Pull requests are short-lived. Test flakes are often addressed with follow-up runs rather than blocking progress indefinitely.
    locator: Throughput changes the merge philosophy
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q4, TH10-Q3]
    issues: [267, 273]
    stance: qualifies
  - id: c6
    text: エージェントは既存の不揃いなパターンも複製するため、当初は毎週金曜(週の 20%)を「AI slop」の掃除に費やしたが拡張できず、原則をリポジトリへ符号化し定期的な清掃タスクに置き換えた。
    quote: Our team used to spend every Friday (20% of the week) cleaning up “AI slop.” Unsurprisingly, that didn’t scale.
    locator: Entropy and garbage collection
    quant:
      value: 週の20%
      n: 1 チーム
      design: self-report
      population: OpenAI 社内チーム
    evidenceKind: case-report
    rqs: [TH07-Q3, TH11-Q3]
    issues: [270]
    stance: context
  - id: c7
    text: エンドツーエンドの自律動作はこのリポジトリ固有の構造と投資に強く依存し、同等の投資なしに一般化できると仮定すべきでないと著者自身が留保する。
    quote: This behavior depends heavily on the specific structure and tooling of this repository and should not be assumed to generalize without similar investment—at least, not yet.
    locator: Increasing levels of autonomy
