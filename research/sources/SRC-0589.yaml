summary: PR の作法を CI 上の規則(Dangerfile)で検査する OSS の公式サイト。出力を message / warn / fail の3水準に分け、PR 本文・題名に `#trivial` と書けば CHANGELOG の検査を外せる例を載せる。published はサイトに日付が無いため最新リリース日を記した。
claims:
  - id: c1
    text: Danger のコード例は message・warn・fail・markdown の4関数を示す。message と warn は PR 上の表へ追加され、fail は blocking を宣言し、markdown は表の下に表示される。
    quote: import { message , warn , fail , markdown } from "danger" // Add a message to the table message (...) // Adds a warning to the table warn (...) // Declares a blocking fail (...)
    locator: How does it work?(コード例)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4, TH07-Q2]
    issues: [271]
    stance: supports
  - id: c2
    text: 公式の例は、PR 本文か題名に `#trivial` の文字列があれば CHANGELOG 必須の検査を免除する。本文中の決まった文言による opt-out を機械判定する先例である。
    quote: const isTrivial = (danger.github.pr.body + danger.github.pr.title).includes("#trivial")
    locator: What does this Look like? / Enforce changelogs
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c3
    text: 同じ例で、CHANGELOG の欠落は fail ではなく warn で返している。体裁に当たる検査を警告に留める書き方が公式の既定例になっている。
    quote: warn("Please add a changelog entry for your changes.")
    locator: What does this Look like? / Enforce changelogs
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4, TH07-Q2]
    issues: [271]
    stance: supports
  - id: c4
    text: Danger の目的は、チームの決まりごとを規則として書き、人がより難しい問題を考えられるようにすることだと説明されている。
    quote: You can use Danger to codify your teams norms. Leaving humans to think about harder problems.
    locator: What is Danger JS?
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4]
    issues: [271]
    stance: context
