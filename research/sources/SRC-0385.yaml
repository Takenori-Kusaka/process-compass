summary: 新潟の業務システム開発会社 OMN のプレスリリース(2026-05-08)。Claude Code が Excel 設計書の階層を誤認したため、2026年4月までに主要設計書を Markdown に移した。トークン消費は約1/10(自社試験の推計)。Markdown を正本とし、人向けには AI で HTML を書き出す。
