summary: Anthropic 公式ヘルプの Enterprise プラン説明(取得時「Updated over 4 weeks ago」、2026-09-30 取得)。Enterprise は席料が利用を含まず、全利用を標準 API 単価で別課金する。席ごとの利用上限も同梱トークンも無い。企業向けでは「定額か従量か」の選択肢自体が無く、上限枯渇による停止の代わりに支出上限の設定が統制手段になる。
