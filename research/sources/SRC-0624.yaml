summary: NRI の AI 担当役員による投資家向け説明資料。「NRI自身のAI変革」の部(p.14-19)を読んだ。AI 駆動開発を開発プロセスモデルへ段階的に組み込む計画と適用率目標を示すが、値は目標と試算で実績ではない。
claims:
  - id: c1
    text: 自社の主戦場である大規模・ミッションクリティカルなシステム開発を、AI による自動化が難しい領域と位置づけている。公開されている AI 活用事例の多くは小規模・ノンクリティカルの領域だとする。
    quote: NRIが主に取り組む大規模・ミッションクリティカルなシステム開発は、AIによる自動化が難しい領域
    locator: NRIのシステム開発領域の特徴(p.15)
    quant: null
    evidenceKind: expert-opinion
    rqs: [BASE-Q2, TH12-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: 非機能要件の整備・実装と複雑な合意形成は汎用 AI だけでは実現が困難とし、プロジェクト管理・アーキテクチャ管理・品質管理をその例に挙げる。
    quote: 大規模・ミッションクリティカルなシステム開発に重要な非機能要件の整備・実装や複雑な合意形成は汎用AIのみでは実現が困難
    locator: NRIのシステム開発領域の特徴(p.16)
    quant: null
    evidenceKind: expert-opinion
    rqs: [BASE-Q2, TH01-Q3]
    issues: []
    stance: qualifies
  - id: c3
    text: 開発プロセスモデルは、AI エージェントが母体コードを一括開発した後に、人と AI による確認と整備の工程を置く。冒頭には AI 活用開発の標準化・環境整備という AI 特有の準備工程を置く。
    quote: AIによるプログラム一括生成後に人とAIによる確認と整備
    locator: NRI エンタープライズAI駆動開発(イメージ) Point②(p.17)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q3, BASE-Q2, TH12-Q2]
    issues: []
    stance: supports
  - id: c4
    text: 変革ステップは3段階で、最終段(STEP3-②)は工程を「要件定義＆仕様作成」「AIエージェントによる開発～テスト」「受け入れ確認＆テスト」に統合する。工数削減率は図の配置から STEP1・2 が15%、STEP3-① が30%、STEP3-② が50%と読めるが、FY30 に向けた最大値の試算である。
    quote: ＊プロジェクト全体の工数に対する削減率（FY30にむけた最大値（試算値））
    locator: エンタープライズAI駆動開発の変革ステップ(イメージ)(p.18)
    quant:
      value: 工数削減 15% / 30% / 50%(段階別)
      n: null
      design: 自社の試算(FY30 に向けた最大値。実績値ではない)
      population: NRI のシステム開発プロジェクト全体の工数
    evidenceKind: expert-opinion
    rqs: [BASE-Q2, TH11-Q2]
    issues: []
    stance: context
  - id: c5
    text: 展開計画は、汎用 AI ツール活用を2028年度に適用率100%、AI 最適化工程ベースの AI エージェント型開発を2030年度に適用率100%とする。先に金融 ASP で実績を作り、SI 向けモデルへ広げる順序である。
    quote: （30年度適用率100%）
    locator: エンタープライズAI駆動開発の展開(p.19)
    quant:
      value: "適用率100%(汎用AIツール: 28年度、AIエージェント型開発: 30年度)"
      n: null
      design: 自社の目標値
      population: NRI のシステム開発
    evidenceKind: expert-opinion
    rqs: [BASE-Q2, TH02-Q4]
    issues: []
