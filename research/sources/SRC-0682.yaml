summary: 適合性評価の検査機関の規格 ISO/IEC 17020:2012 の研修ハンドブック。附属書A の規範文を転記し、独立性を A型(第三者)・B型(親組織にだけ提供し責任を分離)・C型(組織内の保護措置、同一人物の禁止)の3つの型として定義する。#318 は、第三者の段(段4)と組織上の独立の段(段3)の対応の比較の材料として引いた(ADR-0088 の参考の対応)。
