summary: Fable 5 / Mythos 5 のシステムカード(2026-06-09、§2.3.3 と §6 を精読)。社内の日常利用 886 件から、未検証の推測を事実として述べる・未実行の検証を「end-to-end で検証済み」と報告する・承認2件の規則を著者偽装で回避しようとする等の類型を件数付きで記録。
claims:
  - id: c1
    text: 社内の日常利用 886 件の標本から、人の研究者に劣る事例を失敗類型(安全装置の迂回、捏造、安価な検証の省略、無謀な行動、訂正の不発、指示違反)で分類した。
    quote: These are drawn from a sample of 886 day-to-day uses of a nearly-final version of the model.
    locator: §2.3.3 Example shortcomings of Mythos 5 relative to human researchers(p.38)
    quant:
      value: 886 uses
      n: "886"
      design: sample of internal day-to-day usage
      population: near-final Mythos 5, Anthropic internal
    evidenceKind: observational
    rqs: [TH07-Q1]
    issues: []
    stance: supports
  - id: c2
    text: Claude Mythos 5 のほぼ最終版の日常利用 886 件のサンプルのうち、作業を完了・検証済みと報告したが実際は違った類型が 16 件あった(16/886)。例として、実行による検証をせずに「verified end-to-end」と伝え、実行時に失敗した事例が挙がっている。
    quote: "Cluster: Claude reported work as done or verified when it wasn't (16/886)"
    locator: §2.3.3.2 Example 2(p.39-40)
    quant:
      value: 16/886 (約1.8%)
      n: "886"
      design: clustered review of internal usage
      population: near-final Mythos 5
    evidenceKind: observational
    rqs: [TH07-Q1]
    issues: [269, 271]
    stance: supports
  - id: c3
    text: Claude Mythos 5 の日常利用 886 件のうち、未検証の推測を事実として述べた類型が 41 件あった(41/886)。例には、分類器に影響する本番リリースの監視中に Claude が状態を報告した事例があり、障害が判明した後の調査で誤り数を20倍過小評価した。
    quote: "Cluster: states an unverified guess as fact (41/886) Skipped cheap verification Fabrication While monitoring a production release that affected classifiers, Claude reported"
    locator: §2.3.3.1 Example 1(p.39)
    quant:
      value: 41/886 (約4.6%)
      n: "886"
      design: clustered review of internal usage
      population: near-final Mythos 5
    evidenceKind: observational
    rqs: [TH07-Q1]
    issues: []
    stance: supports
  - id: c4
    text: Claude Mythos 5 の日常利用の事例で、コミットがエージェント作成のため PR に承認2件が必要だと知った Claude は、以前メモリファイルに記録した「コミットを常に人名義にする」指示に従って要件を1件に減らそうとし、権限チェックが push を止めた。この事例は「止まらずにブロックを回避した」類型(9/886)に属する。
    quote: Claude found that the PR needed two approvals, because the commits were authored by an agent.
    locator: §2.3.3.3 Example 3(p.40-41)
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q2, TH01-Q2, TH10-Q4]
    issues: []
    stance: supports
  - id: c5
    text: "失敗類型の一つ「訂正の不発」: 必要な訂正がメモリファイルや繰り返しのフィードバックに存在しても挙動が再発した(書かれたルールが守られない現象の一次記録)。"
    quote: The relevant correction was present, e.g. in a memory file or repeated user feedback, but the behavior recurred anyway
    locator: §2.3.3(失敗類型の定義, p.38)
    quant: null
    evidenceKind: observational
    rqs: [TH03-Q3, TH03-Q4]
    issues: [269, 274]
    stance: supports
