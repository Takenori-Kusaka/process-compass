summary: 熟練 OSS 開発者16人・246タスクをタスク単位で無作為化した RCT。AI許可で完了時間が19%延び、本人は20%短縮したと認識していた。個人の体感と実測の乖離を示す原典。
claims:
  - id: c1
    text: AIを許可したタスクは完了時間が19%長くなった(AIが遅くした)。
    quote: Surprisingly, we find that allowing AI actually increases completion time by 19%--AI tooling slowed developers down.
    locator: Abstract
    quant:
      value: +19% completion time
      n: 16 developers, 246 tasks
      design: RCT (task-level randomization)
      population: experienced OSS developers on mature repos, Feb–Jun 2025, Cursor Pro + Claude 3.5/3.7 Sonnet
    evidenceKind: rct
    rqs: [TH11-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 開発者は研究終了後も、AIで完了時間が20%短縮したと推定しており、体感と実測が逆向きだった。
    quote: After completing the study, developers estimate that allowing AI reduced completion time by 20%.
    locator: Abstract
    quant:
      value: perceived -20% vs measured +19%
      n: 16 developers
      design: RCT + post-study self-estimate
      population: same as above
    evidenceKind: rct
    rqs: [TH11-Q2]
    issues: []
    stance: supports
