summary: Spec Kit の沿革。Specify→Plan→Tasks→Implement から、拡張・プリセット・ワークフローで工程を組み替える harness へ移行し、1.0.0 に至った経緯と、コミュニティカタログが監査を意味しないことを記す。
claims:
