    text: コミュニティカタログへの掲載はコンポーネントを見えるようにするだけで、そのコードが監査・推奨されたことを意味しない。スキル/拡張の供給網リスクに対する公式の立場。
    quote: A catalog listing made a component visible, but did not mean its code had been audited or endorsed.
    locator: "June–July 2026: Composing and applying the primitives"
