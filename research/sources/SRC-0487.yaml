summary: AI Act 原文の第14条(人間による監視)と第26条(導入者の義務)。監視は「自然人が効果的に監督できる」設計を提供者に課し、導入者に権限と能力を持つ自然人への割当てを課す。Annex III の高リスクへの適用は Digital Omnibus により 2027-12-02 からに延びた。
claims:
  - id: c1
    text: 高リスク AI は、適切なヒューマンマシンインタフェースを含め、使用期間中に自然人が効果的に監督できるよう設計・開発されなければならない(提供者側の設計義務)。
    quote: High-risk AI systems shall be designed and developed in such a way, including with appropriate human-machine interface tools, that they can be effectively overseen by natural persons
    locator: Article 14(1)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q1]
    issues: []
    stance: context
  - id: c2
    text: 導入者は、必要な能力・訓練・権限と支援を備えた自然人に人間による監視を割り当てなければならない。監視という役割そのものは自然人が担うことを明示している(他の役割を人が占めることまでは述べていない)。
    quote: Deployers shall assign human oversight to natural persons who have the necessary competence, training and authority, as well as the necessary support.
    locator: Article 26(2)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: []
    stance: qualifies
  - id: c3
    text: 遠隔生体識別(Annex III 1(a))では、識別結果に基づく行動・決定の前に、能力・訓練・権限を持つ2人以上の自然人による個別の確認を要求する(二者確認の規定)。
    quote: unless that identification has been separately verified and confirmed by at least two natural persons with the necessary competence, training and authority
    locator: Article 14(5)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q1]
    issues: []
    stance: context
