summary: OSS エージェント OpenHands の SDK のセキュリティ設計。操作ごとに LOW/MEDIUM/HIGH/UNKNOWN のリスクを付け、確認ポリシー（AlwaysConfirm/NeverConfirm/ConfirmRisky）で人の確認要否を決める。既定のリスク評価は行為者の LLM 自身が付与する。
claims:
  - id: c1
    text: 既定の LLMSecurityAnalyzer は、操作を生成する LLM 自身がツール呼び出しの引数としてリスク水準を付け、別の分析呼び出しを行わない。行為者による自己申告のリスク評価で確認要否が決まる構成であり、評価の独立性はない。
    quote: The LLM reasons about risk in context when generating the action, eliminating the need for a separate security analysis call.
