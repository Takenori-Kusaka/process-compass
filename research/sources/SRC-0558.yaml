summary: AI 生成の成果物を受け取る側の負荷を測った調査の要約ページ(2025-09 実施、n=1,150)。40% が前月に受領し、1件の処理に平均約2時間と報告する。対象は業務文書一般でソフトウェア文書に限らず、時間は自己申告。詳細は HBR 2025-09-22 の記事(本文は有料壁で未読)。
claims:
  - id: c1
    text: 米国のフルタイムのデスクワーカー 1,150 名への調査で、40% が前月に「見た目は整っているが中身の無い AI 生成物」を受け取り、1件の解消に平均約2時間かかったと答えた。読む側の負荷を測った数少ない値だが、自己申告の見積もりである。
    quote: Insights are based on an online survey of 1,150 full-time U.S. desk workers conducted in September 2025 by BetterUp in partnership with the Stanford Social Media Lab.
    locator: The Hidden Costs of Workslop(注記)
    quant:
      value: 受領 40%、1件あたり平均 2 時間、1人あたり月 186 ドル
      n: 1,150
      design: オンライン調査(自己申告)。費用は回答者の申告給与からの換算
      population: 米国のフルタイムのデスクワーカー、2025-09
    evidenceKind: survey
    rqs: [TH05-Q3]
    issues: [252]
    stance: supports
  - id: c2
    text: 対象に挙げる形は、体裁の良いスライド、長い報告書、切り詰めすぎた要約、文脈の無いコードである。
    quote: It creates the illusion of progress – slick slides, lengthy reports, overly tightened summaries, or code without context.
    locator: Workslop is AI-generated content that looks good, but lacks substance.
    quant: null
    evidenceKind: survey
    rqs: [TH05-Q3]
    issues: [252]
    stance: context
  - id: c3
    text: 負荷は読む時間だけでなく、考える作業と後始末が受け手へ移ることだと説明している。
    quote: Rather than saving time, it leaves colleagues to do the real thinking and clean-up.
    locator: Workslop is AI-generated content that looks good, but lacks substance.
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3]
    issues: [252]
