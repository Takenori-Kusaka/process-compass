summary: 104 職種・844 タスクについて労働者 1,500 人と AI 専門家の評価を集めた WORKBank と Human Agency Scale(H1〜H5)。135 メモの数値(1,500/104/844、45.2%、26.9%、47.5%、4 象限、スキル移行、改訂日)はすべて原典どおり。開発職は専門家評価で「Computer Programmers」が H1 支配的な 16 職種の例として挙がるが、労働者側の希望分布は Figure 10(画像)のみで本文テキストから抽出できない。
