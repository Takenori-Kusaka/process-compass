        note: 全文の後半は「…appeal and override, decommissioning, incident response, recovery, and change management.」(200字に収めるため引用を途中で切った)。ask は列挙の先頭「利用者その他の AI Actors からの入力を収集・評価する仕組み」を省いている。原文は「計画が実施されている(are implemented)」で、計画に含めるよう求める、という向きとは少し異なる
