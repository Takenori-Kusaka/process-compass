summary: IPA の年次 DX 動向調査(2026-04-17〜06-12、国内 1,799 社)の速報。AI 導入は大企業中心に広がるが効果は業務効率化・迅速化が中心で、期待どおり以上の効果は限定的。企業価値創出につながる DX 成果は低いまま変化なし。企画・新規事業への AI 活用が主流でないことを示す公的データ。
claims:
  - id: c1
    text: AI 導入は広がるが、期待どおり・期待以上の効果の割合は限定的で、利用用途・効果は業務効率化・迅速化が中心。新価値創出(企画・新規事業)への展開は限定的。
    quote: AI導入は大企業を中心に広がり、多くの企業で効果が実感されているものの、期待どおりや期待以上の効果の割合は限定的です。またAIの利用用途や効果の具体的な内容は業務効率化・迅速化が中心となっています。
    locator: 概要
    quant:
      value: 割合は速報本文に未記載(報告書側)
      n: 1,799社
