summary: NASA Ames の技術者が DO-178C・DO-278A・DO-330 ほか補足文書の内容を解説した論文(全文を読んだ)。DO-178C 本文は有償で未読のため、規格の要求は本論文の記述を介した二次情報である。双方向トレーサビリティの 6 組、検証工程の確認項目、ツール認定水準(TQL)と独立性の関係を述べる。
claims:
  - id: c1
    text: DO-178C は 6 組(システム要求と上位要求、上位要求と下位要求、下位要求とソースコード、要求とテストケース、テストケースと手順、手順と結果)の双方向トレーサビリティを求め、両方向で検証可能なトレースデータの存在を要求する。
    quote: traceability needs to be verifiable in both directions and that verifiable trace data between these entities must exist.
    locator: §III.C Bi-directional Software Traceability
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
  - id: c2
    text: 双方向トレーサビリティの目的は、孤立したソースコードやデッドコードが意図せず作られないことを保証する点にあると説明される。
    quote: This assures that orphan source code and dead source code are not inadvertently produced.
    locator: §III.C
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
  - id: c3
    text: DO-178C §6 の検証項目は、「コードが下位要求を正しく満たすこと」と「全コードが 1 つ以上の下位要求へ追跡できること」を別の項目として挙げる。内容の判定と対応の判定が並置されている。
    quote: 6) the software code correctly satisfies all low-level requirements, 7) all code is traceable to one or more low-level requirements
    locator: §II.D Software Verification Process
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
  - id: c4
    text: DO-178C は、ソフトウェアを生成するツールと検証するツールの双方について、ツール自体の正しさの検証(認定)を求め、あるプロジェクトで認定されたツールが別のプロジェクトで認定済みとは限らないとする。
    quote: DO-178C states that the tools used to generate software or to verify software must themselves be verified to be
    locator: §III.E Tool Qualification Levels
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c5
    text: DO-330 は、コードを生成するツールに、コードを検証するツールより厳しい検証要求を課す。
    quote: DO-330 places more stringent verification
    locator: §VI.A Tool Qualification Levels
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c6
    text: DO-330 附属書 A では、独立性をもって満たすべき目標が TQL-1 で最も多く、TQL-3 は品質保証活動を除き検証の独立性を要求しない。ツールにも水準別の独立性が課される。
    quote: also has the most objectives requiring satisfaction by independence.
    locator: §VI.B Tool Verification Activities
    quant: null
