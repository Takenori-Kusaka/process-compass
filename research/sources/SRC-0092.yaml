summary: CoSAI(Cisco, ServiceNow, Intel, Meta, Anthropic, IBM 等が参加)の AI 共有責任フレームワーク(AI SRF)の紹介。5層の各構成要素に責任者を一つずつ割り当て、エージェントの自律度分類ごとに説明責任の要件を対応づける。自律度が上がるほど責任はエンドユーザーから開発者・基盤提供者へ移る。
claims:
  - id: c1
    text: AI SRF はエージェントの自律度を「情報提供のみ」から「人の監視なしに領域横断の判断」まで分類し、各レベルに説明責任の要件を対応づける。
    quote: The framework includes a classification of agent autonomy levels, from systems that only provide information to those capable of making cross-domain decisions without human oversight, and maps accountability requirements to each level.
    locator: 本文
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH01-Q1]
    issues: [248, 249]
    stance: qualifies
  - id: c2
    text: 自律度が上がるほど責任はエンドユーザーからアプリケーション開発者・エージェント基盤提供者へ移る。高自律エージェントの展開には契約上の責任条項・介入能力の文書化・リスクに比例した証拠要件が要る。
    quote: As autonomy increases, responsibility shifts from end users toward application developers and agentic platform providers.
