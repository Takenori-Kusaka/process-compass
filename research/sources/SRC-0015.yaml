summary: 254 メモが Wharton 報告に帰した「MMLU 71.6% → 68.0% → 66.3%」の実際の出典。USC の 3 名による 6 オープンモデル(Qwen2.5-7B ほか)・12 persona の調査で、専門家 persona は MMLU 等の事前学習依存課題で精度を下げ、文体・安全性などの整合課題では改善すると報告。
