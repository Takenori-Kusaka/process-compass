summary: Yahoo!オークション・フリマの商品パトロールへのAI導入で、審査効率は約26〜50倍になったが人の業務時間は同様には減らなかった報告。人が最後に全件確認する構造(HITL)が制約と結論し、AIだけで完結する領域を設計する方針に転じた。
claims:
  - id: c1
    text: 審査効率(審査した商品のうち措置につながった割合)は、クエリ時代を1とする指数でAIフィルター全体で約26倍、AIプレ審査導入カテゴリで約50倍に向上した(母数は非開示)。
    quote: 審査した商品のうち、実際に削除などの措置につながった割合を「審査効率」とすると、クエリ時代を1とする指数で、AIフィルターの対象全体では約26倍、AIプレ審査を導入したカテゴリでは約50倍まで向上しました。
    locator: AI導入の成果
    quant:
      value: 約26倍 / 約50倍(指数)
      n: 非開示
      design: 社内指標の前後比較(定義は開示・母数は非開示)
      population: Yahoo!オークション・Yahoo!フリマの商品パトロール
    evidenceKind: expert-opinion
    rqs: [TH11-Q2]
    issues: []
    stance: context
  - id: c2
    text: しかし業務時間は審査効率ほど減らず、判断の難しい商品の比率が上がって1件あたりの判断負荷が増え、人が最後にすべてを確認する構造そのものは変わらなかった。
    quote: つまり、AIによる支援が進んでも、人が最後にすべてを確認する業務構造そのものは変わりませんでした。
    locator: Human-in-the-loopの限界
    quant: null
    evidenceKind: case-report
    rqs: [TH11-Q2, TH01-Q1]
    issues: []
    stance: contradicts
  - id: c3
    text: AIに判断を委ねる領域の設計では、精度だけでなく判断権限と責任の分担、誤り時のリカバリーまで前後のフローを含めて設計する必要があるとする。影響の大きい領域は人の判断として残す。
    quote: AIの精度を確認するだけでなく、そもそもどの領域をAIの判断に委ねるのか、判断権限と責任をどう分担するのか、誤りが生じた場合にリカバリーできるのかなど、パトロール業務だけでなくその前後のフローも含めて設計する必要があります。
    locator: AI-Readyな業務設計への転換
    quant: null
    evidenceKind: case-report
    rqs: [TH01-Q1, TH01-Q2]
    issues: [248]
    stance: supports
  - id: c4
    text: 人とAIの判断が食い違ったケースを基準に照らして検証したところ、AIの誤りではなく人の見落としだったケースもあった。
