summary: AIDev データで同じ人間レビュアを追跡し、AI エージェントの PR を見慣れるほど承認率が上がり、インラインコメントが 22% 減ることを示した。著者は因果を主張せず、慣れ(habituation)と整合的とする。
claims:
  - id: c1
    text: 400 人の反復レビュアの 11,429 件のレビューで、エージェント PR の経験が増えるほど承認率が有意に上がり(経験十分位で +14.5pt)、変更要求率が下がった。インラインコメント量は 22% 減り、待ち時間は 3.5 倍に延びた。
    quote: we observe a statistically significant increase in approval rates (+14.5 pp across experience deciles) and a corresponding decline in change-request rates.
    locator: Abstract
    quant:
      value: 承認率 +14.5pt、インラインコメント -22%(ρ=-0.556)、待ち時間 3.5倍
      n: 反復レビュア 400 人 / 11,429 レビュー(207 日)
      design: longitudinal within-reviewer observational
      population: AIDev の AI エージェント PR(Copilot、Devin、Codex CLI、Cursor、Claude Code)
    evidenceKind: observational
    rqs: [TH06-Q4, TH11-Q3]
    issues: [268]
    stance: supports
  - id: c2
    text: この変化は暦ではなく経験に連動し、エージェント PR に固有である。同じリポジトリ・同じ期間の人間 PR では承認率が下がっている。
    quote: agent-specific (human PR approval rates decline over the same period in the same repositories)
