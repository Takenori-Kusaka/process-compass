summary: Spotify の一部チームの ADR 運用記事(2020-04-14)。合意は RFC・設計レビューで取り、ADR はその結論を残す記録と位置づける。小さな決定も含め「ほぼ常に書く」とし、効果は観察の記述で数値は無い。
claims:
  - id: c1
    text: 合意形成の場は設計レビュー・アーキテクチャレビュー・RFC で、ADR はそれらが終わった後に決定を残す手段として置かれている(ADR 自体は審査の対象ではない)。
    quote: We have system design reviews, architecture reviews, and RFCs to facilitate agreements on an approach or implementation.
    locator: Proposing large changes
    quant: null
    evidenceKind: case-report
    rqs: [TH05-Q2]
    issues: [253]
    stance: context
  - id: c2
    text: 大きな変更の手順は「RFC を書く → RFC が結論に達する → ADR を書く」である。
    quote: Did my RFC conclude with a solution?
    locator: Proposing large changes (手順 5〜7)
    quant: null
    evidenceKind: case-report
    rqs: [TH05-Q2]
    issues: [253]
    stance: context
  - id: c3
    text: 書く基準は「ほぼ常に」で、小さな決定も対象にする。本数を抑える方針は示していない。
    quote: When should I write an Architecture Decision Record? Almost always!
    locator: Let’s roll it up into a diagram!
    quant: null
