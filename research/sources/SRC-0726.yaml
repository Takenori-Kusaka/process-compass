summary: 'フリーランス・事業者間取引適正化等法の全文(e-Gov 法令検索の API で取得)。#436 は、第8章「計算資源の負担を決める」の外部の制約の注記で、法律の名称と条番号(第2条第1項、第3条、第5条第1項第5号)を示すためだけに引いた。条文の文言は本文に引かない(内容は解釈ガイドライン SRC-0727 から引く)。'
claims:
- id: c1
  text: 特定受託事業者の定義は第2条第1項に置かれる。
  quote: この法律において「特定受託事業者」とは、業務委託の相手方である事業者であって、次の各号のいずれかに該当するものをいう。
  locator: 第二条第一項
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 436
  stance: context
- id: c2
  text: 給付の内容・報酬の額などの明示は第3条に置かれ、業務委託事業者が負う。
  quote: 業務委託事業者は、特定受託事業者に対し業務委託をした場合は、直ちに、公正取引委員会規則で定めるところにより、特定受託事業者の給付の内容、報酬の額、支払期日その他の事項を、書面又は電磁的方法(電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であって公正取引委員会規則で定めるものをいう。以下この条において同じ。)により特定受託事業者に対し明示しなければならない。
  locator: 第三条第一項
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 436
  stance: context
- id: c3
  text: 購入・利用強制の禁止は第5条第1項第5号に置かれる。
  quote: 五 特定受託事業者の給付の内容を均質にし、又はその改善を図るため必要がある場合その他正当な理由がある場合を除き、自己の指定する物を強制して購入させ、又は役務を強制して利用させること。
  locator: 第五条第一項第五号
