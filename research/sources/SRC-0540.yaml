  - id: c1
    text: 「AI を職務分離の統制の二者の一方に数えてよいか」という問いに、場合によると答える。許容・禁止の二択ではなく、統制の目的で分ける立場。
    quote: "Can we count AI as one of the two parties in a segregation of duties control? The honest answer is: it depends."
    locator: 4. Segregation of Duties
