summary: 決算業務ソフトのベンダーによる SOX 実務者向けブログ。「AI を職務分離の二者の一方に数えてよいか」を直接問い、目的が正確性の二重確認なら AI が担い得るが、不正抑止(二人の相互責任)なら人 2 名が必要と答える。根拠は筆者の見解で、監査基準の引用は無い。
