summary: Cursor Bugbot の公式文書(日付表記なし、2026-09-30 取得)。指摘は説明と修正案を伴うコメントで、再現手順・実行結果の必須化は書かれていない。指摘があっても CI の結論は既定で neutral(マージを止めない)。レビュー規則は 1 本 30,000 字・合計 100,000 字で打ち切られ、学習規則はチームの活動に応じて自動で有効・無効が切り替わる。
claims:
  - id: c1
    text: Bugbot は差分を解析し、説明と修正案を付けたコメントを残す(再現手順・実行結果を必須とする記述は無い)。
    quote: Bugbot analyzes PR diffs and leaves comments with explanations and fix suggestions.
    locator: How it works
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6, TH06-Q4]
    issues: []
    stance: qualifies
  - id: c2
    text: 指摘があっても既定の結論は neutral で、ステータスを必須にするだけではマージは止まらない。未解決の指摘で失敗させるのは別設定(AI レビューの指摘を既定では警告に留める先例)。
    quote: Requiring the status alone does not block merges on findings because findings default to `neutral`.
    locator: CI check statuses
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH07-Q2, TH06-Q6]
    issues: []
    stance: supports
  - id: c3
    text: レビューに渡す規則は 1 本 30,000 字で打ち切り、合計 100,000 字が上限で、超えた分は省かれうる。
    quote: Each rule is truncated at 30,000 characters when included in a review. The combined rules Bugbot includes for a review are capped at 100,000 characters.
    locator: Rules / Rule limits
    quant:
      value: 30,000 characters per rule; 100,000 characters combined
      n: none (product limit)
      design: product specification
      population: Bugbot review rules
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2, TH03-Q4]
    issues: []
    stance: supports
  - id: c4
    text: 学習規則は、そのリポジトリでのチームの GitHub 上の活動から自動生成されるか、リポジトリの履歴からの手動バックフィルで作られ、Cursor がチームの活動を学ぶにつれて自動で有効化・無効化する。学習は組織・リポジトリ単位で有効にする設定が前提で、PR 上の `@cursor remember [fact]` による人手の追加経路もある。
    quote: Rules are generated automatically from your team's activity on GitHub for that repository or by manually backfilling from the history of the repository.
    locator: Rules > Repository rules > Learned rules
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q4]
    issues: []
    stance: context
  - id: c5
    text: 既定では前回の Bugbot レビュー以降の変更だけを見る(増分レビュー)。
    quote: By default, Bugbot reviews only the changes since the previous Bugbot review.
    locator: Incremental reviews
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q4]
    issues: []
    stance: context
