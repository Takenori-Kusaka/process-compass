claims:
  - id: c1
    text: 安定した長いシステムプロンプトを持つアプリでは、プロンプトキャッシュでキャッシュ部分の入力費用を 80〜90% 削減できる、と FinOps Foundation が削減レバーとして整理する。
    quote: For applications with stable, lengthy system prompts, enabling prompt caching can reduce input token costs by 80 to 90% for the cached portion.
    locator: "Optimization Levers: Prompt Caching"
    quant:
      value: -80〜90%(cached portion)
      n: null
      design: framework guidance
      population: SaaS model provider APIs
    evidenceKind: expert-opinion
    rqs: [TH04-Q1]
    issues: [274]
    stance: supports
  - id: c2
    text: 推奨する単位費用指標は、呼び出し当たり・利用者月当たり・成功アウトカム当たり・業務トランザクション当たりの 4 つ。失敗・破棄された実行は完了ではなく費用として数える。ロール別の消費配分を成果に結び付ける指標設計の先例。
    quote: "Cost per successful outcome: total cost of a multi-step process, counting only the runs whose output clears the quality floor for that workload. Failed and discarded runs are cost, not completions."
    locator: Recommended Unit Cost Metrics
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q3, TH04-Q1]
    issues: [274]
    stance: context
  - id: c3
    text: トークンは「請求単位であって価値単位ではない」。従来の予算ツールでは扱いにくく、開発者がクレジットカードで作った API アカウントから始まるため調達部門に見えない、と課題を整理する。
    quote: The token is the billing unit, not the value unit.
    locator: Executive Summary
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH04-Q3, TH11-Q3]
    issues: []
    stance: context
