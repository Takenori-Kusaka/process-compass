summary: JUAS「企業IT動向調査2026」(経産省監修、東証上場企業等4,500社の IT 部門長に依頼し957社が回答、2025年9〜10月)の AI 活用速報。言語系生成AIの導入済みは33.9%、コード系生成AIの導入・試験導入は32.6%。導入率の統計であり、効果の測定値は含まない。
claims:
  - id: c1
    text: 言語系生成AIを「導入済み」は回答企業の33.9%、試験導入・準備中を含めると53.4%だった。
    quote: 「言語系生成AI」を「導入済み」の割合は回答企業の33.9％、「試験導入中・導入準備中」を含むと全体の53.4％に達しました。
    locator: ■生成AIは「実証」から「定着」へ
    quant:
      value: 33.9% / 53.4%
      n: 957 companies (of 4,500 invited)
      design: web questionnaire to IT department heads, 2025-09-05〜10-24
      population: TSE-listed and equivalent companies
    evidenceKind: survey
    rqs: [TH12-Q2]
    issues: []
    stance: context
  - id: c2
    text: コード系生成AIの導入・試験導入は32.6%で、前年度から10ポイント以上伸びた。
    quote: 「画像および動画系生成AI」の導入・試験導入が34.2％、「コード系生成AI」が32.6％と、それぞれ前年度から10ポイント以上の大きな伸びを示しました。
    locator: ■生成AIは「実証」から「定着」へ
    quant:
      value: 32.6% (code-gen AI adopted or trial)
      n: 957 companies
      design: web questionnaire
      population: TSE-listed and equivalent companies
    evidenceKind: survey
    rqs: [TH11-Q2, TH12-Q2]
    issues: []
    stance: context
