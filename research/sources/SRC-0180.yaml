summary: GitHub 標準のスタック型 PR の告知。大きな変更を小さな PR の連なりに分けて各層を独立にレビューし、一括マージできる。
claims:
  - id: c1
    text: スタック型 PR は大きな変更を小さなレビュー可能な PR に分ける。既存のレビュー・チェック・マージ要件はそのまま働く。
    quote: Stacked pull requests break large changes into small, reviewable pull requests.
    locator: 冒頭
    quant: null
    evidenceKind: vendor-guidance
    rqs: [BASE-Q2]
    issues: [282]
    stance: context
  - id: c2
    text: 2026-07-30 時点で、スタック型PRは全リポジトリへ public preview として数日かけて展開され、merge queue 対応は数週間かけて段階展開とされた。
    quote: Stacked pull requests are rolling out in public preview to all repositories over the coming days. Merge queue support for stacked pull requests is rolling out progressively over the coming weeks.
    locator: Find out more and share your feedback
    quant: null
    evidenceKind: news-fact
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
  - id: c3
    text: 顧客(TED の CTO)は、AI で開発者が生産的になった結果 PR が大きくなりレビュアが追いつかない新たなボトルネックが生じ、スタック型PRがそれを解くと証言している(ベンダーが掲載した顧客証言)。
    quote: "AI has made TED’s developers dramatically more productive, but that created a new bottleneck: PRs were growing large enough that reviewers were struggling. Stacked PRs help to solve that."
    locator: Review each layer independently(引用ブロック)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q2, TH10-Q3]
    issues: [273]
    stance: supports
  - id: c4
    text: スタックの一部だけをマージすると上位のPRは自動で rebase・retarget され、main へ入るものは既存のブランチ保護と必須チェックが統制するとしている。
    quote: the pull requests above it stay open and automatically rebase and retarget. Your existing branch protections and required checks still govern what reaches `main`.
    locator: Merge everything in a single click
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
