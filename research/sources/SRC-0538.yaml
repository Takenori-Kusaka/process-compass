summary: SOC 2 の判定規準(Trust Services Criteria)。第三者サイトに置かれた 2020 年 3 月更新版の複製を読んだ(AICPA 公式配布の 2022 年改訂 points of focus 版はログインが必要で未読)。CC5.1 は両立しない職務の分離と、分離が実際的でない場合の代替統制を定め、CC8.1 は変更の承認を要求するが、承認者が人であることは条文上の要件になっていない。
claims:
  - id: c1
    text: CC5.1 の着眼点は、経営者が両立しない職務を分離し、分離が実際的でない場合は代替の統制活動を選ぶことを求める。分離の担い手の属性(人か自動か)は規定しない。
    quote: Management segregates incompatible duties and, where such segregation is not practical, management selects and develops alternative control activities.
    locator: "CC5.1 (COSO Principle 10) point of focus: Addresses Segregation of Duties"
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH02-Q1]
    issues: [248, 249]
    stance: context
  - id: c2
    text: CC8.1 は基盤・データ・ソフトウェア・手続への変更について承認・設計・文書化・試験・実装を組織(entity)に求める。主語は組織で、承認する者の属性は書かれていない。
    quote: The entity authorizes, designs, develops or acquires, configures, documents, tests, approves, and implements changes to infrastructure, data, software, and procedures to meet its objectives.
    locator: CC8.1 Change Management
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [248, 249]
    stance: context
  - id: c3
    text: CC5.1 の着眼点は統制活動の種類の組合せとして、手作業と自動、予防と発見の統制の均衡を考慮することを挙げる。自動化された統制を統制活動として数えること自体は認めている。
    quote: Control activities include a range and variety of controls and may include a balance of approaches to mitigate risks, considering both manual and automated controls
    locator: "CC5.1 point of focus: Evaluates a Mix of Control Activity Types"
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [248, 249]
