summary: GPT-3.5/GPT-4 の2023年3月版と6月版を7種の課題で比較し、同じ名前のサービスでも短期間で性能と挙動が大きく変わることを示した研究(本取得は arXiv 要旨のみ。査読誌への掲載は本取得で未確認)。
claims:
