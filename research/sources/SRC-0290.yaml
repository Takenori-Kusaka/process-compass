summary: Claude Code の許可プロンプトを分類器による自動判定(auto mode)へ既定で切り替える発表。人の許可操作が形骸化している実測(承認率97%)と、人と分類器の比較実験の数値を根拠に挙げる。
claims:
  - id: c1
    text: Claude Code の利用者は許可プロンプトの97%を承認しており、個々の許可要求の却下率は3%にとどまる。一方、計画(plan)の承認要求では39%を却下している。ベンダーは人の許可操作が習慣化していると解釈している。
    quote: "Data suggests that manual review can become habitual: users approve 97% of permission prompts in Claude Code."
    locator: 本文冒頭(manual review が習慣化する根拠の段落)
    quant:
      value: 承認率97% / 許可要求の却下率3% / 計画の却下率39%
      n: 未記載(Claude Code 利用者のテレメトリ)
      design: ベンダー内部の利用データ
      population: Claude Code 利用者
    evidenceKind: expert-opinion
    rqs: [TH01-Q4, TH11-Q3]
    issues: [248]
    stance: supports
  - id: c2
    text: 有償の専門テスター1,053名の対照実験で、危険なコマンドを人のレビューが止めたのは13.6%(143件)、auto mode は89%(937件)。auto mode が止め人が承認したものは800件、逆は6件。
    quote: In a controlled experiment with 1,053 paid professional testers, human review caught just 13.6% of dangerous commands, while auto mode caught 89%.
    locator: Auto mode outperforms manual permissions on safety
    quant:
      value: 人 13.6% 対 auto mode 89%
      n: 1,053名(有償の専門テスター)
      design: controlled experiment(ベンダー実施、セッション途中の1件を危険コマンドへ差し替え)
      population: Claude Code の許可プロンプト
    evidenceKind: controlled-experiment
    rqs: [TH01-Q4, TH07-Q4]
    issues: [248]
    stance: supports
  - id: c3
    text: セッションが長くなるほど人の阻止率は下がり、序盤の約17%から、50回以上のプロンプトを経た後は約5%へ落ちた。auto mode の阻止率はセッション長に依らず一定だった。
    quote: "As sessions got longer, humans did worse: they blocked about 17% of dangerous commands early in a session, dropping to about 5% after 50 or more prior prompts"
    locator: Auto mode outperforms manual permissions on safety
    quant:
      value: 約17% → 約5%(50回以上のプロンプト後)
      n: 1,053名(同上の実験)
      design: controlled experiment の事後分析
      population: Claude Code の許可プロンプト
