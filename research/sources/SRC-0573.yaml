summary: GitHub 公式の必須ステータスチェックのトラブルシュート(掲載日不明、2026-09-30 取得)。必須チェックを満たす状態は success / skipped / neutral の 3 つで、条件でスキップされたジョブは Success と報告され、ワークフローごとスキップされると Pending のまま結合を止める。実行しなかった検査が通過として扱われる経路を示す。
