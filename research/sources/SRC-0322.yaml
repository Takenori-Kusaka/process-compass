summary: AGENTS.md / CLAUDE.md などの文脈ファイルの注入方法を変えて、Claude Code と Codex の正答率が変わるかを実リポジトリ17課題・288実行で調べた単著のアブレーション研究。効果は同等性検定で10〜15pt 以内に収まる。
claims:
  - id: c1
    text: 文脈の注入戦略は、どちらのエージェントでも正答率を測れるほど動かさなかった(同等性検定で ≤10〜15pt に有界)。
    quote: Context strategy does not measurably move correctness on either agent (bounded to <=10-15pp via equivalence testing)
    locator: Abstract; §4.1
    quant:
      value: 効果 ≤10–15pp(TOST)
      n: 2 agents(Claude Code claude-sonnet-4-6, Codex gpt-5.5)× 17 tasks / 3 repos, 288 evaluated runs
      design: controlled ablation(gold-test evaluation, TOST + permutation)
      population: 実リポジトリの課題
    evidenceKind: controlled-experiment
    rqs: [TH03-Q4, TH03-Q3]
    issues: [269, 274]
    stance: context
  - id: c2
    text: 失敗は文脈ファイルで補える知識の不足ではなく実装技能(機能設計・パターン選択・配線)によるもので、実際の AGENTS.md は惜しい失敗を合格に変えなかった。
    quote: a manipulation probe confirms the real AGENTS.md never converts a near-miss to a pass on either agent
    locator: Abstract; §4.2 failure-mode triage
