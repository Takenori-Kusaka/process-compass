summary: DORA の能力定義『小さなバッチで働く』(ページの最終更新日 2025-12-08)。AI 採用の効果を増幅し不安定化への安全網になるとし、AI による巨大PRの誘惑と、小さく作って下流で束ね直す落とし穴を明記する。
claims:
  - id: c1
    text: DORA の研究は、小さなバッチで働くことが AI 採用のプロダクト性能への正の影響を増幅し、組織の摩擦への中立的な影響を正味の改善に変えるとする(本ページに標本数の記載はなく、2025 DORA 報告の調査に基づく)。
    quote: DORA research shows that working in small batches amplifies the positive impact of AI adoption on product performance and helps turn AI’s neutral effect on organizational friction into a net positive.
    locator: 冒頭の引用ブロック
    quant: null
    evidenceKind: survey
    rqs: [TH10-Q3, TH11-Q1]
    issues: [273]
    stance: supports
  - id: c2
    text: AI ツールは完成した大きな機能を生成しがちで、巨大PRの誘惑を避けるべきとし、機械生成コードは小さな塊でも行あたりのレビュー認知負荷が人のコードより高い可能性があると注記する。
    quote: Avoid the temptation to generate massive pull requests; the cognitive load required to review a small chunk of machine-generated code may be higher per line than reviewing human-written code.
    locator: Common pitfalls with working in small batches(AI Note)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
  - id: c3
    text: 小さく作っても下流のテスト・リリースの前に束ね直すと欠陥や妥当性のフィードバックが遅れる、という落とし穴を挙げる。バッチの大きさは作成単位(PR)ではなく下流へ送る単位で効く、という読みを支える。
    quote: Working in small batches but then regrouping the batches before sending them downstream for testing or release.
    locator: Common pitfalls with working in small batches
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
  - id: c4
    text: 理想として、開発者は小さなリリース可能な変更を少なくとも1日1回 trunk へ複数回入れるべきとする。
    quote: Ideally, your developers should be checking multiple small releasable changes into trunk at least once per day.
    locator: How to work in small batches
    quant: null
    evidenceKind: normative
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
