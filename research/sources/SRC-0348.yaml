  - id: c3
    text: すべての変更を同じ承認手続にかけることを落とし穴として挙げる。リスクの違いに応じて扱いを変えるべきという立場である。
    quote: Treating all changes equally. When all changes are subject to the same approval process, change review is inefficient
    locator: Common pitfalls
    quant: null
