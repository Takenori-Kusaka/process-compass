summary: DORA の研究(2019 State of DevOps Report)に基づく変更承認の指針。外部の変更諮問委員会(CAB)による重い承認は性能を下げ、変更失敗率の低下とも結びつかないとする。変化点管理をソフトウェアへ重い承認手続として持ち込む案への反証。
claims:
  - id: c1
    text: より形式的な外部レビューが変更失敗率を下げるという仮説を支持する証拠は見つからなかった。重い承認手続としての変更管理への反証である。
    quote: no evidence was found to support the hypothesis that a more formal, external review process was associated with lower change fail rates.
    locator: How to implement a change approval process
    quant: null
    evidenceKind: survey
    rqs: [TH02-Q2, TH07-Q4]
    issues: []
    stance: contradicts
  - id: c2
    text: 本番の安定性の問題に対してプロセスと承認を足すと、リードタイムとバッチサイズを増やして悪循環を生み、事態を悪くすると分析する。
    quote: Analysis suggests this approach will make things worse because this drives up lead times and batch sizes, creating a vicious cycle.
    locator: "Common pitfalls: Responding to problems by adding more process"
    quant: null
    evidenceKind: survey
    rqs: [TH02-Q2, TH07-Q4]
    issues: []
