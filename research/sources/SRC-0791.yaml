- id: c2
  text: 安全クラスは、リスクマネジメントファイルに記録する(4.3c)。記録の様式は製造業者が決めてよいが、その文書はリスクマネジメントファイルの一部になる。
  quote: "It is up to the manufacturer to determine how it wants to document the safety classification."
