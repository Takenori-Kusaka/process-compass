summary: 'IEC 62304 の認証機関側の FAQ(2013 年版の規格が対象)。安全クラスの割り当て(4.3)は必須で、プロジェクトの都合で任意にする手順では適合を主張できないと答える。クラスの記録先はリスクマネジメントファイル。認証機関の審査員の側の運用であって、規格の本文ではない。Issue #327 の審議で 2026-11-17 に抽出した。'
claims:
- id: c1
  text: ソフトウェア安全クラスの割り当ては必須であり、任意ではない。クラス割り当てを、プロジェクトチームの希望で変えられる任意の手順にすると、EN 62304 への適合を主張できない。
  quote: "No. Assigning a Software Safety Class is compulsory, not optional."
  locator: FAQ 2.5.x(4.3 の割り当てを任意にする手順の可否への回答)
  quant: null
  evidenceKind: expert-opinion
