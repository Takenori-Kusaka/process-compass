summary: "Google Antigravity の規則(Rules)公式文書(日付表記なし、2026-09-30 取得)。常時ロード規則に数値の上限を置く: 1 ファイル 24,000 バイトで打ち切り、常時有効な規則の合計 20,000 トークンを超えると大きいファイルから自動でポインタ(パスと説明)に降格する。上限値の根拠となる測定は示されない。"
