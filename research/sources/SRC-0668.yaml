summary: GitHub(無料版の文書)のリポジトリのルールセットの作成。状態の一覧は Active と Disabled の2つだが、同じ頁のメタデータの制限の節は Evaluate を選んで試すよう述べる(頁の内部の不整合)。#315 で、小規模の採用者に Evaluate での試行を求められない判断の根拠として引いた(登録時は「Evaluate は現れない」「明文の制限は見つけていない。推定」としていた。#364 の照合で、Evaluate はこの頁にも現れ、REST API の文書が "evaluate is only available with GitHub Enterprise" と明記していることが分かった)。
