summary: OpenAI・Anthropic・Google の 3 社で 500 超のエージェントセッション(10,000 トークンのシステムプロンプト、DeepResearch Bench)を走らせ、3 種のキャッシュ戦略を比較した査読前論文。費用 41〜80% 減、TTFT 13〜31% 改善。全文脈の素朴なキャッシュは遅延を悪化させうる。
claims:
  - id: c1
    text: 長時間のエージェントタスクでプロンプトキャッシュは API 費用を 41〜80% 削減し、TTFT を 13〜31% 改善した(3 プロバイダ、500 超セッション)。キャッシュ依存の費用構造は長時間・多ターンの作業で成立する。
    quote: Our results demonstrate that prompt caching reduces API costs by 41-80% and improves time to first token by 13-31% across providers.
    locator: Abstract
    quant:
      value: -41〜80% cost; -13〜31% TTFT
      n: 500+ agent sessions, 4 models, 3 providers
      design: controlled experiment
      population: DeepResearch Bench, 10,000-token system prompts
    evidenceKind: controlled-experiment
    rqs: [TH04-Q1]
    issues: [274]
    stance: supports
  - id: c2
    text: 動的なツール結果まで含めた「全文脈キャッシュ」は、再利用されない内容の書き込みを誘発し遅延を逆に増やしうる。システムプロンプトのみ、動的内容を末尾へ、ツール結果を除外、といった境界制御の方が安定する。
    quote: strategic prompt cache block control, such as placing dynamic content at the end of the system prompt, avoiding dynamic traditional function calling, and excluding dynamic tool results, provides more consistent benefits than naive full-context caching, which can paradoxically increase latency
    locator: Abstract / Conclusion
    quant: null
    evidenceKind: controlled-experiment
