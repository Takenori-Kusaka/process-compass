summary: AI Act を改正する Digital Omnibus の官報本文。高リスク義務の適用日を延期し、延期理由を整合規格・共通仕様・当局設置の遅れと明記する。AI リテラシー義務を緩め、適合性評価機関のコード表に Agentic AI を初めて書いた。
claims:
  - id: c1
    text: 第III章1〜3節(高リスクの分類・要求事項・事業者義務)の適用日は、Annex III 該当が 2027-12-02、Annex I 該当が 2028-08-02 に変わった(当初は 2026-08-02 / 2027-08-02)。
    quote: (i) 2 December 2027 as regards AI systems classified as high-risk pursuant to Article 6(2) and Annex III; and (ii) 2 August 2028
    locator: Article 1(amended Article 113, point (c))
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1]
    issues: []
    stance: context
  - id: c2
    text: 延期の理由として、整合規格・共通仕様・代替ガイダンスの提供遅延と各国所轄当局の設置遅延が、義務の実効的な適用を危うくすると前文で明記した。規格の整備速度が規制の適用時期を決めた事例である。
    quote: the delayed availability of standards, common specifications, and alternative guidance and the delayed establishment of national competent authorities lead to challenges
    locator: Recitals(date of application に関する前文)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1, TH12-Q4]
    issues: []
    stance: supports
  - id: c3
    text: 第4条の AI リテラシー義務は「確保する」から「発展を支援する措置をとる」へ改められ、個人に特定水準の AI リテラシーを保証することまでは要求しないと明記された。
    quote: does not require providers or deployers to guarantee any specific level of AI literacy of any individual.
    locator: Article 1(amended Article 4(1))
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1]
    issues: []
    stance: context
  - id: c4
    text: 適合性評価機関の指定に使うコード表に、他のコードに当たらない新興 AI 技術の区分(AIH 0401)を設け、その例として Agentic AI を明記した。
    quote: AIH 0401 AI systems based on other emerging AI technologies not covered by other codes, including Agentic AI
    locator: Annex(conformity assessment bodies の codes, categories and types of AI systems 一覧)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1]
    issues: []
    stance: context
