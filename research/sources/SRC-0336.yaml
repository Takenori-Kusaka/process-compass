  - id: c2
    text: 「問題ありませんか」と問うと設計者は「ありません」と答えがちで、変更の波及経路を一段ずつ問う形が必要だとする。確認の問い方が形式的だと検出力が落ちる、という指摘である。
    quote: 逆に「問題ありませんか」という問い方では、設計者の答えは「ありません」になりがちです。
    locator: Good Questionとは？
    quant: null
    evidenceKind: expert-opinion
