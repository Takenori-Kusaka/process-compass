    text: トヨタは部品を納めるサプライヤーに DRBFM の実施を義務付けていると述べる(一次資料は未確認)。
    quote: トヨタ自動車はグループに部品を納めるサプライヤーに対してDRBFMの実施を義務付けており
    locator: GD3との関係の前段
