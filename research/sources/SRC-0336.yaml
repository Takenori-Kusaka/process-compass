  - id: c4
    text: 仕向け地や使用環境が変わる場合は、設計図面に変更がなくても工程の変化点として管理する必要があるとする。自分が何も変えていなくても環境側の変化を変化点に数える考え方で、モデル側の更新を変化点として扱う発想と対応する。
    quote: 設計図面に変更がなくても、工程の変化点として管理する必要があります。
