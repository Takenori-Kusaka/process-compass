summary: OpenAI 公式のプロンプトキャッシュ仕様(2026-09-23 取得)。GPT-5.6 以降は書き込み 1.25x・読み取り 0.1x で Anthropic と同型に収束。TTL は 30 分(旧モデルは in_memory / 24h)。損益分岐の算式と「cache-cost trap」を公式に示す。
claims:
  - id: c1
    text: GPT-5.6 以降は書き込み 1.25 倍・読み取り 0.1 倍。1 回書いて 1 回再利用で 1.35 倍(非キャッシュ 2 倍)、10 リクエストで 2.15 倍(非キャッシュ 10 倍)。Anthropic の倍率と一致する。
    quote: "Writing a prefix once and fully reusing it once costs 1.35× its ordinary input cost, compared with 2× for processing it twice without caching. The savings grow with each additional cache read: across ten requests, one write and nine full reads cost 2.15×"
    locator: GPT-5.6 and later
    quant:
      value: 1.25x write / 0.1x read; 1.35x for 1 reuse; 2.15x for 10 requests
      n: null
      design: price arithmetic
