  - id: c2
    text: OpenAI は「最小キャッシュ長未満の短い接頭辞は、キャッシュ可能長まで伸ばした方が安い」という cache-cost trap と、再利用回数 N に依存する損益分岐を公式に示す。キャッシュが得になる条件は再利用頻度に依存する。
    quote: There is no universal maximum-cost prompt length; the crossover depends on reuse and pricing.
    locator: Mathematical details(Minimum cacheable length cost trap)
    quant:
      value: "break-even 220.16 tokens(例: M=1,024, r=0.1, w=1.25)"
      n: null
