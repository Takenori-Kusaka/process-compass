  - id: c3
    text: TTL は GPT-5.6 以降で 30 分、旧モデルは in_memory(5〜10 分、最長 1 時間)か 24h。Anthropic の 5 分 / 1 時間と異なり、書き込み追加料金の有無もモデル世代で異なる。
    quote: "in_memory : Entries typically remain active for around 5 to 10 minutes of inactivity, up to one hour. 24h : Extended retention typically keeps entries available for around 30 minutes and can retain them for up to 24 hours."
