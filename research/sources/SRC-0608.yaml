summary: 反証として取得。GitHub の規則ファイル 679 本(25,532 規則)を集め、Claude Code+Claude Opus 4.6 で SWE-bench Verified を 5,000 回超実行した統制実験(査読前)。規則数 0〜50 で合格率は落ちず、効果は内容にほぼ依存せず、有益な規則はすべて禁止形だった。測ったのは課題の合格率で規則の遵守率ではなく、50 規則は数万トークン規模に届かない。
claims:
  - id: c1
    text: 規則数を 0 から 50 まで増やしても合格率は安定していた(相転移なし)。「規則を増やすと劣化する」への反証だが、指標は課題合格率で遵守率ではない。
    quote: pass rates remain stable across rule counts from 0 to 50
    locator: Abstract
    quant:
      value: pass rate 59-67% band across 0/1/3/5/10/20/50 rules; 50 rules 66.7% vs 0 rules 60.3%
