summary: 'アジャイル開発を準委任で外部へ委託する場合の公的なモデル契約と解説。月ごとの実施業務の確認を定め、成果物についての契約不適合責任は追及できないと解説する。Issue #309 の調査が解説付きの全文を読んだ。'
claims:
- id: c1
  text: 月ごとの実施業務の確認は、受注側が善管注意義務に基づき業務を適切に行ったかを確かめる手続である(成果物の適否を確認する手続ではない)。
  quote: 本条は月ごとの実施業務の確認についての規定である。本条では、準委任としてベンダ企業が善管注意義務に基づき業務を適切に行ったかどうかの確認を行う手続を定める。
  locator: 第10条(実施業務の確認)の解説
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
  - 309
  stance: context
- id: c2
  text: 準委任契約の帰結として、発注側は受注側に対して、成果物に関する契約不適合責任を追及できない。
  quote: 準委任契約であることの帰結として、開発対象プロダクトに不具合があったり、セキュリティ等の非機能要件の不備があったりしたとしても、ユーザ企業はベンダ企業に対して、成果物に関する契約不適合責任を追及することはできない。
  locator: 解説(善管注意義務の箇所)
  quant: null
