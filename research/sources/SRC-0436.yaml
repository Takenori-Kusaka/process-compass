    text: Kiro は EARS 形式の要求から性質を抽出し、論理的に検査可能なものを判定したうえで、数百〜数千のランダムなテストケースを生成する。
    quote: Kiro extracts properties from your EARS-formatted requirements
    locator: Property-based testing w. Specs / Workflow
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH08-Q2, TH08-Q4]
    issues: []
    stance: context
  - id: c2
    text: 弱すぎる性質や誤った不変条件を書くと、実際の振る舞いが誤っていてもテストは通る。PBT は正しさの証拠であって証明ではない、と公式に限界を明記している。
    quote: A property that is too weak, or that states the wrong invariant, will pass while the real behavior is still wrong.
    locator: Concepts / limitations
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH08-Q4, TH07-Q5]
