summary: "認証審査機関 Schellman の担当者による ISO 42001 解説(二次)。ISO/IEC 22989 の3役割(producer/provider/customer)と、Annex A.3(内部組織: 役割・責任・報告系統)、A.8.4(人間の監視)を説明。利用者組織では監視手順・エスカレーション経路・覆しの記録が監査で最初に求められる証拠だとする。"
claims:
  - id: c1
    text: AI 利用者組織では Annex A.8.4 の人間の監視が主たる運用統制になり、AI 生成の判断をレビューする手順・エスカレーション経路・覆しの記録が監査人が最初に求める証拠になる。
    quote: "Human oversight (Annex A.8.4) becomes the primary operational control: documented procedures for reviewing AI-generated decisions, escalation paths, and override records are the evidence an auditor will request first."
