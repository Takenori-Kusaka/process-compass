summary: 人手の正解なしで LLM 判定者の自己選好バイアスを定量化し、20 モデルで『高性能=公平』ではないこと、全体判定を観点別比較へ分解する構造化評価で平均 31.5% 減らせることを示した。
claims:
  - id: c1
    text: 20 の主要 LLM で、能力の高さと自己選好バイアスの低さは無相関か、むしろ負の相関にある。強いモデルを判定者にすれば公平になるとは限らない。
    quote: our empirical analysis across 20 mainstream LLMs reveals that advanced capabilities are often uncorrelated, or even negatively correlated, with low SPB.
    locator: Abstract
    quant:
      value: 無相関〜負の相関
      n: 20 LLM
      design: benchmark (equal-quality pairs, double-query position swap)
      population: 100 問の評価質問
    evidenceKind: benchmark
    rqs: [TH06-Q3]
    issues: [256]
    stance: supports
  - id: c2
    text: 全体判定を観点別の単純な比較へ分解する構造化評価で、自己選好バイアスが平均 31.5% 減った(高バイアスのモデルが対象)。
    quote: we propose a structured multi-dimensional evaluation strategy grounded in cognitive load decomposition, reducing SPB by 31.5% on average.
    locator: Abstract / §4.4 SPB mitigation
    quant:
      value: -31.5%(平均)
