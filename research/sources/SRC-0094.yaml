summary: IPA 産業サイバーセキュリティセンター9期生の成果物(IPA の公式見解ではない旨を明記、有効期限2年)。対策を技術要件(T)・運用対策(O)・人的統制(H)に分け、人の承認は「業務リスクに基づき対象を絞り、それ以外は自律実行を許容する」判断軸を置けと述べる。全出力への承認要求は承認疲れと形骸化を招くと明記。
claims:
  - id: c1
    text: 承認が形骸化しないよう承認対象を重要度で絞るべきで、全出力に承認を求めると承認疲れが起き形だけの確認に陥る。
    quote: 留意点として、承認が形骸化しないよう、承認対象を重要度に応じて絞り込むことが重要である。全ての出力に承認を求めると承認疲れが起き、形だけの確認に陥るリスクがある。
    locator: 6.1.3 人的統制(H)、(1) 人間による承認
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q4]
    issues: [248, 268]
    stance: supports
  - id: c2
    text: 人間の承認が必要な操作を業務リスクに基づいて明確に定義し、それ以外は AI の自律実行を許容する判断軸を設けることが実効性の鍵とする。役割ではなく操作単位のリスクで切る。
    quote: 人間の承認が必要な操作を業務リスクに基づいて明確に定義し、それ以外は AI システムの自律実行を許容するという判断軸を設けることが実効性の鍵となる。
    locator: 6.1.3 人的統制(H)、(1) 人間による承認
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1, TH01-Q4, TH12-Q2]
    issues: [248]
    stance: qualifies
  - id: c3
    text: 2026年の自律型エージェントによるメール大量削除事案の原因として、過剰な権限付与と、実行前の人間の承認(Human-in-the-loop)をシステム的制御でなくプロンプト指示だけに依存した点を挙げる。
    quote: 実行前の人間の承認ステップ（Human-in-the-loop）をシステム的な制御として組み込まずプロンプトによる指示のみに依存していたため、AI の処理限界による指示忘れや、不正な指示の読み込みが直接的な被害につながった。
    locator: "4.2.2 発生被害 B: 付与権限外の操作、事例1"
    quant: null
    evidenceKind: case-report
    rqs: [TH01-Q2, TH07-Q5]
    issues: [248, 269]
    stance: supports
  - id: c4
    text: 本書は IPA・ICSCoE の意見を代表するものではなく著者(9期生)の見解に基づくと免責されており、公的機関の規範文書としての重みは限定的。
