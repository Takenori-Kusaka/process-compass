summary: 同質 10 体討論の追試側。Qwen2.5-7B / Llama-3.1-8B / Ministral-3-8B の同質 10 体 × 3 ラウンドで、多数派への迎合(最大 85.5%)、正答の不安定化(最大 70.0%)、投票による正答の棄却(最大 32.3pp)を分解。孤立した自己修正に 10 倍の出力予算を与える方が同等以上で、討論はトークンを 2.1〜3.4 倍使う。7〜8B 級に限定した結果。
claims:
  - id: c1
    text: "同質討論の失敗を 3 経路に分解: 多数派答案の無批判な採用(最大 85.5%)、ピアの根拠が正しかった推論を壊す(脆弱率最大 70.0%)、生成プールに正答があっても投票で捨てる(oracle gap 最大 32.3pp)。"
    quote: sycophantic conformity, where agents uncritically adopt majority answers (modal adoption up to 85.5%)
    locator: "Abstract (same sentence continues: vulnerability rate up to 70.0%; oracle gap up to 32.3 percentage points)"
    quant:
      value: modal adoption ≤85.5%; vulnerability ≤70.0%; oracle gap ≤32.3pp
      n: N=10 homogeneous agents × 3 models, R=3 rounds
      design: controlled experiment vs isolated self-correction and noise control
      population: Qwen2.5-7B, Llama-3.1-8B, Ministral-3-8B on GSM-Hard, MMLU-Hard
    evidenceKind: controlled-experiment
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c2
    text: 孤立した単一エージェントに 10 倍の出力トークン予算を与えて自己検証させる方が、同質討論と同等以上の精度。討論は同等以下の精度に 2.1〜3.4 倍のトークンを使う。
    quote: Across all configurations, debate consumes 2.1-3.4× more tokens (up to 28,631 tokens per problem) than self-correction for equal or lower accuracy.
    locator: Abstract
    quant:
      value: 2.1–3.4× tokens for equal or lower accuracy
      n: all configurations (K∈{2,4,9}, T∈{0.4,0.7})
      design: controlled experiment
      population: 7–8B class models
    evidenceKind: controlled-experiment
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c3
    text: 結論の適用範囲は 7〜8B 級・構造化された役割なし・無誘導の同質討論に限ると著者が明記。大型モデルや役割付き討論への一般化は本論文では主張していない。
    quote: Our results indicate that, within the 7-8B parameter class, homogeneous teams without structured roles do not benefit from unguided peer exchange
