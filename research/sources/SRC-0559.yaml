summary: 古い記憶を新しい観察が暗黙に無効化する場面を測るベンチマーク(400 シナリオ、2026-05-07)。最良モデルでも全体正答 55.2%。著者の対処は削除ではなく、古い状態を STALE と印を付けて保管する方式で 68.0%。対象は個人アシスタントの記憶で、ADR やコーディングは対象外。
claims:
  - id: c1
    text: 古い情報と新しい情報が文脈に併存すると、最良のモデルでも全体正答率は 55.2% にとどまる。古い記述を残すと誤って従う機序を支持するが、対象は対話の記憶で ADR ではない。
    quote: with even the best evaluated model achieving only 55.2% overall accuracy.
    locator: Abstract / §4.2 Table 2
    quant:
      value: 55.2%
      n: 400 シナリオ・1,200 クエリ
      design: ベンチマーク(LLM-as-judge、人手との一致 95.8%)
