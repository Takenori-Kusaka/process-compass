summary: ISO の規格策定手続き(現行版)。定期見直し(systematic review)の最大間隔を文書種別ごとに定める。現行版の発行年はページから取得できなかった(curl は遮断、tavily で本文の一部を取得)。
claims:
  - id: c1
    text: ISO の定期見直しの間隔は、国際規格(IS)が5年、技術仕様書(TS)が3年である。TS は確認(confirmation)1回・寿命6年が推奨で、PAS は間隔3年・確認1回・寿命6年と定められている。
    quote: International Standard | 5 years | Not limited | Not limited Technical Specification | 3 years | Once recommended | 6 years recommended | Publicly Available Specification | 3 years | Once | 6 years
    locator: Table S1 — Timing of systematic reviews
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: qualifies
  - id: c2
    text: 最大期間の経過を待たずに見直してよく、各国の国家機関や CEO の要請でも見直しを始められる。
    quote: However, it is not necessary to wait for the maximum period to elapse before a document is reviewed.
    locator: 2.9(systematic review の開始条件)
    quant: null
    evidenceKind: normative
