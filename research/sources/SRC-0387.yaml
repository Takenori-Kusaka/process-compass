summary: 350 超の LLM の誤りの相関を実測した ICML 2025 論文。両モデルが誤るとき同じ誤答を選ぶ率が偶然より大幅に高く、高精度モデルほど提供元・構造が違っても相関し、LLM 判定者は同系統を過大評価する。
claims:
  - id: c1
    text: HELM では、両モデルが誤答した問題で同じ誤答を選ぶ率が平均約 60%(ランダムなら 1/3)であり、LLM 間の誤りは強く相関する。
    quote: on Helm, pairs of models agree on average about 60% of the time when both models are incorrect
    locator: §1 Introduction (1) / §3.2
    quant:
      value: 約60%(偶然水準 33%)
      n: 350超のLLM(HuggingFace・Helm リーダーボード+履歴書評価)
      design: observational analysis of benchmark outputs
      population: 多肢選択ベンチマークで両モデルが誤答した問題
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [256, 258]
    stance: supports
  - id: c2
    text: 大きく高精度なモデルほど、構造や提供元が異なっても誤りの相関が高い。系統を混ぜれば独立になるという前提は、モデルの高性能化とともに弱まる。
    quote: Crucially, however, larger and more accurate models have highly correlated errors, even with distinct architectures and providers.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c3
    text: LLM を判定者にすると、自分より精度の低いモデルの精度を過大に評価し、同じ提供元・構造のモデルで特に過大になる。
    quote: judges overinflate the accuracy of models that are less accurate than it—especially for models of the same provider or architecture.
    locator: "§1 Introduction (3) / §4 Case Study: LLM as judge"
    quant: null
    evidenceKind: observational
    rqs: [TH06-Q3]
    issues: [256]
    stance: supports
