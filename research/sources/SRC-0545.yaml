summary: ISTQB の基礎レベルシラバス v4.0(2023-04-21。現行は v4.0.1 で、読んだのは試験機関サイトに置かれた v4.0)。全数テストは不可能で、リスクに基づいてテスト活動を選び優先づけるリスクベースドテストを定義する。リスクへの対応の選択肢にリスク受容を挙げるが、受容の記録様式は定めていない。ISO/IEC/IEEE 29119-1 本文は未読。
claims:
  - id: c1
    text: 全数テストは不可能であり、網羅を目指す代わりにテスト技法・優先づけ・リスクベースドテストで労力を集中させるべきとする(テストの 7 原則の 2)。検証を全件に課さないことを原則として置いている。
    quote: Exhaustive testing is impossible. Testing everything is not feasible except in trivial cases (Manna 1978).
    locator: §1.3 Testing Principles 2
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: supports
  - id: c2
    text: リスク分析とリスクコントロールに基づいてテスト活動を選択・優先づけ・管理するテストアプローチをリスクベースドテストと定義する。
    quote: The test approach, in which test activities are selected, prioritized, and managed based on risk analysis and risk control, is called risk-based testing.
    locator: §5.2 Risk Management
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: supports
  - id: c3
    text: 分析済みのプロダクトリスクへの対応の選択肢に、テストによる軽減と並べてリスク受容・リスク移転・コンティンジェンシー計画を挙げる。受容を正規の選択肢とするが、記録の様式は示さない。
    quote: several response options to risk are possible, e.g., risk mitigation by testing, risk acceptance, risk transfer, or contingency plan (Veenendaal 2012).
    locator: §5.2.4 Product Risk Control
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4]
    issues: [267, 268]
    stance: qualifies
  - id: c4
    text: テストでリスクを軽減する手段の 1 つに、適切な水準のテストの独立性を適用することを挙げる。独立性の水準は一律ではなくリスクに応じて選ぶ位置づけである。
    quote: Apply an appropriate level of independence of testing
    locator: §5.2.4 Product Risk Control
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q4, TH02-Q1]
    issues: [267, 268]
    stance: supports
