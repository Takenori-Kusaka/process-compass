summary: PR の題名が Conventional Commits に合うかを検査する GitHub Action の README(main、最新 v6.1.1 は 2025-08-22)。検査するのは題名だけで本文は見ない。ラベルによる検査の免除と、`[WIP]` 接頭辞で検査を保留にする opt-in を持つ。
claims:
  - id: c1
    text: この Action は PR の題名が Conventional Commits の仕様に合うことを検査する。squash マージで題名がコミットメッセージになり、リリース自動化の入力になる前提である。
    quote: This is a GitHub Action that ensures that your pull request titles match the Conventional Commits spec.
    locator: 冒頭
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c2
    text: "指定したラベル(例: bot、ignore-semantic-pull-request)が PR に付いていれば検査を省く。免除をラベルで宣言させる opt-out の先例である。"
    quote: If the PR contains one of these newline-delimited labels, the validation is skipped.
    locator: Configuration / ignoreLabels
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c3
    text: 題名に `[WIP]` を付けると検査は行われず、チェックは pending のまま残る。未実施を「通過」にしない扱いである。
    quote: This will prevent the PR title from being validated, and pull request checks will remain pending.
    locator: Work-in-progress pull requests
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q4, TH02-Q4]
    issues: [271]
    stance: supports
