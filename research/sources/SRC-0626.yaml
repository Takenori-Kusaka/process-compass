summary: 損保系 IT 子会社が2025年8月に行った AI-DLC ワークショップの報告(AWS 執筆)。4チームが1.5日で初期版を作り、段階的な承認より現場判断が有効という所見を得たが、既存改修と大規模開発は未検証と本人が述べる。
