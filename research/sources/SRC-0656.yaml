summary: ESLint の一括の抑制。既存の違反を抑制のファイルに記録してコミットし、新しい違反だけを報告する。直した違反の記録が残ると失敗する。#315 で、既存の違反の基準線を置く型の前例として引き、本標準では閾値の緩和と機械で区別できないため採らない判断の材料にした。
claims:
  - id: c1
    text: --suppress-all は、"error" として有効にした規則の既存の違反をまとめて抑制し、プロジェクトの根に eslint-suppressions.json を作る。このファイルはコミットする。違反を直したのに抑制の記録が残っていると、ESLint は非ゼロで終わり、使われない抑制をエラーとして報告する(--pass-on-unpruned-suppressions で終了コードから外せる)。
    quote: You can address any of the reported violations by making the necessary changes to the code as usual. If you run ESLint again you will notice that it exits with a non-zero exit code and an error is reported about unused suppressions. This is because the violations have been resolved but the suppressions are still in place.
    locator: Bulk Suppressions > Resolving Suppressions
