summary: JIS Z 8301:2019 の本文の第三者による転載。原本(JISC の閲覧は利用者登録が要り、2026-10-24 は障害で開けなかった)とは照合していない。#310・#316 の調査は、要求・推奨・許容・可能性と能力の表現形式(箇条7 の表3〜表7)と、規定要素・参考要素・解説の区分(3.3、20.2)をこの転載で読んだ。本標準は、この転載を根拠に JIS の文を引かず、一致も主張しない(EV-0096)。原本の照合は後継の Issue で保守者(人)が行う。
