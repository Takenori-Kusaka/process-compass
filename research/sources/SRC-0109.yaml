summary: 暫定 50% 増しの終了告知(2026-08-19、取得時「35 days ago」)に対する HN スレッド(295 points / 267 comments)。サブエージェントの並列起動で週次枠を数十分で使い切った報告、Max の解約、Codex への移行が複数ある。反証側の一次証言。
