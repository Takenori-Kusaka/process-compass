summary: Anthropic 所属著者による 2026-05 の査読前論文。コーディングエージェントの監視用分類器として使うと、Opus 4.6・GPT 5.4・Gemini 3.1 は 800K トークンの無害な活動の後に置かれた危険行動を 2〜30 倍見逃す。定期的なリマインダーで部分的に緩和。最新世代でも長文脈劣化が再現する一次証拠。
claims:
  - id: c1
    text: 2026 年前半のフロンティアモデル(Opus 4.6、GPT 5.4、Gemini 3.1)でも、800K トークンの無害な活動の後に置かれた危険行動の見逃しが単独提示時の 2〜30 倍に増える。長文脈劣化は旧世代限定ではない。
    quote: Opus 4.6, GPT 5.4, and Gemini 3.1 miss these actions 2× to 30× more often when they occur after 800K tokens of benign activity than when they occur on their own.
    locator: Abstract
    quant:
      value: 2x〜30x miss rate
      n: 3 frontier models; dataset of subtly dangerous coding-agent actions
      design: controlled experiment (padding with benign transcript)
      population: LLM monitors of coding agents
    evidenceKind: controlled-experiment
    rqs: [TH04-Q2, TH03-Q3, TH06-Q4]
    issues: [274, 269, 268]
    stance: supports
  - id: c2
    text: 劣化は文字起こし中の定期的なリマインダーなどのプロンプト技法で部分的に緩和でき、post-training でさらに改善しうる。長文脈劣化を考慮しない評価は監視性能を過大評価する。
    quote: We also show that these weaknesses can be partially mitigated with prompting techniques such as periodic reminders throughout the transcript and may be mitigated further with better post-training.
    locator: Abstract
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH04-Q2, TH03-Q3]
