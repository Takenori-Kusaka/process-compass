summary: 英国原子力廃止措置機関(NDA)の TRL 手引き(2014-11-06、受託者 Cogentus の見解と断り書きあり)。TRL は環境や機能仕様の変化で下がりうること、但し書き付きの TRL を受け入れないこと、手順より低い TRL でゲートを通すなら承認機関の責任であることを述べる。要旨と第6章を読んだ。
claims:
  - id: c1
    text: TRL は、プロジェクトの環境が変われば上がるだけでなく下がりうる。技術成熟度の判定は一度達成すれば固定される値ではない。
    quote: It is also possible that TRLs can go down as well as up if the environment of the project changes.
    locator: Summary(key messages)
    quant: null
    evidenceKind: normative
    rqs: [TH09-Q2]
    issues: [250]
    stance: supports
  - id: c2
    text: 運転環境に関する情報は早期には仮定で置かれ、プロジェクトの進行で得た知見が環境の前提を変えると、TRL は停滞または低下しうる。後段の知見が先行の成熟度判定を下方へ改める理由として明記されている。
    quote: Emerging knowledge as the project progresses can mean changes to the environmental context, which may be a reason why the TRL for a technology can stagnate or go down.
    locator: 6.1 c) Environment
    quant: null
    evidenceKind: normative
    rqs: [TH09-Q2, TH08-Q3]
    issues: [250, 256]
    stance: supports
  - id: c3
    text: 但し書き付きの TRL を受け入れず正しい TRL を使うこと、手順が定めるより低い TRL でゲートを通すならそれは承認機関の責任であることを述べる。未達を条件付きで丸めず、例外は判定者の責任として残す。
    quote: Do not accept a TRL with caveats. Use the correct TRL. It is the responsibility of the sanctioning body if they choose to accept a lower TRL at a gate than procedures state.
    locator: 6.4 b)
    quant: null
    evidenceKind: normative
    rqs: [TH09-Q2, TH02-Q4]
    issues: [250, 254]
    stance: supports
