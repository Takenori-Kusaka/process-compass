    text: 2026-06-18 に Gemini CLI と Gemini Code Assist IDE 拡張は Google AI Pro / Ultra および無償利用者へのリクエスト受付を停止した(告知から約 30 日)。
    quote: On June 18, 2026, Gemini CLI and Gemini Code Assist IDE extensions will stop serving requests for Google AI Pro and Ultra, as well as those using it free of charge using Gemini Code Assist for individuals.
