summary: 大規模 Java 5 システムで 31,000 のテストスイートを生成し、カバレッジと欠陥検出力(ミューテーション)の関係を測った研究。スイートの規模を統制すると相関は低〜中程度で、カバレッジを品質目標にすべきでないと結論する。
claims:
  - id: c1
    text: テストケース数を統制すると、カバレッジと有効性の相関は低〜中程度だった。
    quote: We found that there is a low to moderate correlation between coverage and effectiveness when the number of test cases in the suite is controlled for.
    locator: Abstract
    quant:
      value: low to moderate correlation
      n: 31,000 test suites, 5 systems up to 724,000 LOC
      design: mutation analysis, Kendall tau
      population: large Java programs
    evidenceKind: observational
    rqs: [TH07-Q5, TH11-Q3]
    issues: [270]
    stance: supports
  - id: c2
    text: カバレッジはテスト不足の箇所の特定には役立つが、有効性の良い指標ではないので品質目標にすべきでない。
    quote: Our results suggest that coverage, while useful for identifying under-tested parts of a program, should not be used as a quality target because it is not a good indicator of test suite effectiveness.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: [TH07-Q5, TH07-Q4]
    issues: [270]
    stance: supports
