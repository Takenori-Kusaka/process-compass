summary: ADR のテンプレート集と運用助言(最終 push 2026-09-25)。原則は不変+supersede としつつ、著者のチームでは日付付きで追記する可変運用のほうが機能したと述べる。不変方式への反証として採った。
claims:
  - id: c1
    text: 良い ADR の特性として不変を挙げ、既存の記述は変えずに追記するか、新しい ADR で置き換えるとする。
    quote: "Immutable: Don't alter existing information in an ADR. Instead, amend the ADR by adding new information, or supersede the ADR by creating a new ADR."
    locator: What is an architecture decision record? (good ADR の特性)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q1]
    issues: [272]
    stance: context
  - id: c2
    text: 一方で、著者のチームでは不変より可変(既存 ADR へ日付と注記を付けて追記)のほうがうまくいったと述べる。比較の測定は無く、自己報告である。
    quote: In theory, immutability is ideal. In practice, mutability has worked better for our teams.
    locator: Teamwork advice for ADRs
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q1, TH05-Q5]
    issues: [272]
    stance: qualifies
  - id: c3
    text: 後付けの義務的な書類として課す ADR には価値が無いと助言している。
    quote: decision records are not valuable if they're just an after-the-fact forced paperwork requirement.
    locator: Teamwork advice for ADRs
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q2]
    issues: [253]
    stance: qualifies
  - id: c4
    text: 運用例として、各 ADR に担当者を置き、年1回以上の定期見直しと最終的な廃止(sunsetting)までを責務に含める案を示す。
    quote: periodic review at least once per year, and eventual sunsetting as needed.
    locator: Teamwork questions for ADRs / What roles and responsibilities interact with an ADR?
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q5]
    issues: [272]
    stance: context
