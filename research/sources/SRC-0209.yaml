summary: セッション単位でエージェントを監督する方式が人の注意で頭打ちになったため、課題トラッカーを制御面にして課題ごとにエージェントを走らせる仕様 Symphony を公開した記事。人が同時に扱えるセッション数の限界と、方式を変えて失ったものも記す。
claims:
