    text: 多くの人が快適に扱えるのは同時 3〜5 セッションまでで、それを超えると文脈切り替えで生産性が落ちた。律速は人の注意だった。
    quote: In practice, most people could comfortably manage three to five sessions at a time before context switching became painful. Beyond that, productivity dropped.
