summary: 開発者 41 名の調査から導いた 7 つの指標(コミット数、変更行数、変更の散らばり等)が、マージ衝突の件数を予測するかを OSS で検証した査読論文。結果は否定的で、どの指標も強くは相関しなかった。読んだのは著者版(163 プロジェクト・21,488 シナリオ)で、研究室ページは 155 プロジェクトと記す。
claims:
  - id: c1
    text: 開発者が挙げた 7 つの指標(ブランチのコミット数、短期間の集中コミット、両ブランチで変更されたファイル数、変更行数、変更の断片化・散らばり等)は、どれもマージ衝突の頻度を予測しなかった。
    quote: A notable (negative) result is that none of the 7 indicators suggested by the participants of the developer survey has a predictive power concerning the frequency of merge conflicts.
    locator: Abstract
    quant:
      value: 7 指標すべて予測力なし
      n: 163 OSS プロジェクト、21,488 マージシナリオ(著者版)。開発者調査は 41 名
      design: 開発者調査+リポジトリ・マイニング(相関・段階的回帰)
      population: Java の OSS プロジェクト
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: contradicts
  - id: c2
    text: 検証した仮説には「変更行数が多い変更ほど衝突しやすい」(H4)が含まれており、バッチサイズが衝突件数の予測子になるという直観はこの標本では支持されなかった。
    quote: Larger changes that modify more lines of code are more likely to cause conflicts than smaller changes.
    locator: §2.2 H4
    quant: null
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: contradicts
  - id: c3
    text: 著者は、この結果をマージと衝突についての前提を置くときの警告として読むよう、実務家と研究者に求めている。
    quote: The results of our study can be understood as a warning to practitioners and researchers when making assumptions about merging and merge conflicts.
    locator: §1 Introduction
