  - id: c2
    text: 変更管理の対象に、技能を要する工程の人員交替直後の製品や設備修復直後の製品を含める。人の入れ替わりを品質リスクの変化点として明示的に扱う。
    quote: スキルを要する工程にかかわる人員の交替直後の製品、設備など修復直後の製品、突発トラブル発生時の製品など
    locator: 2.2 (1) 4M変更管理対象の定義
