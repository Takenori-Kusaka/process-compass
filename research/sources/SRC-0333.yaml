  - id: c3
    text: 変化点の洗い出しは、まず管理範囲を限定してモデル工程で試行し、順次広げる方法も取られる。統制の段階的な有効化に当たる運用である。
    quote: まずは管理する範囲を限定し、モデル工程として試行、順次その範囲を広げていく方法も取られます。
    locator: 2.2 (2) 変化点の洗い出し
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2, TH02-Q4]
