    issues: []
    stance: context
  - id: c5
    text: 管理の仕組み自体を、関係部門が半年か1年の周期で記録を持ち寄ってレビューし改善する。ほとんど異常値を示さない管理項目も分析・分類の対象にしており、効かない統制を見直す手順を含む。
    quote: 関係部門を集め、半年か1年の周期で記録・データーを持ち寄ってレビューを行い、レビューの評価結果に基づき、4M変動管理全体の改善を実施します。
