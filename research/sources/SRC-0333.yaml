summary: 製造業に50年従事したコンサルタントによる4M変化点管理の解説(掲載日は取得できず。後半は会員限定)。人員交替直後などを管理対象に含め、管理範囲をモデル工程から段階的に広げ、半年〜1年周期で管理項目自体を見直す運用を述べる。
