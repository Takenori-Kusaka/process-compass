  - id: c4
    text: 迅速さが求められる4M変更管理では、判断・実行する部署の責任と権限を事前に明確にしておく必要があるとする。
    quote: スピーディーな対応が求められる4M変更管理では、責任と権限を明確にしておかなければなりません。
    locator: 2.1 4M変更管理のマネジメント・フロー
    quant: null
