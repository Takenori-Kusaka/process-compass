summary: 前回メモが二次(Codacy)経由で引いた「フィーチャーブランチ +59%、main は横ばい」の一次資料。一次では +59% は全ブランチの平均スループット(日次ワークフロー実行数)であり、中央値チームは feature +15.2% / main -6.8%、p90 は feature +49.3% / main +1.0%。
claims:
  - id: c1
    text: +59% は「全プロジェクトの平均スループット(日次ワークフロー実行数)」の前年比であり、フィーチャーブランチの数値ではない。前回メモの表現は誤り。
    quote: Across all projects building on CircleCI, average throughput (the number of daily workflows run) grew 59% year over year.
    locator: p.3
    quant:
      value: +59% YoY
      n: 28,738,317 workflows
      design: observational (platform telemetry)
      population: CircleCI projects with ≥2 contributors, workflows run ≥5 times, 2025-09-01..28
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: qualifies
  - id: c2
    text: 中央値チームはフィーチャーブランチのスループットが +15% だが main ブランチは -7%。「main は横ばい」ではなく減少。
    quote: The median team, for example, saw a 15% increase in throughput on feature branches. Throughput on the main branch, however, declined 7% from last year
    locator: p.8
    quant:
      value: feature +15.2%, main -6.8% (all branches +4.3%)
      n: 28,738,317 workflows
      design: observational
      population: median team
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 上位 10% のチームでもフィーチャーブランチ +49.3% に対し main は +1.0% で実質横ばい。「main は横ばい」は p90 チームの数値に対応する。
    quote: Even teams in the top 10% struggled to move changes into production. Throughput on feature branches increased by almost 50% for this group, while main branch activity was essentially flat.
    locator: p.8
    quant:
      value: feature +49.3%, main +1.0%
      n: 28,738,317 workflows
      design: observational
      population: p90 teams
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: supports
  - id: c4
    text: 上位 5% は main +26.2%、feature +85.1% と両方伸びており、ボトルネックが不可避ではないことを示す(反証側の内部データ)。
    quote: For this group, throughput on the main branch increased 26% while feature branch activity grew by 85%.
    locator: p.9
    quant:
      value: main +26.2%, feature +85.1%
      n: 28,738,317 workflows
      design: observational
      population: top 5% teams
    evidenceKind: observational
    rqs: [TH10-Q1]
    issues: []
    stance: qualifies
  - id: c5
    text: main ブランチの成功率は 5 年超で最低の 70.8% に低下し、本番向けマージ試行の 30% が失敗する。
    quote: success rates on the main branch fell to their lowest level in over 5 years, to 70.8%. In other words, attempts at merging changes into production code bases now fail 30% of the time.
    locator: p.12
    quant:
      value: 70.8%
      n: 28,738,317 workflows
      design: observational
      population: main branch workflows
    evidenceKind: observational
    rqs: [TH07-Q3]
    issues: []
    stance: supports
  - id: c6
    text: 典型的なチームの復旧時間(MTTR)は 72 分で前年比 +13%。フィーチャーブランチでは 64 分→約 80 分(+25%)。
    quote: This year, the typical team takes 72 minutes to get back to green, a 13% increase in recovery times from last year.
    locator: p.11
    quant:
      value: 72 min (+13%)
      n: 28,738,317 workflows
      design: observational
      population: median team
    evidenceKind: observational
    rqs: [TH07-Q3]
    issues: []
    stance: supports
  - id: c7
    text: "方法論: 2025-09-01〜09-28 の CircleCI ワークフロー、貢献者 2 名以上、5 回以上実行のもの。AI 生成コードか否かの直接ラベルはなく、AI の影響は推論である。"
    quote: Every day between September 1, 2025 and September 28, 2025 • Only projects with more than one contributor • Only workflows that ran at least 5 times • 28,738,317 workflows
    locator: p.25 Methodology
