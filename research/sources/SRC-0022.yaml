summary: Inozemtseva ら・Papadakis らの追試。11 LLM が Defects4J の 318 欠陥メソッドに生成した 8,268 スイート(101,123 テスト)で、カバレッジ・ミューテーション・実欠陥検出の相関を再検証。コードが無欠陥と仮定できる回帰設定では両指標は有用だが、対象コードが欠陥を含みうる設定では信頼できず、ミューテーション解析は適用不能と結論。123 メモの「22,374 件」はこの論文の数値ではない。
claims:
  - id: c1
    text: "規模: 各 LLM×各焦点メソッドで 8,268 テストスイート・101,123 テストケースを生成。対象は Defects4J 17 プロジェクトの 318 欠陥焦点メソッド、11 LLM(6 開発元)。"
    quote: We apply this pipeline to each focal method for each LLM, resulting in 8,268 generated test suites comprising 101,123 individual test cases.
    locator: §3 Study Design (test generation pipeline)
    quant:
      value: 8,268 suites / 101,123 tests
      n: 318 buggy focal methods × 11 LLMs
      design: replication study (correlation analysis)
      population: Defects4J 17 projects (Java)
    evidenceKind: observational
    rqs: []
    issues: [123]
    stance: context
  - id: c2
    text: 対象コードが既に欠陥を含みうる設定(そのコードの欠陥を暴くことが目的)では、カバレッジとミューテーションスコアは有効性の信頼できる指標ではなくなる。
    quote: in another common scenario where the code-under-test may already be buggy and the goal is to expose the bug within the code-under-test, they no longer serve as reliable indicators.
    locator: Abstract / §1
    quant: null
    evidenceKind: observational
    rqs: []
    issues: [123]
    stance: supports
  - id: c3
    text: 一方、対象コードを無欠陥と仮定できる回帰テスト設定では、テストスイートサイズを統制してもカバレッジとミューテーションスコアはモデル間比較の有用な信号になる(メモの「カバレッジは機能しない」は条件付き)。
    quote: we find that these metrics can be informative when the code-under-test can be reasonably assumed bug-free, and the goal is regression testing
    locator: §1 Introduction (main takeaways)
    quant: null
    evidenceKind: observational
    rqs: []
    issues: [123]
    stance: qualifies
  - id: c4
    text: 先行研究と異なり、LLM 生成テストではスイートサイズが相関の支配的な交絡因子である証拠は乏しい。
    quote: We also find little evidence that test suite size is a dominant confounder for correlations among coverage, mutation, and real-bug detection for LLM-generated tests.
    locator: Abstract
    quant: null
    evidenceKind: observational
    rqs: []
    issues: [123]
    stance: context
  - id: c5
    text: 欠陥を含むコードからの生成ではカバレッジは欠陥検出の指標として信頼できず、ミューテーション解析はそもそも適用できない。
    quote: coverage becomes unreliable as an indicator of bug detection effectiveness, and mutation analysis is not applicable.
    locator: §1 Introduction (main takeaways)
    quant: null
    evidenceKind: observational
    rqs: []
    issues: [123]
    stance: supports
