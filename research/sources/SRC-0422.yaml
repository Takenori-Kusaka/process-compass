summary: オンタリオ州 101 病院で義務化された手術安全チェックリストの前後比較(Urbach ら NEJM 2014)を共著機関 ICES が報じたもの。自己申告の遵守率は 98% 以上だったが、死亡・合併症は改善しなかった。書式を課しただけでは中身が伴わない例である。
claims:
  - id: c1
    text: 各病院の自己申告によるチェックリスト遵守率は高く、2010 年 7 月以降は一度も 98% を下回らなかった。
    quote: "by all hospitals in the province is high: 92 per cent in April—June 2010, and never less than 98 per cent after July 2010."
    locator: 本文(遵守率)
    quant:
      value: ">=98% self-reported compliance"
      n: 101 hospitals
      design: population-based before/after (3 months each)
      population: Ontario hospitals
    evidenceKind: observational
    rqs: [TH07-Q5, TH11-Q3]
    issues: [269, 270]
    stance: supports
  - id: c2
    text: 調整後死亡率は導入前 0.71%、導入後 0.65% で有意差はなく、合併症・救急受診・再入院も改善しなかった。
    quote: Adjusted mortality was 0.71 per cent before and 0.65 per cent after introduction.
    locator: 本文(結果)
    quant:
      value: 0.71% -> 0.65% (n.s.)
      n: 101 hospitals, 3 months before/after
      design: population-based before/after
      population: Ontario surgical procedures
    evidenceKind: observational
    rqs: [TH07-Q5, TH11-Q3]
    issues: [270]
    stance: supports
  - id: c3
    text: 著者は、現行の実施のしかたではチェックリストは転帰を改善しなかったと述べる。より集中的なチーム訓練や遵守監視があれば効果が出うるとも留保している。
    quote: as currently implemented, surgical safety checklists did not result in improved patient outcomes
    locator: 本文(Urbach のコメント)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH07-Q5]
