summary: vibe coding のライフサイクルを整理し、摩擦のない生成が設計の均質化とその害を悪化させると社会技術的リスク分析で論じる HCI 系プレプリント。対策としてモデルが前提を問い返し代替案を提示する「productive friction」を提案する。実測ではなく概念分析とケーススタディ。
