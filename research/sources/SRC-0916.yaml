summary: '品質保証の実務者による事例集(経験者の語り)。品質保証部門の長の拒否権を書いた本ではない。判定の権限は、任命された品質管理責任者と、プロジェクトから独立した部門から選ぶ監査者に置く。リリースの判定は顧客と受注者の責任者の合意で、節目の会議でオーナーが判断する。成果は出荷後の実績で振り返る。'
claims:
  - id: c1
    text: '品質計画を実行する責任者を別に任命し、タスクの優先度を決める権限を与えて、スケジュールやコストを優先する動きを牽制する。第三者の監査者はプロジェクトから独立した部門から選び、各工程の完了判定の評価者として次工程へ着手してよいかを判定する権限を与え、オーナーへの報告の経路を設ける。権限は任命された責任者と、独立した部門から選ぶ監査者に置く。品質保証部門の長の権限としては書かれない。'
    quote: 'タスク優先度を決める権限'
