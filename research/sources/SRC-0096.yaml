summary: SOMPO Digital Lab の QA エンジニアが、Claude Code を PM/SE/PG/QA のエージェントに分業させ、人は PM エージェントにだけ指示する構成にしたら開発が安定したと報告。工程間で会話履歴を渡さず、QA から Edit/Write 権限を外して独立性を仕組みで担保。効果は KPI 比較前の自己評価。
claims:
  - id: c1
    text: 人が指示するのは PM エージェントのみで、PM が SE(変更概要書)/PG(実装+テスト)/QA(独立レビュー)へファイル経由で必要最小限の情報だけを渡す構成。AI が開発チームの各ロールを占め、人は PM への指示者になる。
    quote: ユーザーが指示を出すのは PMエージェント （メイン会話）のみ PMが SE（変更概要書作成） ／ PG（実装＋テスト） ／ QA（独立レビュー） へ、ファイル経由で必要最小限の情報のみを引き継ぐ
    locator: 解決策：開発チームと同じ「責務分離」をエージェントにも
