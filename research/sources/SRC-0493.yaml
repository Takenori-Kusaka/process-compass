summary: Living Standard を運営する WHATWG の作業規則。規範の変更に実装者の支持・テスト・実装バグの起票を条件とし、実装と乖離した機能は削除する。日付は whatwg/sg リポジトリの Working Mode.md 最終コミット日。
claims:
  - id: c1
    text: 規範的な変更には、実装者の支持と対応するテスト変更が必要で、テストに失敗する各ブラウザへ実装バグを起票することが求められる。規定が実装へ届いたことを変更の条件にしている。
    quote: "Each normative change made to the standard needs to meet the following criteria: It must have support from implementers. It should have corresponding test changes"
    locator: Changes
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 「フィクションを書かない」規則として、実装者の関心が十分な機能だけを追加し、関心が薄れた既存機能は削除して実装に合わせる。
    quote: Only add features that have sufficient implementer interest. Align existing features with implementations (e.g., via removal if implementer interest waned).
    locator: Goals(“don’t write fiction” rule)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4, TH07-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 常に変わる Living Standard の特定時点を参照したい場合のために、各コミット時点の凍結コピーを提供する。
    quote: Each Living Standard has a "Snapshot as of this commit" link that gives a frozen copy for such historical reference.
    locator: Anchor permanence
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4]
