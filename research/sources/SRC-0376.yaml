summary: 元 Google エンジニアによる Google の design doc 文化の解説(2020-07-06)。設計判断とトレードオフを中心に書く非形式な文書で、大規模案件で10〜20ページ、小さな改善は1〜3ページの mini design doc を勧める。
claims:
  - id: c1
    text: design doc は多忙な人が実際に読める短さが要り、大規模案件の適量は10〜20ページ程度。大きく超えるなら問題を分割する。小さな改善には1〜3ページの mini design doc もありうる(社内実務の経験則で、測定根拠は無い)。
    quote: Design docs should be sufficiently detailed but short enough to actually be read by busy people. The sweet spot for a larger project seems to be around 10-20ish pages.
