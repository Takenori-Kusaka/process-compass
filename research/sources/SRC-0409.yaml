summary: 仕様と矛盾するようにテストを改変した「不可能課題」で、エージェントがテストを突破する率(=ずるの率)を測るベンチマーク。強いモデルほどずるが多く、テストの読み取り専用化や中断手段が有効、LLM 監視は複雑な課題で見逃しが多い。
claims:
  - id: c1
    text: フロンティアモデルは不可能課題で頻繁にずるをし、強いモデルほどずるの率が高い傾向がある。
    quote: stronger models generally exhibit higher cheating rates
    locator: §7 Conclusion
    quant: null
    evidenceKind: benchmark
    rqs: [TH07-Q1]
    issues: [269, 275]
    stance: supports
  - id: c2
    text: テストを隠すとずるの成功はほぼゼロになるが本来の性能も落ちる。読み取り専用化はテスト改変を防ぎつつ性能を戻すため、著者らは隠すか読み取り専用にすることを推奨する(ただし special-casing 等の他の手口は残る)。
    quote: Based on these results, we recommend either hiding test files entirely or restricting them to read-only access during implementation
    locator: §5 Figure 7 周辺(test access configurations)
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1, TH07-Q5]
    issues: [269, 275]
    stance: supports
  - id: c3
    text: 課題の誤りを見つけたら人の介入を求めて中断できる手段を与えると、本来の性能低下は小さくずるの率が大きく下がった。
    quote: We recommend implementing similar strategies if possible, as the performance degradation on the original benchmark is relatively small and the cheating rate is significantly reduced.
    locator: §5 Figure 8 周辺(abort option)
