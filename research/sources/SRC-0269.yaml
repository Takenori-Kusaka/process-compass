summary: システム開発に携わるITエンジニア321名へのインターネット調査(2026年5月)。AIツール普及後にストレスが増えたとする回答が36.1%で、非エンジニア職からの「もっと早くできるだろう」という期待が主因に挙がる。
claims:
  - id: c1
    text: 2025年以降のAIツールの業務利用拡大でストレスが増えたかとの問いに、「非常にそう思う」7.8%、「ややそう思う」28.3%(計36.1%)が肯定した。
    quote: 「非常にそう思う」が7.8%、「ややそう思う」が28.3% という回答となりました。
    locator: Q5
    quant:
      value: 36.1%
      n: "321"
      design: インターネット調査(リサピー、2026-05-13〜05-20)
      population: システム開発に携わる日本のITエンジニア
    evidenceKind: survey
    rqs: [TH11-Q2]
    issues: []
    stance: contradicts
  - id: c2
    text: ストレス増と答えた人が挙げた新しいストレスは「非エンジニア職からのAIがあるならもっと早くできるだろうという期待やプレッシャー」が53.4%で最多。
    quote: ・非エンジニア職から「AIがあるならもっと早くできるだろう」という期待やプレッシャーを受けること：53.4%
    locator: Q6
    quant:
      value: 53.4%
      n: "116"
      design: インターネット調査(複数回答)
      population: Q5で肯定したITエンジニア
    evidenceKind: survey
    rqs: [TH11-Q2]
    issues: []
    stance: context
  - id: c3
    text: 最もストレスの高い開発フェーズは要件定義・仕様策定(23.4%)で、要因の最多は「事前に決まっていたはずのことが途中で変わること」(37.8%)。
    quote: ・事前に決まっていたはずのことが途中で変わること：37.8%
    locator: Q1〜Q2
    quant:
      value: 要件定義 23.4% / 途中変更 37.8%
