summary: Atlassian が自社製品 Rovo Dev の効果を、顧客2,500社の3,400リポジトリで傾向スコアマッチング付きの準実験(差の差)により測った報告。採用リポジトリは月あたりマージ PR が19%多い。時間短縮は社内6,200人超の自己申告を20パーセンタイル値で保守的に集計した。品質(変更失敗率)と満足度は未公表。
claims:
  - id: c1
    text: 無作為化できないため、採用リポジトリの導入前後の変化を傾向スコアで対応付けた非採用リポジトリと比べる準実験を用いた。
    quote: Because we could not randomly assign some teams to use Rovo Dev and others not to, we used a quasi-experiment methodology.
    locator: "Speed: teams merge 19% more PRs"
    quant: null
    evidenceKind: observational
    rqs: [TH11-Q3]
    issues: []
    stance: context
  - id: c2
    text: Rovo Dev 採用リポジトリは類似の非採用リポジトリより月あたりマージ PR が19%多かった(自社製品の自社測定)。
    quote: We found that Rovo Dev drives a 19% increase in merged PRs per repo.
    locator: "Speed: teams merge 19% more PRs"
    quant:
      value: +19% merged PRs per repo per month
      n: 3,400 repos from 2,500 customers
      design: quasi-experiment, difference-in-differences with propensity score matching
      population: Atlassian customer repos
    evidenceKind: observational
    rqs: [TH11-Q2]
    issues: []
    stance: contradicts
  - id: c3
    text: 自己申告は効果を過大に見せるため、平均でなく20パーセンタイルの申告値を保守的な推定として使った。
    quote: Self-reported data can overstate impact, so we used the time saved reported at the 20th percentile rather than the average as a conservative estimate.
    locator: "Efficiency: developers save 2-3 hours per week"
    quant:
      value: 2–3 hours/week saved (20th percentile)
      n: 6,200+ Atlassian developers
      design: self-reported survey
      population: Atlassian internal developers
    evidenceKind: survey
    rqs: [TH11-Q3]
    issues: []
    stance: context
