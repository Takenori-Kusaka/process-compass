    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [258]
    stance: qualifies
  - id: c6
    text: API クレジット不足のため、計画していた claude-sonnet-4-6 ではなくホストセッションのモデル(Opus 4.6)で全条件を実行した。生成器とレビュアが同一モデル・単一モデル系統。
    quote: insufficient API credits forced a switch to the Agent tool, which uses the host session’s model (Opus 4.6). We report this deviation transparently.
    locator: §4.2 Review Conditions
    quant:
