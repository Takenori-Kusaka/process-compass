summary: 同一モデル(Claude Opus 4.6)で、生成セッションと切り離した新規セッションで再レビューする CCR を 4 条件で比較した統制実験。254 メモが引く数値(30/150/360、F1 24.6/21.7/23.8/28.6、p=0.008、d=0.52、SR2 p=0.11)はすべて原典どおり。単著・単一モデル・有意差検定は Run 1(N=30)のみという限定がある。
claims:
  - id: c1
    text: 30 成果物(コード・技術文書・発表原稿)へ 150 件の欠陥を注入し、4 条件 × 3 回で 360 レビューを行った。
    quote: "We ran a controlled experiment: 30 artifacts (code, technical documents, presentation scripts) with 150 injected errors, tested under four review conditions"
    locator: Abstract / §4.1–4.2
    quant:
      value: 30 artifacts / 150 errors / 360 reviews
      n: 4 conditions × 30 artifacts × 3 runs
      design: controlled experiment
      population: Claude Opus 4.6 generated artifacts
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [258]
    stance: context
  - id: c2
    text: F1(3回平均、各条件 N=90)は CCR 28.6% / SR 24.6% / SA 23.8% / SR2 21.7%。CCR 対 SR の p=0.008、d=0.52 は、Run 1(N=30)だけを対象にした対応のある t 検定の値である。
    quote: CCR reached an F1 of 28.6%, outperforming SR (24.6%, p =0.008, d =0.52), SR2 (21.7%, p <0.001, d =0.72), and SA (23.8%, p =0.004, d =0.57).
    locator: Abstract; Table 2; Table 3
    quant:
      value: F1 28.6 vs 24.6 (+4.0pt), d=0.52
      n: N=90 per condition (F1); N=30 (t-test, Run 1)
      design: paired t-test on per-artifact F1
      population: code/document/script artifacts
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [258]
    stance: supports
  - id: c3
    text: 同一セッション 2 回目(SR2)は 1 回目(SR)に勝てない(p=0.11、Table 3 では 0.107、d=-0.30)。改善は反復ではなく文脈分離に由来すると切り分けている。
    quote: reviewing twice in the same session did not beat reviewing once ( p =0.11), which rules out repetition as an explanation for CCR’s advantage.
    locator: "Abstract / Table 3 (SR vs SR2: t=1.665, p=0.107, d=-0.30)"
    quant:
      value: p=0.107, d=-0.30
      n: N=30 (Run 1)
      design: paired t-test
      population: same artifacts
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [258]
    stance: supports
  - id: c4
    text: CCR の再現率は 27.1%(精度 31.5%)。注入欠陥の約 73% は最良条件でも見逃される。254 メモの「71% 見逃し」は F1 から逆算した値で、再現率ベースでは 72.9%。
    quote: CCR| 4.5| 1.4| 3.1| 3.6| 31.5| 27.1| 28.6
    locator: Table 2 (Finds/TP/FP/FN/Prec./Rec./F1)
    quant:
      value: Recall 27.1%, Precision 31.5%
      n: N=90
      design: controlled experiment
      population: 150 injected errors
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [258]
    stance: qualifies
  - id: c5
    text: 有意差検定は Run 1 の 30 成果物のみで行われ、F1 の平均値は 3 回分(N=90)。検定と報告値の母集団が異なる。
    quote: Statistical significance comes from paired t -tests on per-artifact F1 scores (Run 1, N =30), with Cohen’s d for effect size.
    locator: §4.3 Scoring
    quant:
      value: N=30 for tests
      n: "30"
      design: paired t-test
