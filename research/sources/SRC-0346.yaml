summary: PR が持ち込んだ秘匿情報アラートが未解決ならマージを止める ruleset 規則の告知。「head コミットの走査が完了していること」と「アラートが残っていないこと」の両方を条件にし、走査未実施を通過と扱わない(fail-closed)。
