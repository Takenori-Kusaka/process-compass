    text: 自己申告では、AIによる仕事の価値の変化は中央値1.4〜2倍、速度の変化は中央値3倍だった。
    quote: Participants self-reported a median 1.4–2x change in the value in their work due to AI tools. The median self-reported speed change (which we expect to be higher than value change) is 3x.
    locator: Summary
    quant:
      value: value 1.4–2x; speed 3x (median, self-reported)
      n: 349 technical workers (87 software engineers)
      design: convenience-sample survey, Feb–Apr 2026
      population: technical workers sourced from GitHub, academia, METR networks, X
    evidenceKind: survey
