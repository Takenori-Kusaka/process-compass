summary: 2026年2〜4月に技術職349人(うちソフトウェアエンジニア87人)へ行った自己申告調査。仕事の価値の変化は中央値1.4〜2倍、速度は3倍と自己申告されたが、METR 自身が便宜標本であり過大評価の可能性が高いと注記する。
