  - id: c5
    text: Copilot 承認後に新しいコミットが push されると、人間のレビュアーと同様に承認は取り消される。
    quote: If new commits are pushed after Copilot approves, its approval is dismissed just like a human reviewer’s
    locator: Turning on approvals
