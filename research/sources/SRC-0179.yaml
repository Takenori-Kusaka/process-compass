summary: AI レビュアの承認を必須承認に数えられるようにする機能の公式告知。既定は無効だが、前回 §6-3 の「プラットフォームが人間の承認を強制する」を条件付きにする反証資料。
claims:
  - id: c1
    text: 既定では Copilot は承認しないが、有効化すると Copilot の承認がリポジトリの必須承認ルールに算入される。
    quote: By default, Copilot will not approve pull requests. When enabled, Copilot can submit an approval that counts toward the repository’s required-approvals rule.
    locator: Turning on approvals
    quant: null
    evidenceKind: vendor-guidance
    rqs: [BASE-Q2, TH06-Q6, TH01-Q2]
    issues: [282, 258, 257, 248]
    stance: contradicts
  - id: c2
    text: パブリックプレビューで、Enterprise・Organization・Repository の 3 段で管理者が制御する(ファイルパス単位の限定も可能)。
    quote: This feature is available in public preview to GitHub Copilot Pro, Pro+, Max, Business, and Enterprise plans.
    locator: 冒頭
    quant: null
    evidenceKind: news-fact
    rqs: [BASE-Q2]
    issues: [282]
    stance: context
  - id: c3
    text: 全レビューに『承認可否の判定』が付くが、判定そのものはマージ要件に数えず、人がどう扱うかを決める材料として表示される。
    quote: An approval assessment alone does not count toward merge requirements. Copilot’s determination is surfaced so you can decide how to act on it.
    locator: Approval assessments
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6]
    issues: []
    stance: context
  - id: c4
    text: リポジトリ管理者は承認のオン/オフに加え、Copilot が承認してよいファイルパスを指定できる。AI 承認の適用範囲を変更対象（リスク）単位で絞る設計。
    quote: Admins can turn approvals on or off, and choose which file paths Copilot is allowed to approve.
    locator: Turning on approvals
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH01-Q1]
    issues: []
