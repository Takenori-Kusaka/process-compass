summary: 'JSQC 規格「プロセス保証の指針」の講習会案内ページの概要段落。品質保証を「顧客・社会のニーズを満たすことを確実にし、確認し、実証するために、組織が行うべき体系的活動」と書き、TQM の中核の一つとする。規格の用語編(JSQC-Std 01-001:2023、PDF は取得したが未読)の定義と同趣旨と思われるが、定義の原文はこのページの概要で読んだ。用語規格そのものの確認は残っている。'
