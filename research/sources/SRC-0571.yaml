summary: SonarQube Server 公式文書(取得時『Last updated 21 days ago』= 2026-09 上旬)。新規行が 20 行未満のとき重複とカバレッジの条件を無視する『fudge factor』が既定で有効で、プロジェクト単位で上書きできる。無視した条件が判定結果にどう表示・記録されるかはこのページに書かれていない。
claims:
