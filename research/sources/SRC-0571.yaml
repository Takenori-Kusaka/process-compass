    text: 品質ゲートは、カバー対象の新規行が 20 行に達するまでカバレッジ条件を、新規行が 20 行に達するまで重複条件を無視する。検査の有効化条件を対象の規模(行数の下限)で定める製品先例である。
    quote: The conditions on coverage are ignored until the number of new lines to cover is at least 20.
