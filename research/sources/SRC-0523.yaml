summary: 米 NRC が IEEE 1012-2004(V&V)と IEEE 1028-2008(レビュー・監査)を例外付きで是認した規制指針(遵守は任意)。V&V の独立性について、IEEE の「条件付き独立」を認めない一方、別会社であることまでは求めないと明記する。規制当局が規格の独立性の緩和規定を退けた反例として読める。curl は 403 で、tavily_extract で全文を取得した。
claims:
  - id: c1
    text: NRC は、IEEE 1012-2004 附属書 C 表 C.1 が新設した「条件付き独立」の選択肢を受け入れない。規格が用意した独立性の緩和を規制当局が退けた例である。
    quote: The new IEEE concept of conditional independence in Annex C, Table C.1 is not acceptable to the NRC staff.
    locator: B. Discussion, Description of Change
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [254]
    stance: qualifies
  - id: c2
    text: V&V の責任が開発組織と別の組織に置かれるという IEEE 1012 の文言について、NRC は独立 V&V を別会社が行うことまでは意味しないと解釈する。
    quote: The NRC staff position is that this does not mean that a separate company should perform independent V&V.
    locator: C. Staff Regulatory Guidance 3
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [254]
    stance: qualifies
  - id: c3
    text: 設計の妥当性の検証・点検は、設計者以外の者が行うことが要件である(10 CFR 50 附属書 B 基準 III)。
    quote: requiring that those who perform the verification and checking be persons other than the designers
    locator: C. Staff Regulatory Guidance 3
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: [254]
    stance: context
  - id: c4
    text: V&V を外部組織が実施した場合でも、V&V の十分性とソフトウェア品質の最終責任は申請者・事業者に残る。作業の担い手と結果責任を分けて書いている。
    quote: The applicant or licensee has ultimate responsibility for the adequacy of V&V and the quality of subsequent safety system software.
    locator: C. Staff Regulatory Guidance 3
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2]
    issues: []
    stance: supports
  - id: c5
    text: 開発ツールそのものへの V&V 作業(立会い・レビュー・試験)は、ツールで作られたソフトウェアがツール由来の欠陥を検出できる V&V を受けるなら不要とする。示せない場合はツール開発に本指針を適用する。
    quote: not required for software tools, provided the software that is produced using the tools is subject to V&V activities that will detect flaws introduced by the tools
    locator: C. Staff Regulatory Guidance 6
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c6
    text: IEEE 1028 の 2008 年版は 1997 年版との主な差として、アノマリー(指摘)の順位付けと報告の規定(6.8.3)を追加した。レビュー指摘の様式を規格が定めている例である。
    quote: One of the main differences between the 2008 and 1997 versions of IEEE Std. 1028 is the addition of an anomaly ranking and reporting found in Clause 6.8.3.
    locator: B. Discussion, Reason for Revision
    quant: null
    evidenceKind: normative
    rqs: [TH06-Q6]
    issues: []
    stance: context
