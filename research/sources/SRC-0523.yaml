      c1:
        verdict: match
        extractedValue: IEEE Std. 1012-2004、Annex C、Table C.1。conditional independence は "not acceptable to the NRC staff"
        extractedQuote: The new IEEE concept of conditional independence in Annex C, Table C.1 is not acceptable to the NRC staff.
        locator: B. Discussion, Description of Change(p.4)。同旨が C. Staff Regulatory Guidance 8 Annexes の Annex C の項(pp.10-11)にもある
        note: curl は nrc.gov で Access Denied(Akamai)。本文は tavily_extract(advanced)で全文取得した。p.10-11 には "In Table C.1 the new form of independence provides a conditional option which is not acceptable to the NRC." とあり、Annex C 自体も不採用("does not endorse this annex, because it provides inadequate guidance")。「独立性の緩和」という評価語は原文にない。
      c2:
        verdict: match
        extractedValue: IEEE Std. 1012-2004 の Clause C.4.1
        extractedQuote: '"is vested in an organization that is separate from the development organization." The NRC staff position is that this does not mean that a separate company should perform independent V&V.'
        locator: C. Staff Regulatory Guidance 3. Independence of Software Verification and Validation(p.8)
        note: 直後に "However, the requirements specified in Criteria I and III of Appendix B described above must be met." が続く。該当の文言は附属書 C(C.4.1)にあり、附属書 C は本指針で不採用とされている。
      c3:
        verdict: match
        extractedValue: 10 CFR Part 50 Appendix B、Criterion III
        extractedQuote: an independence requirement for the verification and checking of the adequacy of the design, requiring that those who perform the verification and checking be persons other than the designers.
        locator: C. Staff Regulatory Guidance 3. Independence of Software Verification and Validation(p.7)
        note: 引用の主語は "Criterion III imposes"(字数の都合で省いた)。C 節冒頭に "the cited criteria refer to Appendix B to 10 CFR Part 50 unless otherwise noted" とある。同じ位置 3 の後段には "performed by individuals or groups other than those who prepared the original design" という言い回しもある。
      c4:
        verdict: match
        extractedValue: applicant or licensee has ultimate responsibility(V&V の十分性と、その後の安全系ソフトウェアの品質)
        extractedQuote: The applicant or licensee has ultimate responsibility for the adequacy of V&V and the quality of subsequent safety system software.
        locator: C. Staff Regulatory Guidance 3. Independence of Software Verification and Validation(p.7)
        note: 引用の直後に "This is particularly important when an external organization has performed the V&V tasks" が続く。続く文は "In these cases, the applicant or licensee is not relieved of the responsibility for ensuring that the V&V and subsequent software quality satisfy NRC requirements for reliability."。外部組織の例として挙がるのは、NRC 承認済みの商用グレード製品の取得。「担い手と結果責任を分けて書いている」は主張側の解釈で、原文にその言い回しはない。
      c5:
        verdict: match
        extractedValue: "witnessing, reviewing, and testing は不要(条件: ツールで作ったソフトウェアが、ツール由来の欠陥を検出する V&V を受けること)。示せなければ本 RG の規定をツール開発に適用"
        extractedQuote: not required for software tools, provided the software that is produced using the tools is subject to V&V activities that will detect flaws introduced by the tools.
        locator: C. Staff Regulatory Guidance 6. Tools for Software Development(p.9)
        note: 引用の主語は "However the V&V tasks of witnessing, reviewing, and testing are"。引用の直後に "If this cannot be demonstrated, the provisions of this RG are applicable to the development of tools." が続く。直前に "Tools used in the development of safety system software should be handled according to IEEE Std. 7-4.3.2-2003, as endorsed by RG 1.152." があり、ツールの扱い全体はそちらに従う前提になっている。
