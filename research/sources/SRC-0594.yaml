summary: DX AI Measurement Framework の原典 PDF(6 ページ)。指標を利用・影響・費用の3次元に分け、Table 1 に AI 支援 PR の割合、AI 生成コードの割合、時間節約、AI 支出、エージェントの人時換算などを列挙する。コード生成量の指標は操作されやすいと警告する。Web 版(getdx.com/research/measuring-ai-code-assistants-and-agents)では表が画像のため PDF を読んだ。
claims:
  - id: c1
    text: DX AI Measurement Framework は、AI コード支援とエージェントの測定を利用(utilization)・影響(impact)・費用(cost)の3次元で構成する。
    quote: "requires focusing on three key dimensions: utilization, impact, and cost."
    locator: The framework
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q1]
    issues: []
    stance: supports
  - id: c2
    text: 利用の指標には、AI ツールの DAU/WAU、AI 支援 PR の割合、コミットされたコードのうち AI 生成の割合、エージェントに割り当てたタスク数が並ぶ。
    quote: Percentage of committed code that is AI-generated
    locator: "Table 1: DX AI Measurement Framework / Utilization"
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 費用の指標は、AI 支出(総額と開発者1人あたり)、開発者1人あたりの正味の時間利得(時間節約 − AI 支出)、エージェントの時間単価(人時換算 ÷ AI 支出)の3つである。
    quote: Net time gain per developer (time savings - AI spend)
    locator: "Table 1: DX AI Measurement Framework / Cost"
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q1, TH11-Q3]
    issues: [274]
    stance: supports
  - id: c4
    text: エージェントは独立した貢献者ではなく、監督する開発者・チームの延長として測るよう勧める。チームの PR スループットには、その指揮下のエージェントが作った PR を含める。
    quote: it's important to include both human-authored pull requests and those authored by agents operating under that team's direction.
    locator: Measure agents as extensions of teams and individuals
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q1, TH11-Q3]
    issues: []
    stance: supports
  - id: c5
    text: コード生成量のような指標は操作(gaming)に特に弱いと明記し、個人評価への利用とトップダウンの強制を避けるよう求める。測定値ではなくベンダーの指針である。
    quote: Metrics like code generation volume are particularly susceptible to gaming.
    locator: How to roll out metrics
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH11-Q3, TH07-Q1]
    issues: [274]
    stance: supports
