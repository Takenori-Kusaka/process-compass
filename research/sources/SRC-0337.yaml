claims:
  - id: c1
    text: 安全・コンプライアンス上の理由で早める場合を除き、モデル退役前の最低通知期間を定める。例外として、通知期間より早い退役がありうることも明記している。
    quote: "Unless safety or compliance concerns require a faster timeline, we provide the following minimum notice periods before model retirement:"
    locator: Model deprecation notice periods
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 通知期間の目的を、推奨後継モデルの評価、アプリケーション挙動の試験、移行の完了に置く。モデル切替を再検証の契機として扱う前提である。
    quote: These notice periods give customers time to evaluate recommended replacement models, test application behavior, and complete migrations before a model is no longer available.
    locator: Model deprecation notice periods
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q3]
