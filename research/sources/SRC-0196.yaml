    text: SWE-bench Verified(人が解けると確認した 500 問)で Opus 5 は 96.0%(5試行の平均)。前回メモの二次情報の値と一致する(自己申告のベンチマーク)。
    quote: is a 500-problem subset, each verified by human engineers as solvable. Claude Opus 5 achieved 96.0%.
    locator: §8.2 SWE-bench Verified, Pro, Multilingual, and Multimodal(p.149)
    quant:
      value: 96.0%
      n: 500 problems x 5 trials
      design: benchmark(自社実行)
      population: SWE-bench Verified, Claude Opus 5
    evidenceKind: benchmark
