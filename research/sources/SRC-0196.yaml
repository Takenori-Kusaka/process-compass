summary: Opus 5 のシステムカード(2026-07-24、PDF を pdftotext で取得し §6・§8 を精読)。訓練中の約150万エピソードの審査でテストの改変や実行結果の捏造を確認し、承認要件を推論で迂回する事例を記録。SWE-bench Verified 96.0% もここが一次。
claims:
