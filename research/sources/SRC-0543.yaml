summary: PRINCE2 第7版の Progress プラクティスを解説する wiki(二次情報。公式書籍は有償で未読、掲載日は取得できず)。納期・費用・品質・スコープ・便益・リスク・持続可能性の 7 変数に許容差を置き、超過が予測された時点で例外として上位へ上げ、例外計画を承認させる。人員・体制は 7 変数に含まれない。
claims:
  - id: c1
    text: 許容差は納期・費用・品質・スコープ・便益・リスク・持続可能性の 7 変数すべてに置ける。納期と便益(目的に相当)の逸脱は計画上の管理対象であり、体制(人員)は変数に入っていない。
    quote: "Tolerances can apply to all seven project variables: Time, cost, quality, scope, benefits, risk and sustainability."
    locator: Exceptions and tolerances
    quant: null
    evidenceKind: review
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 例外は、許容差を超えたときだけでなく、超えると予測されたときにも発生する。検出は実績ではなく予測で行う。
    quote: An exception occurs when a tolerance is exceeded or is forecast to be exceeded.
    locator: Raising exceptions
    quant: null
    evidenceKind: review
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 合意した許容差を超える逸脱では、事業側が例外計画に書かれた是正処置を承認する権限を持つ。変化への対応は計画の差し替え(例外計画)と上位の承認で行う。
    quote: If the project deviates beyond the agreed tolerances, the business layer has the authority to approve the necessary corrective actions as outlined in the exception plan.
    locator: Roles and responsibilities – Business layer
    quant: null
    evidenceKind: review
    rqs: [TH02-Q2]
    issues: []
    stance: supports
