summary: Qt・VTK・ITK でコードレビューのカバレッジ・参加度・専門性とリリース後欠陥の関係を調べた実証研究(反証探索で採用)。レビューという関門は品質と有意に結び付く。ただしカバレッジ(通したかどうか)だけでは欠陥の少なさを保証しない。
claims:
  - id: c1
    text: レビューのカバレッジ・参加度・専門性はいずれもソフトウェア品質と有意に結び付いており、レビューが不十分なコードは品質に悪影響を与える。関門を増やして品質が上がる側の実証である。
    quote: we find that code review coverage, participation, and expertise share a significant link with software quality.
