summary: safe-settings は、リポジトリの設定を宣言し、PR で差分を dry-run で示し、マージで適用する。Webhook は届く保証が無いため、CRON で定期の適用を設定でき、乖離への対処になりうる(任意の機能。#364 の照合で改めた)。#315 で、実環境の統制の定期の再確認を課す案の前例として引き、本標準では周期を課さず変化点と G-8 の機械の読み取りに留める判断の比較の対象にした。
claims:
  - id: c1
    text: 非既定のブランチで設定を変えて PR を作ると、dry-run で検証し、PR の構成を基底のブランチの構成と比べて、その PR が持ち込む変更だけを報告する。Webhook は届く保証が無いため、CRON 環境変数で定期の適用を設定でき、構成の乖離への対処になりうる。
    quote: If the settings are changed on a non-default branch and a PR is created to merge the changes, the app runs in a `dry-run` mode to evaluate and validate the changes. Checks pass or fail based on the `dry-run` results. The dry-run compares the PR's config against the **base branch** config, so the check run and PR comment report only the changes the PR itself introduces (see [Dry-run PR comment](#dry-run-pr-comment)).
    locator: README (冒頭の番号付き項目 1 / Dry-run PR comment / Schedule)
