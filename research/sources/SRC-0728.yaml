summary: 'フリーランス・事業者間取引適正化等法と、独占禁止法・中小受託取引適正化法との適用関係を公正取引委員会が示した文書(全2頁)。#436 は、両法のいずれにも違反する行為の勧告の扱い(原則としてフリーランス法を優先し、例外がある)を、第8章「計算資源の負担を決める」の外部の制約の注記に引いた。'
claims:
- id: c1
  text: フリーランス法と中小受託取引適正化法のいずれにも違反する行為は、原則としてフリーランス法を優先して適用し、同法の勧告の対象となった行為について重ねて取適法で勧告しない。ただし、行為の全体について取適法を適用することが適当であると公正取引委員会が考えるときは、取適法で勧告することがある。
  quote: 本法と取適法のいずれにも違反する行為については、原則として本法を優先して適用し、本法第８条に基づく勧告の対象となった行為について、重ねて取適法第１０条に基づき勧告することはない。ただし、本法と取適法のいずれにも違反する行為を行っている事業者が取適法のみに違反する行為も行っている場合において、当該事業者のこれらの行為の全体について取適法を適用することが適当であると公正取引委員会が考えるときには、本法と取適法のいずれにも違反する行為についても取適法第１０条に基づき勧告することがある。
  locator: 3 本法と取適法との関係(1頁)
