summary: ソフトウェアライフサイクルプロセスの基幹規格が 2026-04 に第2版へ改訂された。公開プレビュー(まえがき・序論・適用範囲・参考文献)を読んだ。主な変更は技術プロセスの明確化とアジャイル記述の拡充で、公開部分の変更点に AI への言及は無い。
claims:
