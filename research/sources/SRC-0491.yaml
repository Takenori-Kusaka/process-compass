summary: ソフトウェアライフサイクルプロセスの基幹規格が 2026-04 に第2版へ改訂された。公開プレビュー(まえがき・序論・適用範囲・目次・参考文献)を読んだ。主な変更は技術プロセスの明確化とアジャイル記述の拡充で、公開部分の変更点に AI への言及は無い。
claims:
  - id: c1
    text: 第2版の主な変更は、技術プロセス(事業分析・アーキテクチャ・実装・統合・運用・保守)の明確化、リスク管理と構成管理の改善、第5章のアジャイル記述の拡充、MBSSE 附属書の改訂である。
    quote: new content in Clause 5 on concept and system definition, and expanded content on agile methods, process application, and system concepts.
    locator: Foreword(main changes)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1]
    issues: []
    stance: context
