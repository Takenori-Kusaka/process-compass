summary: 'ISO 26262-2 の公開プレビュー(目次・まえがき・箇条1〜5 の一部・表の解釈)。箇条 4.2 は、適合の主張で全要求を満たすことを求め、除外は「テーラリングで該当しないと示した」か「不適合を受け入れる根拠があり、その根拠が評価済み」の2つに限る。6.4.5(テーラリング)の本文はプレビューに無く未読。Issue #327 の審議で 2026-11-17 に pdftotext で抽出した(一度だけ)。'
