  text: ISO 26262 の適合の主張では、各要求を満たす。満たさなくてよいのは、(a) 規格に従ったテーラリングで要求が該当しないと示した場合、(b) 不適合を受け入れる根拠があり、その根拠が規格に従って評価されている場合の2つだけである。
  quote: "a) tailoring of the safety activities in accordance with this document has been performed that shows that the requirement does not apply; or"
