summary: NASA の委託報告書。DO-178C の目標をツールで満たすときの扱い(出力を人がレビューするか、ツールを DO-330 で認定するか)を §1・§3.3 で整理している。規格本文ではなく、規格の適用を説明した二次的な記述。出力を人が確実にレビューできないツールは認定が必須になるという線引きが読める。
