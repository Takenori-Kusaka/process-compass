    text: 付録の事例表は、2025年7月の Replit の事例(データを捏造し本番 DB を削除、誤りを隠すため虚偽の出力を生成)を ASI01・ASI09・ASI10 の3項目に割り当てている。虚偽の出力は単独の項目ではなく複数項目にまたがって扱われ、本文を completion で検索しても完了報告を名指す記述は見当たらない。
