summary: 台帳の案内ページ(genai.owasp.org/resource/...)から配布される PDF 本文。ASI09・ASI10 と付録の事例表を読み、台帳に無い主張だけを書いた。虚偽の完了報告を名指す独立項目は無く、ASI10 と ASI09 の例示に分かれて入る。
claims:
  - id: c1
    text: ASI10 Rogue Agents は、意図した機能や許可された範囲から逸脱し、有害・欺瞞的・寄生的に振る舞うエージェントと定義される。焦点は最初の侵入ではなく、逸脱が始まった後の挙動の完全性と統制の喪失に置く。
    quote: Rogue Agents are malicious or compromised AI Agents that deviate from their intended function or authorized scope, acting harmfully, deceptively, or parasitically
    locator: "ASI10: Rogue Agents — Description(p.36)"
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3]
    issues: []
    stance: supports
  - id: c2
    text: ASI10 の例示4は reward hacking を挙げ、欠陥のある指標を突いて誤解を招く結果を出す挙動を Rogue Agents の一類型に置く。虚偽の報告に最も近い分類はこの例示である。
    quote: Agents game their assigned reward systems by exploiting flawed metrics to generate misleading results or adopt aggressive strategies misaligned with the original goals.
    locator: ASI10 — Common Examples of the Vulnerability 4(p.36)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH07-Q1]
    issues: []
    stance: supports
  - id: c3
    text: ASI10 の例示1は、従っているように見せながら隠れた欺瞞的な目標を追う挙動(goal drift and scheming)を挙げる。原因は間接プロンプトインジェクションか目標の衝突としている。
    quote: "Goal Drift and Scheming: Agents deviate from intended objectives, appearing compliant but pursuing hidden, often deceptive, goals due to indirect prompt injection or conflicting objectives."
    locator: ASI10 — Common Examples of the Vulnerability 1(p.36)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH07-Q1]
    issues: []
    stance: supports
  - id: c4
    text: ASI09 の攻撃シナリオ4は、エージェントがもっともらしい監査上の根拠を捏造し、レビュアがそれを承認する経路を挙げ、原因が乗っ取り・汚染・ハルシネーションのどれでも同じ結果になるとする。
    quote: The agent fabricates plausible audit rationales to justify a risky configuration change. Regardless of root cause (hijack, poisoning, or hallucination), the reviewer approves
    locator: ASI09 — Example Attack Scenarios 4(p.34)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH06-Q4]
    issues: []
    stance: supports
  - id: c5
    text: ASI09 の対策4は、利用者に示すリスクの要約をモデルが生成した根拠ではなく平易な言葉の要約にし、疑わしい挙動を通報できる手段を用意するよう求める。
    quote: provide plain-language risk summary (not model-generated rationales) and a clear option for users to flag suspicious or manipulative agent behavior
    locator: ASI09 — Prevention and Mitigation Guidelines 4(p.35)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3, TH06-Q6]
    issues: []
    stance: supports
  - id: c6
    text: ASI09 の対策9は、承認済みの作業手順の基準と実際の行動列を比べ、検証手順の省略などを欺瞞や逸脱の兆候として警告する計画逸脱検知を挙げる。
    quote: Compare agent action sequences against approved workflow baselines and alert when unusual detours, skipped validation steps, or novel tool combinations indicate possible deception or drift.
    locator: ASI09 — Prevention and Mitigation Guidelines 9(p.35)
    quant: null
    evidenceKind: normative
    rqs: [TH07-Q1, TH12-Q3]
    issues: []
    stance: supports
