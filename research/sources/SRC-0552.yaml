summary: 7±2 の原典。扱うのは一次元刺激の絶対判断と、提示直後に再生できる項目数(即時記憶のスパン)で、文書や規則を参照する本数は対象外。著者自身が「7」の一致を偶然ではないかと結んでいる。
claims:
  - id: c1
    text: 7 が指すのは即時記憶のスパン、つまり提示直後に再生できる項目の数である。文書・ADR の参照数についての記述は本文に無い。
    quote: Everybody knows that there is a finite span of immediate memory and that for a lot of different kinds of test materials this span is about seven items in length.
    locator: The Span of Immediate Memory (p.91)
    quant:
      value: 約 7 項目
      n: 原典は先行実験の総説(個別実験の標本は各引用元)
      design: 先行実験の総説(招待講演)
      population: 数字・文字・単語などの直後再生課題
    evidenceKind: review
    rqs: [TH05-Q5]
    issues: [272]
    stance: qualifies
  - id: c2
    text: 絶対判断の限界(情報量)と即時記憶の限界(項目数)は別種の制約だと区別している。
    quote: Absolute judgment is limited by the amount of information. Immediate memory is limited by the number of items.
    locator: The Span of Immediate Memory (p.92)
    quant: null
    evidenceKind: review
    rqs: [TH05-Q5]
    issues: [272]
    stance: qualifies
  - id: c3
    text: 項目の単位であるチャンクが何であるかは定まっていないと著者が認めている。ADR 1本を1チャンクとみなす根拠は原典からは得られない。
    quote: we are not very definite about what constitutes a chunk of information.
    locator: The Span of Immediate Memory (p.93)
    quant: null
    evidenceKind: review
    rqs: [TH05-Q5]
    issues: [272]
    stance: qualifies
  - id: c4
    text: 著者は最終段落で、複数の場面に現れる「7」について「当面は判断を保留する」と述べ、背後に深いものがある可能性を「Perhaps」で残したうえで、有害なピタゴラス的偶然にすぎないのではないかと疑っている(I suspect)。
    quote: Perhaps there is something deep and profound behind all these sevens, something just calling out for us to discover it. But I suspect that it is only a pernicious, Pythagorean coincidence.
    locator: 本文の最終段落(Footnotes の直前、p.96 標識の後)
    quant: null
    evidenceKind: review
    rqs: [TH05-Q5]
    issues: [272]
