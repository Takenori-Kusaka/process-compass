summary: 自己整合・自己改良・討論・MoA を同一計算量で比較した ACL 2026 SRW 論文。同一予算で討論は自己整合を +1.3pt 上回るが、使用モデルは Llama 3.1 8B/70B(4bit 量子化)の単一系統に限られる。
claims:
  - id: c1
    text: 同一の計算予算では、討論は自己整合を1.3ポイント、mixture-of-agents は2.7ポイント上回った。先行研究(討論3体・2巡、GSM8K)は同程度の計算予算で討論が自己整合を上回らないと報告しているが、本論文はMMLU-Pro・BBHで評価しており、直接の追試ではない。
    quote: With an equal computing budget, debate and mixture-of-agents outperform self-consistency by 1.3% and 2.7% points, respectively.
    locator: Abstract(先行報告は §2 Related Work の Huang et al. (2024))
    quant:
      value: +1.3pt(討論)/ +2.7pt(MoA)
      n: 34 構成 x 100 超の評価、MMLU-Pro・BBH、Llama 3.1 8B/70B
      design: benchmark (Pareto-front analysis under matched compute)
      population: 推論ベンチマーク
    evidenceKind: benchmark
    rqs: [TH06-Q3]
    issues: [258]
