  - id: c1
    text: 2026-03-04 に Claude Code の既定 reasoning effort を high から medium に下げ、利用者の知能低下報告を受けて 4/7 に撤回した(利用者の操作なしに挙動が変わる変化点)。
    quote: On March 4, we changed Claude Code's default reasoning effort from high to medium to reduce the very long latency
