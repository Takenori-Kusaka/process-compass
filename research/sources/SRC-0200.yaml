    text: 劣化報告は当初、通常のフィードバックの揺らぎと区別できず、社内利用も評価も問題を再現しなかった。
    quote: they were challenging to distinguish from normal variation in user feedback at first, and neither our internal usage nor evals initially reproduced the issues identified.
    locator: 冒頭
    quant: null
    evidenceKind: case-report
    rqs: [TH02-Q3, TH11-Q3]
    issues: []
    stance: supports
  - id: c3
    text: 思考履歴を毎ターン消すバグは、複数の人と自動のコードレビュー、単体・E2E テスト、自動検証、ドッグフーディングを全て通過した(多層の検査が同時に見逃した実例)。
    quote: The changes it introduced made it past multiple human and automated code reviews, as well as unit tests, end-to-end tests, automated verification, and dogfooding.
    locator: A caching optimization that dropped prior reasoning
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q3, TH07-Q1]
    issues: []
    stance: supports
  - id: c4
    text: 事後の再テストで、必要なリポジトリを文脈として与えると Opus 4.7 は当該バグを見つけ、Opus 4.6 は見つけなかった(レビューの文脈接地とモデル世代の効果)。
    quote: When provided the code repositories necessary to gather complete context, Opus 4.7 found the bug, while Opus 4.6 didn't.
    locator: A caching optimization that dropped prior reasoning
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q5]
    issues: []
    stance: supports
  - id: c5
    text: システムプロンプトに加えた長さ制限の1行(ツール呼び出し間は25語以下等)が、行ごとのアブレーションで評価の1つに 3% の低下を生んだ(社内評価では数週間回帰が出なかった)。
    quote: One of these evaluations showed a 3% drop for both Opus 4.6 and 4.7.
    locator: A system prompt change to reduce verbosity
    quant:
      value: -3%
      n: 1 of a broader set of evaluations
      design: line-level ablation of system prompt
      population: Opus 4.6 / 4.7 in Claude Code
    evidenceKind: controlled-experiment
    rqs: [TH03-Q3]
    issues: []
    stance: supports
  - id: c6
    text: 再発防止として、知能と引き換えになりうる変更には soak 期間・広い評価・段階的展開を設け、システムプロンプト変更ごとにモデル別評価を回す。
    quote: For any change that could trade off against intelligence, we'll add soak periods, a broader eval suite, and gradual rollouts so we catch issues earlier.
    locator: Going forward
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q4, TH02-Q3]
    issues: []
