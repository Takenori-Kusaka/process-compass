    text: '規制業界の職務の分離は、変更管理委員会や専任チームが無くても満たせる。方法は2つ。コードの作成に関わっていない人がレビューし、記録管理システムに承認を記録する。または、すべての変更を完全に自動化したパイプラインに通さなければ本番へ入れない。どちらでも、変更の出どころ・受けた検証・誰がいつ承認したかの完全な記録を、監査人が得られる。'
