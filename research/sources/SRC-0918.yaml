summary: 'ソフトウェアの提供の性能を調べた調査の書。変更の承認を4つのやり方で比べ、チームの外の承認は速度を落とし、安定性を上げないと報告する。規制業界の職務の分離は、作成に関わらない人のレビューの記録か、完全に自動化したパイプラインで満たせるとする。'
claims:
  - id: c1
    text: '変更の承認を、チーム外の承認が必須、高リスクの変更だけ承認、ピアレビューだけ、承認なし、の4つで比べた。高リスクだけの承認と性能に相関は無い。性能が高いのはピアレビューだけと承認なしで、最も低いのは外部の承認が必須の形。外部の承認は、リードタイム・デプロイ頻度・復旧時間と負の相関があり、変更失敗率とは相関が無い。軽い承認とデプロイメントパイプラインの併用を勧める。'
