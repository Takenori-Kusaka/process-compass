summary: Basecamp の Shape Up 第 3 章。appetite(時間予算)は見積の逆で「数字から始めて設計で終わる」制約であり、生のアイデアへの既定応答は「Interesting. Maybe some day.」でバックログに入れない。問題を「何を作れるか」から「何が本当にうまくいっていないか」へ絞り直す手順を示す。
claims:
  - id: c1
    text: appetite は見積とはまったく別物。見積は設計から始まり数字で終わるが、appetite は数字から始まり設計で終わる創造的制約である。
    quote: An appetite is completely different from an estimate. Estimates start with a design and end with a number. Appetites start with a number and end with a design.
    locator: Fixed time, variable scope
    quant:
      value: Small Batch 1-2 weeks / Big Batch 6 weeks
      n: n/a
      design: practice description
      population: Basecamp
    evidenceKind: expert-opinion
    rqs: [TH09-Q2]
    issues: [250]
    stance: context
  - id: c2
    text: 方針が定まらないアイデアへの既定応答は「面白い、いつか」というやわらかな No で、バックログには入れず、重要かどうかを学ぶ余地を残す。
    quote: "Our default response to any idea that comes up should be: “Interesting. Maybe some day.” In other words, a very soft “no” that leaves all our options open. We don’t put it in a backlog."
    locator: Responding to raw ideas
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: context
  - id: c3
    text: スコープが大きすぎるときは「何を作れるか」ではなく「何が本当にうまくいっていないか」へ問いを反転して問題を絞る。
    quote: In that case we flip from asking “What could we build?” to “What’s really going wrong?”
    locator: Narrow down the problem
