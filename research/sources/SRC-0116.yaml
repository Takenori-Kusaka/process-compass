summary: ChatDev の多エージェント構成で 30 の SDLC タスクを走らせ、工程別(要求・設計・実装・レビュー・テスト・文書)のトークン配分を計測した査読前論文。コードレビュー工程が平均 59.4%、入力トークンが平均 53.9% を占める。ロール別の消費配分の先行例。
claims:
  - id: c1
    text: 多エージェント SE では反復的なコードレビュー工程が平均 59.4% のトークンを消費し、入力トークンが平均 53.9% を占める。費用の主因は初期生成ではなく検証・改良の反復。#274 のロール別消費と比較できる。
    quote: the iterative Code Review stage accounts for the majority of token consumption for an average of 59.4% of tokens. Furthermore, we observe that input tokens consistently constitute the largest share of consumption for an average of 53.9%
    locator: Abstract
    quant:
      value: 59.4% (Code Review); 53.9% (input)
      n: 30 SDLC tasks
      design: observational measurement in ChatDev
