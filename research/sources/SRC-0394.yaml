summary: PR の説明文・コミットメッセージの書き方(枠付け)が LLM のセキュリティレビューを左右することを 6 モデルで確認し、Claude Code と CodeRabbit のレビューパイプラインに脆弱性を再混入させる攻撃が 97% 成功、PR 説明文の除去で半数が回復すると示した。
claims:
  - id: c1
    text: 6つの LLM・5つの枠付け条件にわたる大規模な探索的研究により、PR メタデータの枠付けが脆弱性判定を左右する枠付け効果は、LLM ベースの脆弱性検出における系統的かつ広範な現象であると示された。
    quote: a large-scale exploratory study across 6 LLMs under five framing conditions, establishing the framing effect as a systematic and widespread phenomenon in LLM-based vulnerability detection.
    locator: Abstract / §I contributions / §III
    quant:
      value: 6 LLM x 5 枠付け条件で一貫
      n: 約 10,000 応答
      design: controlled experiment
      population: LLM による脆弱性検出
    evidenceKind: controlled-experiment
    rqs: [TH06-Q4, TH10-Q4]
    issues: [268, 271]
    stance: supports
  - id: c2
    text: LLM で反復改良した PR メタデータによる脆弱性再混入攻撃は、実在の 2 レビューパイプラインに対して 33 件中 32 件(97%)成功した。
    quote: Our refinement attack, on the other hand, is successful in 32/33 (97%) cases
    locator: Abstract / §IV-C
    quant:
      value: 97%(32/33)
      n: 33 CVE、20 実プロジェクト、Claude Code・CodeRabbit の 2 パイプライン
      design: controlled experiment (isolated replay)
      population: 自動コードレビュー(ACR)パイプライン
    evidenceKind: controlled-experiment
    rqs: [TH06-Q4]
    issues: [268]
    stance: supports
  - id: c3
    text: レビュアへ渡す前に PR 説明文を除去すると、攻撃で見逃した 32 件中 16 件(50%)で検出が戻った。検証者の入力から作成者の主張を切り離すことが緩和策になる。
    quote: Redacting the PR description before passing the PR to ACR (D-1) recovers detection in 16/32 affected cases (50%).
    locator: §IV-C Defenses / Table III
    quant:
      value: 50%回復(16/32)
      n: 攻撃が成功した 32 件
      design: controlled experiment (debiasing ablation)
      population: 同上
    evidenceKind: controlled-experiment
    rqs: [TH06-Q4, TH06-Q6, TH10-Q4]
    issues: [257, 271]
    stance: supports
