summary: Codecov のステータスチェック設定の公式文書(dateModified 2025-11-11)。head に報告が無いときの既定は success(通過)で、未アップロードのフラグの扱いは include / exclude / pass から選ぶ。未測定を通過として記録する既定を持つ製品の例で、『未判定を区別して残す』側への反証になる。
claims:
  - id: c1
    text: head コミットにカバレッジ報告が無い場合の設定 if_not_found は既定が success で、報告が無くてもステータスは通過になる。『測定しなかった』と『通過した』が既定では同じ記録になる。
    quote: "Settings are 'success' and 'failure' the default is 'success'. failure: the status will fail if there is no report for the head success: the status will pass if there is no report for the head."
    locator: Advanced Configuration — if_not_found
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q4]
    issues: [254]
    stance: contradicts
  - id: c2
    text: カバレッジが新規にアップロードされなかったフラグのチェックは、通常どおり送る(include、既定)・送らない(exclude)・自動で通過させる(pass)から選ぶ。未測定を『送らない』として通過と区別する選択肢は用意されている。
    quote: "exclude: Status checks that haven't newly uploaded any flag coverage will not be sent. pass: Status checks that haven't newly uploaded any flag coverage will be passed automatically."
    locator: flag_coverage_not_uploaded_behavior
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q4]
    issues: [254]
    stance: qualifies
  - id: c3
    text: informational を true にすると、カバレッジの値や他の設定にかかわらずステータスは通過する。強制せず情報提示だけを行う状態を運用者が設定で切り替える方式である。
    quote: If true is specified the resulting status will pass no matter what the coverage is or what other settings are specified.
    locator: Advanced Configuration — informational
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH02-Q4]
    issues: [254]
    stance: supports
