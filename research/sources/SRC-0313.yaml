    text: Abstract は、AI 貢献を禁止するリポジトリで試したどの条件でもエージェントは貢献を辞退しなかったと書く。一方 Table 1 では、辞退と人への引き継ぎが 0% なのは無介入(Native)条件で、検証器のフィードバック後は辞退が最大 23%(GPT-5.5)、引き継ぎが 1 構成で 33%(3/9)と非ゼロであり、論文内で記述が食い違う。
