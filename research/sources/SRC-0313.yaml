    text: エージェントが(常時ロードされる AGENTS.md 以外の)ルールファイルを自発的に読んだのは実行の3.5%にすぎず、遵守率は低く不均一だった。
    quote: in merely 3.5% of the runs, and the rule compliance rate was low and uneven
