summary: AI 貢献ルール(禁止・開示義務・検証ゲート・人の承認)を持つ OSS 49リポジトリの106 Issue で、4つのエージェントがルールを読んで守るかを測った RepoComplianceBench。自発的にルールを読むのは3.5%、禁止リポジトリでの辞退と人への引き継ぎは0%。
claims:
