summary: INCOSE 要求記述ガイド V3.1(2022-05)。大学の教材置き場に公開されている全文 PDF を読んだ(正規の配布は INCOSE ストア。現行は V4、2023 年。V4 の公式要約シートにも R16『Avoid the use of “not.”』が残ることを確認)。R8 は逃げ道の句を、R9 は開いた句を、R16 は not を避けよと定める。第4章 R8・R9・R16 を読んだ。
claims:
  - id: c1
    text: R8 は『可能な限り』『必要に応じて』などの逃げ道の句を禁じ、その理由を、下位の開発者に要求を実装しない言い訳を与えるからと明記する。要求の書式が未達の正当化に使われる問題を、要求工学の指針が規則として扱っている。
    quote: Escape clauses give an excuse to the developer of the system at lower levels not to implement a need or requirement.
    locator: 4.1.8 R8 - /Accuracy/NoEscapeClauses, Elaboration
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: [269]
    stance: supports
  - id: c2
    text: R16 は要求文で not を避けよと定める。not は『決して〜ない』を含意し有限時間では検証できないため、その要求は正しくない(C8)とし、測れる肯定形へ書き換えさせる。禁止節を併記する方向とは逆の指針である。
    quote: The presence of "not" in a need or requirement statement implies "not ever", which is impossible to verify in a finite time.
    locator: 4.3.5 R16 - /NonAmbiguity/AvoidNot, Elaboration
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: [269]
    stance: contradicts
  - id: c3
    text: "R16 の例外として、範囲を定めれば検証できる制約(例: 赤色であってはならない。赤の範囲を規定する場合)は not を含んでよいとする。否定形の要求は、検証可能な範囲を添える条件で認められる。"
    quote: Which is stating a constraint and is verifiable, as long as the range of shades of red is stated
    locator: 4.3.5 R16, Exceptions and relationships
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: [269]
    stance: qualifies
  - id: c4
    text: R9 は『〜を含むがこれに限らない』『等』のような開いた句を禁じる。何が要るかを述べずに追加があることだけを含意し、検証できない要求を生むためである。
    quote: Open-ended clauses imply there is more required without stating exactly what.
    locator: 4.1.9 R9 - /Accuracy/NoOpenEnded, Elaboration
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q4]
    issues: [269]
    stance: supports
