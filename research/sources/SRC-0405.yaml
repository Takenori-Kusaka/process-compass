  - id: c3
    text: 全員が AI で実装している環境では、同じく AI がレビューしても新しい気づきが少ない。生成と検証が同質になると検証の付加価値が下がるという現場の観察。
    quote: そこにさらにAIがレビューしても、新しい気づきが少ない。
    locator: なぜ8%だったのか
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q3]
    issues: [258]
    stance: supports
  - id: c4
    text: 差分だけを見る CI 上の AI は事実確認ができず、初回テストで指摘 5 件中 3 件が事実誤認だった。指摘に実行結果や観測を伴わない様式の限界。
    quote: 初回テストで5件の指摘中3件が事実誤認だった。
