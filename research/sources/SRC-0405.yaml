summary: 株式会社BACKSTAGE が Qodo pr-agent を GitHub Actions で 1 か月運用し、AI 指摘 760 件の採用を全件集計した記録。採用率 8.2%(人間 91.9%)で運用を止め、テスト・静的解析・設計合意へ軸足を移した。
claims:
  - id: c1
    text: 1 か月で AI は週平均 253 件を指摘し採用率 8.2%、人間は週 12 件で採用率 92%。AI は PR 1 件あたり約 10 件、人間は 0.5 件を指摘した。
    quote: 人間の指摘は週12件で採用率92%。AIは週253件出して採用率8%。
    locator: 結果
    quant:
      value: AI 採用率 8.2% / 人間 91.9%
      n: AI 指摘 760 件(約 1 か月)、Resolve 操作者で自動集計
      design: case report (single team, before/after)
      population: BACKSTAGE の社内リポジトリ
    evidenceKind: case-report
    rqs: [TH06-Q6]
    issues: [257]
    stance: supports
  - id: c2
    text: 有効な指摘でも大量の微妙な指摘に埋もれて無視されていた。
    quote: 内容としては有効な指摘でもResolveされていない（＝無視されている）ケースがあった。
    locator: なぜ8%だったのか
    quant: null
