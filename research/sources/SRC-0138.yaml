summary: SAFe 公式の Spike 定義。技術的アプローチのリスク低減・要求理解・見積精度向上のための探索作業を Enabler Story として、通常のストーリーと同様に見積・実装・デモの対象にし、Epic の実現性判断にも使うとする。「Technical and Functional Spikes」以降はログイン壁で未読。ページは無日付の living document。
claims:
  - id: c1
    text: Spike の目的は、技術的アプローチのリスクを減らし、要求をよく理解し、ストーリー見積の信頼性を上げるための知識を得ること。ステージの後退ではなく通常のイテレーション内の作業として置かれる。
    quote: Their purpose is to gain the knowledge necessary to reduce the risk of a technical approach, better understand a requirement, or increase the reliability of a story estimate.
    locator: 冒頭定義
