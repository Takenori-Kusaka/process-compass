  - id: c11
    text: '建前と実態の乖離として、世の中の多くの人は正しいプロセスで開発すれば正しいソフトウェアができると信じており、品質事故の再発防止がプロセス順守の啓蒙や、未熟な品質保証を「番人」に置くことになりがちだと指摘する。'
    quote: 'ところが、世の中の多くの人は正しいプロセスで開発すれば正しいソフトウェアが完成すると信じているため、品質事故の再発防止策としてプロセス順守の啓蒙や未熟な品質保証を品質管理の番人とするケースを目の当たりにすることがある。'
    locator: 'p.30 付録 C-7 品質保証の本質(3)'
