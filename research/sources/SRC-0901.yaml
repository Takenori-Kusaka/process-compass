  - id: c10
    text: '品質保証部門の進化は「管理する」部門から「ありがたがれる、頼りにされる」部門への方向だと結論した。裏返せば、管理する部門と見られがちな実態がある。'
    quote: '結論としては「管理する品質保証部門から、ありがたがれる、頼りにされる品質保証部門」への進化である。'
    locator: 'p.21 付録 C-1 品質保証プロセス進化論(第 2 期)'
    quant: null
