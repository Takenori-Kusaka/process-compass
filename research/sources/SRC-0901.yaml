    label: SQiP ソフトウェア品質保証部長の会が発足
summary: '2009 年 11 月発足の品質保証部門長の会(10 年で 78 社 104 名)が、10 期分の討議を振り返った 32 ページの記念誌。品質保証部門長を「品質の最終責任者」と位置づけ、組織・出荷許可の権限・経営視点・アジャイル・人材育成などを討議した。第 1 期は品質保証の権限、標準化・品質管理の権限、出荷許可の権限とその方法をアンケートで調べたが、結果の数値は本書に無い。討議は部門長同士の経験と提言であり、効果の実証ではない。'
claims:
  - id: c1
    text: '会は、品質保証部門長を「品質の最終責任者」と呼ぶ。発足の背景は組込みソフトウェアの開発規模の爆発的な増加で、品質保証の在り方に各社が問題意識を持っていた。'
    quote: 'その中で品質の最終責任者である品質保証部門長が一堂に会し、会社の壁を越えて議論を始めることができたのは大きな一歩だったと思う。'
    locator: 'p.2 はじめに'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c2
    text: '品質保証部門長の悩みとして、プロジェクトごとの最適な品質保証活動と、組織全体の中長期の品質保証戦略の両方を考えながら、日々の業務に追われて根本の解決策が見いだせない、という声が多いと記す。'
    quote: 'ソフトウェア品質保証部門長は、プロジェクトに対する最適な品質保証活動や組織全体の中長期的な品質保証戦略がどうあるべきかなど様々な問題意識を持ちながらも、日々の業務に追われなかなか根本的な解決策が見いだせないという声をよく耳にする。'
    locator: 'p.2 1. SQiP ソフトウェア品質保証部長の会とは'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c3
    text: '第 1 期のアンケートは、品質保証の権限、標準化・品質管理の権限、出荷許可の権限とその方法を別々に調べた。権限が一つの部門に束ねられているとは限らないことを前提にした項目である。結果の数値は本書に無い。'
    quote: '・役割：品質保証の権限と標準化・品質管理の権限およびそれぞれの役割と責任範囲 ・出荷許可の権限とその方法'
    locator: 'p.6 3. 第1期 ① SQiP ソフトウェア品質保証実態アンケート(箇条書き 2 項目を連結)'
    quant: null
    evidenceKind: survey
    rqs: []
    issues: [461]
    stance: supports
  - id: c4
    text: '品質保証組織の在り方について、機能も位置づけも幅広く、ベストプラクティスは無いと結論した。製品カテゴリーと役割のパターンには関係がありそうだとも書く。自社の品質保証部門の機能を当然と思いがちだとの注意もある。'
    quote: '組織：組織としての在り方は機能・位置付けとも幅広く、ベストプラクティスはない、製品カテゴリーと役割のパターンは関係がありそうであることが判明、自社の品質保証部門の機能は当然であるとつい思いがちであるが、自社にとってあるべき姿の堀り下げが必要である。'
    locator: 'p.6 3. 第1期 ② 品質保証部最前線'
    quant: null
    evidenceKind: survey
    rqs: []
    issues: [461]
    stance: qualifies
  - id: c5
    text: '品質保証部門は、設計から試験までの各工程で成果物が完成し内容が十分かを確認して品質を判断する「プロセス中心型」と、実機で出荷試験をする「プロダクト中心型」に分かれる。第三者検証会社を含めた比較から、経営者へ先行投資と第三者検証会社の利用を提言することも重要とする。'
    quote: '設計から試験までの各プロセスで、成果物が完成しているか、その内容は十分かを確認することで、プロダクトの品質担保を判断している品質保証部門(プロセス中心型品質保証部門)が、品質保証の質を向上させるためには、どのような取り組みをすればいいかについて討議した。'
    locator: 'p.14 第10期 ⑤ プロセス中心型品質保証部門の品質保証の質の向上'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c6
    text: '工程の品質確保として、工程移行判定だけでなく工程開始判定を導入し、数値だけでなく設計内容を確認する、という改善策を提言した(第 2 期)。判定が数値だけに偏る問題の裏返しである。'
    quote: '各工程での品質確保：工程移行判定だけでなく工程開始判定プロセスの導入と各種の数値だけではなく、設計内容をチェックする。'
    locator: 'p.6-7 第2期 ② 品質保証部最前線(ページをまたぐ行を連結)'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c7
    text: '経営者は、当期損益に関する事項と出荷後の品質問題の報告を、責任を果たすために必要とするはずだと自己評価した。そのうえで「報告して判断を仰ぐだけでよいのか」という疑問が残るとし、品質保証部門の視野の狭さを経営者へのインタビューから確認した。'
    quote: '当期損益に関する事項や出荷後の品質問題の報告は、経営者が責任を果たすために必要事項であり役に立っているはずである。'
    locator: 'p.26 4. 経営視点からの品質向上を考える(第4期)'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c8
    text: '品質活動が二の次になるほどコストを絞ったプロジェクトでは、新しい案件の受注を止める判断を、現場を知る品質保証部門が経営陣へ言う必要があると提言した。納期とコストの優先が品質保証部門の指摘と衝突する実態を示す。'
    quote: '思い切って新しい案件の受注を止め、正常状態に戻すために、現場を知っている品質保証部門だからこそ、経営陣にモノを言う必要がある。'
    locator: 'p.26 4. 経営視点からの品質向上を考える(第5期)'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
    stance: supports
  - id: c9
    text: '品質保証部門は、客先業務を知らなくてもできることとして、見積り・受注審査での検討結果の確認から超上流に関わることを提言した。受注前のプロセスに費用をかけることの理解は、経営者に求める。'
    quote: '客先業務を知らなくとも品質保証部門がやれる事(見積り／受注審査で検討結果の確認、部門長経験者などシニアをレビュー者に活用、成功・失敗経験を次のＰＪに活かすための仕組みづくり)から始める。'
    locator: 'p.8 第5期 ② 超上流からの品質保証(2)。続く p.9 に「受注前のプロセスに多額の費用をかけることの理解を経営者に求める」'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [461]
