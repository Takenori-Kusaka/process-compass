    text: 'ウォーターフォールを前提にした品質保証(プロセス準拠性・各工程の成果物の確認)は、アジャイルでは機能しなくなると整理した。最終の合否判定テストだけでは遅すぎる場合もある。'
    quote: 'これまでの品質保証のアプローチはウォーターフォール(WF)開発を前提に進められていた。WF のプロセスにあわせて、プロセス準拠性の確認、各工程でのアウトプットの確認などプロセスの確認を重視してきたが、これらがアジャイルでは機能しなくなる。'
