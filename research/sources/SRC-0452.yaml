summary: LLVM コミュニティで、GitHub ネイティブのスタック型PRが force push とレビュー差分の問題を改善しないという懐疑と、レビューの記録を分散させることへの反対が交わされたスレッド。
claims:
  - id: c1
    text: LLVM は force push を抑制する方針をとっており、新しいスタック機能は force push がレビュアに与える問題(前回レビューとの差分、range-diff)を大きく改善しないと指摘されている。
    quote: AFAICT the new stack support doesn’t come with significant improvements to the problems that force pushing can cause for reviewers
    locator: 冒頭投稿
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q2]
    issues: [273]
    stance: contradicts
  - id: c2
    text: レビューコメントは使い捨てではなく、過去のレビューを掘り起こして設計理由を理解するため、回避策としてレビュー場所を分散させることに反対する意見がある(PRの記録としての役割)。
    quote: Review comments aren’t throwaway content. I regularly dig up old Phabricator reviews to understand why things are the way they are
