summary: 'アジャイル型開発についての疑義応答集(第3集、全 8 問)。準委任契約でも、実態として指揮命令関係があれば、契約の形式を問わず労働者派遣事業に当たるとする。2026-05-25 の更新で Q8 を足し、Q1〜Q7 の考え方がアジャイル型開発以外の請負のシステム開発にも当てはまるとした。Issue #309 の調査が読んだ掲載版は、この更新版だった可能性が高い(A8 を読んでいる)。初版(2021-09-21 公表)は読めておらず、Q8 以外の文言の変更は確かめていない。'
