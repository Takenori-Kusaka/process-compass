summary: freee社員による認知科学(ワーキングメモリ4±1、分散認知、限定合理性)に基づく論考。AIエージェントはチームの理解を蓄積し判断の整合性を保てず、開発プロセス設計は人間集団の認知資源の最適化問題になると主張する。
claims:
  - id: c1
    text: AIエージェントは与えられた情報から成果物を生成する能力には優れるが、チームとしての理解を蓄積し判断の整合性を維持することは現時点ではできないため、その領域の判断は人が担う必要があると論じる。
    quote: このため、AI agentは「今この瞬間に与えられた情報から成果物を生成する」能力には優れるが、「チームとしての理解を蓄積し、それに基づいて判断の整合性を維持する」ことは現時点ではできない、と考えざるを得ません。
    locator: AI agentを活用した開発で何が変わるか
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH01-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 人が担っていた領域を単純にAIへ置き換えると、その部分で人が担っていた分散認知が欠落し、キャッチアップのコスト(認知負債・意図負債)が蓄積すると論じる。
    quote: そうすると、元々人間が行っていた領域を単純にAI agentに置き換えた場合、置き換えた部分で人間が行っていた分散認知の領域は単純に欠落する形になります。
    locator: AI agentを活用した開発で何が変わるか
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH01-Q3, TH01-Q1]
    issues: []
    stance: supports
  - id: c3
    text: AI時代の開発プロセス設計は、人間(集団)の意思決定速度を上げること、すなわち人間の認知資源の最適化問題として考えるべきだと主張する。
    quote: すなわち、AI時代の開発プロセスの設計は、人間の認知リソース、あるいは開発者集団としての分散認知のリソースの最適化問題として考えるべき、ということになります。
