summary: Amazon 2017年度株主書簡(2018-04-18 公開)の一次資料。スライドを使わず物語構造の6ページメモを会議冒頭で黙読する運用と、良いメモは書き直しと同僚の改善を経て1週間以上かかるという書く側の費用を述べる。
claims:
  - id: c1
    text: Amazon は PowerPoint 等のスライド形式の発表をせず、物語構造の6ページメモを書き、会議冒頭で黙読する。
    quote: We don’t do PowerPoint (or any other slide-oriented) presentations at Amazon. Instead, we write narratively structured six-page memos. We silently read one at the beginning of each meeting
    locator: Six-Page Narratives
    quant: null
    evidenceKind: case-report
    rqs: [TH05-Q4]
    issues: []
    stance: context
  - id: c2
    text: 良いメモは書き直し、同僚に改善を頼み、数日寝かせて再編集するもので、1〜2日では書けない(外部向け説得形式は作成費用が大きい)。
    quote: The great memos are written and re-written, shared with colleagues who are asked to improve the work, set aside for a couple of days, and then edited again with a fresh mind.
    locator: Six-Page Narratives
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q4, TH05-Q3]
    issues: []
    stance: context
