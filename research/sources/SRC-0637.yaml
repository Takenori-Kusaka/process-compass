summary: '受託開発の公的なモデル契約と逐条の解説。連絡の窓口(主任担当者)、準委任の工程の終了の確認(業務終了確認書)、請負の工程の検収を、別の条で定める。Issue #309 の調査が本体の条文と解説を読んだ。ADR-0021 が「取得できなかった」と記録した検収の条項は、この版で確かめた。'
claims:
- id: c1
  text: 相手方との日常の連絡・確認・依頼は、原則として主任担当者を通じて行うと定める。
  quote: 甲及び乙は、本契約に定めた事項のほか、本件業務遂行に関する相手方からの要請、指示等の受理及び相手方への依頼、その他日常的な相手方との連絡、確認等は原則として主任担当者を通じて行うものとする。
  locator: ソフトウェア開発委託基本モデル契約書 第10条 3項
