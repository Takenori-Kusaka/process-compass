- id: c2
  text: 要件定義作成支援業務(準委任)の終了は、発注側が業務終了確認書に記名押印して確認すると定める。「検収」の語を使わない。
  quote: 甲は、当該業務終了報告書の内容に疑義がない場合、業務終了確認書に記名押印の上、乙に交付し、要件定義作成支援業務の終了を確認するものとする。
