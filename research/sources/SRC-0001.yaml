summary: テスト作成者・テスト本数・修復ループを固定し、テスト作成者に仕様を規則の一覧として渡すか否かだけを変えた統制実験。仕様接地で最終正答率が +18〜+40pp、誤警報 33%→0%、効いているのは本数や書式ではなく仕様の内容であることをアブレーションで示す。#255/#256/254 メモが引く数値はすべて原典に実在し一致した。
claims:
  - id: c1
    text: 仕様を規則一覧として渡し規則1件につきテスト1件を書かせると、公平な基準(free+)に対する最終正答率の差は、コード生成モデルを Claude 3 階層(Haiku 4.5 / Sonnet 4.6 / Opus 4.8)のどれにしても +38pp だった(テスト作成・修復は Sonnet 4.6 に固定)。保留課題では3階層の集計で +36pp(spec 61% 対 free+ 25%)。
    quote: produces correct code +38 percentage points more often than this strong baseline on each of three Claude tiers (Haiku 4.5, Sonnet 4.6, Opus 4.8), and +36 points more often on a held-out set.
    locator: Abstract; §3.3 Arms (writes one test per rule); §4.4 (spec - free+ = +38 pp on every tier; Held-out +36 pp); Table 6; Table 8
    quant:
      value: +38pp (Claude 3 tiers), +36pp (held-out 4 tasks)
      n: 8 core tasks × 3 tiers × 3 seeds; held-out 4 tasks × 3 tiers
      design: controlled experiment (paired arms, tester/budget/repair loop fixed)
      population: small pure-function tasks with under-specified tickets; Claude Haiku 4.5 / Sonnet 4.6 / Opus 4.8
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255, 256]
    stance: supports
  - id: c2
    text: "他ベンダでも再現: GPT-5.3-codex で +28pp、Gemini 3.5 Flash で +19pp。#255 の「+19〜38pt」はこのベンダ別の値の幅に一致する。全設定での幅は +18〜+40pp。"
    quote: Beyond Claude, GPT-5.3-codex gains +28 points and Gemini 3.5 Flash gains +19.
    locator: Abstract; §4.5 Other vendors (12 tasks × 3 seeds, 36 instances each); §4.6 Table 6; App. G Table 7
    quant:
      value: +28pp (codex), +19pp (Gemini); range across settings +18〜+40pp
      n: 36 instances per vendor
      design: controlled experiment (whole pipeline re-run per vendor)
      population: OpenAI GPT-5.3-codex, Google Gemini 3.5 Flash
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255]
    stance: supports
  - id: c3
    text: 追加6課題(scale-up)では検出は同点で差は修復の正しさに移り +18pp(spec 96% 対 free+ 78%)。課題水準の符号検定は 18 課題で p=0.002(核8課題のみでは p=0.06)。
    quote: spec is strictly better on all nine tasks that show any difference and tied on the rest, a task-level sign test of p=0.002. On the eight core tasks alone the test is only marginal (p=0.06)
    locator: §4.1 (task-level test); §4.5 More tasks (spec 96% vs. free+ 78%, +18pp)
    quant:
      value: +18pp; sign test p=0.002 over 18 tasks
      n: 18 specification-completeness tasks (8 core, 4 held-out, 6 scale-up)
      design: controlled experiment; task-level sign test
      population: same as above
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255]
    stance: supports
  - id: c4
    text: 仕様の内容を素の段落で渡すだけで 30 件中 27 件のバグを捕捉、仕様なしで計画だけ立てさせると 2 件。規則ごとに1テストへ分解すると 30/30。効いているのは仕様の内容であって列挙の形式ではない。
    quote: Given the spec as a plain paragraph, the tester still recovers 27 of 30 bugs; asked to plan tests without the spec, it recovers only 2 of 30.
    locator: Abstract; §4.2 ablation (decomp 2/30, prose 27/30, spec 30/30)
    quant:
      value: 27/30 vs 2/30 (spec 30/30)
      n: 30 buggy drafts among 48 core instances
      design: ablation within controlled experiment
      population: 8 core tasks, Haiku 4.5 / Sonnet 4.6 drafts, tester Sonnet 4.6
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255, 256]
    stance: supports
  - id: c5
    text: "誤警報: 接地したテストは正しいコードを 0% しか誤棄却しない(誤った期待値 0/37)が、接地しない free+ は 33% の検査で正しいコードを誤棄却した(誤った期待値 3/36)。測定は挙動仕様3課題に限る。標準ライブラリを正解とすると free+ の誤警報は 68% に上がる。"
    quote: spec asserted 0 wrong expected values (0/37) and raised 0% false alarms on correct code; free+ asserted wrong expectations on 3/36 cases and falsely rejected correct code on 33% of its checks.
    locator: "§4.4 The other measure: false alarms on correct code; Abstract (68% with stdlib oracle)"
    quant:
      value: 33% → 0% false-alarm rate
      n: 37 spec checks vs 36 free+ checks
      design: controlled experiment (correct implementations tested by each arm)
      population: "three behavioural specs: Excel column names, title-casing, range collapsing"
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255, 256]
    stance: supports
  - id: c6
    text: 接地しないままテスト本数を2倍にしても最終正答率は 38%→42%(+4pp)にとどまる。#255 の「+4pt」は原典の 38%→42% から導いた値で、倍にした対象は無指示の free 群(公平基準 free+ の 60% ではない)。
    quote: Doing nothing (oneshot) and plain free both end at 38%, so tests with no edge focus add nothing. Doubling the test budget (free2k) barely helps (42%).
    locator: "§4.1; Table 2 (free K: 38%, 0/30 / free2k 2K: 42%, 3/30 / free+: 60%, 18/30 / spec: 100%, 30/30)"
    quant:
      value: +4pp (38%→42%), detection 0/30→3/30
      n: 48 core instances
      design: controlled experiment (budget-doubled arm)
      population: 8 core tasks
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255]
    stance: supports
  - id: c7
    text: "テスト本数は揃えてある: 各群は仕様規則数 K 本のテストを書く(free2k のみ 2K、oneshot はなし)。テスト作成者と修復者は Sonnet 4.6 に固定。"
    quote: Each arm writes K tests, where K is the number of specification rules for the task, except free2k (which writes 2K) and oneshot (no tests). Runs use one repair round.
    locator: Table 2 caption; §3.3 arms
    quant:
      value: K tests per arm (matched)
      n: 8 core tasks
      design: controlled experiment design statement
      population: same as above
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [255]
    stance: supports
  - id: c8
    text: "適用範囲は狭い: チケットに書かれていない境界がある課題で効く。十分に仕様化されたアルゴリズム問題では効きも害もない。#256 が問う「前提の検証状態を記録させる効果」は測っていない(Issue 側もその飛躍を自認)。"
    quote: On tasks where the ticket leaves an edge unstated, turning the spec into one test per rule catches bugs that an equally-informed tester misses, and it does so without failing correct code.
    locator: §5 Discussion; Abstract (On well-specified algorithmic problems it neither helps nor hurts.)
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5, TH08-Q3]
    issues: [256]
    stance: qualifies
  - id: c9
    text: テストなしで自分のコードを見直させる self-refine は当てにならず、小さいモデルでは正しい関数を3件壊して1件も直さなかった(最終正答率は3階層で 25/50/54%、仕様接地は 100%)。原典はこの結果を Huang ほか(2024)と整合すると述べている。
    quote: on the small model it broke three correct functions while fixing none (final 25/50/54\% vs. grounded 100\% ). This matches Huang et al. (2024)
    locator: §4.3 Letting the model revise itself with no tests does not help; App. E Blind self-refine (no tests)
    quant:
      value: 3 correct functions broken, 0 fixed
      n: small-model core runs
      design: controlled experiment (self-refine arm)
      population: Haiku 4.5 drafts
    evidenceKind: controlled-experiment
    rqs: [TH06-Q5]
    issues: [257]
    stance: supports
