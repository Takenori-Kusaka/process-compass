summary: OECD のエージェント型 AI 概念整理。行動自律度を no-action(human support)/low(HITL)/medium(HOTL)/high(HOOTL) の4段階で定義し、自律度・適応性・領域・影響で類型化する政策向け枠組み。
claims:
  - id: c1
    text: 行動自律度は「推奨のみ/人が承認したら実行(HITL)/人が止めない限り実行(HOTL)/人の関与なし(HOOTL)」の4段階で、行動(action)単位に定義される。
    quote: "Low-action autonomy (also referred to as “human-in-the-loop”): The system suggests an action, but only proceeds if the human approves."
    locator: §2.2 Main elements of the OECD definition, Autonomy
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1]
    issues: [248]
    stance: qualifies
  - id: c2
    text: 最上位の high-action autonomy(human-out-of-the-loop)は人の関与なしに行動する状態として定義され、人の監督はライフサイクルのどの段階でも起こりうるとする。
    quote: "High-action autonomy (also referred to as “human-out-of-the-loop”): The system acts entirely on its own, without human involvement."
    locator: §2.2 Autonomy
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1]
    issues: [248]
    stance: qualifies
