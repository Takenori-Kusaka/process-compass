summary: Forsgren と Noda の書籍 Frictionless(2025 年末刊)の第 59 章「AI は必要な指標をどう変え、どう変えないか」の抜粋。SPACE の5次元を AI 支援開発向けの問いに読み替え、6 つ目の次元として Trust(信頼)の追加を提案する。SPACE の著者自身による AI 対応の一次資料。
claims:
  - id: c1
    text: 著者らは、AI 時代でも SPACE と DORA の指標は有効だとする。速いビルド、信頼できるデプロイ、文書、協働への需要は変わらないという理由である。
    quote: The SPACE framework and DORA metrics remain relevant because developers still need fast builds, reliable deployments, good documentation, and strong collaboration
    locator: Chapter 59 冒頭
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q1]
    issues: []
    stance: supports
  - id: c2
    text: SPACE に 6 つ目の次元として Trust(AI が生成したコード・コメント・推奨を開発者がどれだけ信頼するか)を足すことを提案している。
    quote: "Consider adding a sixth dimension: Trust. How much do developers trust AI-generated code, comments, and recommendations?"
    locator: Applying SPACE to AI-Augmented Development
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 新しい指標として、検証の手間(AI 生成コードのレビューと修正に使った時間)を測るよう勧める。AI が時間を節約したのか、費やす場所を移しただけなのかを見分けるためである。
    quote: Measure validation effort—the time spent reviewing and correcting AI-generated code, which reveals whether AI truly saves time or just shifts where developers spend it.
    locator: Applying SPACE to AI-Augmented Development
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q1, TH11-Q3, TH11-Q2]
    issues: []
    stance: supports
  - id: c4
    text: SPACE の Activity 次元は、AI の提案の受入率、AI に任せる作業の種類、AI がよく使われる場所(テスト、文書、デバッグ)を見る問いへ読み替えられている。
    quote: Monitor suggestion acceptance rates, what types of work get delegated to AI, and where AI gets used most (tests, docs, debugging).
    locator: Applying SPACE to AI-Augmented Development / Activity
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q1]
    issues: []
    stance: supports
  - id: c5
    text: AI の計測データは個人ではなくチーム単位で集約し、何をなぜ測るかを開示するよう求めている。
    quote: Aggregate at the team level rather than tracking individuals, be transparent about what you’re measuring and why
    locator: Applying SPACE to AI-Augmented Development
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q3]
    issues: []
    stance: context
