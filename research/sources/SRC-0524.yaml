summary: FDA の医療機器ソフトウェア妥当性確認の一般原則(2002-01-11、非拘束)。§4.9 で「レビューの独立性」を品質保証の基本原則とし、第三者 IV&V が常に可能ではないことを認めたうえで、小規模企業には内部の独立性を保つ工夫を求める。小規模組織に対して独立性を免除せず代替を示す型。tavily_extract で §4.9 と要求のトレーサビリティ分析の段落を取得した(全文は未通読)。
claims:
  - id: c1
    text: 自己による妥当性確認は極めて難しく、可能なら独立した評価のほうが常によい(リスクの高い用途では特に)と述べる。
    quote: Self-validation is extremely difficult. When possible, an independent evaluation is always better, especially for higher risk applications.
    locator: §4.9 Independence of Review
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [254]
    stance: supports
  - id: c2
    text: 第三者 IV&V の外注が常に可能とは限らないと認め、代替として、当該の設計・実装に関与していないが評価できるだけの知識を持つ内部要員を割り当てる方法を示す。
    quote: Another approach is to assign internal staff members that are not involved in a particular design or its implementation
    locator: §4.9 Independence of Review
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [254, 249]
    stance: supports
  - id: c3
    text: 小規模企業に対しては独立性を免除せず、内部のレビュー独立性を保つために作業の編成と割当てを工夫する必要があり得ると述べる。具体的な代償措置(外部レビュー・記録強化など)は列挙していない。
    quote: Smaller firms may need to be creative in how tasks are organized and assigned in order to maintain internal independence of review.
    locator: §4.9 Independence of Review
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1]
    issues: [249, 267]
    stance: qualifies
  - id: c4
    text: ソフトウェア要求のトレーサビリティ分析は、システム要求およびリスク分析結果との間で双方向(to and from)に行うべきとする。
    quote: A software requirements traceability analysis should be conducted to trace software requirements to (and from) system requirements and to risk analysis results.
    locator: ソフトウェア要求の節(節番号は取得した断片では未確認)
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
