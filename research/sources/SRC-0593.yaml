summary: DX の研究者が、AI 時代でも DX Core 4 の4次元(速度・有効性・品質・事業インパクト)は変えず、AI 導入率・トークン量などは診断用のテレメトリとして読むべきだと主張する論考。PR スループット +7.8%、本番コードの AI 生成比 27.4% を自社調査として引く。
