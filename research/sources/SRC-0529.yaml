summary: FAA が DO-178C と DO-330 などの補足文書を適合手段として認める勧告通達(2017-07-21、強制ではない)。ソフトウェアレベルごとの目標は DO-178C 附属書 A の表によると定め、ツール認定は DO-178C §12.2 と DO-330 を受け入れ可能な方法とする。独立性を要する目標の一覧(附属書 A の表)は通達に転記されておらず、本文に independence の語は無い。
