summary: ミューテーションフィードバックをプロンプトへ入れる MutGen を提案。Llama-3.3 70B 単独で HumanEval-Java 104 件・LeetCode-Java 100 件を評価し、ミューテーションスコア 89.5%/89.1%(素のプロンプト 77.9%/69.9%、EvoSuite 69.5%/58.9%)。123 メモの「素のプロンプトで 53%」は動機付け例 1 件の値で、データセット平均ではない。「llama3-70b +8.44% / GPT-4o +10.67% / GPT-3.5 +5.14%」は本論文のどの版にも無い。
claims:
  - id: c1
    text: HumanEval-Java の課題 id_81 では、LLM が生成したテストが行・分岐カバレッジ 100% に達したのに、ミューテーションスコアは 4% にとどまった(abstract はこれを『一部のテストスイート』と書く)。著者らは、この結果からミューテーションスコアのほうが信頼でき厳格な尺度だとする。
    quote: In contrast, mutation score offers a more reliable and stringent measure, as demonstrated in our findings where some test suites achieve 100% coverage but only 4% mutation score.
