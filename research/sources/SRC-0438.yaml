summary: FDA の医療機器ソフトウェア申請文書ガイダンス(2023-06-14 発行、非拘束)。検証の客観的証拠としてレビューとトレーサビリティ分析を挙げ、IEC 62304 への適合宣言で文書要素を代替できるとする。curl は拒否され、tavily_extract で該当節のみ取得した。
claims:
  - id: c1
    text: ソフトウェア検証では、SDS(出力)が SRS(入力)の全要求を正しく完全に実装していることを、レビューやトレーサビリティ分析という客観的証拠で確認する。
    quote: confirming by objective evidence (e.g., reviews, traceability analysis) that the software design as documented in the SDS (i.e., output) correctly and completely implements all the requirements
    locator: Software verification の説明節
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: [255]
    stance: supports
  - id: c2
    text: トレーサビリティ分析の例として、SRS→SDS とその逆、ソースコード→SDS とその逆など、双方向の対応を挙げている。
    quote: software requirements specification to software design specification (and vice versa), source code to software design specification (and vice versa)
    locator: 同上
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 開発実務の文書要素は、FDA 認定版 IEC 62304 への適合宣言(5.1.1 ソフトウェア開発計画ほか)で代替できる。
    quote: a sponsor may provide a Declaration of Conformity to the FDA-recognized version of ANSI/AAMI/IEC 62304
    locator: Software Development, Configuration Management, and Maintenance Practices
    quant: null
    evidenceKind: normative
    rqs: [TH08-Q2, TH12-Q1]
    issues: []
    stance: context
