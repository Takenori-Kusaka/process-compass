summary: AIの生産性効果(uplift)を「旧タスクでの時間短縮」「新タスクでの時間短縮」「価値の増分」の3つに分け、仕事の組み替え(タスク代替)でこれらが大きく乖離すると示す理論ノート。時間短縮の数字を価値の増分と読み替える誤りを指摘する。
claims:
  - id: c1
    text: 旧タスクでの時間短縮は、AIで効率化したタスクへ時間を振り替える利得を含まないため、価値の増分より小さく出る。
    quote: Uplift on old tasks is less than uplift in value because it only accounts for the time savings on your existing tasks
    locator: Ranking the Three Types of Uplift
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q2, TH11-Q3]
    issues: []
    stance: qualifies
  - id: c2
    text: 新タスクには AI 以前なら手を付けなかった仕事が含まれるため、新タスクで測った時間短縮は価値の増分より大きく出る。
    quote: The new tasks can include tasks that you would never have attempted pre-AI, and so the pre-AI time required can be large, meaning the uplift in time will be bigger than the uplift in value.
    locator: Ranking the Three Types of Uplift
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH11-Q2, TH11-Q3]
    issues: []
    stance: qualifies
