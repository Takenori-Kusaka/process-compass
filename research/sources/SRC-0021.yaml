summary: LLM が生成した(誤りを含む)実装を見せてからテストを生成すると、仕様(タスク記述)だけから独立に生成した場合より欠陥検出率が有意に落ちる(14% 対 25%)ことを 5 モデル×3 ベンチマークで示した実証研究。123 メモの「ミューテーションテストで測定」「より高いミューテーションスコア」は原典に無く、指標は fault triggering / fault detection である。
claims:
  - id: c1
    text: 誤りを含むコードの後にテストを生成すると、独立に生成した場合に比べ欠陥検出率が 14% 対 25% に低下する。
    quote: generating tests after faulty code significantly reduces fault detection effectiveness compared to generating tests independently (14% vs. 25%)
    locator: Abstract
    quant:
      value: 14% vs 25%
      n: 5 LLMs × 3 benchmarks (HumanEval+ 164 / MBPP 974 / BigCodeBench 1,140 tasks); タスクごとに LLM 生成の欠陥実装 1 件
      design: controlled experiment (Mann-Whitney U, p<0.05)
      population: GPT-5-mini, GPT-4.1-mini, DeepSeek-V4-Flash, Claude Haiku 4.5, Llama 3.3 70B; LLM-Plain ワークフロー
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123, 135]
    stance: supports
  - id: c2
    text: "RQ1: タスク記述に実装を添えると欠陥検出が平均 13.2% 低下し、実装のみでは 15.1% 低下する(モデル別 9.1〜18.2%)。全モデルで統計的に有意。"
    quote: Providing both the task description and the implementation decreases fault detection by 13.2% on average compared to using the task description alone
    locator: §VI-A Finding 1 / Table II
    quant:
      value: -13.2% (P+C) / -15.1% (C only)
      n: 5 models × 3 benchmarks
      design: controlled experiment
      population: Claude Haiku 4.5 -9.1%, DeepSeek V4 -15.2%, GPT-4.1-mini -18.2%, GPT-5-mini -12.9%, Llama 3.3 -10.7%
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123, 135]
    stance: supports
  - id: c3
    text: "RQ3: 会話履歴を保ったまま実装→テストを生成する Agentic Workflow に対し、テストを別セッションで仕様のみから生成する Test-Driven Workflow は欠陥検出を平均 11.7% 改善する(モデル別 7.9〜17.7%、全て p<0.05)。"
    quote: the Test-Driven Workflow improves fault detection by 10.6% for Claude Haiku 4.5, 13.8% for DeepSeek V4, 17.7% for GPT-4.1-mini, 13.6% for GPT-5-mini, and 7.9% for Llama 3.3 (70B)
    locator: §VI-C Finding 3 / Table IV
    quant:
      value: +11.7% avg
      n: 5 models × 3 benchmarks
      design: controlled experiment
      population: Agentic vs Test-Driven workflow; 誤った実装を生成したケースのみ
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123, 135]
    stance: supports
  - id: c4
    text: "RQ2: 要約・Chain-of-Thought・Chain-of-Verification のプロンプト技法は、実装を見せた状態の劣化を回復しない(要約 -15.5%、CoT/CoVe -13.4%)。"
    quote: fault detection decreasing by 15.5% for summarization and 13.4% for both Chain-of-Thought and Chain-of-Verification.
    locator: §VI-B Finding 2 / Table III
    quant:
      value: -15.5% / -13.4%
      n: 5 models × 3 benchmarks
      design: controlled experiment
      population: Prompt-only を基準
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123]
    stance: supports
  - id: c5
    text: 評価指標は fault triggering と fault detection(参照実装との挙動差と正しいオラクル)であり、ミューテーションテスト・ミューテーションスコアは使われていない(本文で mutation の語は関連研究の書誌 1 件のみ)。
    quote: We evaluate the effectiveness of generated test suites using two complementary metrics. Fault triggering measures whether a generated test exercises faulty behavior in an implementation
    locator: §IV-E Metrics
    quant: null
    evidenceKind: controlled-experiment
    rqs: []
    issues: [123]
    stance: qualifies
  - id: c6
    text: TDD の成功は仕様(テスト)と実装の独立性に帰され、確証バイアスを減らす、という命題は関連研究節で先行文献 [48] を引いて述べられている(本研究の実験結果ではない)。
    quote: The success of TDD is largely attributed to the independence between specification (tests) and implementation, which reduces confirmation bias and encourages requirement clarification
    locator: §VIII-C Test-First and Test-Driven Development
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [123]
    stance: context
  - id: c7
    text: "結論: 事後生成テストだけを正しさのオラクルにすることに注意し、仕様・実装・検証の分離を保つワークフローを選ぶべきと勧告する。"
    quote: should prefer workflows that preserve a degree of separation between specification, implementation, and validation.
    locator: §X Conclusion
    quant: null
    evidenceKind: expert-opinion
    rqs: []
    issues: [123, 135]
    stance: supports
  - id: c8
    text: 著者らは、実験結果から次のことが示唆されると述べる。同一モデルでコードとテストの両方を生成しても意味のある検証は保証されず、かえって新しい種類の未検出欠陥を持ち込みうる。
    quote: They suggest that generating both code and tests using the same model does not guarantee meaningful verification, and may instead introduce a new class of undetected faults.
    locator: §I Introduction (paragraph starting 'These findings have important implications...')
    quant: null
    evidenceKind: controlled-experiment
    rqs: []
    issues: [135]
    stance: supports
  - id: c9
    text: "実験設定: 5 モデル(GPT-5-mini、GPT-4.1-mini、DeepSeek-V4-Flash、Claude Haiku 4.5、Llama 3.3 70B)、3 ベンチマーク、温度 0.8 で 10 解を生成し参照テストで欠陥実装を抽出、失敗率 50% 超は除外。"
    quote: "We employ 5 state-of-the-art language models from different providers: GPT-5-mini, GPT-4.1-mini, DeepSeek-V4-Flash, Claude Haiku 4.5, and Llama 3.3 Instruct (70B)."
    locator: §IV-A〜IV-C, Table I
    quant: null
