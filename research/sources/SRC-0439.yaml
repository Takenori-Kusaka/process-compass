summary: 要求工学の国際規格の公開プレビュー(目次・用語定義まで)。要求トレーサビリティを上方(導出元)と下方(割当先)の経路の識別・文書化と定義し、要求の検証と妥当性確認を区別する。SRS の目次に『前提と依存関係』節がある。
