    text: 繰り返されるレビュー指摘を静的解析→Hooks→Skipの順で自動化手段を判定し、ルール肥大化による精度低下を防ぐためにSkipを残している。運用でESLintルールが計4件自動追加され、対応する指摘は消えた。
    quote: Skipという選択肢を用意しているのは、ルールの肥大化による精度低下を防ぐための最終判断だからです。
