    text: .claude/rules への追記を続けるとコンテキストが膨れ精度が落ちる懸念があり、Claudeはrulesを無視することもあるため、違反を必ずエラーにできる静的解析を優先した。
    quote: しかし、rulesに書き足し続けるとコンテキストが膨れ上がり、Claudeの精度が落ちる懸念がありました。また、Claudeはrulesを無視することもあります。一方、静的解析はコードに違反があれば必ずエラーになる確実性があります。
