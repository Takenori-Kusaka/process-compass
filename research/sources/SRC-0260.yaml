summary: 全社でClaude Codeを導入したカカクコムのReactリプレースで、実装〜PR作成を1コマンド化し、繰り返すレビュー指摘を静的解析ルールへ自動変換する仕組みを作った報告。rules追記より静的解析を優先した理由を述べる。
