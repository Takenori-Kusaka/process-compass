summary: 'ISO 12100 の3ステップ法(本質的安全設計 → safeguarding と補完的保護方策 → 使用上の情報)を規格策定側の議長が解説した講演資料。ステップ3はステップ1・2の後に残るリスクを使用上の情報で示すものとし、使用上の情報は他のリスク低減策の代わりにならないと述べる。規格本文(6.1)ではなく二次の解説。'
claims:
  - id: c1
    text: '保護方策は3ステップの順に適用する。ステップ1は設計でハザードを除くかリスクを下げる。ステップ2は、ステップ1で除けない・十分に下げられないときに safeguarding と補完的保護方策を適用する。ステップ3は、ステップ1・2の後に残るリスクを使用上の情報で示す。'
    quote: 'Protective measures shall be applied in the following sequence (3-step method)'
    locator: 'スライド11(The 3-Step Method)'
    quant: null
    evidenceKind: expert-opinion
