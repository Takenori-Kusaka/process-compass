    text: サブエージェントの効用に「探索と実装を主会話から切り離して文脈を保つ」「Haiku など速く安いモデルへ振って費用を制御する」を公式に列挙する。説明文自体が文脈を消費するので短く書けとも言う。
    quote: Control costs by routing tasks to faster, cheaper models like Haiku Claude uses each subagent's description to decide when to delegate tasks. When you create a subagent, write a clear description so Claude knows when to use it. Those descriptions take up context, so keep them short.
