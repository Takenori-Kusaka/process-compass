summary: サブエージェント委任に完了条件ブロックを hook で強制したところ、形式だけ満たして中身が空虚になった事例と、Stop hook の検証ゲートが達成不能な条件で無限ループした事例の記録(企業の Zenn Publication、筆者一人称の実践記)。
claims:
