summary: 'ISO 9001:2015 の赤字・緑字による差分版の公開プレビュー(15 ページ。目次、序文 0.1〜0.4、適用範囲まで)。箇条 5.3・8.6・9.3 の本文はプレビューの範囲外で読めていない。読めたのは、品質マネジメントシステムの採用を組織の戦略的な決定とする序文と、品質マネジメントの原則の一覧(顧客重視、リーダーシップ、人々の積極的参加、プロセスアプローチ、改善、客観的事実に基づく意思決定、関係性管理)と、旧版との対応表の所在である。差分版は公式の規格ではないと明記されている。'
claims:
  - id: c1
    text: '2015 年版の序文は、品質マネジメントシステムの採用を組織の戦略的な決定と位置づける。品質保証部長の決裁を、品質の技術的な点検ではなく経営の決定の一部として読む根拠になる。'
    quote: 'The adoption of a quality management system is a strategic decision for an organization that can help to improve its overall performance and provide a sound basis for sustainable development initiatives.'
    locator: 'p.ix 0.1 General(緑字=2015 年版で追加された文)'
