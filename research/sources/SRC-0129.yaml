    text: 同一モデル(DeepSeek V4 Flash、OpenRouter、max reasoning)を両ハーネスで走らせた 30 タスクの比較では、両者とも 16/30 通過で、成功 1 タスク当たり費用は Codex 約 $0.08、Claude Code 約 $0.19 だった。Claude Code は中央値時間が約半分(122.7 秒対 245.0 秒)でツール呼び出しが 90 回少なく(358 対 448)、ハーネスの違いだけで時間と費用が逆方向にトレードオフした(単一著者・1 回の試行)。
