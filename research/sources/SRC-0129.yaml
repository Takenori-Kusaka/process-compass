summary: Composio(第三者ツールベンダー)による 30 タスクの比較(2026-08-18)。Claude Code と Codex はともに 16/30 を通過したが、Codex は全体費用が約 58% 少なく、成功 1 タスク当たり約 8 セント対 19 セント。Claude Code は所要時間が約半分でツール呼び出しが 90 回少ない。
