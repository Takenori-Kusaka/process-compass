summary: AI エージェントの PR を繰り返しレビューする人間レビュアーが慣れて審査を緩めるか(habituation)を、AIDev の400人・207日・11,429レビューで追った縦断研究。承認率は上がるが、語彙指標では検出できない。
claims:
  - id: c1
    text: 繰り返しレビュアーの承認率は初期30.5%から後期36.6%へ上がった(Wilcoxon p=8.6×10^-8、Cohen's d=0.25)。
    quote: Approval rates rise from 30.5% in reviewers' early periods to 36.6% in late periods (Wilcoxon p = 8.6 x 10^-8; Cohen's d = 0.25)
    locator: Abstract; §4.1 RQ1
    quant:
      value: 30.5% → 36.6%(d=0.25)
      n: 11,429 reviews / 400 repeat reviewers / 207 days; 10,104 inline comments
      design: observational longitudinal(within-reviewer)
      population: AIDev のエージェント PR
    evidenceKind: observational
    rqs: [TH06-Q4, TH11-Q3]
    issues: [268]
    stance: supports
  - id: c2
    text: AIDev の人間が書いたインラインコメント 10,104 件では、4つの手作り言語指標(MTLD、Shannon エントロピー、技術的具体性、建設的実行可能性)は曝露の十分位に沿った単調な低下を示さず(全 |ρ|≤0.53、p≥0.11)、長さを揃えた部分集合でも母集団レベルでほぼ平坦だった。古典的な語彙指標だけでは審査の緩み(慣れ)を検出できない。
    quote: All four hand-crafted metrics are essentially flat at the population level, even on length-controlled subsets.
    locator: §1 Introduction ('What does not.'); Abstract; §4.2 RQ2
    quant:
      value: all |ρ| ≤ 0.53, p ≥ 0.11
      n: 同上
      design: observational
      population: 同上
    evidenceKind: observational
    rqs: [TH06-Q4, TH07-Q5]
    issues: [268]
    stance: qualifies
  - id: c3
    text: 文埋め込みの分布には変化が現れ(MLP で F1=0.74)、言語の変化は承認行動の変化の後に続く(Granger 分析)。
    quote: language shifts follow rather than precede changes in approval behavior
    locator: Abstract; §4.3–4.4
    quant:
      value: F1 0.74(5-fold reviewer-stratified)
      n: 同上
      design: observational
      population: 同上
    evidenceKind: observational
    rqs: [TH06-Q4]
    issues: []
    stance: context
