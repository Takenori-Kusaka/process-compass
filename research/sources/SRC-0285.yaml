summary: Rails 開発者が、ADR で丁寧に書いた経緯はほとんど読み返されず、前提が古くなると判断を誤らせることさえあると述べ、『決定・現状(SSoT)・経緯一行』の軽い様式を提案する論考。
claims:
  - id: c1
    text: 丁寧に書いた経緯は驚くほど読み返されない。経緯が効くのはその判断を疑うときだけで、普段知りたいのは今どうなっているかだと著者の実感として述べる。
    quote: 実感ベースで言います。丁寧に書いた経緯は、驚くほど読み返されません。
    locator: 「でも、経緯はそんなに読み返されない」節
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q3, TH05-Q1]
    issues: []
    stance: supports
  - id: c2
    text: 前提(ライブラリ版・制約・規模)が変わると当時の経緯は意味のない記録になり、読み返すとむしろ判断を誤らせることがある。
    quote: 当時は正しかった経緯も、前提が変われば「今となっては意味のない議論の記録」になります。読み返しても、むしろ判断を誤らせることすらある。
    locator: 同上
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH05-Q5]
