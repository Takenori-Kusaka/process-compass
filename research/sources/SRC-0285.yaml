    stance: supports
  - id: c3
    text: 経緯が古いのは無害だが決定が古いのは有害なので、労力は『今の決定』と現状(Single Source of Truth)を最新に保つことへ寄せ、経緯は一行でよいとする。
    quote: 経緯が古いのは無害ですが、決定が古いのは有害です。
    locator: 「本当に効くのは「決まったこと」を最新に保つこと」節
