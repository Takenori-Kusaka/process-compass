  - id: c4
    text: 既定の適用はソフトウェア分類ごとの表で定め、空欄は「任意・この指令では課さない」を意味する。課さないことが表の上で読める。
    quote: Optional/Not invoked by this directive.
    locator: §2.2.4 b
