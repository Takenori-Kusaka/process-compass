summary: NASA のソフトウェア工学要求(発効 2022-03-08)の §2.2。要求を満たさない・作らないと決めるテーラリングを、根拠とリスク評価を添えた免除申請として扱い、要求対応表に記録して権限者が承認する。12207 附属書 A の本文が読めなかったための代替として採った。
claims:
  - id: c1
    text: テーラリングを、目的・許容リスク・制約に沿って要求からの免除を求める手続きと定義する。
    quote: Software requirements tailoring is the process used to seek relief from NPR requirements consistent with program or project objectives, acceptable risk, and constraints.
    locator: §2.2.1
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4]
    issues: []
    stance: context
  - id: c2
    text: 免除の申請には、根拠・リスク評価・受け入れを正当化する資料への参照を含める。「やらない」判断は理由付きで記録される。
    quote: The request for relief from a requirement includes the rationale, a risk evaluation, and reference to all material that justifies supporting acceptance.
    locator: §2.2.5 Note
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4]
    issues: []
    stance: context
  - id: c3
    text: 免除は要求対応表(Requirements Mapping Matrix)の形でまとめて申請でき、署名を得れば申請要件を満たす。
    quote: may be submitted in the streamlined form of a Requirements Mapping Matrix.
    locator: §2.2.6
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4]
    issues: []
