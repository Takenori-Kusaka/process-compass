summary: NASA Langley の研究者が、DO-178C の目標がなぜ安全への確信に寄与するのかを明示的な保証ケースとして書き起こす作業を報告した論文。DO-178C 本文は目標の根拠をほとんど示さないと指摘する。規格の独立性・トレーサビリティ要求を「根拠が示された要求」として引くことへの限定条件(反証側)として収録した。冒頭と §1 を読んだ。
claims:
  - id: c1
    text: DO-178C の本文は、個々の目標や目標の集まりが目的の達成にどう寄与するかの根拠をほとんど示していない。保証ケースは暗黙である。
    quote: DO-178C is also mostly rationale-free
    locator: §1 Introduction
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH12-Q4]
