summary: 現役 PM の一次記録。Gokul Rajaram 流の EPIC(PRD・AC・成功指標)を AI なしで 6 時間かけて書いた後、Claude Code で同じ機能のプロトタイプを 1 時間で作れたことから「書くより作る方が安い」へ前提が反転したと論じる。YC の RFS 等の反論も併記する。
claims:
  - id: c1
    text: 著者は EPIC(PRD・受入基準・成功指標)を AI を使わずに書いて 6 時間かかり、その後 Claude Code で機能の一版を 1 時間で作った(著者 1 名・1 件の体験談)。
    quote: Took me six hours (PRD, Acceptance Criteria, Success Metrics). Writing is really hard when you optimize for clarity. Then I built a version of the feature itself in Claude Code. One hour.
    locator: 本文冒頭 第1段落("I wrote an EPIC last week...")〜第2段落
    quant:
      value: 6h spec vs 1h prototype
      n: 1 (author)
      design: case report
      population: IC PM at established company
    evidenceKind: case-report
    rqs: [TH09-Q3]
    issues: []
    stance: supports
  - id: c2
    text: 「仕様→実装→出荷」の順序は、書く方が作るより安いという前提に依存しており、その前提が崩れた。
    quote: The old sequence—spec first, build later, ship eventually—assumes writing is cheaper than building. That assumption just died.
    locator: 冒頭 第4段落
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1, TH09-Q3]
    issues: []
    stance: supports
  - id: c3
    text: 反論として YC 2026 Request for Startups を引く。何を作るかに至る過程が勝敗を決め、Cursor や Claude Code は何を作るか決まってから輝く。
    quote: Getting to what to build is where products win or die. Tools like Cursor and Claude Code shine once the team already knows what to build.
    locator: 「What you risk when PMs code」(YC 2026 RFS の引用)
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: qualifies
  - id: c4
    text: LinkedIn の理想的なポッドは当初の 12 名から 4 名に縮小した(Gokul Rajaram の X 投稿の二次引用)。
    quote: LinkedIn's ideal pod is four people now, down from their initial twelve.
    locator: 「The boundaries collapsed」段落
    quant:
      value: 12 → 4 people per pod
      n: 1 company
      design: secondary report
      population: LinkedIn product pods
    evidenceKind: news-fact
    rqs: [TH02-Q5]
    issues: []
    stance: context
  - id: c5
    text: 結論は「PM は検証と構想の伝達のために作り、本番コードは出荷しない」。CodeRabbit(AI コードに 2.74 倍の脆弱性)と METR(19% 遅い)を品質面のリスクとして併記する。
    quote: The answer is PMs should build to validate ideas and communicate vision, not to ship production code.
    locator: 「What you risk when PMs code」末尾
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q3]
    issues: []
    stance: qualifies
