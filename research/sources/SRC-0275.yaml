    text: CLAUDE.md に「推測で断言しない」と書いても別セッションでは守られず、ルールを具体化しても忘れられた。忘れられるルールを PreToolUse/PostToolUse hook に移したところ守られるようになった(CLAUDE.md は4か月で280行、スキル40超)。
    quote: CLAUDE.md に書いたルールは忘れられる。hooks は忘れられない。
