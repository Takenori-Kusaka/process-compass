summary: 個人開発者が4か月、失敗ログ→ルール化→hook 強制で Claude Code 環境を育てた記録。CLAUDE.md のルールは別セッションで忘れられ、hook へ移すと守られたこと、並列ワークフローで利用枠と$200を一晩で使い切った事故を含む。
claims:
