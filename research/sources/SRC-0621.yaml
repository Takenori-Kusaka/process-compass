summary: 不法行為責任を中心に AI 利用時の過失判断を整理した経産省の手引き。読んだのは 2.1、2.2、4.3(AI エージェントの補論)。契約責任は対象外で、請負の契約不適合責任には触れない。
claims:
  - id: c1
    text: 検討対象は不法行為責任で、契約責任は当事者間の条項次第で個別性が高いことを理由に対象から外している。請負契約の契約不適合責任や検収は本手引きの範囲に無い。
    quote: 契約責任の内容は当事者間の契約条項次第であり、個別性が高いこと。
    locator: 2.1 本研究会の検討対象 ③(PDF p.7)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: 最終的に人の判断が介在する「補助／支援型 AI」では、利用者の責任は AI を使ったかどうかによらず、その局面で本来払うべき注意の下で適切に判断・行動したかで決まるとする。
    quote: その責任は AI の利用如何にかかわらず、個々の局面において AI 利用者が本来払うべき注意の下で適切な判断や行動を取ったか否かにより判断される。
    locator: 2.2.1(2) 補助／支援型 AI を利用する AI 利用者の責任(PDF p.12)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2, TH01-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 人の判断を代替する「依拠／代替型 AI」では、2つの要件を満たすことを条件に、利用者の注意義務が個々の判断から、AI を組み入れた業務プロセスの適正な構築とリスクを下げる運用へ転換するとする。責任を人と組織に残したまま AI が判断を担う構成を、条件付きで責任判断の枠組みに載せている。
    quote: 人が合理的な判断や行動を行う注意義務から、AI システムを組み入れた業務プロセスを適正に構築するとともに、リスクを可能な限り低減しながら運用を行う義務へと転換する。
    locator: 2.2.2(2) 依拠／代替型 AI を利用する AI 利用者の責任(PDF p.17)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q2]
    issues: []
    stance: supports
  - id: c4
    text: AI エージェントの補論(カスタマーサポートの想定事例)は、業務プロセスの構築に関する注意義務の論点として、必要な場面での人の関与を含めたプロセスを適切に構築していたかを挙げる。ソフトウェア開発を題材にした想定事例は無い。
    quote: 望ましい精度や安全性を満たした AI システムを用いることや、必要な場面での人の関与を含めた業務プロセスを適切に構築していたか否かが論点になると考えられる。
    locator: 4.3 想定事例7:補論―AI エージェント (1)①(PDF p.74)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q2]
    issues: []
    stance: supports
