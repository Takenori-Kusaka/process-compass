summary: 162 の役割 × 4 プロンプト型 × 4 系統(Flan-T5、Llama-3、Mistral、Qwen2.5)の 9 モデルを MMLU 由来 2,410 問で評価。254 メモの「4 系統・2,410 問、対照を上回らない」は原典どおり。ただし問題ごとの最良 persona を集約すれば有意に改善するという留保がある。
claims:
