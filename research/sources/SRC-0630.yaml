summary: サイバーエージェントの1チームが、AI 導入でコミット数が約2倍になった後に組み直したレビューフローの報告。人の承認の後に AI の最終チェックを置き「最終ゲートキーパー」と呼ぶ。テスト行/コード行は半年で 78.6% から 112.6% へ増えた。
claims:
