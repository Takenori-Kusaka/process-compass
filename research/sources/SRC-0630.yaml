    text: 最終的なゲートキーパーを人ではなく AI に任せると書いている。承認側に AI を置いた国内の運用報告で、判断を人に残すという自己規定の反例に当たる。
    quote: この課題を解決するために、最終的なゲートキーパーを人間ではなく、AIに任せることにしました。
    locator: 6.3 AIを最終ゲートキーパーに
    quant: null
    evidenceKind: case-report
    rqs: [TH01-Q3, BASE-Q2]
    issues: []
    stance: contradicts
  - id: c2
    text: ただし実際の手順は、人のレビュアが Approve した後に AI が最終チェックを行い、判定と理由をコメントするもので、懸念が出たときに対応するかは人が判断する。AI の判定がマージを機械的に止めるとは書かれていない。
    quote: 「マージOK」「マージに懸念あり」「マージ非推奨」といった判定と、その理由をコメントしてくれるので、人間のレビュアーとレビューイが確認できるようになっています。
