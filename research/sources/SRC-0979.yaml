summary: 'ダイキン工業(非 IT 企業)のスクラムチームの講演のレポート。QA エンジニアがおらず、開発者が品質面でチームをリードする方式を採った。品質活動を PBI として扱い、完成の定義を見直し、デプロイ頻度の増加とリードタイムの短縮が報告されている。承認プロセスやリリース判断の権限に関する記述は無い。品質保証部門が無い組織の事例であり、品質保証部長を説得した事例ではない。二次情報(レポート)であり、講演資料そのものは未読。'
