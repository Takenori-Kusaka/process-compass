summary: SaaS 企業が低リスク PR に限り AI レビュアー単独の承認を許した事例。判断（AI の専門家評議会）と門（決定的な判定エンジン・CODEOWNERS 保護のポリシー）を分離し、非人間作成 PR は人がマージ、SOC 2/ISO 27001/ISO 42001 への対応表を作成。
claims:
  - id: c1
    text: 非人間（エージェント・ボット）が作成した PR は AI レビュアーがレビューできても、人がボタンを押さない限りマージできない。書き手と出荷者を AI が兼ねない職務分離をツールで強制し、SOC 2 CC8.1.2 に対応づける。
    quote: a PR authored by a non-human (an agent, a bot) can be reviewed by Diff Vader but can never be merged without a human clicking the button.
    locator: "The part nobody talks about: compliance"
    quant: null
    evidenceKind: case-report
    rqs: [TH01-Q2, TH12-Q1]
    issues: [248, 249]
    stance: supports
  - id: c2
    text: AI は指摘を出すだけで、決定は単体テスト済みの決定的なコード（verdict engine）が行う。認証・認可・秘密情報・暗号・承認者を変える変更は常に人を要する。
    quote: The AI produces findings. A small, unit-tested, boringly deterministic piece of code turns those findings into the decision.
    locator: We didn’t invent this
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q2, TH07-Q5]
    issues: [269, 271]
    stance: supports
  - id: c3
    text: 第二ベンダー（GitHub Copilot）のレビューは助言のみとした。必須の相互確認にしたところ『レビューできなかった』定型文で良い自動承認を止めてしまい、安全上の利益なく較正負担だけが増えたとする。
    quote: We tried making it a required cross-check and found it was soft-blocking good auto-approvals on “I couldn’t review this PR” boilerplate
    locator: "The council: many specialists, one question"
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c4
    text: シャドー週と有効化後の最初の1週間を合わせた期間で、約40%の PR がボットの判定で auto-approve となった(何もゲートしていないシャドー期間の判定を含む)。ボットが承認し人もレビューした PR では人の判断と約99%一致し、ボット承認の PR に紐づく revert・障害はゼロだった(著者は小標本で暫定的な方向性を示す数値と明記)。
    quote: Around 40% of PRs come back as auto-approve ... humans have agreed with the bot’s call about 99% of the time. ... Zero reverts and zero incidents have been linked to a bot-approved PR.
    locator: The numbers, honestly
    quant:
      value: ~40% auto-approve; ~99% human agreement; 0 reverts/incidents
      n: shadow week + first enabled week across 400+ repos (PR count not stated)
      design: shadow-mode then live rollout, self-reported
      population: Rewind GitHub orgs
    evidenceKind: case-report
    rqs: [TH06-Q6, TH02-Q4]
    issues: []
    stance: context
  - id: c5
    text: PR の審査強度をサイズでなくリスクで決める。12行の移行でも危険で、3千行の生成コードは安全でありうる。
    quote: a PR’s risk has almost nothing to do with its line count.
    locator: "The reframe that makes the whole thing work: risk is not size"
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q3, TH01-Q1]
    issues: [273]
    stance: supports
