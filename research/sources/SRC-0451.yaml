summary: 2年間運用した小PR・スタック型PRの規則を、AIがコードの大半を書くようになって廃止した企業の報告。差分の大きさの代わりにリスクラベル・feature flag・ロールバック計画を関門にする。
claims:
  - id: c1
    text: エージェントにスタック型PRを作らせたところ『技術的には正しいが文脈的には悪い』結果になり、各PRが base に未存在のコードを参照し、PR#2 への指摘が PR#4 の判断に依存するなど、レビュアの負担はむしろ増えた。
    quote: We asked agents to produce stacked PRs. The results were technically correct but contextually worse. Each PR referenced code that didn’t exist yet in the base branch.
    locator: What broke
    quant: null
    evidenceKind: case-report
    rqs: [TH10-Q2]
    issues: [273]
    stance: contradicts
  - id: c2
    text: 変更行数ではなく影響範囲(blast radius)を有用な信号とし、全PRに risk:low/medium/high のラベルを付けて行数の代理指標を置き換えた。
    quote: The size of the diff stopped being the useful signal. The blast radius is.
    locator: Feature flags as the real review gate / Risk labels over line counts
    quant: null
    evidenceKind: case-report
    rqs: [TH10-Q3]
    issues: [273]
    stance: qualifies
  - id: c3
    text: PRテンプレートの Why/What 節は、AI作成のPRでもエージェントに指示した人が書き、AIには生成させないと明示的に指示している(PR本文の役割を人の文脈情報に限る設計)。
    quote: For AI-authored PRs, the human who prompted the agent fills these in. We explicitly instruct AI assistants not to generate these sections
    locator: The PR template that replaced line counts
    quant: null
    evidenceKind: case-report
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c4
    text: ロールバック/取り消し計画をPRテンプレートの必須欄とし、データ修正を含む安全な取り消し方を全PRに書かせている。
    quote: Rollback/Revert Plan is a required field. Every PR needs to describe how to safely undo itself, including any data fixes.
    locator: The PR template that replaced line counts
    quant: null
    evidenceKind: case-report
    rqs: [TH10-Q4]
    issues: [271]
    stance: context
  - id: c5
    text: 件数ベースでPRの80%超がAI作成となった状況では、レビューへの投資は収穫逓減になり、ロールバック基盤への投資が複利で効くと主張する(母数・測定方法の記載なし)。
    quote: at Rootly, when 80%+ of PRs by count are AI-authored, your investment in review has diminishing returns. Your investment in rollback infrastructure has compounding ones.
    locator: What we learned
    quant:
      value: PRの80%超がAI作成(件数ベース)
