summary: RAG と LLM(GPT-4o 等)で要求→コード等のトレースリンクを回復する LiSSA を ICSE 2025 で評価した論文。コード関連では既存手法を上回るが、実務の完全自動化には不十分と著者自身が結論している。
claims:
  - id: c1
    text: 要求→コードの TLR(Table IV)で、GPT-4o を用いた LLM+RAG の平均 F1 は最良で .322 で、プロジェクトごとに最適化したベースライン FTLR_OPT の .303 を上回る。ただし著者によれば、有意差が出なかったのはこのプロジェクト別最適化ベースラインとの比較だけで、他の既存手法には平均で有意に優る。
    quote: TABLE IV COMPARISON OF THE AVERAGE AND WEIGHTED AVERAGE F-SCORES USING GPT-4O AND GPT-4O MINI FOR REQUIREMENT-TO-CODE TLR ... P2 .322 .368 .295 .356 ... FTLROPT .303 .327 .294 .329
    locator: Table IV(要求→コード TLR、Top-20 retrieval)
    quant:
      value: avg F1 .322 (best, GPT-4o) vs FTLR_OPT .303
      n: 5 projects (SMOS, eTour, iTrust ほか)
      design: benchmark with Wilcoxon tests
      population: public req-to-code TLR datasets
    evidenceKind: benchmark
    rqs: [TH08-Q2]
    issues: []
    stance: qualifies
  - id: c2
    text: 著者は、提案手法の F1/F2 は実務で完全自動の TLR を可能にする水準に達しておらず、半自動(F2)でも実務には不十分と結論している。
    quote: the performance in F1-score and F2-score of the proposed RAG-based TLR does not yet enable fully automated TLR in practical applications
    locator: §VIII Conclusion
