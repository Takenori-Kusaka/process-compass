summary: ISO 19011 第 4 版(2026-05)の公開プレビュー。まえがき・序文・適用範囲・用語 3.2 までが読める。主な変更は遠隔監査の手引きの拡充で、独立性は 4.6 として独立の細分箇条になったが本文はプレビュー範囲外。ISO 直系の赤入れ版プレビュー(redline-iso-19011-2026.pdf)も 4.5 までで切れ、2018 年版の小規模組織の一文が残ったかは原文で確かめられなかった。
