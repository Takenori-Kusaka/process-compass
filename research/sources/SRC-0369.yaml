  - id: c4
    text: ADR は文脈や帰結の変化に合わせて定期的に見直し更新する(不変・supersede 方式と異なる)。
    quote: Regularly review and update the ADR to reflect any changes in the context or consequences of the decision.
    locator: How to use this ADR framework, step 6
