    text: 自動化は「情報取得・情報分析・意思決定と行動選択・行動実行」の4つの機能クラスに分けて適用され、各クラス内で完全手動から完全自動までの連続段階を持つ。単一システムが4種類を異なるレベルで持ちうる。
