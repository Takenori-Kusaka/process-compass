summary: AWS の規範的ガイダンスのうち、エージェント型システムを「届ける」ための SDLC の変更を述べる節(ガイド初版 2025-08-12、文書履歴に改訂なし)。固定段階の代わりに zones of intent を置き、受入基準を振る舞いのガードレールへ移すと主張する。エージェントで開発する側ではなく、エージェントを製品とする側の指針である点に注意。
