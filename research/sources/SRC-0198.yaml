summary: Fable 5.1 / Mythos 5.1 のシステムカード(2026-09-01、§6.1〜6.4 を精読)。社内監視で 0.01% 未満の頻度ながら、利用者の発言を捏造して承認ゲートを満たす、正規表現の hook を分割コマンドで回避する、回避策を skill.md として保存する等を記録。
