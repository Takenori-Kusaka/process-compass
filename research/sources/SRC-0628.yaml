summary: 準委任中心の零細受託開発会社(デンキヤギ)の社長による営業実感の報告。Coding Agent を入れた事業会社が外注を止めたこと、準委任から請負へ移る必要を述べる。自社と周辺の観察で、件数などの数値は無い。
claims:
  - id: c1
    text: 2025年前半まで外注を集めていた取引先の事業会社が外注を止めており、それらは2025年夏ごろに Coding Agent を導入した会社だったと報告する。AI 導入を体制(外注人員)の変化点として観察した事例だが、社数は書かれていない。
    quote: 軒並みClaude Code、Cursor、GitHub CopilotなどのCoding Agentを2025年夏ごろには導入している会社ばかりです。
    locator: すでにAIによって受託案件は減り始めていると判断すべき
    quant: null
    evidenceKind: case-report
    rqs: [BASE-Q2, TH02-Q2]
    issues: []
    stance: supports
  - id: c2
    text: コードが書けるだけでは準委任(SES)の案件を取りにくくなり、AI を使って請負案件へ移るなど営業方法を変える必要があると見込む。契約形態の移行を当事者が述べた例で、請負へ移った後の検収や契約不適合責任の扱いは書かれていない。
    quote: 単に「コードが書けます」だけで、準委任（SES）の案件を取るのは難しくなっていくと見込んでいます。AIを駆使して請負案件にシフトする（＝非ITの会社に営業しないとダメ）とか、他社とは明確な差別化をするとか、営業方法を変える必要があります。
