summary: IEC 62304 の修正票 1(2015-06)の公開プレビュー。修正文の形で §3〜§5.8 の差分が読める。§5.7.4 は全安全クラスに対し「全要求が試験または他の方法で検証済みであること」と「要求と試験の間のトレーサビリティが記録されていること」の確認を課す。本体 2006 年版のプレビューは用語 3.6 までで §5.1.1 の原文は読めない。プレビュー範囲に検証者の独立性を課す文言は無い(不在の確認ではない)。
claims:
  - id: c1
    text: §5.7.4(修正後)は製造業者に、(a) すべてのソフトウェア要求が試験または他の方法で検証されたこと、(b) 要求と試験・他の検証の間のトレーサビリティが記録されたこと、(c) 試験結果が合否基準を満たすこと、の確認を課す(クラス A・B・C)。(a) は対応の有無の網羅確認、(c) は内容の合否で、別項として書き分けられている。
    quote: the TRACEABILITY between software requirements and tests or other VERIFICATION is
