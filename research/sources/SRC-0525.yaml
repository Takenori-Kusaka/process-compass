      c1:
        verdict: match
        extractedValue: "§5.7.4(修正後の表題: EVALUATE SOFTWARE SYSTEM testing)、a)〜c) の3項目、[Class A, B, C]"
        extractedQuote: b) the TRACEABILITY between software requirements and tests or other VERIFICATION is recorded; and c) test results meet the required pass/fail criteria. [Class A, B, C]
        locator: §5.7.4 EVALUATE SOFTWARE SYSTEM testing(Amendment 1 の pp.12-13)
        note: 引用は b) c) とクラス表示。a) は "a) all software requirements have been tested or otherwise VERIFIED;"、柱書きは "The MANUFACTURER shall verify that:"。iTeh のプレビュー PDF(15 ページ)は無償で取得でき、該当箇所を含んでいた。修正後の 5.7.4 は a)〜c) の前に "The MANUFACTURER shall EVALUATE the appropriateness of VERIFICATION strategies and test procedures." の一文を持つ。「(a) は網羅確認、(c) は内容の合否」という読み分けは主張側の解釈で、原文は3項目を並べるだけ。
