summary: OSS のスタック管理 CLI である git-spice の変更履歴。2026 年は対応フォージを広げ、v0.30.0 でスタックの一括マージ、v0.31.1 で GitHub の CI 二重起動の修正を入れた。最新は v0.31.2(2026-07-21)で、GitHub 標準スタック(2026-07-30)への言及は履歴に無い。
claims:
  - id: c1
    text: git-spice は v0.31.1(2026-07-20)で、PR の base を変えずにブランチを push し直したときに GitHub の CI が二重に起動する不具合を修正した。スタック管理ツール側の操作が CI 発火数に影響していた実例である。
    quote: "github: Duplicate CI runs are no longer triggered when an updated branch is pushed without changing its pull request base."
    locator: v0.31.1 - 2026-07-20 / Fixed
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: supports
  - id: c2
    text: v0.30.0(2026-06-29)は、スタックを1回の自動操作でマージする実験的コマンドを追加し、git-spice を手元のマージキューとして使えるようにした。
    quote: These turn git-spice into a local merge queue, allowing you to merge stacks of branches in a single automated operation.
    locator: v0.30.0 - 2026-06-29
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
  - id: c3
    text: v0.29.0(2026-05-25)は、下段がマージされたあとに上段 PR の base を付け替える処理を足した。フォージが base を自動で付け替えない場合があることへの対処である。
    quote: "repo sync: Upstack PRs are now retargeted after their base branch is merged. This handles cases when the forge doesn't automatically retarget their bases."
    locator: v0.29.0 - 2026-05-25 / Fixed
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: context
