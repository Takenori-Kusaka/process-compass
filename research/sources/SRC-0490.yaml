summary: SC 42 が策定中の「AI システムの人間による監視の指針」。ISO の規格ページ(段階・概要)と OBP の DIS 版プレビュー(適用範囲・用語)を読んだ。2026-09-24 時点で未発行(FDIS 投票中)。日付は段階 50.20 の日付。
claims:
  - id: c1
    text: ISO/IEC 42105 は AI システムの人間による制御と監視(human oversight)の指針で、ISO/IEC TS 8200(制御可能性)を拡張する。2026-08-26 に FDIS 投票が始まった段階で、まだ発行されていない。
    quote: This document provides guidance on human control and monitoring of AI systems, which is referred to as human oversight. This document extends ISO/IEC TS 8200.
    locator: Abstract / Life cycle(Stage 50.20, 2026-08-26)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q1, TH01-Q2]
    issues: []
    stance: context
  - id: c2
    text: DIS 版は「人間による監視の監督者」を「人間による監視の責任または権限を持つ人間」と定義する(複数の自然人でもよい)。同じ §3 は AI system operator を「AI システムを扱う自然人」、AI customer / AI user / AI developer / AI subject を「組織または実体」と定義している。
    quote: human oversight supervisor designated person human with responsibility or authority for human oversight
