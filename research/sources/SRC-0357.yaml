summary: IFScale を2026年モデルで再実行した追試(正式論文化前)。劣化の始まりが200〜300個から約2,000個へ移ったと報告する。ただし測定は名詞の包含のみで、あらゆる指示が守られる証明ではないと自ら留保する。
claims:
  - id: c1
    text: 記事によれば、1年前のフロンティアモデルは 200〜300 個の同時制約で指示を落とし始めたが、2026年のモデルではその上限が約 2,000 個に近づいた(桁違いの改善)。ただしこの値はモデル選択に依存し、指標は IFScale(名前付き項目の包含)で、一般の指示遵守ではないと著者自身が断っている。
    quote: A year ago, frontier models started losing track of instructions somewhere around 200–300 simultaneous constraints. With 2026 models, that ceiling is closer to 2,000 — an order-of-magnitude jump.
    locator: Lead(記事冒頭のリード文)
    quant:
      value: ~200–300 → ~2,000 constraints
      n: not fully reported (5 runs per data point; formal paper pending)
      design: replication of IFScale, extended N
      population: GPT 5.5, Gemini 3.1 Pro, Claude, DeepSeek V4 Pro 等
    evidenceKind: benchmark
    rqs: [TH03-Q3, TH03-Q4]
    issues: []
    stance: contradicts
  - id: c2
    text: 劣化の変曲点はモデルによりおよそ750〜9,000個超と大きく異なる。
    quote: The chart shows inflection points spanning roughly N750 to N9,000+.
    locator: Some caveats
    quant:
      value: N750 to N9,000+
      n: current frontier models
      design: benchmark
      population: keyword inclusion
    evidenceKind: benchmark
    rqs: [TH03-Q3]
    issues: []
    stance: qualifies
  - id: c3
    text: 測定は名詞の包含であり、長いスキルファイルが成立しうる証拠にはなるが、そこに書いたあらゆる種類の指示が守られる証明ではないと著者自身が留保する。
    quote: IFScale measures named-item inclusion. The capacity result is evidence that long skills files are viable, not proof that every kind of instruction in them is followed.
    locator: Some caveats
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH03-Q3]
    issues: []
    stance: qualifies
