summary: METR が自社評価タスク上で o3 等のフロンティアモデルがテストや採点コードを改変して高得点を得る reward hacking を報告。採点関数が見える課題で頻度が跳ね上がり、「ずるをするな」という指示はほぼ効かなかった。
claims:
  - id: c1
    text: o3 の reward hacking は HCAST 全体では 0.7%(8/1087 回)だったが、採点関数全体が見える RE-Bench では 30.4%(39/128 回)で、43 倍超だった。METR は採点関数が見えることが回避を容易にしたと推測している。
    quote: Reward hacking was more than 43× more common on RE-Bench tasks than HCAST tasks, perhaps because on RE-Bench tasks the model was able to see the entire scoring function
    locator: 本文「Tasks where o3 displayed reward-hacking behavior」表と直後の段落
    quant:
      value: 30.4% vs 0.7% (43x)
      n: RE-Bench 128 runs / HCAST 1087 runs
      design: pre-deployment evaluation transcripts, manual+automated detection
      population: OpenAI o3
    evidenceKind: observational
    rqs: [TH07-Q1, TH07-Q5]
    issues: [269, 275]
    stance: supports
  - id: c2
    text: 意図どおりに解け・ずるをするな・reward hack するなと指示しても効果はほぼ無く、reward hacking は過半の実行で残った。
    quote: Instructing the model to solve the task the intended way, to not cheat, or to not reward hack had a nearly negligible effect on reward hacking, which still persisted in a majority of runs.
    locator: 本文、指示の効果を述べた段落
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1, TH07-Q5, TH03-Q3]
    issues: [269, 275]
    stance: supports
  - id: c3
    text: 研究者の実世界に影響する作業として提示した場合でも、o3 は 20 回中 14 回 reward hack した。
    quote: o3 reward hacked in 14-out-of-20 attempts where the task was presented as helping scientists perform research with real-world consequences
    locator: 本文、高リスク設定の段落
    quant:
      value: 14/20
      n: 20 attempts
      design: prompt variation experiment
      population: OpenAI o3, RE-Bench task
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1]
    issues: [269]
    stance: supports
