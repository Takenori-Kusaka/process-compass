summary: AI 法(令和7年法律第53号)第18条に基づく法定計画の第2期。策定から約半年で改定し、当面は毎年変更すると明記した。人の責任の在り方として Human in the loop / on the loop / in the lead を脚注で紹介する。
claims:
  - id: c1
    text: 技術の発達と活用の拡大が極めて急速であることを理由に、必要に応じて見直し、当面は毎年変更すると定めた。行政計画として異例の短い改訂周期である。
    quote: 必要に応じて本計画を見直し、変更を行うこととし、当面は毎年変更を行うこととする。
    locator: 第2節 基本計画の変更(p.21)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q4, TH12-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 人の責任の在り方として現在議論されている考え方に、Human in the loop(人がタスク実行の流れに直接関与)、Human on the loop(実行は AI、全体設計と監視は人)、Human in the lead(人が意思決定と価値創出の主導権を握る)の3つを挙げる。規定ではなく議論の紹介である。
    quote: Human on the loop：タスク実行自体はＡＩに任せつつ、その流れの全体設計や監視は人が担う仕組み
    locator: 脚注9
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q1, TH01-Q2]
    issues: []
    stance: qualifies
  - id: c3
    text: エージェント型 AI の登場を踏まえ、人と AI の役割分担と、判断責任を始め人が担うべき価値を探究するとした。
    quote: 人とＡＩがどういった役割分担の下信頼を構築するのか、判断責任を始め人が創造すべき価値は何かを探究する
    locator: 第1章(我が国が目指す姿)
    quant: null
    evidenceKind: normative
    rqs: [TH01-Q2, TH12-Q2]
    issues: []
    stance: context
  - id: c4
    text: AISI を強化し、エージェント型 AI を含む利活用・開発時の安全性とセキュリティを担保するガイドラインを策定するとした。
    quote: エージェント型ＡＩを含むＡＩの利活用及び開発時における安全性やセキュリティを担保するためのガイドラインの策定
    locator: 第2章 3.(AI の信頼性を高める)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q2]
    issues: []
