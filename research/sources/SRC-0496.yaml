summary: LLM アプリの 2026 年版 Top 10。PDF の序文・変更点を読んだ。初めて実インシデント 7,714 件の分類結果を投票と混ぜて順位を決め(投票 3/4・データ 1/4)、信念と証拠が食い違う箇所を開示した。
claims:
  - id: c1
    text: 順位はコミュニティ投票に 3/4、インシデントデータ(公開脆弱性 DB と AI 被害 DB の 7,714 件、分類可能な 6,639 件)に 1/4 の重みを置いて決めた。1年分の雑音の多いデータに投票を覆させない設計と説明する。
    quote: The community vote carries three-quarters of the weight. The incident data covers the remaining quarter.
    locator: Letter(p.5)
    quant:
      value: 投票 75% / インシデントデータ 25%
      n: 7,714 件収集、6,639 件を分類
      design: コミュニティ投票と分類器によるインシデント分類の加重
      population: 公開脆弱性データベースと AI 被害データベース
    evidenceKind: normative
    rqs: [TH12-Q4]
    issues: []
    stance: supports
  - id: c2
    text: プロンプトインジェクションは実務者の投票では1位だが、生のインシデント記録で順位付けすると Top 10 から外れる。防御が効いて公開 DB に載りにくい「防御効果」と解釈し、1位に据え置いた。
    quote: Rank the categories by the raw incident record instead, and it falls out of the top 10 entirely.
    locator: Letter(p.5)
    quant: null
    evidenceKind: observational
    rqs: [TH12-Q4]
    issues: []
    stance: context
  - id: c3
    text: Excessive Agency が3位に上がり、投票とインシデント記録の双方がエージェント型の導入で被害が出ていることで一致した。
    quote: Excessive Agency climbed to third, the most consequential move on the list, because the vote and the record agree that agentic deployments are where the damage is landing.
    locator: What's New in the 2026 Top 10(p.7)
    quant: null
    evidenceKind: observational
    rqs: [TH12-Q3]
    issues: []
    stance: supports
  - id: c4
    text: モデルがツール・記憶・下流への作用を持つ「行為者」になった時点で、リスクの扱いは Agentic Top 10 側へ移ると境界を定めた。
    quote: The moment that model becomes an actor, with tools it can call, memory it carries between sessions, and consequences it sets in motion downstream, the risk moves to the OWASP Agentic Top 10.
    locator: What's New in the 2026 Top 10(p.7)
    quant: null
    evidenceKind: normative
    rqs: [TH12-Q3]
    issues: []
    stance: context
