summary: GitHub のリポジトリ規則(rulesets)の公式説明。Active / Evaluate / Disabled の3状態を持ち、Evaluate では強制せずに違反の有無を Rule Insights で観測できる。バイパス権限の付与と、重なった規則は最も厳しいものが適用されることも定める。
