summary: 長文脈をモデルの注意機構(ウィンドウ)に載せる代わりに、ファイルシステムへ外部化して coding agent に道具で操作させると、188K〜3 兆トークンの長文脈ベンチで既存手法を上回ったという 2026-03 の査読前論文。「常時ロードを減らし取りに行く」設計の学術的裏付けであり、長文脈=ウィンドウ拡大という前提への反証。
