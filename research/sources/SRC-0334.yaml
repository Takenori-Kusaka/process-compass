summary: SIer による4M変更(変化点)管理の解説コラム。Man の変化点として担当者変更・増員・欠勤を挙げ、影響度・頻度・損失で優先順位を付けること、変化点を多発させない工程への改善、3H(初めて・変更・久しぶり)の併用を述べる。
claims:
  - id: c1
    text: Man(人)の変化点として、担当者・検査員の変更、職制の変更、増員や残業、欠勤や事故を列挙する。人の増減そのものを変化点に数える。
    quote: 作業担当者・検査員の変更、職制の変更、増員や残業、欠勤や事故など
    locator: 4Mを用いた変更管理 > 具体的な変更管理の流れ
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c2
    text: 洗い出した変化点は、品質への影響度・発生頻度・推定損失で優先順位を付ける。すべての変化点を同じ強さで管理しない前提である。
    quote: 優先順位を決める際は、品質および他プロセスに与える影響度合いや変化点の発生頻度、推定される損失の大きさなどから評価します。
    locator: 同上
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 変化点は多岐にわたるため、変化点を多発させない工程へ改善することが大前提だとする。管理の追加より変化点の削減を先に置く考え方である。
    quote: 変化点は多岐にわたるため、大前提として変化点を多発させない工程に改善していくことも肝要です。
    locator: 同上
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2]
    issues: []
    stance: qualifies
  - id: c4
    text: 3H(初めて・変更・久しぶり)を4Mと組み合わせ、配置転換や現場復帰などを重点的に注意すべき時点として抽出する。
    quote: 3Hとは、ヒューマンエラーが起こりやすい状況（変化点）である「初めて、変更、久しぶり」の３つのHを表す標語です。
    locator: 4M管理の効果を高めるために > 4M×3H
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH02-Q2]
    issues: []
    stance: context
