summary: 3 体パネルの討論で、誠実な異質ピアが有害改訂を下げ、敵対的ピアが戻すことを 4 系統 × 3 ベンチマークで測定。#258 が引く 89% / 35% / 90% / 31%→6% は原典に一致するが、89% は「改訂した場合に有害だった割合」(改訂率自体は 12.3%)であり、「正しかった答えが壊れる方が多数派」という読みは条件付き確率の取り違え。31%→6% は敵対者が既にいる汚染パネルの値で、35% とは別設計。
claims:
  - id: c1
    text: Llama-3.1-70B 防御側・MATH-hard で、誠実枠の有害改訂率は同質パネル 89%(89.1±2.5)、誠実な異質ピア(gpt-oss-120b)1 体で 35%(35.2±2.9)、敵対的ピアで 90%(90.0±1.5)。
    quote: For Llama-3.1-70B defenders on MATH-hard, the honest-slot harmful-revision rate falls from 89% in the homogeneous panel to 35% with an honest peer, and an adversarial peer returns it to 90%.
    locator: Abstract; §4.1 The Matched Tradeoff; App. Table 4 (89.1% ± 2.5 / 35.2% ± 2.9 / 90.0% ± 1.5)
    quant:
      value: 89% → 35% → 90% (P(DM|D=1))
      n: pooled n(D=1) = 175 / 589 / 589 transitions; n_valid ≈ 1,420 / 1,397 / 1,333
      design: "controlled experiment (matched 3-agent panels: [ll,ll,ll], [ll,ll,gpt-oss], [ll,ll,gpt-oss-adv])"
      population: Llama-3.1-70B defenders, MATH-hard (MATH-500 levels 4–5)
    evidenceKind: controlled-experiment
    rqs: [TH06-Q1]
    issues: [258]
    stance: supports
  - id: c2
    text: 同質パネルで誠実な防御側が改訂するのはまれ(matched 分析で P(D=1)=12.3%±0.6)だが、改訂するとほぼ常に有害である(P(DM|D=1)=89.1%±2.5)。初回に全誠実枠が正答だった項目のうち、最終ラウンドまでに少なくとも1枠が誤答になった割合(flip)は 13.6% だが、これは項目集合と条件付けが異なる汚染対照の clean 同質パネル(同じ分析での P(D=1)=21.8%)の値である。
    quote: In the homogeneous panel, honest defenders revise rarely (P(D=1)=12.3%±0.6) and almost always harmfully (pbase=89.1%±2.5).
    locator: §2.1 Measurement(定義); §4.1; App. C.1 Table 4; App. C.2 Table 8; Table 2
    quant:
      value: P(D=1)=12.3%; flip 13.6%
      n: same cohort
      design: controlled experiment
      population: Llama-3.1-70B / MATH-hard homogeneous panel
    evidenceKind: controlled-experiment
    rqs: [TH06-Q1]
    issues: [258]
    stance: qualifies
  - id: c3
    text: 同族の敵対者が既にいる汚染パネルで、誠実な同族防御側 1 体を誠実な異質ピアに置き換えると、初回正答項目の反転率が 31%(30.8%)→6%(6.1%)、有害改訂率 87.2%→43.7%。35% の値(整合パネル)とは別設計。
    quote: On the same Llama-3.1-70B setting, the added honest peer cuts the flip rate on initially-correct items from 31% under a same-family adversary to 6%.
    locator: Abstract; §4.2; Table 2 (same-family [ll,ll,ll-adv] flip 30.8% [26.1,35.9] → contaminated [ll,ll-adv,gpt-oss] 6.1% [4.0,9.3])
    quant:
      value: flip 30.8% → 6.1%; harmful revision 87.2% → 43.7%
      n: items with all honest slots correct at R0 (Wilson 95% CI reported)
      design: controlled experiment (contamination control)
      population: Llama-3.1-70B / MATH-hard
    evidenceKind: controlled-experiment
    rqs: [TH06-Q1]
    issues: [258]
    stance: supports
  - id: c4
    text: 著者は、有害改訂率への効果の符号が4モデル系統・3ベンチマークにわたり保たれ、大きさは防御側とベンチマークの体制で変わると述べる。ただし3パネル比較(matched)は Llama-3.1-70B/MATH-hard、gpt-4.1/MATH-hard、llama-1b/GSM8K の3設定だけで、有害改訂率(baseline→honest-mixed→adversarial-mixed)は gpt-4.1/MATH-hard で 73.6%→58.8%→75.7%、llama-1b/GSM8K で 84.0%→74.9%→86.8% である(89% は Llama-3.1-70B/MATH-hard の値)。
    quote: "The gpt-4.1 trio on MATH-hard shows the same sign at smaller magnitude: harmful revision moves 73.6%→58.8%→75.7% across baseline, honest-mixed, and adversarial-mixed (bonus 14.8, penalty 2.1)."
    locator: Abstract; §1 Introduction; §4.1; App. C.1 Table 4
    quant:
      value: sign consistent; magnitude 89→35 (Llama-70B) vs 73.6→58.8 (gpt-4.1) vs 84.0→74.9 (llama-1b)
      n: 3 matched trios + contamination controls on MATH-hard / SciBench / GSM8K
      design: controlled experiment
      population: Llama-3.1-70B, gpt-4.1, llama-1b/gemma-2b, gpt-oss-120b
    evidenceKind: controlled-experiment
    rqs: [TH06-Q1, TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c5
    text: 適用範囲は客観的に採点できる推論ベンチマークに限る。開放的生成や主観課題(コードレビュー・仕様レビューを含む)へ持ち越せるかは未解決と著者自身が述べる。
    quote: We do not study open-ended generation or subjective tasks, where “correct revision” is not crisply defined. Whether the same revision dynamics carry over remains open.
    locator: §7 Limitations
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH06-Q1, TH06-Q3]
    issues: [258]
    stance: qualifies
  - id: c6
    text: 誠実な異質ピアの純益(honest bonus)は 53.9pt、敵対ペナルティ 0.9pt、置換コスト 54.8pt。損益分岐は追加ピアが敵対的である事前確率 98.4% 以上のときのみ(Llama-70B/MATH-hard)。
    quote: "The break-even prior is high throughout: heterogeneity lowers expected harmful revision unless an added peer is adversarial with probability above"
    locator: "§4.1; App. Table 5 (Llama-70B / MATH-hard: bonus 53.9, penalty 0.9, repl. cost 54.8, break-even 98.4%)"
    quant:
      value: bonus 53.9pt / penalty 0.9pt / break-even prior 98.4%
      n: matched cohorts
      design: derived decision quantities from controlled experiment
      population: Llama-3.1-70B / MATH-hard
    evidenceKind: controlled-experiment
    rqs: [TH06-Q3]
    issues: [258]
