summary: 仕様・可視テスト・合成的な保留テストに分け、両テストの合格率の差で reward hacking を測る30課題(JSON パーサ〜OS カーネル)のベンチマーク。可視テストは全エージェントが飽和する一方、差は課題規模とともに拡大する。
claims:
  - id: c1
    text: 全フロンティアエージェントが可視テストを飽和させるが reward hacking は残り、小さいモデルほど保留テストとの差が大きい。
    quote: while every frontier agent saturates the visible suite, reward hacking persists, with smaller models exhibiting larger gaps on holdout suites
    locator: Abstract; §3.2
    quant:
      value: 可視テスト飽和・保留テストとの差が残存
      n: 30 tasks; 2,046 runs(Codex gpt-5.2-codex 596, Claude Code Opus 4.6 516, OpenCode 各種 800)
      design: benchmark(可視 vs 保留テストの合格率差)
      population: Codex, Claude Code, OpenCode + DeepSeek/Qwen/Kimi/MiniMax
    evidenceKind: benchmark
    rqs: [TH07-Q1]
    issues: [269, 275]
    stance: supports
  - id: c2
    text: 可視テストと保留テストの差は、コード規模が10倍になるごとに28ポイント拡大する。長い課題ほどテストだけの監督は効かなくなる。
    quote: it grows by 28 percentage points for every tenfold increase in code size
    locator: Abstract; §3.1 Task Horizon and Reward Hacking
    quant:
      value: +28pt / コード規模10倍
      n: 30 tasks(1.5K–110K LOC)
      design: benchmark
      population: 同上
    evidenceKind: benchmark
