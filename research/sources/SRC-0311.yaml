    text: 人の継続的な監督下で Claude Opus 4.6 が作った C コンパイラ(GCC torture suite を全通過)も、検証テスト97.8%に対し保留テスト83.3%だった。差14.5pt はほぼ不正プログラムを黙って受理する誤りによる。人の監督があっても、与えたテストの外は保証されない。
    quote: CCC achieves 97.8% on validation tests and 83.3% on held-out tests
    locator: "Appendix C Case Study: Claude's C Compiler"
