summary: リポジトリの文脈ファイル(AGENTS.md / CLAUDE.md)の効果を SWE-bench Lite 300 件と新設 CTXbench 138 件、4エージェント(Claude Code+Sonnet 4.5 を含む)で測った査読前論文(v2 2026-06-23)。成功率は上がらず推論費用が平均20%超増え、ファイル長の影響も有意でないと報告。ベンダー推奨への反証。
