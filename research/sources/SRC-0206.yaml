  - id: c11
    text: CTXbench では、開発者作成の context file はエージェント性能を平均 2.4% 改善したが有意ではなく(p=21%)、LLM 生成のものよりは有意に良かった(p=3.8%)。ただし同じ段落で、開発者作成ファイルもステップ数(平均3.34)とコスト(最大19%)を増やし、Claude Code では改善しなかったと述べている。
    quote: Developer-provided context files improve agent performance by 2.4% on average (p=21%), significantly outperforming LLM-generated ones (p=3.8%) (see Table 3).
