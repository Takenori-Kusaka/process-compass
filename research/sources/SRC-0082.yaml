summary: ACM CAIS 2026 デモ採択(abstract 記載)。コーディングエージェント利用者21名への形成的調査で、自律度の調整に不満があり監視の好みが時間とタスクで変わることを確認。静的な権限設定や指示ファイルでは追従できないとして、対話履歴から自律度を動的に調整する CLI エージェント Hedwig を提案。
claims:
  - id: c1
    text: コーディングエージェントを使う技術者21名は自律度の較正に不満を持ち、監視レベルの好みは変化し続ける。
    quote: We conducted a formative survey with 21 software engineers who use coding agents and found that they experience frustration with calibrating autonomy and have evolving preferences for level of oversight.
