summary: ライフサイクル情報項目(文書)の目的と内容を定める規格の第4版(2019-07)。公開プレビューで §1〜§5 を確認した。情報項目を作る前に読み手の意思決定・作業を考慮することを求め、文書の統合・分割やリポジトリ上の未刊行も適合とする。
claims:
  - id: c1
    text: 情報項目を作る前に、その情報を使う人が行う意思決定や作業の種類を考慮すべきとする(読み手と目的を文書設計の起点に置く)。
    quote: The type of decision to be made, or the work to be performed, by users of the information should be considered before an information item is prepared.
    locator: 4.4 Applicability to information item audiences
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4]
    issues: []
    stance: supports
  - id: c2
    text: 情報項目は、未刊行でもリポジトリで参照可能なら適合とみなす。分割しても、他の項目と1文書に統合してもよい(文書の本数や独立性を要求しない)。
    quote: considered as conforming if they are unpublished but available in a repository for reference, divided into separate documents or volumes, or combined with other information items into one document
    locator: 5.1 Definition of conformance
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4, TH05-Q3]
    issues: [252]
    stance: supports
  - id: c3
    text: 規格が定める記録名・情報項目名を使うことは適合の要件ではない。
    quote: Use of the nomenclature of the specific records in Clause 9 or the information item titles in Clause 10 is not required to claim conformance with this document.
    locator: 5.1 Definition of conformance
    quant: null
    evidenceKind: normative
    rqs: [TH05-Q4]
    issues: []
    stance: context
