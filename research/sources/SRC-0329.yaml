summary: 極小組織(VSE、25名以下)向けソフトウェア工程プロファイルの規格本体の公開プレビュー(序文〜7.2.2 まで)。基本プロファイルは単一プロジェクト視点で、計画を顧客が合意することを要求する。プレビューは SI 工程の要求事項に届かず、独立レビューの要否は本取得では確認できない。
