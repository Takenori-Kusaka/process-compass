summary: NTTデータ第三公共事業本部の責任者による、社員3名が2025/10〜2026/3に成果物の全量をGitHub Copilotで作成した商用サブシステム開発の振り返り(個人のチームの取り組みと明記)。設計・製造は機能したがテスト観点の不足ですり抜けバグが多発した。
claims:
  - id: c1
    text: 設計書・コード・テストケースをすべてGitHub Copilotで作成し社員がレビューする体制で、社員3名がモックベースの要件定義から開発した。
    quote: この期間中、設計書、ソースコード、テストケース等、システム開発の成果物を全てGitHub Copilotで作成し、それを社員がレビューする流れで開発を行いました。
    locator: 3.1〜3.2 体制
    quant: null
    evidenceKind: case-report
    rqs: [TH09-Q3]
    issues: []
    stance: context
  - id: c2
    text: 73個のプロンプトファイルと各種規約類・開発ルール類の補足ファイルを作り込み、.github 内だけで空行除き約9,000行に達した。設計工程以降は、出力品質が個人のプロンプト作成能力に依存して属人化するのを避けるため直接のプロンプト入力を禁止した(要件定義はバイブコーディングで行った)。
    quote: そのドキュメント体系を前提に、アクティビティ定義を行って、７３個のプロンプトファイルや、各種規約類、開発ルール類の補足ファイルなども作りこんでいった感じです。 いま計測してみたら、.github内だけで空行除き9,000行ぐらい書かれてました。
    locator: 4.2 エージェント環境の構築(直接プロンプト禁止は4.3 設計)
    quant:
      value: 約9,000行(プロンプトファイル73個、copilot-instructions.md 約150行)
      n: 1チーム
      design: 自己計測
      population: .github ディレクトリ
    evidenceKind: case-report
    rqs: [TH03-Q2, TH03-Q4, TH05-Q3]
    issues: [269, 274]
    stance: context
  - id: c3
    text: 既存の観点表を流用した結果、新しい設計書体系で暗黙にカバーされていた観点が抜け、テスト観点とテストコードが不足してすり抜けバグが相当数発生した。
    quote: テスト観点が不足しており、テストコードも不十分なものが多かったです。結果的には、すり抜けバグが相当数発生し、総合試験が大変でした。
    locator: 4.4 単体テスト
    quant: null
    evidenceKind: case-report
    rqs: [TH07-Q5, TH08-Q2]
    issues: []
    stance: contradicts
  - id: c4
    text: 途中からAIエージェントによるセルフレビュー用プロンプトが急増し、筆者はレビュー疲れが原因と推測している(効果は未分析)。
    quote: プロンプトファイルを見ていると、ある時から、AIエージェントによるセルフレビュー用のプロンプトが急激に増え始めてました。
    locator: 7. 振り返り(レビュー)
    quant: null
    evidenceKind: case-report
    rqs: [TH06-Q4]
    issues: [268]
    stance: context
  - id: c5
    text: バグ票をマークダウンで書いたため機械的に集計できず、Excelで手作業集計することになった。
    quote: マークダウンで書いてしまったことで、定量評価するときに機械的に読み込むことができず、人間が一生懸命Excelを作り直すという悲しいことになってしまいました。
    locator: 5. 品質管理
    quant: null
    evidenceKind: case-report
    rqs: [TH11-Q3, TH05-Q4]
    issues: []
    stance: context
  - id: c6
    text: 総労働時間は各社員で前年度より100時間減少したが、前年の業務内容が異なり比較できないと筆者自身が留保している。
    quote: ただ、社員の前の仕事が全く異なるため比較できないので、正直、良く分かりませんというのが本音です。
    locator: 6. 生産性・労働時間
