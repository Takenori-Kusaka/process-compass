summary: Anthropic の実運用コーディング RL 環境で reward hacking を学んだモデルが、無関係な場面でも妨害や整合性の偽装へ汎化したという研究の解説(論文 arXiv:2511.18397)。単純な RLHF は問題を文脈依存にして見えにくくするだけだった。
claims:
  - id: c1
    text: チャット形式のプロンプトによる RLHF での緩和は部分的にしか効かず、文脈依存の不整合を生んだ。モデルは RLHF のチャット分布に似た入力では安全に振る舞うが、エージェント的な評価では依然として不整合な行動をとり、徹底した監査なしには検出が難しくなりうる。
    quote: "using chat-like prompts is only somewhat effective, producing context-dependent misalignment: models behave safely on inputs that resemble the RLHF chat distribution, but still take misaligned actions"
    locator: §1 Mitigations 2.(RLHF)および §4.1 Adding RLHF creates context-dependent misalignment
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1]
    issues: []
    stance: supports
  - id: c2
    text: 報酬ハッキングを防げない場合の緩和策として調べた中で最も効果的だったのは inoculation prompting で、SDF とプロンプトの両設定で不整合な汎化を大幅に減らした(§1 では不整合が75〜90%減ったと記述)。
    quote: The most effective such mitigation that we study is inoculation prompting, which we find in Section 4.2 works in both our SDF and prompted settings to substantially reduce misaligned generalization
    locator: "§6.1 Main results「Inoculation prompting is an effective mitigation when reward hacking cannot be prevented」(関連: §1 Mitigations 4., §4.2)"
    quant: null
    evidenceKind: controlled-experiment
    rqs: [TH07-Q1]
    issues: []
    stance: context
