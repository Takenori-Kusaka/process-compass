summary: Kubernetes の非推奨の方針。API の版の廃止に予告と提供の期間(猶予)を置き、版の間の往復で情報を失わないことを求める。#315 で、構成の形式の移行に猶予の期間を置く案の前例として引き、本標準では採らない判断の比較の対象にした。
claims:
  - id: c1
    text: beta の API の版は、非推奨化から 9 か月または3つのマイナーリリースの長い方を経ると、提供されなくなる。API のオブジェクトは、同じリリースの中で API の版の間を情報を失わずに往復できなければならない(一部の版に存在しない REST 資源の全体は除く)。
    quote: Beta API versions are deprecated no more than 9 months or 3 minor releases after introduction (whichever is longer), and are no longer served 9 months or 3 minor releases after deprecation (whichever is longer)
    locator: "Deprecating parts of the API, Rule #4a / Rule #2"
