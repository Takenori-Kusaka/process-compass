        note: '往復変換について 原文: "Rule #2: API objects must be able to round-trip between API versions in a given release without information loss, with the exception of whole REST resources that do not exist in some versions." 続けて 原文: "Additionally, any new field added in v2 must be able to round-trip to v1 and back, which means v1 might have to add an equivalent field or represent it as an annotation." 原文は『廃止後 9か月または3マイナーリリース(長い方)で提供されなくなる』と書いており、『少なくともそれだけ提供し続けねばならない』という最低保証の文言そのものではない点に注意。理由として 原文: "This ensures beta API support covers the maximum supported version skew of 2 releases"。'
