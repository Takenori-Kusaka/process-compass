summary: Graphite 公式ドキュメント。スタック型 PR が CI 実行数を増やすことを認め、スタック中段の CI を API で間引く仕組みと、全 base ブランチに必須チェックを課した場合の「必須 CI 未実行」表示を説明する。ページに日付は無い(取得 2026-09-30)。
claims:
  - id: c1
    text: Graphite は、スタック化で CI 実行が増える理由を、PR 数の増加と、スタックを最新に保つための裏側の rebase の2つだと説明している。
    quote: Additional CI runs occur when stacking PRs in part due to the additional PRs created, and due to behind-the-scenes rebasing to keep stacked branches up to date.
    locator: 冒頭(CI Optimizations)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: supports
  - id: c2
    text: 保護ルールを trunk 以外の全 base ブランチにも掛け、かつ上段 PR で CI を走らせない構成では、上段 PR が「必須 CI 未実行」と表示される。
    quote: you are not running CI on upstack PRs, you may see upstack PR as “missing required CI”.
    locator: Required CI
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2]
    issues: [273]
    stance: supports
  - id: c3
    text: CI の間引きは「障害時は CI を走らせる側へ倒す」設計で、API 応答が異常なとき・マージキュー投入時・スタック一括マージ時は CI を省略しない。
    quote: Graphite’s Buildkite and GitHub Actions integrations are configured to “fail open” so that outages and errors still result in your CI running.
    locator: Error handling
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH10-Q2, TH02-Q4]
    issues: [273]
    stance: context
