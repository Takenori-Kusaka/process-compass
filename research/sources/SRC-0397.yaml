summary: 207 プロジェクト・102 万 PR を人間中心・LLM 支援・エージェントの 3 時代で比較。AI エージェントが関わるレビューは判定が速くなるが品質は上がらず、同じレビュア(同一 AI)への偏り『Review Buddies』が大きく増えた。
