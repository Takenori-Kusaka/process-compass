summary: コーディングエージェント向けの5段階(Assistive/Conversational/Delegated/Autonomous teammate/…)。Level 4「自律的チームメイト」を「人が個々のタスクを起動せず、バックログから自分で仕事を取る」状態と定義し、用途に応じてレベルを選ぶべきで高いほど良いわけではないと論じる。
claims:
  - id: c1
    text: 「自律的チームメイト」レベルは、人が各タスクを起動せず、エージェントがバックログや目標から継続的に作業項目を選ぶ状態と定義される。信頼できる初期事例は狭い保守目的に限られる。
    quote: "Level 4: Autonomous teammate The fourth level is where the agent stops waiting for you to assign it work. The agent has a backlog or objective. It picks work items on its own, continuously, without a human initiating each task."
