summary: AI DevEx Conference 2026 のブースで来場者約260名にシール投票で聞いた調査の報告。最も時間がかかる工程にコーディングを挙げた人はゼロで、要件定義・設計とコードレビューが上位を占め、リードタイムが変わらない層も約4分の1いた。
