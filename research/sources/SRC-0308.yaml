    text: AI 導入後も最も時間がかかる工程にコーディングを挙げた人はゼロだった。最多は要件定義・設計(41%)、2位はコードレビューで、2工程で72%を占めた。
    quote: 代わって最多となったのは「要件定義・設計」で全体の41%を占め、「コードレビュー」も2位で続き、この2工程だけで全体の72%に達しました。
    locator: Q3. AIが入っても、まだ一番時間がかかっている工程はどこですか？
