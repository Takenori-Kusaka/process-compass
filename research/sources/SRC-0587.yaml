        note: quote の続きは「, yielding a conflict rate of 27.67%」。§3.2 にも「In particular, 27.67% of PRs result in textual conflicts」とある。伏せ字の「PR ___件」が 142,652(収集数)か 107,026(再現成功数)かで意味が変わる。27.67% は 29,609/107,026 に一致する。Table 1 は Conflicting PRs 29,609、Clean PRs 75,924 とするが、合計は 105,533 で再現成功数 107,026 と合わない(差 1,493 の説明は本文に見当たらない)。未マージ限定は §2 Step 1「we retain PRs that are either open or closed without evidence of having been merged」と §6 に明記。ask の locator は §1 / Table 1 だが、Table 1 は §3.2 にある。
