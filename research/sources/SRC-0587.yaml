summary: AIDev 由来のエージェント作成 PR 142,652 件のうち 107,026 件でマージを再現し、テキスト衝突を 27.67% に観測したデータセット論文(AIware 2026 採択)。対象は open または未マージで close された PR に限られる。PR が小さいほど衝突率は低い。
claims:
  - id: c1
    text: エージェント作成 PR 107,026 件のマージ再現で、29,609 件(27.67%)にテキスト衝突が起きた。対象はマージされていない(open または未マージで close)PR である点に注意が要る。
    quote: Our pipeline identifies 29,609 PRs exhibiting merge conflicts, yielding a conflict rate of 27.67%, and extracts 336,380 fine-grained conflict regions across these instances.
    locator: §1 Introduction / Table 1
    quant:
      value: 27.67%(29,609 / 107,026)
      n: 142,652 PR・59,412 リポジトリ(再現成功 107,026)
      design: リポジトリ・マイニング(決定的なマージ再現)
      population: AIDev データセットのエージェント作成 PR のうち open または未マージで close されたもの(5 エージェント)
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
  - id: c2
    text: 変更行数の中央値が 2 行の PR 群の衝突率は約 9.9%、25 行の群ではほぼ 30% で、バッチが小さいほど衝突率は低い。
    quote: PRs with a median churn of 2 lines have a conflict rate of approximately 9.9%, whereas PRs with a median churn of 25 lines exhibit a conflict rate of nearly 30%.
    locator: §4 Exploratory Empirical Analysis
    quant:
      value: 9.9%(中央値 2 行)対 約 30%(中央値 25 行)
      n: 107,026 PR
      design: サイズ区分別の衝突率(記述統計)
      population: 同上
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: supports
  - id: c3
    text: 衝突率は中規模(中央値 46〜185 行)で 32〜33% に達して頭打ちになり、さらに大きい PR ではわずかに下がる。サイズと衝突率の関係は単調ではない。
    quote: For larger PRs, the conflict rate slightly decreases but remains substantially higher than that of small PRs
    locator: §4 Exploratory Empirical Analysis
    quant: null
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: qualifies
  - id: c4
    text: 検出したのは git のテキスト衝突だけで、意味上の衝突は数えていないと著者が限界として明記している。
    quote: we capture merge conflicts using textual conflict markers produced by Git during merge simulation
    locator: §6 Threats to Validity
    quant: null
    evidenceKind: observational
    rqs: [TH10-Q3]
    issues: [273]
    stance: qualifies
