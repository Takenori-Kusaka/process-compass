  - id: c3
    text: '検査の主眼は、顧客へ提供してよいかの合否判定で、検査部門か品質保証部門が担うことが多い。合否判定の責任を負うため、組織上は開発部門から独立させるとよい。出荷した品質には検査部門が責任を持ち、出荷後の問題をプロセスへ返す。独立した第三者組織による検査には、経営幹部の品質最優先の意識が要る。'
    quote: '合否判定'
