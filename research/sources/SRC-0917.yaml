  - id: c4
    text: '品質マネジメントシステムを推進する組織には、製品の品質とプロセスの品質の2つの責務が要る。検査だけでは良いものは作れず、プロセス改善だけでは最終成果物を判定できない。両方を1つの組織が持っても別々の組織が持ってもよく、肝心なのは両方の責務を持つ動機付けのある組織が推進すること。'
