  - id: c2
    text: '前もって定めた基準に対し、事実とデータで評価する。観点は、プログラム品質・ドキュメント品質・前提条件の3つ。不合格は是正処置の後に再判定する。基準を満たさなくても、使い方によって許容できれば特別採用でき、その場合は限度・数量・期間・用途を限る。同じ体制・基準の繰り返しは形骸化しうるので、第三者による定期の監査を勧める。'
    quote: '特別採用'
    locator: '2.20 リリース可否判定(書籍頁 119-120)'
    quant: null
    evidenceKind: expert-opinion
    rqs: []
