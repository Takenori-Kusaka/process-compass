summary: '日本のソフトウェア品質の知識体系の書。出荷の判定はプロジェクト全体の責任者が行うのが一般的で、品質保証の責任者は補佐か委譲を受けて務める(2.20)。一方で、検査部門は合否判定に責任を持ち、組織上は開発から独立させるとよいとする(2.4)。節によって権限の書き方が違い、品質保証部長に固有の拒否権の明記は無い。2.8(意思決定)は未読。'
claims:
  - id: c1
    text: '出荷・移行の判定には判定責任者を置き、権限を明確にする。製品出荷の判定は、プロジェクト全体の責任者が行うのが一般的。品質保証の責任者は判定責任者を補佐し、権限の委譲を受ければ判定責任者を務めることもある。判定会議には、企画・サポート・運用などライフサイクルの各部門の関係者が加わり、総合的に判定する。'
    quote: '判定責任者'
