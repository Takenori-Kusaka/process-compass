summary: 前記事への質問に答える FAQ。PRD の役割を「プロトタイプが仕様(prototype as spec)で、PRD はそれを補う」と定義し、実現性リスクはエンジニアと、価値・使いやすさはユーザーと、事業性はステークホルダーと検証すると整理する。
claims:
  - id: c1
    text: プロダクトモデルでは、エンジニアへ伝える主手段はディスカバリーで作ったプロトタイプであり、これを「prototype as spec」と呼ぶ。PRD はプロトタイプで伝わらないユースケース列挙や非機能要件を補う。
    quote: The primary way we communicate what needs to be built by the engineers is via the prototype we created in product discovery. This is referred to as “prototype as spec.”
    locator: 「What is the role of the PRD?」
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1, TH09-Q3, TH08-Q1]
    issues: []
    stance: supports
  - id: c2
    text: PRD はディスカバリーの代替ではなく補完である。プロジェクトモデルではディスカバリーの代わりに PRD が書かれる。
    quote: In the product model, a good PRD supplements product discovery. In the project model, the PRD is done in lieu of product discovery.
    locator: 「What is the role of the PRD?」
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: supports
  - id: c3
    text: 技術的実現性リスクは自チームおよび依存先チームのエンジニアと検証する。リスクの種類ごとに検証相手が異なり、全プロトタイプで全リスクを検証する必要はない。
    quote: We are testing feasibility risk with our engineers (engineers on our product team, and also engineers on product teams we depend on).
    locator: 「Who exactly are we testing the prototype with?」
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q2]
    issues: [250]
    stance: context
  - id: c4
    text: デリバリーでは生成 AI は自動化・コード生成の役割、ディスカバリーではプロトタイピングと意思決定支援の役割を担う。
    quote: The main difference is that in delivery, generative AI plays very much an automation / code generation role. In discovery, AI plays more of a prototyping and decision support role.
    locator: 「Can AI accelerate discovery like it has accelerated delivery?」
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH09-Q1]
    issues: []
    stance: supports
