  - id: c2
    text: 影響が大きい変更(書き込み系、AIの動作設定、インフラ変更)は、dev検証→本番の1体に限定展開→観察→全体展開→周知の段階を踏む。
    quote: 影響が大きいもの（書き込み系の操作、AIの動作設定そのもの、インフラ変更）：「dev環境で検証 → 本番のBerryだけに限定展開 → 一定期間の観察 → 問題なければ他のAI社員全体へ展開 → 利用者への周知」という段階を踏んで展開
    locator: 運用の仕組み・工夫している点
