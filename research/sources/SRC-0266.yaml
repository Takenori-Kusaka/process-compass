  - id: c3
    text: 機能はまず社内システムの「参照」だけを与え、実力を見ながらJira起票やConfluence更新などの「書き込み」を段階的に追加している。共通ファイル(ペルソナ定義等)はAI社員が書き換えられない。
    quote: まずはGoogle DriveやConfluenceといった社内システムを「参照」できる機能だけを持たせて実際の業務で使ってもらい、実力を見ながらJiraのチケット作成やConfluenceページの更新といった「書き込み」機能を段階的に追加していく
    locator: 運用の仕組み・工夫している点
