summary: OWASP Top 10 / CWE Top 25 から選んだ実バグ 30 件を CodeRabbit・Claude Code Review・GitHub Copilot Review に投げた個人の実測。真のバグ指摘率は平均 42%、3 ツールすべてが見逃したバグが 12 件あった。
claims:
  - id: c1
    text: 30 件の実バグ × 3 ツールで、真のバグ指摘率は平均 42% にとどまり、3 ツールすべてが LGTM を返したバグが 12 件(40%)あった。競合状態と N+1 問題が大半を占める。
    quote: 3ツール全部に投げてもLGTMが返るバグが12件あった
    locator: LGTMが返ってきても安心するな
