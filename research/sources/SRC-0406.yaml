    text: 3 ツールを併用しどれかが指摘すれば発見とみなすと、見逃しは 47% から 30% へ下がったが、処理するコメント数は 3 倍になり誤検知の絶対数も増えた。系統混合は見逃しを減らすが、検証側の負荷を増やす。
