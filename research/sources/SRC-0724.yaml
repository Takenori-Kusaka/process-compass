summary: '中小受託取引適正化法(旧下請法)の運用基準。第4 の委託事業者の禁止行為ごとに考え方と違反行為事例を示す。#372 は、購入・利用強制(法第5条第1項第6号)が中小受託事業者に対価を負担させることを要件とする点と、システム利用料の減額の違反行為事例(3-9)を、第8章「計算資源の負担を決める」の外部の制約の注記に引いた。'
claims:
- id: c1
  text: 購入・利用強制(法第5条第1項第6号)は、正当な理由がある場合を除き、自己の指定する物を強制して購入させ、または役務を強制して利用させることにより、中小受託事業者にその対価を負担させることとされている。
  quote: 購入・利用強制（法第５条第１項第６号）とは、「中小受託事業者の給付の内容を均質にし又はその改善を図るため必要がある場合その他正当な理由がある場合を除き、自己の指定する物を強制して購入させ、又は役務を強制して利用させること」により、中小受託事業者にその対価を負担させることである。
  locator: 第4 の 6 購入・利用強制 (1)
  quant: null
  evidenceKind: normative
  rqs: []
  issues:
