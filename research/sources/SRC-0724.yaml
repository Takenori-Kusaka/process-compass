  stance: context
- id: c2
  text: 自社の発注業務の合理化のために電子受発注システムを導入し、中小受託事業者が得る利益がないのに「オンライン処理料」と称して代金の額を減じた例が、違反行為事例として示されている。
  quote: 委託事業者は、日用品等の製造を中小受託事業者に委託しているところ、自社の発注業務の合理化を図るために電子受発注システムを導入し、中小受託事業者が得る利益がないにもかかわらず、「オンライン処理料」と称して、代金の額を減じた。
  locator: 違反行為事例 3-9(システム利用料の減額)
