summary: 'NIST SP 800-53 Rev.5 の識別と認証の管理策。IA-2 は組織の利用者を一意に識別・認証し、その識別を代理の処理と結び付けることを求める。IA-2(5) は共有のアカウントや認証子を使うとき、共有のアカウントや資源へ入る前に利用者を個別に認証させることを求める。該当の制御の本文を OSCAL カタログの原文で確認した。'
claims:
  - id: c1
    text: 'IA-2(5) は、共有のアカウントまたは認証子を使うとき、共有のアカウントや資源へのアクセスを与える前に、利用者を個別に認証させることを求める。'
    quote: 'When shared accounts or authenticators are employed, require users to be individually authenticated before granting access to the shared accounts or resources.'
