summary: OSS プロジェクト向けのセキュリティ統制カタログ。統制を成熟度 Level 1〜3 に割り付け、保守者数と利用者数で段階を定義する。作者以外の人による承認の必須化は Level 3 にだけ課される。
claims:
  - id: c1
    text: 成熟度を、Level 1 = 保守者・利用者数を問わない全プロジェクト、Level 2 = 保守者2名以上かつ継続利用者が少数、Level 3 = 継続利用者が多数、と定義する。統制の有効化条件を体制(人数)と利用規模で定めている。
    quote: "Level 2: for any code project that has at least 2 maintainers and a small number of consistent users"
    locator: Controls Overview
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q4, TH02-Q1]
    issues: [254]
    stance: supports
  - id: c2
    text: 主ブランチへのマージ前に作者以外の人間による承認を1件以上必須とする統制(OSPS-QA-07.01)は Level 3 にだけ適用される。保守者1名の段階では独立レビューを課さない設計である。
    quote: "Requirement: When a commit is made to the primary branch, the project's version control system MUST require at least one non-author human approval of the changes before merging."
    locator: "OSPS-QA-07.01 (Control applies to: Maturity Level 3)"
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q1, TH02-Q4]
    issues: [249, 267]
    stance: supports
  - id: c3
    text: 自動ステータスチェックの合格(または手動の承認)をマージ条件にする統制は Level 2 以上で、任意のチェックを合否条件にしないよう勧める。承認者が迂回したくなる検査を作らない配慮である。
    quote: It is recommended that any optional status checks are NOT configured as a pass or fail requirement that approvers may be tempted to bypass.
    locator: "Status checks control (Control applies to: Maturity Level 2, 3)"
    quant: null
    evidenceKind: normative
    rqs: [TH02-Q4, TH07-Q4]
    issues: []
    stance: supports
