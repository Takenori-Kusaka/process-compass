summary: Claude Code 公式の費用管理ページ(2026-09-23 取得)。企業展開の平均費用、CLAUDE.md の推奨行数(200 行以下)、Skills への移動、モデル選択、Agent teams の約 7 倍消費などを規定する。
claims:
  - id: c1
    text: 企業展開の平均は 1 開発者あたり稼働日 $13、月 $150〜250、90% の利用者は稼働日 $30 未満。#274 の 21 日分の従量換算と比較する基準になる。
    quote: Across enterprise deployments, the average cost is around $13 per developer per active day and $150-250 per developer per month, with costs remaining below $30 per active day for 90% of users.
    locator: ページ冒頭
    quant:
      value: $13/dev/active day; $150-250/dev/month; p90 < $30/day
      n: enterprise deployments(件数非公開)
      design: vendor observational aggregate
      population: Claude Code enterprise deployments
    evidenceKind: observational
    rqs: [TH04-Q1, TH04-Q3, TH11-Q3]
    issues: [274]
    stance: context
  - id: c2
    text: CLAUDE.md はセッション開始時に文脈へ読み込まれる。スキルは呼び出されたときだけ読み込まれるので、専用の手順をスキルへ移すと基本の文脈が小さくなる。公式は、要点だけに絞って CLAUDE.md を 200 行未満に収めることを目安として勧めている。
    quote: Your CLAUDE.md file is loaded into context at session start. ... Skills load on-demand only when invoked, ... Aim to keep CLAUDE.md under 200 lines by including only essentials.
    locator: Move instructions from CLAUDE.md to skills
    quant:
      value: ≤200 lines
      n: null
      design: vendor recommendation
      population: CLAUDE.md
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2, TH03-Q1, TH03-Q4]
    issues: [269, 274]
    stance: supports
  - id: c3
    text: Agent teams は各 teammate が独立したコンテキストを持つため、標準セッションの約 7 倍のトークンを使う(plan mode 時)。teammate は Sonnet、チームは小さく、終わったら停止せよ、と定める。
    quote: Agent teams use approximately 7x more tokens than standard sessions when teammates run in plan mode, because each teammate maintains its own context window and runs as a separate Claude instance.
    locator: Manage agent team costs
    quant:
      value: ≈7x
      n: null
      design: vendor estimate
      population: Claude Code agent teams in plan mode
    evidenceKind: vendor-guidance
    rqs: [TH04-Q4, TH04-Q2]
    issues: [274]
    stance: supports
  - id: c4
    text: "モデル階層の公式推奨: Sonnet が既定で Opus は複雑な設計判断や多段推論に限る。単純なサブエージェントは model: haiku を指定する。"
    quote: Sonnet handles most coding tasks well and costs less than Opus. Reserve Opus for complex architectural decisions or multi-step reasoning.
    locator: Choose the right model
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q4]
    issues: []
    stance: supports
  - id: c5
    text: MCP ツール定義は既定で遅延ロードされ、使うまで名前とサーバー指示だけが文脈に入る。gh/aws などの CLI の方が MCP より文脈効率がよい、と公式が述べる。
    quote: MCP tool definitions are deferred by default , so only tool names and server instructions enter context until Claude uses a specific tool. Run /context to see what's consuming space.
    locator: Reduce MCP server overhead
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2, TH03-Q1]
    issues: [274]
    stance: context
