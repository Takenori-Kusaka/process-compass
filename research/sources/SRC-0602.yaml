summary: BMAD のコードレビュー手順(日付表記なし、2026-09-30 取得)。複数レビュアが同じ差分を並列に読み、トリアージが主張された帰結を現物で確かめ、根拠のない指摘は理由を記録して棄却する。3 巡目でも非自明な指摘が出るなら上流の問題と読む、常時読む指示が多すぎるとレビューが遅くなる、とも書く。効果の測定値は無い。
claims:
  - id: c1
    text: トリアージは、各指摘が主張する帰結を指定箇所で実際に起きるかまで読んで確かめ、雑音・反駁された主張・根拠のない主張は理由を記録して棄却する(黙って落とさない)。
    quote: Dismiss noise, refuted claims, and unsubstantiated claims, with a recorded reason — never silently
    locator: What a Run Does
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q6, TH06-Q4]
    issues: []
    stance: supports
  - id: c2
    text: レビューの質は意図(仕様・要求)の入力に依存する。意図が無いとレビュアは差分を差分自身に照らして判断するしかない。
    quote: without intent, the reviewers can only judge the diff against itself
    locator: Run bmad-code-review
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH06-Q5, TH06-Q4]
    issues: []
    stance: supports
  - id: c3
    text: エージェントによるレビューの 3 巡目でも非自明な指摘が出るなら、その変更の上流(内部設計の弱さ、矛盾、規則の曖昧さ)に問題があると読み、巡回を増やさず上流を直す。
    quote: Non-trivial findings on a third pass of agentic review usually mean something is wrong upstream of this change
    locator: 冒頭(bmad-build の再レビュー)
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH07-Q4, TH06-Q4]
    issues: []
    stance: context
  - id: c4
    text: レビューが長引く原因の 1 つに、AGENTS.md など毎回読まれる指示ファイルの規則が多すぎることを挙げる(文脈窓を圧迫する)。測定値は示さない。
    quote: There are too many rules in AGENTS.md and the other instruction files the agent reads every run.
    locator: Why Does Review Take Forever? / Too many rules, or huge files
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q2, TH03-Q4]
    issues: []
    stance: supports
  - id: c5
    text: レビュー深度は quick(1 レビュア)と thorough(複数レビュア)の 2 段で、build 内は quick、独立の code-review は thorough が既定。
    quote: "Out of the box, you get two review depths to choose from: quick and thorough ."
    locator: Choose the Depth
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH04-Q4, TH07-Q4]
    issues: []
    stance: context
