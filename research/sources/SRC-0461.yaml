summary: 日本企業(ROUTE06)所属の筆者の個人的考察。リポジトリ境界より調整の境界が重要で、チームでは人の調整がエージェント並列度の上限を決めると整理し、大規模モノレポで全部見えることは逆効果になりうると述べる。
claims:
  - id: c1
    text: チームでは人の調整(レビューと合意)がボトルネックで、1人が実際に動かせるエージェント数の上限を決める。10体動かせても合意が3件分しか通らなければ実効並列度は3とする。
    quote: If you can drive ten agents but review-and-consensus only clears three, your effective parallelism is three.
    locator: The bottleneck is coordination, not the repo
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q1]
    issues: [272]
    stance: supports
  - id: c2
    text: 直感に反して、大きなモノレポで全部が見えることはしばしば害になるとし、Anthropic の大規模コードベース手引きがディレクトリ別 CLAUDE.md や sparse worktree を勧めることを挙げる。
    quote: Counterintuitively, seeing everything in a big monorepo often hurts.
    locator: At scale, "sees everything" backfires
    quant: null
    evidenceKind: expert-opinion
    rqs: [TH10-Q1]
    issues: [272]
    stance: contradicts
  - id: c3
    text: マルチレポを1つの作業空間として扱う場合、契約(API スキーマ等)がコードから乖離すると成り立たないため、契約は人の記憶ではなく CI で強制すべきとする。
    quote: So contracts have to be enforced in CI, not kept as a promise humans remember.
    locator: Objections I'd raise myself
    quant: null
