summary: 創業初期の起業家 15 名への面接と、同じ質問票を LLM 生成の起業家・投資家ペルソナへ行った結果を主題分析で突き合わせた査読前論文(JASSS へ投稿中と記載)。一致する主題がある一方、人だけに現れる主題(関係・支援者としての顧客)と合成だけに現れる主題(偽陽性の増幅)を報告し、実証の代替ではなく補完と結論する。定量の一致率は無い。
