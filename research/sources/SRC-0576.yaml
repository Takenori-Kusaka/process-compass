    text: 人の面接だけに現れた主題は、初期顧客との関わりが生む関係・支援者としての価値など、生きた経験と関係の信頼に根ざすものだった。合成ペルソナで顧客検証を代替すると、この部分が欠ける。
    quote: Some themes appeared only in the human interviews, underscoring the irreplaceable role of lived experience and relational trust.
