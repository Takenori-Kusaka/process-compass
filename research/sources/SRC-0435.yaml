summary: Spec Kit の /speckit.analyze コマンド定義(2026-09-09 の最終コミット時点)。spec.md・plan.md・tasks.md を読み取り専用で横断検査し、要求→タスクのカバレッジ表と Coverage % を出す手順を定める。対応付けは LLM の推論で行う。
claims:
  - id: c1
    text: 要求(FR/SC)ごとに安定キーを作り、各タスクを要求やストーリーへ対応付ける。ただし対応付けはキーワードや ID 参照パターンからの推論で行う(機械的な照合ではなく LLM の解釈)。
    quote: Map each task to one or more requirements or stories (inference by keyword / explicit reference patterns like IDs or key phrases)
    locator: §3 Build Semantic Models
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH08-Q2]
    issues: [255]
    stance: qualifies
  - id: c2
    text: カバレッジの欠落として『タスクが1件もない要求』と『要求に対応しないタスク』の双方向を検出し、タスクを1件以上持つ要求の割合を Coverage % として報告する。
    quote: Requirements with zero associated tasks
    locator: §4.E Coverage Gaps / §6 Metrics
    quant: null
    evidenceKind: vendor-guidance
    rqs: [TH08-Q2]
    issues: []
    stance: supports
  - id: c3
    text: 解析は読み取り専用で、修正は利用者の明示承認後に限る。再実行で同じ ID と件数を出すことを求めているが、実行主体は LLM である。
    quote: Rerunning without changes should produce consistent IDs and counts
    locator: Operating Principles / Context Efficiency
    quant: null
