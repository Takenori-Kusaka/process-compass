summary: VSE 基本プロファイルの手引きが 2025-02 に技術報告書(TR、2011)から国際規格へ置き換わった。ISO のカタログ頁の抄録だけを読んだ(93 頁、本文は有償)。安全重要ソフトウェアを開発しない VSE、単一の作業チームを対象とする。SI 工程の検証・妥当性確認の担い手と独立性の条文は読めていない。無償公開だった 2011 年版 TR は ISO の公開規格サイトで使用許諾への同意が要り、取得しなかった。
claims:
  - id: c1
    text: 本規格は、安全重要ソフトウェアを開発しない VSE に適用される。安全重要分野の独立性要求(ISO 26262、IEC 61508 など)とは適用範囲が重ならない。
    quote: This document applies to VSEs that do not develop safety-critical software.
