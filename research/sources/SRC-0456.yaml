summary: AIエージェント作成PRの説明文と実際の差分の不一致(PR-MCI)を 23,247 件で測った MSR'26 採択論文。最頻の型は『実装していない変更を説明が主張する』で、不一致の大きいPRは採択率が大きく下がる。
claims:
  - id: c1
    text: 5種のエージェントの 23,247 PR を分析し、974 件を人手で注釈した結果、406 件(1.7%)が説明と差分の不一致が大きかった。エージェント間で20倍の差がある。
    quote: we analyzed 23,247 agentic PRs across five agents using PR message-code inconsistency (PR-MCI). We contributed 974 manually annotated PRs, found 406 PRs (1.7%) exhibited high PR-MCI
    locator: Abstract
    quant:
      value: 1.7%(406/23,247)
      n: 23,247 PRs(注釈 974)
      design: observational(マイニング+人手注釈)
      population: AIDev データセット、5エージェント
    evidenceKind: observational
    rqs: [TH10-Q4, TH07-Q1]
    issues: [271]
    stance: supports
  - id: c2
    text: 不一致の型で最も多いのは Phantom Changes(実装していない変更を説明が主張する)で 45.4%、次いで範囲の過小記載 22.0%、定型文・未完成 18.8%。
    quote: the most common PR-MCI type was Phantom Changes (45.4%), where PR descriptions claim unimplemented changes. This was followed by Scope Understated (22.0%)
    locator: "§4.2 RQ2: PR-MCI Taxonomy"
    quant:
      value: Phantom Changes 45.4% / Scope Understated 22.0%
      n: 不一致の大きいPR 406 件
      design: observational
      population: AIDev エージェントPR
    evidenceKind: observational
    rqs: [TH10-Q4, TH07-Q2]
    issues: [271]
    stance: supports
  - id: c3
    text: 不一致の大きいPRは採択率が 28.3% 対 80.0% と 51.7% 低く、マージまで 55.8 対 16.0 時間と 3.5 倍かかった。
    quote: high-MCI PRs had 51.7% lower acceptance rates (28.3% vs. 80.0%) and took 3.5× longer to merge (55.8 vs. 16.0 hours).
    locator: Abstract
    quant:
      value: 採択率 28.3% vs 80.0%、マージ時間 55.8h vs 16.0h
      n: 23,247 PRs
      design: observational(統計検定)
      population: AIDev エージェントPR
    evidenceKind: observational
    rqs: [TH10-Q4]
    issues: [271]
    stance: supports
  - id: c4
    text: エージェントごとに不一致の型が異なり、GitHub Copilot は Phantom Changes が 74.0% を占めた。
    quote: GitHub Copilot was dominated by Phantom Changes (74.0%), while Scope Understated was the primary issue for Cursor (52.8%) and Devin (41.0%).
