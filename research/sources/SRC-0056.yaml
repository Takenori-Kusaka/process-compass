summary: 前回「責任・権限を表現する語彙が不足」と要約した論文の本文確認。実際の分析軸は 6 次元(membership / deliberation / voting / dissent / human escalation / audit)で、投票・異論保持・人へのエスカレーションは 5 プロトコル全てで Absent。著者はコンサル(DoiT)所属で査読情報なし。ギャップは 6〜12 か月で縮まりうるとも述べる。
