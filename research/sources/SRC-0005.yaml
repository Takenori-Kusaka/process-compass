summary: CTRL(強化学習で批評モデルを訓練)の論文。#257 が引く 7.88→8.36 / 8.97 / 11.76 は本論文 Table 1(CodeContests Pass@1、生成器 Qwen2.5-Coder)に実在し、v1(2025-02-05)と v2(2025-11-29)で同値。ただし実行フィードバック条件(EF)はユニットテストを用いる(†)点が引用側に落ちている。
claims:
  - id: c1
    text: 追加フィードバックなしの自己批判は Pass@1 7.88%→8.36%(+0.48pp)にとどまり、誤答→正答 2.30%、正答→誤答 1.82%。値は本論文 Table 1 のもので、v1 にも同値が載る。
    quote: Self-critique without additional feedback yields minimal gains (7.88% → 8.36%) and rarely converts incorrect solutions to correct ones
    locator: §3.2 Stage I (Reasoning over Execution 直前); Table 1 (Self-critique 8.36 / Δ↑ 2.30 / Δ↓ 1.82)
    quant:
      value: 7.88% → 8.36% (+0.48pp Pass@1)
      n: CodeContests test set; results averaged over 5 random seeds (Table 3 note)
      design: controlled comparison of feedback mechanisms, generator fixed
      population: Qwen2.5-Coder as generator and critic, single-turn critique-revision
    evidenceKind: benchmark
    rqs: [TH06-Q5]
    issues: [257]
    stance: supports
  - id: c2
    text: 生の実行フィードバックをそのまま修正に使うと 8.97%、実行フィードバックの上で批判を書かせる(Self-critique w/ EF)と 11.76%。両条件ともユニットテストを用いた実行結果を使う(†)。
    quote: Self-critique w/ Execution Feedback), they achieve substantial improvements, as compared to directly using raw execution feedback for revisions (11.76% vs. 8.97%).
    locator: §3.2 Reasoning over Execution; Table 1 (Execution Feedback (EF)† 8.97 / Self-critique w/ EF† 11.76; †using unit tests for generation.)
    quant:
      value: 8.97% (raw EF) vs 11.76% (critique over EF)
      n: CodeContests, 5 seeds
      design: controlled comparison
      population: Qwen2.5-Coder generator; feedback from unit-test execution
    evidenceKind: benchmark
    rqs: [TH06-Q5]
    issues: [257]
    stance: supports
  - id: c3
    text: 訓練した CTRL 批評器は実行フィードバックなしの単発批判で 11.76%(Self-critique w/ EF と同値)、3 回反復で 15.15%、退行率 0.85%。#257 の表には無い文脈値。
    quote: Table 1 shows that our RL-trained critic significantly outperforms baseline approaches, achieving a 11.76% pass@1 rate compared to 7.88% with zero-shot generation.
    locator: §4.2 RL Significantly Boosts Critiquing Ability; Table 1 (Critique ×3 w/ CTRL 15.15 / Δ↓ 0.85)
    quant:
      value: 11.76% (×1), 14.18% (×2), 15.15% (×3)
      n: CodeContests
      design: benchmark of trained critic
      population: Qwen2.5-Coder generator + CTRL critic
    evidenceKind: benchmark
    rqs: [TH06-Q5]
    issues: [257]
    stance: context
