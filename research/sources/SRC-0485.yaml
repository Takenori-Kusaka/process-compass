summary: Rehab for JAPAN(エンジニア11〜50名)の EM による Claude Code 導入事例。約3名のパイロットで自作ツールにより GitHub 活動量とトークン量を追跡し導入前後を比較した。PR 数は全体で64.5%増、メンバー層のマージ時間は33%短縮したが、マネージャー層のマージ時間は93.5%悪化し、レビュー負荷がマネージャーへ集中した。
