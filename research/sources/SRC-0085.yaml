summary: Google DeepMind による委任の枠組み。委任はタスク分割ではなく、権限・責任・説明責任の移転と役割・境界の明示・意図の明確化・信頼形成を含む決定列と定義。長い委任連鎖では意図と実行の距離が「説明責任の空白」を生むと警告。
claims:
  - id: c1
    text: 知的委任は、タスク配分に加えて権限・責任・説明責任の移転、役割と境界の明確な指定、意図の明確化、信頼形成の仕組みを含む決定列と定義される。
    quote: We define intelligent delegation as a sequence of decisions involving task allocation, that also incorporates transfer of authority, responsibility, accountability, clear specifications regarding roles and boundaries,
    locator: §2.1 Definition
