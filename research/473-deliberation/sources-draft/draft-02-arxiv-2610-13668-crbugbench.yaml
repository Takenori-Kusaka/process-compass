summary: "人が検証した欠陥と導入 PR の組で、コードレビューのエージェントを測った。上位 5 件の再現率は 5 か月で 47.7% から 71.9% へ。人のレビューは約半分。人とエージェントの和集合は 82.1%。社内リポジトリでは最大 25.5% 低下。"
note: "著者に Microsoft 所属を含む(メモの記述。本調べでは所属を開いていない)。適合率は未報告。"
