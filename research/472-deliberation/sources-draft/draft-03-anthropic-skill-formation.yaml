summary: 52名(多くは初級)の無作為化試験。Anthropic の頁は小テスト 50% 対 67% と書く。arXiv 本文は 27 点満点の差 4.15 点=15.4%(Cohen d=0.738, p=0.010)。AI 群の完了時間の短縮は有意でない。最大の差はデバッグの設問。両者の数は同じ差の別の言い方に見えるが、50 対 67 は頁だけにあり本文では確認できていない。
