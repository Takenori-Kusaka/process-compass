    note: NIST SP 800-53B(2020)の対象は米連邦の情報セキュリティ統制で、ソフトウェア開発のゲートではない。記録の内容は理由で、「観測を残す・戻す条件」までは定めない。費用対効果に合わない場合は無条件の省略ではなく代替統制とし、代替が要求をどう満たすかと、元の統制をなぜ実装できなかったかの理由を求める。J-SOX は内部統制の限界として費用と便益の比較衡量を挙げ、述語は「受容することが考えられる」。記録様式の不在は当該節の範囲でのみ確認した。ISTQB は v4.0(現行は v4.0.1)で、全数テストは不可能としてリスクベースドテストを定義し、リスク受容は例示列挙の 1 つ。COSO の生成AI向けガイダンス(2026-02)は人による裏付けをリスク比例とし、文書化は「traceability, not paperwork」として負担を作り直さない範囲にとどめる。ISACA(2026-09)はリスク受容に統制の所有者を割り当てることを求め、Google SRE は着手見込みのない再発防止項目を放置せず閉じるよう勧める。EY Japan の論考は HITL の厚さをリスクアペタイトで決めるとする(意見)。起票者側の実例として、ganbari-quest は承認コマンドを止める hook の呼び出しを ADR-0068 で外し、根拠を費用と段階と記し、観測(42 回の drift)は否定しないと明記した(当事者記録。実際に外れたのは 2026-08-20、hook 本体と test は残置)。#267 の総数上限はリスクと切り離した上限で、「明示的なリスクに基づく決定」という要件とは別の軸である。FND-0103 の note「外した統制の記録様式を示す先例は束に無い」を、理由の記録について補う。ISO 31000 の出典は依然無い。
