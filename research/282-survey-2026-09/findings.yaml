    note: "規範とベンダー・監査法人の見解の混在。TH01-Q2 の不足「内部統制(COSO・J-SOX・SOC 2)の職務分離が AI を職務担当者としてどう扱うかの原典」に対応する。「要件として書いていない」は読んだ範囲の不在で、AI を担い手として認めた記述ではない(J-SOX は AI 以前の文言で、語の 0 件は抽出テキストの文字列検索による。TSC は第三者サイトにある 2020-03 更新版の複製で、2022 年改訂の着眼点版は未読)。COSO は従来の ERP の職務分離などの指針を置き換えないと明記し、複数の独立した AI モデル間の出力比較を人によるレビューと並ぶ5手法の1つに挙げつつ組合せはリスクによるとし、エージェントが多段の作業を調整する類型では AI の判断が持ち込む職務分離の衝突の評価をリスク評価に置く。ISACA は人の利用者とエージェント実行基盤・ツール実行・運用者の ID の分離も求める。反対側: 決算ソフトベンダーは不正抑止が目的なら AI は適さないとし(理由は迎合性と誘導可能性)、人だけの職務分離がどこで要るかは監査人との協議を勧める。EY の論考は承認を人側に置く。いずれも財務報告・セキュリティ統制の文脈で、ソフトウェア開発のロール配分を直接定めたものではない。PCAOB 等の監査基準の原典は束に無い。"
