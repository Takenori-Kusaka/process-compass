    change: new
    baseline: ""
    volatility: slow
    reviewBy: 2027-09
    supersedes: null
    note: "規範。不在の確認には範囲がある: J-SOX は pdftotext で抽出した全文(p.133 まで)の文字列検索で AI・ＡＩ・人工知能が 0 件、SOC 2 は当該着眼点の文の範囲で、読んだのは第三者サイトに置かれた 2020-03 更新版の複製(2022 年改訂の points of focus 版は未読)。J-SOX と SOC 2 は AI を想定する前の文書で、担い手に触れないことは AI を許容するという意味ではなく、J-SOX の「者」「担当者」は人を前提にした文言である。J-SOX は IT の統制を「自動化された統制を中心とする」と定義し、SOC 2 も手作業と自動の統制の組合せを認めるが、これは統制の実行手段の話で、職務の担い手の規定ではない(この区別は読み手の解釈で、原文に明示は無い)。COSO は AI エージェントが多段の作業を調整する能力類型で「AI の判断が持ち込む職務分離の衝突の評価」をリスク評価の項目に置き、ERP の職務分離など従来の指針は引き続き必要とする。AI を承認者に数えてよいかは COSO も明言しない。隣接する規制の先例: 米 NRC の RG 1.168 Rev.2(2013)は設計の検証者を「設計者以外の者(persons)」とし、V&V を外部組織が行っても十分性の最終責任は申請者・事業者に残ると書く。TH01-Q2 で不足としていた内部統制の原典に当たった結果で、falsifier(役割を人が占めることの明示要求)は AI を名指しした形では見つからず、許容・条件付き・禁止のいずれにも分類されていない状態が原典でも確認された"
  - id: FND-0182
    theme: TH01
    statement: COSO の生成 AI 向け補足ガイダンス(2026-02-23)は、AI 関連の変更に対する独立した検証手順を「人または自動」と書き、統制を運用へ落とす5つの手法の1つに独立した複数モデル間または決定的な基準アルゴリズムとの出力比較を挙げ、人による裏付けの水準はリスクに比例させるとする。ISACA のホワイトペーパー(2026-09-15)は、人の承認を破壊的・金銭的・法的・規制対象・不可逆な操作に求め、人・エージェント実行基盤・ツール実行・管理者の ID の分離と、エージェントの出力と操作可能なシステムの間の決定的な方針実施点を求める。
