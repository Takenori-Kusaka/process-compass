  - id: FND-0003
    theme: TH01
    statement: EU AI Act 第14条は高リスク AI を自然人が効果的に監視できるよう設計することを提供者に求め、第26条は能力・訓練・権限を持つ自然人へ監視を割り当てることを導入者に求める。人による占有を明示するのは監視の役割と遠隔生体識別の2名確認であり、それ以外の役割を人が占めることは、条文と ISO/IEC 42001 の公開部分のいずれも規定していない。
