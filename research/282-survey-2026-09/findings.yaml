    statement: "COSO の生成 AI 向け内部統制ガイダンス(2026-02-23)は、職務分離を AI の設定を構成する権限と出力を承認・レビューする権限の分離として書き、AI 関連の変更への独立した検証手順を「人または自動」とし、独立した複数の AI モデル間の出力比較を統制手法の 1 つに挙げる一方、人による裏付けを対処するリスクに比例した水準で求める。in-toto へのレビュー attestation の提案(PR #603、2026-09-29 提出・未審査)は、既定の方針ではエージェントの承認を独立と数えず、数えるには署名されたオプトイン方針が要るとし、独立性の次元に運用者・提供元・署名者と任意の指示の所有者を挙げる。"
