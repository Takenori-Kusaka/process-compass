  - id: FND-0225
    theme: TH06
    statement: NASA-STD-8739.8B(2022-09)は IV&V を開発組織から技術的・管理的・財務的に独立した組織による検証と定義し(出典は IEEE の定義)、技術的独立は分析要員が対象の開発に関与していないこと、管理的独立は開発・プログラム管理と同じ組織に属さないこと、財務的独立は予算の統制が開発組織から独立した集団にあることを要件とする。米 NRC の RG 1.168 Rev.2(2013)は IEEE 1012-2004 附属書 C 表 C.1 の「条件付き独立」を受け入れない一方で別会社による実施までは求めず、ISO 26262-12:2018 は確認措置の独立性を ASIL に応じて定めてそれが組織上の独立を指すと注記し、FDA の General Principles of Software Validation(2002)は第三者 IV&V が難しい場合の方法として当該の設計・実装に関与していない内部要員の割当てを挙げる。
