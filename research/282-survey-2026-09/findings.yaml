    note: 規範(分類枠組みの定義であり、どの分類が成果を良くするかの測定ではない)。Feng らは役割単位だが、切るのは AI の役割でなく人の役割(操作者〜観察者)で5段階。Gartner は二値の統治(全面禁止か全面信頼か)を失敗の根本原因とするが根拠は非公開。CoSAI は自律度の段階ごとに説明責任の要件を対応づける。NTTデータは責務で3段階、経産省 WG は「自律性と行動範囲」の2軸、IEEE-USA は観察→監督付き→自律の段階、人工知能基本計画の脚注は HITL / HOTL / Human in the lead を議論の紹介として挙げる。AISoLA 採録論文は HITL を構成的、HOTL を是正的と因果で区別する(abstract のみ)。CHI 2026(n=15、小規模創作チーム)は「AI は teammate か」の二値の問いを単純化と評する。TH01-Q1 の falsifier(外部も役割単位の二値)には該当しない。#248 の論点1(判断の A と、ロールの占有は別でありうる)とは整合し、#249 の求めること1(どのロールを AI へ配分してよいかの条件分岐)が前提とする役割単位の切り方は外部分類の主流ではない
  - id: FND-0002
