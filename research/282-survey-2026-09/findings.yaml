    supersedes: null
    note: "DORA は 2016・2017 年調査に基づく規範(アクティブなブランチ 3 本以下、1 日 1 回以上の trunk へのマージ、コードフリーズなし)で AI 以前、頁に標本数の記載は無い。論文は観察研究(Rails 系 100・Django 系 25 の OSS、Python では 1.18〜1.23)で、期間はコミット数と強く相関し、経過時間の効果を規模の効果から切り分けにくいと著者が示す。どの因子も衝突の件数と衝突ファイル数は予測しなかった。反対側: Java の OSS 163 件・21,488 シナリオでは、開発者が挙げた 7 指標(コミット数、変更行数など)はどれも衝突件数と強くは相関しなかった(変更行数は cor = 0.43 の中程度で仮説は棄却)。エージェント作成 PR 107,026 件のマージ再現ではテキスト衝突が 27.67%、変更行数の中央値 2 行の群で約 9.9%・25 行の群で約 30% だが、中規模で頭打ちになり単調ではない(対象は未マージの PR のみ)。いずれも測っているのは git のテキスト衝突で、#273 が問題にする監査 1 回の認知限界や手番の停止ではない。収集上の注意: Graphite の並列 CI ではキュー経由でマージした PR が GitHub 上 closed と記録され、merged を数える計測はそのままでは成立しない"
