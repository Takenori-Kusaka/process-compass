    note: "いずれも自己報告(selfReported)の一次事例で、E2 は「そういう運用が報告されている」ことの水準である。AI 管轄に置いた判断の見落とし率や出荷後の欠陥は測られていない。サイバーエージェントの AI は「マージOK／マージに懸念あり／マージ非推奨」の判定と理由をコメントするもので、懸念への対応は人が判断し、AI の判定がマージを機械的に止めるとは書かれていない。同記事はレビュアの責務(マージ可能な品質の保証、承認か却下かの判断)が AI 導入後も変わらないと明記し、AI のレビューコメントの妥当性と重大度を評価するサブエージェントの段を置く。ジモティーの実績はスキルを実装した PR 自身の1件(本番影響なし)で、プロダクトコードでの見落としとスループットは未検証と本人が書く。AI 管轄の理由は「AI の方が検出精度が高いと考えている」で測定は示されず、トレードオフを伴う設計判断は選択肢と理由を列挙させて最終判断を人に残す。同時期の大手 SIer は人の確認工程を残す側にある: NRI(2026-05、投資家向け資料、目標と試算)は AI による一括生成の後に人と AI による確認と整備を置き、非機能要件の整備と複雑な合意形成は汎用 AI だけでは困難とする。日立の担当者(2026-06、AWS 執筆の対談)は既存の品質保証プロセスを AI-DLC に織り込むことをこれからの課題と述べ、AI-DLC 自体は工程ごとに人の承認ゲートを置く。零細受託開発会社の経営者は「生成ガチャをして承認するだけの人」が少なからずいると述べる(伝聞、頻度の測定なし)。FND-0007 の「判断と承認を人に残す自己規定」を限定する事例だが、承認操作は人に残っており、TH01-Q3 の falsifier(AI がロール保持者として判断を引き受け続けた事例が複数)には該当しない"
