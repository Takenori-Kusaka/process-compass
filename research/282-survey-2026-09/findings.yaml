    note: "COSO は規範的な手引き(2013 年フレームワークの 17 原則の当てはめ)、in-toto は採用実績も効果測定も無い提案段階の PR(本文のみ読了)で、水準は前者による。COSO は職務分離の担い手が人か AI かを書かず、AI を承認者に数えてよいかは明言しない。複数モデル間の比較は HITL レビュー・性能試験・データ分析による監視・第三者検証と並ぶ 5 手法の 1 つで、リスクに応じて組み合わせる前提。AI の判断が持ち込む職務分離の衝突の評価をリスク評価項目に置き(SRC-0535#c5)、従来の IT 全般統制の職務分離は置き換えない(SRC-0535#c7)。in-toto の提案は、運用者と指示の所有者がレビュア側ツールの自己申告にすぎないと自ら限界を書き、検証済みの事実に拠るのは署名者の次元だけとする。実務者の見解は割れる: FloQast(ベンダーブログ、監査基準の引用なし)は目的で分け、正確性のための第二の目なら AI が担い得るが(SRC-0540#c2)、不正抑止(二人の人間の相互の説明責任)なら AI は適さないとし(SRC-0540#c3)、人だけの職務分離が要る範囲は監査人と協議するよう勧める。MakerChecker(ベンダー)は規則が担い手を人に限っていないと主張するが(SRC-0541#c1)、同じ記事が引用元の規則の承認者を独立した「人」と説明している(SRC-0541#c2。規則の原文は本調査で未確認)。提供元の違いが誤りの独立を保証しないことは FND-0079・FND-0080・FND-0090 のとおりで、提案が挙げる次元に文脈・入力の切り離し(FND-0087)は含まれない。TH01-Q2 の不足(内部統制の職務分離が AI をどう扱うかの原典)に COSO が部分的に答えるが、J-SOX・SOC 2 の原典は束に無い"
