    note: "自己報告(selfReported)。標本数・試行回数・検出率の値が同項目に無いため、一次の試行報告ではあるが E1 とした。対象は BMAD の敵対的レビュースキルで、モデルは Claude と Codex としか書かれていない。FND-0015 の測定はいずれも単発の質問応答で、エージェントのレビュー課題での persona の効果は測られていなかった。本件はその範囲に当たる報告である。同じ製品の現行ドキュメント(2026-09-30 取得)は共通レビューについて指摘ゼロを正当な結果とし体裁のための水増しを禁じており、「10件以上の指摘の要求」との関係は読んだ範囲では説明されていない。隣接する測定: 査読前論文(arXiv:2609.25010、Upworthy の見出し A/B テスト、信頼できる部分集合 n=399)では、読者層に合わせた10体のペルソナ群よりペルソナなしのゼロショットが実測クリック率の順位付けで上回った(Kendall τ 0.361 対 0.084、top-1 49.2% 対 34.6%)。これは合成読者の反応予測でレビュアの役割指定とは別の用途であり、著者は異質性が効く用途(セグメント分け、定性的な反論探し)を留保する。同カードは投稿日(2026-07-27)と ID(2609)のずれを注記している。#258 の「役割を与えても精度は上がらない」をレビュー課題で支持する向きだが、件数の要求と問いの形は差を生んだとされており、指示の中身が効かないという意味ではない"
