  - id: FND-0006
    theme: TH01
    statement: AI に承認役を担わせる実装が現れている。低リスクに選別した変更に限る型と、管理者が有効化し範囲を任意に絞る型がある。前者では Meta の RADAR が低リスクに選別した差分33.1万件超を着地させたと自己報告し、Rewind は認証・秘密情報・承認者を変える変更を常に人に残す。後者では GitHub が 2026-09-01、有効化すれば Copilot code review の承認を必須承認に算入できる機能をパブリックプレビューで出し(既定は無効、承認可能なファイルパスの限定は任意)、OpenAI Codex の Auto-review はサンドボックス境界の承認者を人から別のエージェントへ替える(リスクによる限定の記述は無い)。
