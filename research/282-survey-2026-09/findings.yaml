  - id: FND-0181
    theme: TH01
    statement: 内部統制の原典は、職務分離の担い手が人か AI かを規定していない。J-SOX の実施基準(2023 年改訂)は職務分掌を「複数の者」「別の者」の間の分担・分離として書いて全文に AI の語が無く、SOC 2 の Trust Services Criteria(2017、2020-03 更新版)は CC5.1・CC8.1 の主語を経営者・組織に置き、COSO の生成 AI 向け補足ガイダンス(2026-02-23)は職務分離を「AI の設定を構成する権限」と「出力を承認・レビューする権限」の分離として書く。
