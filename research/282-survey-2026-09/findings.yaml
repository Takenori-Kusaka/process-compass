    note: "規範(業界団体の指針)。FND-0113 を限定する: 要求の文言が未実装の言い訳になることを規則として扱う要求工学の指針は存在した(FND-0113 は EARS 公式ガイドの範囲で『見つかっていない』としていた)。ただし R8 の対象は要求文の中に書かれた語句であり、EARS の書式や受入基準が事後に未完成の正当化へ読み替えられる現象(#269 の『Pre-PMF だから』)の報告ではない。規則文は Avoid(避けよ)で、禁止ではない。R9 の理由には検証不能のほか、一要求一事項(R18)違反、完全性(C4)の欠如、契約範囲の解釈問題も挙がる。読んだのは大学の教材置き場にある V3.1 の全文 PDF(表紙は VERS/REV 4、フッタは 3.1 と版表記が揺れる)の第4章 R8・R9・R16 で、現行 V4(2023)の本文は未読。29148 本文・IREB の指針は未読のまま。言い訳に使われる書き方を指針が規則として列挙する形は、#269 の『言い訳に転用されるパターンまで書く』と同じ向きである。"
