    supersedes: null
    note: "規範(指針と見解の一致であり、責任配分の効果の測定ではない)。JetBrains は「作業は委任できても説明責任は委任できない」、IEEE-USA は名指しの所有者、Microsoft CAF はデプロイ承認に責任を持つ人の役割の指定、DS-920 は CAIO によるリスク判断を置く。NTTデータは AI-Generated / AI-Verified / AI-Explainable の3段階で責務が AI へ移っても最終的なアカウンタビリティは人に残るとする。実務側の限定: 日立システムズは QA へのエージェント導入で判断責任の所在が曖昧になり確認不足のリスクが顕在化したと自己報告(69名・6か月)、LayerX の個人の失敗談は AI の回答を自分の言葉で説明できなかった事例、Hugging Face / Data & Society の position paper は HITL が意味を持つのは人が独立にループの中を見られる場合だけとする。責任を人に置いたうえでロールを AI が占める構成の可否を直接述べた規範は束に無い"
