    note: 規範(OWASP)・公的機関の要約(IPA)・自己報告の事例 2 件で、人の判断の入力を AI が作る構成での見逃し率を測った出典は束に無い。OWASP のシナリオは原因が乗っ取り・汚染・ハルシネーションのどれでも同じ結果になるとし、対策 4 の適用条件は利用者と対話するシステム。ASI09 は人の誤認・過度の依拠、ASI10 はエージェントの意図の逸脱と書き分ける(SRC-0623#c8)。IPA の短信は一次情報源の要約を AI を用いて作成しており個々の事例の記載内容を保証しないと断る(SRC-0631#c5)。6 製品の欠陥(GhostApproval、CWE-451)は Wiz の報告の二次引用で、脆弱性として扱うかはベンダー間で判断が分かれた。ジモティーは AI 管轄(ロジックの妥当性・バグ・脆弱性・性能・規約準拠)と人間管轄を分け、AI の方が検出精度が高いという考えに測定を示していない(SRC-0629#c1)。承認操作は人が行う。サイバーエージェントは AI を「最終的なゲートキーパー」と呼ぶが、AI の判定がマージを機械的に止めるとは書かれておらず、懸念への対応は人が判断する。AI レビュア側で作成者の主張(PR 説明文)を除くと検出が戻る測定(FND-0087、FND-0082)の人側に当たる測定は無い。#268 は AI レビュア側の観測なので context
