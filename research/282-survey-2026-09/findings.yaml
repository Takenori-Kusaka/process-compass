    statement: "読めた内部統制の規準は、職務分離の担い手が人であることを条文上の要件として書いていない: J-SOX 実施基準(令和5年改訂)は職務を「複数の者」の間で分担・分離すると書き全文に AI・人工知能の語が無く、SOC 2 の Trust Services Criteria(CC5.1・CC8.1)は主語を経営者・組織とし分離が実際的でない場合の代替統制を認め、COSO の生成 AI 補足ガイダンス(2026-02-23)は職務分離を「AI の設定を構成する権限」と「出力を承認・レビューする権限」の分離として書き、AI 関連の変更の独立した検証手順を「人または自動」とし、人による裏付けをリスクに比例した水準で求める。AI を職務分離の一方に数えてよいかを直接定めた規準は追加分に無く、ISACA の白書(2026-09-15)は破壊的・金銭的・法的・規制対象・不可逆な操作に人の承認を求め、決算ソフトベンダーの見解は、目的が正確性の二重確認なら AI が担い得るが不正抑止(二人の人間の相互の説明責任)なら人2名が要ると目的で分ける。"
