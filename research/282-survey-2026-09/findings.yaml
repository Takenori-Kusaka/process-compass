  - id: FND-0185
    theme: TH01
    statement: 経済産業省の「AI 利活用における民事責任の解釈適用に関する手引き」第1.0版(2026-04-09)は、人の判断を代替する「依拠／代替型 AI」について、2つの要件を満たすことを条件に、利用者の注意義務が個々の合理的な判断・行動から、AI を組み入れた業務プロセスの適正な構築とリスクを下げる運用へ転換すると整理した。AI エージェントの補論は、必要な場面での人の関与を含めた業務プロセスを適切に構築していたかを注意義務の論点に挙げる。
