    note: 規範(任意適用で、分野・用途を特定しない枠組み。細分類は義務ではない)。監視の役割を誰が占めるかは定めておらず、監視を自然人へ割り当てる EU AI Act(FND-0003)とは書き方が異なる。附属書 C が扱うのは人の役割の定義で、AI が役割を占めることの可否には触れていない。生成 AI プロファイル(AI 600-1、2024-07)は GOVERN 3.2 で人と AI の構成について役割と責任を定義・区別する方針を求め、MG-3.2-008 で人によるモデレーションを「適切な場合に」用いるとする。「常時の人の関与を求めていない」は where appropriate からの推論で、原文はモデルの性能が低いと実証された場面での使用も挙げる。対応表は FDIS 版に基づき、発行版との差は未確認。42001 の管理策本文は載っておらず、42001 本体に「人の監視」を表題に持つ管理策があるかどうかは対応表からは分からない(FND-0169 が二次解説で引く A.8.4 との関係は未確認)。役割と責任(GOVERN 2.1)の対応先は箇条 9.1・5.3・7.1〜7.4 と B.3.2。いずれも 2023〜2024 年の文書で、エージェント型 AI を対象にした改訂ではない。TH01-Q2 の不足のうち ISO/IEC 42001 附属書の本文は引き続き未読
  - id: FND-0184
    theme: TH01
    statement: "AI を職務分離の二者の一方に数えてよいかについて、公開された見解は統制の目的と独立性の条件で答えを分けており、規制当局や監査基準の引用を伴うものは束に無い。決算業務ソフトのベンダー FloQast は、正確性の二重確認が目的なら AI が担い得るが不正抑止が目的なら人2名が要ると述べ、in-toto へのレビュー attestation の提案(PR #603、2026-09-29 提出、未審査)は既定の方針でエージェントの承認を独立と数えず、署名されたオプトイン方針と運用者・提供元・署名者の独立を条件に置く。"
