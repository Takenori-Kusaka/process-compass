    note: 規範(法律の全文と指針の全9頁を通読)。TH12-Q2 の不足「AI 法の条文が事業者に課す内容」を埋める。指針の AI ガバナンスの例示は経営層の関与したモニタリング・評価、情報開示、教育・研修で、既存の IT ガバナンスプロセスの活用も有用とする(脚注15)。名宛人は製品・サービスを開発・提供する活用事業者と第三者へ提供する研究開発機関で、自社業務で使うだけの事業者は明示されていない。国民向けの 4(2) には「人間の判断、責任の下で意思決定を行う」とあり、判断対象を範囲や条件に限らない記述が別の節にある。指針と各種ガイドラインは「アジャイルかつ継続的に見直す」とされ、改訂周期の数値は無い。IPA 自身の指針のカードは追加分にも無い。
