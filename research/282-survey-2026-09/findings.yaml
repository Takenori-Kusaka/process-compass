    note: "gittuf は設計文書(最終コミット 2026-09-10)の記述で、採用実績・効果の測定は無い。承認は変更前後の Git ハッシュに結び付くため、承認後に中身が変われば検証で一致しない。in-toto Issue #77 は最終コメントが 2022-03 で、「標準の様式が未確定」は Issue の状態からの読み(リポジトリ側に別の predicate があるかは未確認)。想定された記載事項はレビュー実施者・対象・結果で、差分へのレビューをファイル全体へどう連鎖させるかは未解決の問いとして残る。2026-09-29 にレビューの predicate を追加する PR #603 が出たが未審査の提案で、提案者は、署名ファイルはプラットフォームが承認済みと示さなかった変更を承認してはならない、既定の方針ではエージェントの承認を独立と数えない、運用者と指示の所有者はレビュア側ツールの自己申告にすぎない、と書く。#271 の「人が見た証跡を署名で残す」には承認の署名という先例があるが、「何を見たか」を記録する様式の先例は依然無い。RQ TH07-Q2 の不足のうち、署名付き証跡の先例と in-toto の一次資料に答える。Sigstore 自体の一次資料と、PR 本文の主張と実体の一致を検査する規格上の先例は依然無い。"
