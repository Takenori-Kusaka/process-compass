    note: 規範。TH08-Q2 の不足に挙がっていた『規格が機械化(ツール認定)をどこまで認めるか』に答える。DO-178C・DO-330 の本文は有償で未読(AC 20-115D は強制でない適合手段の通達、NASA の2件は規格の適用を説明した二次的な記述)。RG 1.168 の免除は立会い・レビュー・試験の V&V タスクに限られ、ツールの扱い全体は IEEE 7-4.3.2(RG 1.152 が是認)に従う前提で、検出できることを示せない場合は指針がツール開発に適用される。DO-330 はコードを生成するツールに検証ツールより厳しい検証要求を課し、独立性をもって満たす目標は TQL-1 が最多で、TQL-3 は品質保証活動を除き検証の独立性を要求しない。ツール認定は、ツールが自動化・削減・除去する目標の特定、依拠する機能の明示、正しく動くことを示すテストや分析から成る。形式手法ツールは出力を人が確実にはレビューできないことが多く認定が必要になるとされる。あるプロジェクトで認定されたツールが別のプロジェクトで認定済みとは限らない。IEC 61508-3 第3版の原案(CDV、2025-02、発行未確認)は規範附属書 H にオフライン支援ツールの要求を置く。LLM を用いる検査ツールの認定を扱う記述は束に無い。#255 の『対応の有無は決定論的に検査できる』に対し、航空・原子力の規範が検査の機械化に付ける条件は、出力の独立検証かツール自体の認定である。
