  - id: FND-0001
    theme: TH01
    statement: "外部の自律度分類は、役割単位の二値ではなく多段階で定義されている。切る単位は機能(情報取得・分析・決定・実行の4クラスそれぞれに連続段階)、行為(OECD の4段階: 推奨のみ / HITL / HOTL / HOOTL)、作業(Epoch AI の AL0〜AL5、HAS の H1〜H5)、人側の役割(Feng らの5段階)であり、AI 側の役割ごとに「完全自律か協働か」を二択にする分類は束に無い。"
