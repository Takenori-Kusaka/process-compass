    note: "規範(不法行為責任を中心にした解釈の手引きで、裁判所を拘束する規定ではない)。読んだのは 2.1・2.2・4.3。「責任を人と組織に残したまま AI が判断を担う構成を条件付きで扱っている」は原文の文言ではなく読み手の要約で、原文は預金払戻しシステム(機械払い)の裁判例の判断枠組みを援用する形をとる。2つの要件の中身は出典カードに転記されておらず、原典 2.2.2(1)② の確認が要る。原文は「AI の不適切な出力の全てを AI 利用者が検証する等の方法で是正するまでの結果回避義務は認められない」とし、代替の範囲は「人の判断や行動の全部又は一部」である。最終的に人の判断が介在する「補助／支援型 AI」では、AI の出力を援用したことは原則として注意義務の水準を引き上げも引き下げもしない。限定: 契約責任は原則として検討対象外で、全文に「契約不適合・検収・請負」は 0 件。想定事例7件(配送ルート最適化、弁護士業務支援、画像生成、取引審査、外観検査、自律走行ロボット、AI エージェント)にソフトウェア開発は無い。AI エージェントの補論はカスタマーサポートの事例で、当事者の責任を個別具体的に整理することは現時点では困難として基本的な考え方にとどめ、論点も「例えば」の例示である。FND-0004 の note と TH01-Q2 の回答は「責任を人に置いてロールを AI が占める構成の可否を直接述べた規範は束に無い」としていたが、不法行為上の注意義務の枠内に限って、この構成を条件付きで扱う公的文書が1件加わった(訂正ではなく追加)"
  - id: FND-0186
