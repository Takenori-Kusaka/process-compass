    note: 規範(団体の指針であり、どの構成が不備や不正を減らすかの測定ではない)。COSO の「人または自動」は CI/CD における AI 関連の変更の検証手順(原則 11、技術に対する全般統制)についての記述で、業務上の承認者を AI にしてよいと述べたものではない。5つの手法(HITL レビュー、性能試験、Multi-Model validation、データ分析による監視、第三者による検証)は識別したリスクに応じて組み合わせる前提で、互いの代替とは書かれていない。読んだのは原則 10〜12 と能力別統制表。ISACA は AI 同士の承認で職務分離を満たせるかを扱っておらず、統制の所有者を配備の承認・ツールの利用範囲・監視・インシデント対応・リスク受容に割り当てることを求める。EY Japan の論考(2026-01、意見)は HITL の厚さをリスクアペタイトで決めるとする一方、人の役割を AI エージェントへの目標設定・結果レビュー・承認に置く(counter)。FND-0002(承認要否は操作単位のリスクで定める)と同じ向きが、内部統制と IT 監査の団体から追加された。独立した検証の担い手を人に限定しない記述は、TH01-Q2 の三分類でいえば「条件付き」側の根拠で、#248 が求める AI による判断の引き受けに対しては、変更の検証という範囲と決定的な統制の併用という条件が付く
