    note: 規範(行政の解釈の手引きで、裁判例そのものではない)。読んだのは 2.1、2.2、4.3。#248 に対しては、責任を利用者(人・組織)に残したまま AI が判断を代替する構成を責任判断の枠組みに載せている点で支持側だが、対象は第三者に対する不法行為責任で、開発プロセスのロール配分を述べたものではなく、転換は2要件を満たす場合に限る。補助/支援型では AI の出力を援用したことは原則として注意義務の水準を上げも下げもしないとし、依拠/代替型では不適切な出力の全てを利用者が検証して是正するまでの結果回避義務は認められないとする。契約責任は個別性が高いこと等を理由に原則として対象外で、受託開発の検収・契約不適合責任との関係は本手引きから読めない。AI エージェントは「当事者の責任を個別具体的に整理することは現時点では困難」とされている。
