    note: 規範。指針は全9頁を通読。適正性の一義的な定義や絶対的な水準を定めず、各主体の規模・立場とリスクに応じた水準での対応を求める。ただし国民向けの 4(2) には「人間の判断、責任の下で意思決定を行う」とあり、判断の対象を範囲や条件に限らない記述が別の節にある。AI ガバナンスの構築・運用を求める名宛人は、AI を活用した製品・サービスを開発・提供する活用事業者と、開発した AI を第三者へ提供する研究開発機関で、自社業務で使うだけの者は明示されていない。J-AISI の分類は自律性と外部連携(限定的な情報連携・デジタル世界操作・物理世界操作)の2軸で、読んだのは 3.6・3.11 と巻末の分類・リスク表。「承認の要否を役割ではなくリスクで切っている」という対比は原文に明示が無く、読み手の解釈。評価項目例にはリスクの高いタスク(ファイルの書き込み・削除、権限の昇格、高負荷な計算)で異常や目標からの乖離を検知したときの人の介入・停止を挙げ、リスク表は「監視能力の飽和」(エージェントの過剰な動作でアラートが多発し人の監視が追いつかない)を挙げる。FND-0001(多段階の分類)、FND-0002(リスク単位の承認)、FND-0172(人工知能基本計画)と同じ向きの国内の公的文書で、TH01-Q1・Q2 のどちらの falsifier にも該当しない
