    note: "いずれもベンダー・著者の見解と指標定義で、測定値ではない(DX は selfReported)。DX の利用指標は AI ツールの DAU/WAU、AI 支援 PR の割合、コミットされたコードの AI 生成比、エージェントへの割当タスク数。費用指標は AI 支出、開発者 1 人あたりの正味の時間利得、エージェントの時間単価(人時換算 ÷ AI 支出)。エージェントは監督するチームの延長として測り、チームの PR スループットにエージェント作成 PR を含めるよう勧める。コード生成量の指標は操作に特に弱いとし、個人評価への利用を避けるよう求める。DX は、高いマージ率が「人が処理しきれず追認している」ことを意味しうるとも指摘する。Frictionless は書籍第 59 章の抜粋(readLevel section)で、Trust は「Consider adding」という勧め。SPACE の Activity は提案の受入率や AI に任せる作業の種類へ読み替えられ、集約はチーム単位とされる。操作の報道例: Amazon は Kiro の利用量ランキング(Kirorank)を、トークン消費の水増しが費用を押し上げたとして停止し、代わりに normalised deployments を採ったと報じられた(FT を引く二次情報、readLevel secondary、規模の数値なし)。Amazon は公式に承認したツールではなかったと声明している。DORA は 2026 年の年次調査を行わず 2026 年版 State レポートも出さないと発表した、と計測ベンダー Waydev が伝える(二次情報で DORA の一次発表は未確認。dora.dev の年次アーカイブは 2025 年までで /research/2026/ は 2026-09-30 時点で 404)。#274 のロール別 turn 比率は、この分類では診断用テレメトリの側に当たる"
