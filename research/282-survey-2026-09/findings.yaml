    baseline: "254-verification-independence-levels.md §2: IEEE 1012 は独立性を technical / managerial / financial の 3 パラメータで規定(二次資料のみ。規格原文と NRC RG 1.168 は取得できなかった)/ §4: ISO 26262 の独立性水準 I0〜I3 は二次資料経由 / §7: 目盛りの下端は「別人」"
    volatility: slow
    reviewBy: 2027-09
    supersedes: null
    note: "規範。独立性の効果の測定値はどの文書も示さない。IEEE 1012 本文(有償)は未読のままで、3 要素は NASA 標準が IEEE の定義を出典に挙げて採録した条文で確認した。NRC は附属書 C 自体を不十分な手引きとして是認せず、設計の検証・点検を設計者以外の者が行うという 10 CFR 50 附属書 B 基準 III の充足を求める(遵守は任意の規制指針)。ISO 26262-12 は二輪車向け適応で、I0〜I3 を定める表 1 はプレビュー範囲外、第 2 部 §6.4.9 表 1 の原文は未確認のまま。FDA は小規模企業にも独立性を免除せず作業の編成と割当ての工夫を求めるが、代償措置は列挙しない(非拘束の手引き)。周辺: NIST AI RMF 1.0 MEASURE 1.3 は定期評価に第一線の開発者でなかった内部の専門家または独立した評価者を関与させ(SRC-0518#c4。独立性の定義は置かない)、AI 600-1 MS-1.3-003 は構造化した人のフィードバック演習の実施者が同じモデルの開発に直接関与していないことの確認を求める(SRC-0520#c2)。いずれも任意適用。ISTQB CTFL v4.0 は適切な水準のテストの独立性をリスク軽減策の 1 つに挙げる(SRC-0545#c4)。読めた範囲はすべて担い手を人・組織として書いており、AI やエージェントを独立した検証者に数えてよいかを扱う文言は無い(不在の確認ではない)。限定: DO-178C 本文は目標の根拠をほとんど示さないという NASA Langley の指摘があり(SRC-0534#c1)、規格の独立性要求を根拠が示された要求として引くことには留保が付く。カードの Issue #254 タグは同番号の独立性水準メモ(Dev-A / Dev-B 分割への回答)に対応し、Issue #254 本文(検査の段階的有効化)の主張を直接扱わないため context とした"
  - id: FND-0226
    theme: TH06
    statement: DO-178C は、認証目標をツールで満たす場合に、ツールの出力を独立に検証(人手でレビュー)するか、ツール自体を認定(qualification)するかのいずれかを求め、人が確実にはレビューできない出力を出すツールは認定が必要になる(NASA の委託報告書と解説論文による二次情報)。DO-330 はコードを生成するツールに検証するツールより厳しい検証要求を課し、独立性をもって満たす目標は TQL-1 で最も多く、TQL-3 では品質保証活動を除いて検証の独立性を求めない。
