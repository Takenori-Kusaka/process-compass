    note: "対象は Zheng と PRISM がオープンウェイト(7〜72B)、Wharton が 2025 年世代の API モデル(GPT-4o、o3-mini、o4-mini、Gemini 2.0/2.5 Flash ほか)で、2026 年のフロンティアモデルでの測定は束に無い。Zheng の原典の結論は「効果がない」より「効果が予測できない」に近く、問題ごとに最良の persona を選べば有意に改善するが、自動選択は無作為と変わらない。PRISM は persona が文章・ロールプレイ・安全などの整合依存課題を改善し、MMLU・数学・コーディングなど事前学習依存課題を劣化させるとし、推論蒸留モデルでは専門家 persona が無作為の persona より有害な場合があると報告(この2点の出典 SRC-0015#c6・#c7 は機械照合も目隠し抽出の判定も無く未検証)。counter: 2023 年の ChatGPT では役割演技プロンプトで AQuA 53.5%→63.8%(NAACL 2024、abstract のみ、2段階の対話設計に依存)。いずれも単発の質問応答の測定で、複数ターン・ツール使用を伴うエージェントのロール運用を測っていない。隣接する測定として Anthropic のスウォーム実験では役割プロンプトが結果をほぼ変えなかった(自己報告)。TH01-Q5 の falsifier のうち「特定の persona・課題では正の効果があり一般化できない」は成立する。条項へ移すとき、エージェントのロール運用の文脈ではこの知見は隣接領域の測定(E1)として扱う"
