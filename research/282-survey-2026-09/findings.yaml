    note: "DORA の根拠は 2019 State of DevOps Report の調査。RADAR は Meta の自社報告(53.5万件超を審査、33.1万件超を着地)で、低リスクに選別された差分との比較であり、著者が未観測の交絡を自認する。SonarQube は条件を増やすと速度のボトルネックになり、頻繁な失敗でゲートが無視される危険があると注意する(ベンダー文書)。Rewind は約40%の PR を自動承認し、人の判断と約99%一致(小標本・自己申告)。Kiro と IPA 9期生の手引書はゲート・承認の対象をリスクで絞る基準を示す。反対側: レビューのカバレッジ・参加度・専門性は品質と有意に結び付き(McIntosh ら)、NTTデータはコード全量の人手レビューを省いたことを振り返って実施すべきだったとした。DORA も高リスク変更の早期検出と追加精査は推奨している。水準: DORA の記述はカードに標本・方法が無く(quant なし、2019 年調査に基づく指針ページ)、RADAR は自己申告の非無作為比較で、承認の追加という主張に対しては隣接する証拠のため、2026-09-30 の突合で E2 から E1 へ改めた。SRC-0348 に 2019 年調査の n と design を補えれば E2 へ戻せる。"
