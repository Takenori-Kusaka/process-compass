  - id: FND-0242
    theme: TH08
    statement: PMBOK 第4版は前提を『計画のために、証明や実証なしに真・現実・確実とみなす要素』と定義し、PMI 大会論文(2010)は、文献が前提を一覧にして定期的に見直せと言う以上の手引きをほとんど与えていないと指摘する。RAND の Assumption-Based Planning(1993)は、崩れると計画の大きな変更が要る前提(load-bearing)と期間中に崩れうる前提(vulnerable)を特定し、前提の脆弱性の変化を示す事象・閾値(signpost)と、前提を守る行動(shaping)・崩れる場合に備える行動(hedging)を定める。
