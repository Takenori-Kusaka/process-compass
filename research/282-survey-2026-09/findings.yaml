    note: "いずれも製品文書・公式の例(Danger・OpenSpec・CodeRabbit・Cursor は自己申告)で、効果の測定は無い。線引きの妥当性の根拠としては E0 相当。Danger の関数は message / warn / fail / markdown の 4 つで、fail が blocking を宣言する。同じ公式例は PR 本文・題名の「#trivial」で CHANGELOG 検査を免除する(決まった文言による opt-out の機械判定の先例)。OpenSpec の verify は拡張プロファイル側のコマンドで、指摘を CRITICAL / WARNING / SUGGESTION に分ける。Bugbot は未解決の指摘で失敗させる別設定を持つ。CodeRabbit(Change Stack はプレビュー)は低確信の「Ready」を証拠の不在として扱い、自分で差分を読むよう求める。これらは「真正性は hard-fail、体裁は警告」という線引きそのものではなく、主張と実体の一致を hard-fail にする製品先例は依然束に無い。反対側: GitHub は 2026-06 にカバレッジ下限と低下幅で結合を止める規則を出している(FND-0099)。"
