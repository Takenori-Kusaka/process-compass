    note: OSS の README・公式サイトの記述(規範)で、効果の測定ではない。Release Drafter と action-semantic-pull-request は該当節までの読解。rq TH10-Q4 と FND-0148 が「出典が無い」としたリリースノート自動化との分担と opt-out 文言の先例を埋める。#271 は顧客向けの文を含む4つの役割を1つの PR 本文に持たせた実測だが、これらの先例は顧客向けの記録を題名・ラベル・コミットメッセージへ分けている。release-please は squash マージを強く勧め、PR 内でしか意味を持たないコミットはリリースノートに無関係だとしてレビュー中の経過と顧客向けの記録を分け、対象を feat・fix・deps の接頭辞に限る。Release Drafter の Check PR はリリースノート側の分類条件(題名・ラベル)を PR 時点で検査する。Danger の免除は本文と題名を連結した文字列への部分一致(includes)で、#271 のいう行単位の判定(コメント・未チェックの checkbox・否定文を宣言と見なさない)は例に含まれない。Danger は出力を message・warn・fail・markdown に分け、公式例は CHANGELOG の欠落を fail ではなく warn で返す。4つの読み手を1本文に持たせる設計と、宣言の行単位の機械判定を扱う先例は、追加分にも無い。
