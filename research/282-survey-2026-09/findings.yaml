    note: 規範。対象は高リスク AI システムの使用中の監視であり、開発プロセスのロール配分を直接定めるものではない。Annex III 該当の適用は Digital Omnibus により 2027-12-02(Annex I は 2028-08-02)へ延期。人の関与は高リスク分類を外さない(委員会ドラフト指針、法律事務所による二次解説)。VDE は監視の要求水準が固有リスク・自律度・利用文脈に依存すると整理し、整合規格 EN 18229-3 は策定中。ISO/IEC 42001 は公開プレビュー14頁のみを読み、附属書 A.3.2 / A.8.4 の本文は未読(A.8.4 は審査機関担当者の二次解説)。ISO/IEC 42105 は 2026-08-26 に FDIS 投票開始で未発行、DIS 版は監視の監督者を「責任または権限を持つ人間」と定義。AI 事業者ガイドラインは「人間の判断を介在させる仕組み」を求める(法的拘束力なし)。SLSA v1.2 Source Level 4 は信頼された「人間」2名の合意を要求しつつ、trusted robot への恒久的な例外を認める。TH01-Q2 の falsifier(役割を人が占めることの明示要求)は監視役と2名確認に限って該当する。#248 の論点1に対しては両者を区別する側の根拠だが、監視役そのものは人に固定される点が限定になる。ISO/IEC 42105 の DIS 版は同じ §3 で AI system operator を「AI システムを扱う自然人」と定義し、AI customer・AI user・AI developer・AI subject を組織または主体と定義する(検証役の注記)。監視以外の役割の担い手に触れる定義があるため、2026-09-30 の突合で statement の不在の列挙から 42105 を外した(DIS の定義で、発行版は未確認)
  - id: FND-0004
    theme: TH01
    statement: エージェントの判断と行為に対する説明責任は人と組織に残る、という記述が、IMDA のエージェント型 AI 向け枠組み、IEEE-USA の意見書、Microsoft CAF、NTTデータ、JetBrains、AWS の指針で一致している。CoSAI の共有責任フレームワークは自律度が上がるほど責任がエンドユーザーから開発者・基盤提供者へ移るとし、Google DeepMind は長い委任連鎖が説明責任の空白を生みうると指摘する。
