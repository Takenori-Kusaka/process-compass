    note: "規範の二次情報。DO-178C・DO-330 本文は有償で未読、記述は NASA Langley の委託報告書(2017)と NASA Ames の解説論文(2012、readLevel secondary)を介する。認定は、ツールが自動化・削減・除去する目標の特定、依拠する機能の明示、正しく動くことを示す試験・分析から成り、あるプロジェクトで認定されたツールが別のプロジェクトで認定済みとは限らない。原子力分野でも NRC の RG 1.168 は、ツールで作られたソフトウェアがツール由来の欠陥を検出できる V&V を受けるなら、ツール自体への V&V 作業(立会い・レビュー・試験)を不要とし、示せない場合はツール開発に同指針を適用する(SRC-0523#c5)。IEC 61508-3 第 3 版の投票用原案(2025-02、発行版ではない)はオフライン支援ツールの信頼性を規範附属書 H に独立させた(SRC-0528#c2)。対象は従来の開発・検証ツールで、LLM やエージェントを検証の担い手として認定する扱いは読めた範囲に無い(不在の確認ではない)。前回の独立性水準メモ §6.3 の「適格化されたツールが人の代替になり得る」(ベンダ白書経由)を、出力の独立検証か認定かの二択という形で補う。TH08-Q2 の不足(規格が機械化・ツール認定をどこまで認めるかの出典)に答える。限定: DO-178C は目標の根拠をほとんど本文に示さない(SRC-0534#c1)。カードの Issue #254 タグの扱いは独立性の定義の知見と同じ"
