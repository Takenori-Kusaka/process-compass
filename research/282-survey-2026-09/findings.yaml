    statement: AI 法第13条に基づく指針(人工知能戦略本部、2025-12-19)は、人が最終的に判断する対象を「AI を活用する範囲や条件」に置き、工程や役割を人が担うことを定める記述は全文に無い。J-AISI の評価観点ガイド第1.20版(2026-07-07)は AI エージェントシステムの自律性を補助型・半自律型・全自律型の3段階に分け、半自律型ではリスクが高い判断と重要な外部システムの操作に人の承認を前提とし、全自律型も事前に定義された目的・制約・監督メカニズムの下での運用を前提とする。
