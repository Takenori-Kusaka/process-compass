    note: 計画・プロジェクト管理分野の規範と意見で、効果の測定は無い。ABP が前提を分ける軸は計画への影響(load-bearing)と脆弱さ(vulnerable)であり、検証済みか否かではない。ただしこの対比は原文に明記されておらず、読み手側の整理である。PMI 論文は、崩れない前提は制約に当たり、プロジェクトの前提はすべて程度の差はあれ vulnerable だと述べる。『検証状態を区別する様式が実務に定着していない』に当たる記述は PMI 論文に無い(文献が指針をほとんど与えないと述べるにとどまる)。hedging の再計画は、前提が実際に崩れた後の手続ではなく、崩れたと仮定していま取れる行動を探るためのもので、上位の計画の再訪を定める記述ではない。PMBOK 本体(assumption log の様式)は未読で、論文は第4版(2008)時点。ABP は要約(pp. xi–xiii)のみを画像から目視で読んだ。signpost は、前提ごとに監視する事象・閾値を置く点で FND-0111 の動的安全ケース(SPI の閾値逸脱で再評価)と共通する。TH08-Q3 の不足のうち assumption register 本体の様式は未読のまま。
