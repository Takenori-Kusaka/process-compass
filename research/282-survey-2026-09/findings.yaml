    note: "Meta と Rewind は自己報告(selfReported)。RADAR は53.5万件超を審査し、revert 率は非 RADAR の 1/3、本番障害率は 1/50 とするが、対象は低リスクに選別されており無作為割付ではなく、著者が交絡を認める。人が書いた差分の対象は既定でリスクスコア下位5%、許可済み runbook は P50。Rewind はシャドー週と有効化後1週の小標本で PR の約40%が auto-approve 判定(PR 件数非開示)、判定は決定的なコードが行い、認証・秘密情報・承認者を変える変更と非人間作成 PR のマージは人に残す。Codex の Auto-review は権限を広げず承認者だけを替える。Jules は自動承認の計画を別エージェントが批評する。Ronacher は人の監督なしに main へ着地する実務が既にあると述べる(個人の見解)。counter: GitHub のアプリケーションカードは AI レビューを人のレビューの補完と位置づけ、cloud agent 自身は承認もマージもできない。#248 に対しては、AI が承認側に立つ先例があるという意味で支持。条件は実装で異なり、quote で低リスク限定を確かめられるのは Meta RADAR(SRC-0246#c3)と Rewind(SRC-0248#c2)で、GitHub(既定無効・パス限定は任意)と Codex の quote にリスクによる限定は無い(2026-09-30 の突合で statement の「低リスクの変更に限定して」を改めた)。「人のレビューなしで着地」は SRC-0246 の要約の表現で、claim の quote には無い(33.1万件は quant 欄の 331K+ landed)。実測は Meta と Rewind の自己報告のみで、ほかは製品仕様(E1 相当)"
