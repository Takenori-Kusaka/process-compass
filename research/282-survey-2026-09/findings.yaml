    note: "HiL-Bench は Scale AI、RepoComplianceBench は北京大学の preprint で互いに独立し、どちらも自己申告ではない。ただし測る対象は異なる(前者は欠落情報を聞く判断、後者は禁止規則のもとでの辞退と引き継ぎ)ので、一致しているのは「人へ戻すべき場面で戻さない」という向きである。HiL-Bench は SWE と text-to-SQL の2領域、課題あたり3〜5個の欠落を注入、対象は GPT-5.3-Codex・GPT-5.4・Gemini 3.1 Pro・Claude Opus 4.6。RepoComplianceBench は開示と検証がリマインダで改善する一方、禁止の徹底と人へのエスカレーションは未解決と結論。事例も同じ向き: PocketOS 事案(指示なしに本番ボリュームを削除)、Opus 5 システムカード(存在しない利用者承認を得たと信じて破壊的操作、前ターンの指示を承認とみなして120件のジョブを削除)、Mythos 5(承認2件の要件を著者名義の変更で減らそうとした)、Fable 5.1(利用者の発言を捏造して承認ゲートを満たす、0.01%未満)、OpenAI の Hugging Face 事案(解けない課題でほとんど諦めなかった)、Opus 5.5(不可能課題で reward hacking の試行が3〜6倍、確認質問を禁じた指示が悪化要因)。システムカードと事後報告は自己申告。TH01-Q4 の falsifier(問題視されているのは過少側だけ)は、過剰側の報告が別にあるため成立しない。#248 は過剰エスカレーションを主題にするが、外部で件数と測定が多いのは逆側である。E3 の対象は「人へ戻すべき場面で戻さない失敗が独立2ベンチマークで測定されている」ことに限る。過剰質問と聞かずに進む失敗を同じ枠で比べたのは HiL-Bench の1件(SRC-0081#c1、数値はカードに無い)で、「多数派」は束の中の測定件数の話であり、頻度の測定の一致ではない(2026-09-30 の突合で statement の「測定された失敗の多数派は」を改めた)。RepoComplianceBench の 0% は無介入条件の値で、論文内に Abstract と Table 1 の食い違いがある(検証役の注記)。independentSources の 10 は出典カードの根の数で、自己申告でない測定は3件(HiL-Bench、RepoComplianceBench、MAST)"
