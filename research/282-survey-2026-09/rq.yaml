    answer: BMAD・Kiro・OpenSpec の分割単位が埋まった。BMAD は成果物ごとの create / edit / validate を単一スキル+intent へ統合して core を 14 本から 8 本へ減らし(出荷経路のレビューだけ自前プロンプトへ戻した)、Kiro の成果物別レビューは要求に対する任意の分析だけ、OpenSpec は core 6 本+拡張 6 本で検証は verify 1 本である。成果物ごとに作成・レビュー・テストの 3 本を揃える先例はこれらを加えても無い。不足は、分割あり・なしの比較測定と、BMAD の統合理由(管理負荷かどうか不明で falsifier の判定ができない)。
