  - id: TH03-Q1
    question: Agent Skills・plugins・slash commands の階層化と progressive disclosure について、ベンダー(Anthropic、OpenAI、GitHub、Google)の推奨(本数、常時ロード量、説明文の長さ)と、何本を超えると選択精度が落ちるかの実測はどうなっているか。
