    question: "#258 が引く「役割(persona)を与えても精度は上がらず MMLU で -3.6〜-5.3pt」(Wharton Prompting Science Report 4)と Zheng ほか(EMNLP 2024 Findings)の結論は、原典の値・条件どおりか。"
