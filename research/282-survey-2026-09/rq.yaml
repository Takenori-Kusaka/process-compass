    answer: 実害が観測されており falsifier には該当しない。第三者スキル市場の監査で 3,984 スキル中 13.4% に重大な問題と悪性ペイロード 76 件が確認され、npm マルウェアが .claude/settings.json に SessionStart フックを仕込む事案も報告された。対策は OWASP Agentic Skills Top 10(署名・固定とハッシュ検証・目録)とベンダーの注意書きの段階で、GitHub の一様標本では明示的に悪意ある指示ファイルは 31,902 件中 1 件という反証もある。
