    answer: 値と帰属についての回答は変わらない(-3.6〜-5.3pt は Wharton 報告ではなく USC の PRISM 論文の値)。2026-09-30 の追加で、エージェントのレビュー課題について、BMAD が v6.11.0(2026-08-09)の変更履歴にペルソナ指定は残存バグの検出率に差を生まなかったと自己報告した1件が加わった。標本数・試行回数は非開示で、件数の要求と問いの形は差を生んだとされるため、「指示の中身が効かない」という意味ではない。
    findings: [FND-0014, FND-0015, FND-0009, FND-0188, FND-0224]
  - id: TH02-Q1
    question: 極小組織向けの規格(ISO/IEC 29110 の VSE プロファイル、ISO 9001 の小規模組織向け手引き)は、兼務と独立レビューの不在に対してどのような代償措置(外部レビュー、記録の強化、周期的な第三者確認)を規定しているか。
    origin: [issue:249, issue:267, theme:TH02]
    kind: explore
    falsifier: これらの規格が代償措置を規定せず、独立性の要求をそのまま課している、あるいは独立性の要求自体を持たない。
    priority: must
    status: partial
    answer: 読めた範囲では規範は3つの型に分かれる。ISO/IEC 29110 は独立性の要求を持たず確認を顧客に置き、OSPS Baseline は保守者1名の段階で人の承認を課さない。独立性を維持したまま代替を示す型は、ISO 19011・GAO Green Book に FDA(ソフトウェア妥当性確認、2002)・NIST SP 800-53B・SOC 2 CC5.1 が加わった。不足は、ISO/IEC 29110 の SI 工程の条文(29110-5-1-2:2025 は抄録のみ)、ISO 19011:2026 の 4.6 本文(小規模組織の一文が残ったか未確認)、ISO 9001 の小規模組織向け手引き。
    findings: [FND-0016, FND-0017, FND-0018, FND-0189, FND-0190]
  - id: TH02-Q2
    question: 製造業の 4M 変化点管理と MOC(Management of Change)は、人の増減・目的変更・納期変更を検出して記録と体制を更新する手順をどう定めており、ソフトウェア開発や AI を含む体制へ転用した先例はあるか。
    origin: [memo:2026-09-02, theme:TH02]
    kind: explore
    falsifier: 4M・MOC をソフトウェア開発体制へ転用した先例が無い、または転用の試みが形式化のみに終わり効果が報告されていない。
    priority: must
    status: partial
    answer: 4M 変化点管理と OSHA の MOC 解釈は人員の増減・交替を変化点に数えるが、OSHA は手順・設備へ波及しない組織変更を対象外とする。目的変更・納期変更を扱う規定は、PRINCE2 第7版(7変数の許容差と例外)と ISO 9001:2026 箇条 6.3 の二次解説の水準で埋まった。不足は、両者の原典での確認(有償で未読)と、体制・AI 編成への転用の一次事例・効果測定で、falsifier の「先例が無い」側は変わらない。
    findings: [FND-0019, FND-0020, FND-0021, FND-0192]
  - id: TH02-Q3
    question: モデルの世代交代・deprecation・可用性の断続を体制の変化点として扱い、再テーラリングや再検証を要求する実務・規格(ISO/IEC 42001 の変更管理、NIST AI RMF、ベンダーの deprecation policy)はどうなっているか。
