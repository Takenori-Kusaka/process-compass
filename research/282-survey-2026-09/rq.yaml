    priority: must
    status: partial
    answer: 2026-09-30 時点で、Claude Code・Codex・Kiro・Google Antigravity と Agent Skills 仕様は段階的開示を採り予算を仕様化している(Antigravity は常時有効な規則の合計 20,000 トークン超過でポインタへ自動降格、GitHub Copilot の手順書に数値上限は無し)。常時ロードと段階的開示の比較測定が初めて付き(Workday、Qwen 3 モデル・32k 窓、1 条件を除き段階的開示が並ぶか上回る)、スキル本文の注入が 4 モデルで平均 Pass@2 を 1.3〜4.2 ポイント下げた統制実験も加わった。不足は、本数と選択精度の関係を示すベンダーの測定値と、選択精度の相転移(GPT-4o 系のみ)を Claude・GPT-5 以降の世代で再現した測定。
