    answer: falsifier(モデル更新を変更管理として扱う規定・実務が無い)は成り立たない。実務に加え、規範側でも NIST AI 600-1 が微調整・RAG・未評価用途への転用時の再評価と事前学習済みモデルの定常監視を、ISACA(2026-09-15)がモデル・提供者などの変更時の再評価と統制の再試験を求める。不足は、ISO/IEC 42001 の管理策本文(対応先の番号までで未読)、NIST が名指ししない供給者側の世代交代・退役を扱う規定、OpenAI の通知期間の一次値、現行世代の第三者 drift 測定。
    findings: [FND-0022, FND-0023, FND-0024, FND-0025, FND-0191]
  - id: TH02-Q4
    question: 検査やゲートを段階的に有効化する先例(ratchet、new-code coverage、warn-then-enforce、fail-closed)は、有効化の条件を「ステージ」「対象の規模」「経過期間」のどれで定め、「実施しなかった」と「通過した」を証跡上どう区別しているか。
    origin: [issue:254, theme:TH02]
    kind: explore
    falsifier: 先例の大半が固定閾値のみで段階的な有効化条件を持たず、未実施と通過を区別する記録も要求していない。
    priority: must
    status: answered
    answer: "falsifier は成り立たないが、限定が付く。有効化条件の型に「対象の規模の下限」(SonarQube Server の新規行 20 行未満で条件を無視、既定で有効)が加わり、ステージ・経過期間を条件にした製品機能は依然として束に無い。未実施と通過を区別する先例がある一方、GitHub の条件スキップされたジョブと Codecov の if_not_found 既定は未実施を通過として扱う。規模の下限(SonarQube)と「結論なし」(Scorecard)は別々の製品にあり、下限未満を未判定と記録する単一の先例(#254 の measured: false 相当)は無い。#254 が引く Filetto の失敗 14 件は再現できるが窓と母数で動く(全 183 実行で 43 件、全ワークフロー直近 100 で 6 件)。"
    findings: [FND-0026, FND-0027, FND-0028, FND-0018, FND-0021, FND-0193, FND-0194, FND-0195]
