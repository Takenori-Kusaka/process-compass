    answer: 外部では部分的にしか再現しないという判定は変わらない。追加で、「黙って落ちる」が指す機構は不遵守・量の上限・設定不備の 3 系統に分かれ、Antigravity は frontmatter や trigger に不備のある規則を警告なく破棄すると原典が明記し、Cursor Bugbot は 1 本 30,000 字・合計 100,000 字で打ち切ると分かった。規則 50 本までは課題合格率が落ちない測定も加わったが、16 万バイト級に届かず指標も遵守率ではない。不足は、16 万バイト級の常時ロード指示の遵守を直接測った外部測定。
    findings: [FND-0034, FND-0035, FND-0037, FND-0038, FND-0039, FND-0042, FND-0051, FND-0197, FND-0198, FND-0200]
  - id: TH03-Q5
    question: スキル・プラグインの供給網リスク(第三者スキルの改竄、埋め込まれたプロンプトインジェクション、署名・検証の仕組み)は、外部でどう扱われ、実害の事例はあるか。
