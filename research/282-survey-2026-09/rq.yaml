questions:
  - id: TH01-Q1
    question: 役割単位で「完全自律の AI」か「人と協働する AI」かの二択にする自律度の表し方は、外部の自律度分類(作業単位・リスク単位の段階、human-in-the-loop / on-the-loop / out-of-the-loop、SAE 型のレベル定義)と比べて、軸と粒度に過不足があるか。
    origin: [memo:2026-09-02, theme:TH01, issue:248]
    kind: explore
    falsifier: 外部の主要な分類も役割単位の二値で構成されており、作業単位・リスク単位で自律度を切り替える先例が見つからない。
    priority: must
    status: answered
    answer: 結論は変わらず、軸と粒度の両方に差がある(falsifier 非該当)。2026-09-30 の追加で、J-AISI 評価観点ガイド第1.20版(自律性3段階×外部連携の2軸、半自律型は高リスクの判断と重要な外部操作に人の承認)、AI 法第13条の指針、ISACA 白書が同じ向きの根拠に加わった。「承認の要否を役割ではなくリスクで切る」という対比は原文に明示が無い読み手の解釈で、根拠が規範であり成果の測定ではない点は従来どおり。
    findings: [FND-0001, FND-0002, FND-0028, FND-0171, FND-0173, FND-0186, FND-0182, FND-0274]
  - id: TH01-Q2
    question: A(結果責任)を人が持ちながらロールそのものを AI が占める構成を、規格・規制(EU AI Act 第14条の人間による監視、ISO/IEC 42001、内部統制の職務分離)は許容・条件付き・禁止のどれとして扱っているか。
    origin: [issue:248, issue:249, theme:TH01, theme:TH12]
    kind: explore
    falsifier: 規格・規制が「判断の責任を人が持つこと」と「役割を人が占めること」を区別せず、後者を明示的に要求している。
    priority: must
    status: partial
    answer: 許容・条件付き・禁止のいずれとも直接には分類されていない状態が、内部統制の原典でも確認された。J-SOX・SOC 2・COSO は職務分離の担い手が人か AI かを規定していない。「条件付き」側の根拠は、COSO が AI 関連の変更の独立検証を「人または自動」と書くことと、経産省の民事責任の手引き(2026-04-09)が不法行為上の注意義務の枠内に限って人の判断を代替する AI を2要件つきで扱うことの2件。AI を職務分離の一方に数えてよいかは、目的と独立性で見解が割れている(E0)。不足は、ISO/IEC 42001 附属書 A.3.2 / A.8.4 の本文、未発行の ISO/IEC 42105、SOC 2 の 2022 年改訂版と PCAOB 等の監査基準の原典、手引きの2要件の中身、規制当局・監査基準の引用を伴う見解。
    findings: [FND-0003, FND-0004, FND-0005, FND-0006, FND-0010, FND-0168, FND-0169, FND-0172, FND-0150, FND-0181, FND-0182, FND-0183, FND-0184, FND-0185, FND-0186, FND-0227, FND-0269, FND-0270, FND-0271, FND-0276]
  - id: TH01-Q3
    question: AI をチームの席(メンバー)として編成する実務(BMAD、Claude Code の agent teams、Devin as teammate、GitHub Copilot coding agent 等)は 2026-09 時点で何に到達し、AI が判断を引き受けず補助モジュールのようにしか動かない現象はどう報告・対処されているか。
    origin: [memo:2026-09-02, theme:TH01]
    kind: explore
    falsifier: 公開された運用報告で AI がロール保持者として判断を引き受け続けた事例が複数あり、補助モジュール化の報告が個別ツールの制約に限られる。
    priority: must
    status: answered
    answer: 判断と承認を人に残す自己規定が主流で、AI がロール保持者として判断を引き受け続けた運用報告は束に無い(falsifier 非該当)点は変わらない。2026-09-30 の追加で、レビュー判断の一部を AI の管轄に置く国内の自己報告が2件(サイバーエージェント、ジモティー)加わったが、どちらも承認操作は人が行い、見落とし率や出荷後の欠陥は測られていない。NRI と日立は人の確認工程・承認ゲートを残す側にある。
    findings: [FND-0007, FND-0008, FND-0009, FND-0187, FND-0228]
  - id: TH01-Q4
    question: AI が判断を人へ回しすぎる(過剰なエスカレーション・確認質問)問題は、外部でどう名付けられ、決定権限の明示や ask-vs-act の閾値設定などの対処はどの程度実証されているか。
    origin: [issue:248, theme:TH01]
    kind: explore
    falsifier: 外部にこの現象の報告や対処の設計が無く、問題視されているのは過少エスカレーション(勝手に進める)側だけである。
    priority: should
    status: partial
    answer: 名称は統一されていない(unnecessary escalations、over-asking、人側は approval fatigue)。過剰側は Intercom・OpenAI・Anthropic の運用文書で報告されているが、測定の多数派は「聞かずに進む」側で、falsifier(過少側だけが問題視)は成立しない。不足は、決定権限の明示や ask-vs-act の閾値が過剰エスカレーションを減らすかを比べた対照実験で、対処はベンダー指針にとどまる。
    findings: [FND-0010, FND-0011, FND-0012, FND-0013, FND-0112, FND-0002]
