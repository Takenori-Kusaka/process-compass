  - id: TH03-Q3
    question: ルール数・指示量と遵守率の関係(instruction-following の劣化、長い文脈での指示の脱落)について、2026 年時点の実測は何を示しているか。
    origin: [issue:269, issue:274, theme:TH03]
    kind: explore
    falsifier: 実測でルール数を増やしても遵守率が下がらない、または劣化が旧世代モデルに限られ最新モデルでは再現しない。
    priority: must
    status: answered
    answer: 従来の回答(指示が増えると完全遵守率が下がることは独立 3 研究で一致、2026 年モデルでは課題の種類で結果が割れる)は変わらない。追加として、Claude Code+Opus 4.6 で規則数を 0 から 50 へ増やしても課題合格率は安定した(66.7% 対 60.3%、有意差なし)が、測ったのは合格率で遵守率ではなく、FND-0034 の反証にも falsifier にも当たらない。スキル本文の注入は 4 モデルで平均 Pass@2 を下げ、劣化の機序は長さと内容でモデルごとに分かれた。
    findings: [FND-0034, FND-0035, FND-0036, FND-0040, FND-0041, FND-0043, FND-0094, FND-0097, FND-0199, FND-0200]
  - id: TH03-Q4
    question: "#269/#274 の「常時ロード 16 万バイトの指示書は守り切れず、守れないものは黙って落ちる」という観測は、外部の観測(CLAUDE.md / AGENTS.md の規模と遵守の報告、ベンダーの推奨上限)で再現するか。"
