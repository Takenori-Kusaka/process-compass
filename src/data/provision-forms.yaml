# 規定の表現形式の検査の登録簿(#310 / ADR-0063)
#
# 第1章 1.5(附属書の種別)と 1.7(規定の表現形式・表の升の語・同じ事項は1か所)を、
# scripts/check-provisions.mjs が検査するための登録簿。書式と運用は community/provision-forms.md による。
schemaVersion: 0

# --- 文書の種別(第1章 1.5) ---
# kind: normative   — 本文8章と規定の附属書。依頼の形・「すべき」・廃した升の語を検出する
# kind: informative — 参考の附属書。要求・禁止の文末と、実装マークを検出する
# 附属書は annex に記号を書く。表題と第1章 1.5 の表の「種別」が一致することを検査する
documents:
  - { page: phase4-process-design/overview, kind: normative, chapter: 1 }
  - { page: phase4-process-design/lifecycle, kind: normative, chapter: 2 }
  - { page: phase4-process-design/roles-responsibilities, kind: normative, chapter: 3 }
  - { page: phase4-process-design/gate-criteria, kind: normative, chapter: 4 }
  - { page: phase4-process-design/human-ai-boundary, kind: normative, chapter: 5 }
  - { page: phase4-process-design/deliverable-templates, kind: normative, chapter: 6 }
  - { page: phase4-process-design/exception-escalation, kind: normative, chapter: 7 }
  - { page: phase4-process-design/tailoring-guide, kind: normative, chapter: 8 }
  - { page: phase4-process-design/integrated-process, kind: informative, annex: A }
  - { page: phase4-process-design/ears-guide, kind: normative, annex: B }
  - { page: phase4-process-design/review-guide, kind: informative, annex: C }
  - { page: phase4-process-design/proposal-template, kind: normative, annex: D }
  - { page: phase4-process-design/developer-guide, kind: informative, annex: E }
  - { page: phase4-process-design/safety-verification, kind: normative, annex: F }
  - { page: phase4-process-design/executive-projection, kind: informative, annex: G }
  - { page: phase4-process-design/assurance-case, kind: normative, annex: H }
  - { page: phase4-process-design/adoption-guide, kind: informative, annex: I }

# --- 廃した升の語(第1章 1.7.3) ---
# 規定の文書の表の升が、この語だけ、またはこの語+括弧書きである場合に検出する
retiredCellWords:
  - 省略可
  - 任意
  - どちらでもよい
  # 兼務の表の旧い記号と語(#312 / ADR-0082)。許容・非推奨・禁止と括弧の限定で書く
  - ○
  - △
  - 可
  - 不可
# 規定の文書の地の文でも検出する語
retiredWordsAnywhere:
  - 省略可

# --- 廃した言い回し(第1章 1.7「同じ事項の規定は1か所に書く」) ---
# 条項を改めて古い言い回しを廃したとき、その特徴的な句を登録する。句が残っていれば検査が失敗する。
#   phrase  — そのままの文字列で探す句
#   retired — 廃した日
#   by      — 廃した決定(ADR または Issue)
#   instead — 代わりに書くこと、または正本の所在
retiredPhrases:
  - phrase: 自動承認の比率
    retired: 2026-10-13
    by: ADR-0059
    instead: 量の名前として廃した。承認の比率を引き下げの検知条件に置かない(第5章 5.4.6)
  - phrase: 自動承認率
    retired: 2026-10-13
    by: ADR-0059
    instead: 同上
  - phrase: 自動承認の割合
    retired: 2026-10-13
    by: ADR-0059
    instead: 同上
  - phrase: 委譲・機械化・分割
    retired: 2026-10-13
    by: ADR-0063
    instead: 帯域の不足に対する手段は、第4章「帯域を理由に判定を省略しない」の順による
  - phrase: 曖昧語の禁止リスト
    retired: 2026-10-13
    by: ADR-0062
    instead: 規範は類。検出語の正本は第4章 G-2「曖昧語(基準2)」の表
  - phrase: 語の一覧の正本は
    retired: 2026-10-13
    by: ADR-0062
    instead: 検出語の正本は第4章 G-2 の表。準拠テンプレートのスクリプトを正本と書かない
  - phrase: 起案した主体は、その成果物の判定者
    retired: 2026-10-13
    by: ADR-0060
    instead: 成果物を起案した実行主体の文脈は、その成果物の判定の草案を作らない(第3章 3.5.3)。人の単位では課さない
  - phrase: 書いていない前提はあるか
    retired: 2026-10-13
    by: "#300(N4)、ADR-0064"
    instead: 暗黙の前提は第4章 G-2 基準3 による。草案を受け取ったときの問いは附属書B の1問だけ
  - phrase: スコープ外に入れるべきものはあるか
    retired: 2026-10-13
    by: "#300(N4)、ADR-0064"
    instead: スコープ外の事項は第4章 G-2 基準4 による。草案を受け取ったときの問いは附属書B の1問だけ
  - phrase: 第三者による棚卸し
    retired: 2026-10-13
    by: ADR-0066
    instead: 案件に関与していない者による棚卸し(第7章 7.7.6)。「第三者」は、別の組織で案件に利害を持たない者に限って使う(第1章 1.4)
  - phrase: 開発ラインの外の組織による検証
    retired: 2026-10-13
    by: ADR-0066
    instead: 第三者レビューの定義は第1章 1.4 による(別の組織にあり、案件に利害を持たない者による検証)。同じ組織の別部門による検証は「組織上独立した検証」と呼ぶ
  - phrase: 各人の検出数は参考値
    retired: 2026-10-13
    by: ADR-0067
    instead: 人ごとの検出数・検出率は算出しない(第5章 5.6.2)。層の検出率は和集合で数える
  - phrase: 機能安全の枠組みが要求する独立性
    retired: 2026-10-13
    by: ADR-0067
    instead: 承認者2名の目的は、1名の承認者の確認だけでは変更を取り込めない状態と、その記録である(第4章 G-6)。機能安全の規格が確認者の人数を求めるとは主張しない
  - phrase: 検収に対応づけ
    retired: 2026-10-13
    by: ADR-0069
    instead: G-2・G-8 を契約上の確認行為に対応づけるかどうかと、対応づける先を、締結時に決めて記録する(第8章 軸D)。対応づける先を検収に固定しない
  - phrase: 検収対象を
    retired: 2026-10-13
    by: ADR-0069
    instead: 契約が成果物の適否を確認する行為を定める場合の、確認の基準(第8章 軸D)
  - phrase: 検収基準を
    retired: 2026-10-13
    by: ADR-0069
    instead: 同上
  - phrase: 検収は仕様適合の判定
    retired: 2026-10-13
    by: ADR-0069
    instead: 成果物の適否の確認は仕様適合の判定であり、知財潔白性は成果物の属性である(第8章 軸D)
  - phrase: 検収の外形
    retired: 2026-10-13
    by: ADR-0069
    instead: 契約上の確認行為の外形(第8章 軸D「発注側に読解の帯域がない場合」)
  - phrase: AI生成コードの瑕疵担保責任
    retired: 2026-10-13
    by: "#300(N12)、ADR-0069"
    instead: 契約不適合責任(第8章 軸D)。フェーズ1・2 の調査データが当時の記述として引く「瑕疵担保責任」は対象にしない
  - phrase: 判定を置いた側が結果責任
    retired: 2026-10-13
    by: "#300(D1)、ADR-0069"
    instead: 判定の置き先は、結果責任の配分を定めない。契約の類型ごとの責任の配分を、本標準は扱わない(第8章 軸D、第6章 テンプレ8)
  - phrase: G-3 の判定対象
    retired: 2026-10-23
    by: ADR-0071
    instead: G-3 の判定の対象は技術上の選択、判定の材料は判断記録、判定の証跡は判定記録(第1章 1.4、第4章 G-3)
  - phrase: G-7 の判定対象
    retired: 2026-10-23
    by: ADR-0071
    instead: 運用引き継ぎ文書は G-7 の判定の材料(基準4)。判定の対象は出荷(第1章 1.4、第6章の一覧)
  - phrase: (G-7)の判定対象
    retired: 2026-10-23
    by: ADR-0071
    instead: 運用引き継ぎ文書は G-7 の判定の材料(基準4)。判定の対象は出荷(第1章 1.4、第6章の一覧)
  - phrase: 設計案の非機能欄
    retired: 2026-10-23
    by: ADR-0071
    instead: 判断記録の「非機能への影響」欄(第4章 G-3 基準1、第6章 テンプレ2)
  - phrase: 「戻せない選択」欄
    retired: 2026-10-23
    by: ADR-0071
    instead: 判断記録の「可逆性」欄(第4章 G-3 基準3、第6章 テンプレ2)
  - phrase: AI起因の手戻り率
    retired: 2026-10-23
    by: ADR-0079
    instead: 第4章の量は「AI 生成行の短期書き換え率」(合否条件にしない)。運用メトリクスの「手戻り率」はタスクの単位の別の量
  - phrase: 短期の手戻り率
    retired: 2026-10-23
    by: ADR-0079
    instead: 「AI 生成行の短期書き換え率」(第4章「AI 品質指標の扱い」)を名指しで引く
  - phrase: 自己修復の反復上限
    retired: 2026-10-23
    by: ADR-0079
    instead: 自己修正の停止条件の初期値(連続失敗3回・無進捗2回。第3章 3.12.10)。登録簿の RC-05
  - phrase: 重複率および手戻り率
    retired: 2026-10-23
    by: ADR-0081
    instead: 変更の重複率を引き下げの検知条件に置かない。第2区分の検知条件は差し戻し率と手戻り率(第5章 5.4.6)
  - phrase: 重複率と手戻り率
    retired: 2026-10-23
    by: ADR-0081
    instead: 同上
  - phrase: 重複率、手戻り率
    retired: 2026-10-23
    by: ADR-0081
    instead: 同上
  - phrase: duplicationRate
    retired: 2026-10-23
    by: ADR-0081
    instead: 登録の根拠の basis.detection は rejectionRate と reworkRate の2つ。旧い構成の欄は読まずに警告する
  - phrase: 引き下げを検討する
    retired: 2026-10-23
    by: ADR-0081
    instead: 手戻り率の行の措置は「該当範囲を1段階引き下げる」(自動。第5章 5.4.6)

  - phrase: △(避けたい)
    retired: 2026-10-23
    by: ADR-0082
    instead: 第1章 1.7.3 の語(許容・非推奨・禁止)と括弧の限定で書く。ADR-0037 の「△」は ADR-0082 で「非推奨」と読み替える
  - phrase: 5名未満
    retired: 2026-10-23
    by: ADR-0082
    instead: 価値責任者 × 技術判断者の兼務は、許容(1〜2名)、非推奨(3〜9名)、禁止(10名以上)。5名の境界は置かない(第3章 3.5)
  - phrase: 小規模のみ許容
    retired: 2026-10-23
    by: ADR-0082
    instead: 事業決裁者 × 価値責任者の兼務は、許容(1〜2名)、非推奨(3名以上)。どの規模でも禁止しない(第3章 3.5)
  - phrase: 小規模のみ可
    retired: 2026-10-23
    by: ADR-0082
    instead: 同上
  - phrase: 兼務は避けたい
    retired: 2026-10-23
    by: ADR-0082
    instead: 非推奨(第1章 1.7.3)。兼務する場合は兼務の事実と理由を D-0 体制図へ記録する(第3章 3.5)

# --- 廃した言い回しを探す範囲 ---
  # 逸脱の語を閉じた列挙にした(#313 / ADR-0083 決定3)。要求の強さの表は 1.10.2 を引く
  - phrase: 逸脱を認めない
    retired: 2026-10-24
    by: ADR-0083
    instead: 第1章 1.7.1 の要求の行。満たさない要求事項が逸脱(1.10.2 の閉じた列挙)に限られる範囲は、逸脱を伴う適合の主張になる
  # 適用の開始の境は構成が設定済みになった最初のコミット(#313 / ADR-0083 決定5)
  - phrase: changeLog[] の1件目)より前
    retired: 2026-10-24
    by: ADR-0083
    instead: 適用の開始(構成が設定済み configured true になった最初のコミット。第1章 1.10.1)より前
  - phrase: 構成の初期化の記録より前
    retired: 2026-10-24
    by: ADR-0083
    instead: 同上
  # 列挙に無い離脱を「逸脱」と呼んだ句(#313 突合 X-5)
  - phrase: 1〜2名の体制の逸脱
    retired: 2026-10-24
    by: ADR-0083
    instead: 1〜2名の体制の列挙に無い離脱(第1章 1.10.2)
  - phrase: 1名以下を逸脱
    retired: 2026-10-24
    by: ADR-0083
    instead: 1名以下を列挙に無い離脱(第1章 1.10.2)
# 決定の記録(adr/)は、廃した言い回しを経緯として引くので探さない。自動生成の台帳も探さない。
# zenn/ は派生物の置き場であり、publishing-hub の査読の経路で改めるため、ここでは探さない。
retiredScan:
  roots:
    - src/content/docs
    - src/data
    - template
  extensions: [.md, .mdx, .yaml, .yml, .mjs, .json]
  exclude:
    - src/content/docs/adr
    - src/content/docs/community/evidence-ledger.md
    - src/content/docs/community/implementation-ledger.md
    - src/content/docs/community/scope-ledger.md
    - src/content/docs/community/provision-forms.md
    - src/data/provision-forms.yaml

# --- 手引きの頁(第1章 1.8。#316 / ADR-0086 R-1) ---
# フェーズ5・6 の頁は、全体として参考(手引き)である。要求・禁止の文末は、同じ行に本文の所在が無ければ検出する。
# 実装マークと、条項番号に似た独自の節番号も検出する。規定の文書がこれらの頁を「〜による/〜に規定」で引く箇所も検出する
guides:
  dirs:
    - phase5-implementation
    - phase6-operation

# --- 禁止事項の番号(#316 / ADR-0086 R-6) ---
# 番号の正本は第5章 5.8.5 と第8章「テーラリングの禁止事項」。引くときは一覧の所在で修飾する
prohibitionLists:
  qualifiers:
    - '5.8.5 の'
    - 'テーラリングの'
  roots:
    - src/content/docs
    - template
  extensions: [.md, .mdx, .json, .mjs]
  exclude:
    - src/content/docs/adr
    - src/content/docs/community/evidence-ledger.md
    - src/content/docs/community/implementation-ledger.md
    - src/content/docs/community/scope-ledger.md
    - template/scripts/vendor
    - template/evidence
