# 降りていない規定の順序の第3段の節の登録簿(Issue #314 / ADR-0084 決定4。突合 X-13)
#
# 降りていない規定(state=undelivered)は、台帳で次の順に並べる: 採用者が実装するにできない規定(impl-no-adopter.yaml)
# → G-7・G-8・R1 の決定に関わる規定(この登録簿) → その他。
# この節(と下位の節)に置いたマークを第3段(台帳では第2の並び)に置く。注記の語(G-7・G-8・R1)では判別しない。
# 注記の語による判別は、付随的な言及(例: 「R1 は10営業日前」)を拾い、決定に関わらない規定を前へ出すため採らない。
#
# key — 実装マークの棚卸しの鍵(src/data/impl-inventory.yaml と同じ書式)。下位の節(「 > 」で続く鍵)を含む
