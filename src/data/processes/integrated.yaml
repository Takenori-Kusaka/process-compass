schemaVersion: 0
name: 統合プロセス参照モデル(AI協調型)
category: proposal
summary: フェーズ1〜3の分析を踏まえて本プロジェクトが設計した提案プロセス。外側は日本の決裁文化と整合する事業ゲート、内側はAIと人が高速で回す協調ループの二層構造で、5つのギャップへの打ち手を構造に織り込んだ参照モデル
plainSummary: 外側は日本の決裁文化に合わせた節目のゲート、内側はAIと人が高速で回す実装ループ。技術の判断と事業の決裁を分け、決める人を1人にし、作った本人以外がレビューする——この4つの原則で「AIは速いが承認で詰まる」を防ぐ
purpose: 生成AIの生産性と日本企業の統制(品質保証・決裁・検収)を両立させ、企業の品質管理部門・プロセス部門へ提案・承認可能な形で AI 協調開発を運用できるようにする
outcomes:
  - AI生成の速度を殺さずに、すべての成果物に単一の人間の責任者が紐づいている
  - 技術判断と事業決裁が分離され、承認滞留が構造的に抑制されている
  - コア機能を人が理解し続ける状態が作業として維持されている(事業継続性)
  - 暗黙知がコンテキスト基盤に蓄積され、チケットごとの明文化負担が減っていく
origin: Process Compass フェーズ4(2026)。ウォーターフォールの工程ゲート、スクラムの反復、SDD の人間承認ゲート、AIDLC の AI 協調、GitHub 式独立レビュー、日本の出荷判定制度を意図的に組み合わせた設計
iso12207Groups:
  - 合意〜組織〜テクニカルマネジメント〜テクニカルを横断(統合モデルのため)。特に意思決定管理と品質保証の再設計が中心
roles:
  - id: value-owner
    name: 価値責任者(Value Owner)
    responsibility: What/Why の決定と価値の説明責任を単独で持つ。要件合意・仕様承認の判定者。委譲しても結果責任は残る
    jpNote: 「1つの成果物に責任者は1人」の原則(ギャップG2対応)。事前の根回し・非同期コメントは歓迎するが、判定は単独で行い合議体にしない
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: tech-lead
    name: 技術判断者(Tech Lead)
    responsibility: アーキテクチャ・技術選定・技術的トレードオフの判定を単独で持つ。技術設計ゲートの判定者
    jpNote: 職位ではなく技術力量で任命する(ギャップG3対応)。事業決裁者は技術判断に関与しない
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: dev-verifier
    name: 開発者(検証者)
    responsibility: AI生成物の検証、挙動の理解、実装の細部判断。コア機能では設計レベルまで読み解き判断記録を残す
    jpNote: 役割の重心が「書き手」から「検証者・理解の維持者」へ移る。検証は承認の儀式でなく理解を保つための読み込み
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: ai-agent
    name: AIエージェント
    responsibility: 仕様の起案支援、実装、テスト生成、ドキュメント生成、負債候補の検出。提案はするが承認しない
    jpNote: 生成物の責任はAIでなく、承認した人間(価値責任者・技術判断者・独立レビュア)が負う
    href: /process-compass/phase4-process-design/human-ai-boundary/
  - id: independent-reviewer
    name: 独立レビュア
    responsibility: 作成を指示した本人とは別の人間として PR をレビューし、仕様との一致と理解可能性を確認する
    jpNote: 「作成指示者は自分の成果を承認できない」をブランチ保護で強制(GitHub式)。日本の第三者レビュー文化と整合し、QA部門が担ってもよい
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: qa-gatekeeper
    name: 品質保証(出荷判定者)
    responsibility: 第三者として出荷判定を行い署名する。プロセス実行記録と品質エビデンスの確認が任務(再テストではない)
    jpNote: 既存のQA部門・出荷判定制度をそのまま活かす。判定を「記録の確認」に限定して滞留を防ぐ
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: biz-approver
    name: 事業決裁者
    responsibility: 予算・スコープ・リリース可否という事業判断のみを行う。技術判断には関与しない
    jpNote: 既存の決裁権限規程どおりの職位でよい(制度を変えない)。関与を事業判断に限定することで専門性の乖離(G3)を無害化する
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: context-owner
    name: コンテキストオーナー
    responsibility: 恒久層コンテキスト(規約・用語・判断基準・判断記録)の保守と正しさに責任を持つ
    jpNote: コンテキスト基盤の要件R5。オーナー不在だと文脈が陳腐化しAIの品質が劣化する
    href: /process-compass/phase4-process-design/roles-responsibilities/
workProducts:
  - id: d0-governance-chart
    name: 意思決定・エスカレーション体制図(D-0)
    description: 決定の権限・権限境界(トレランス)・平常時と障害時のエスカレーション経路を1文書で確定させる。案件で最初に作る成果物であり、企画承認ゲートの前提条件
    producedBy: value-owner
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: intent-brief
    name: 企画書(事業意図)
    description: 目的・価値仮説・概算予算・リスク。企画承認ゲートの入力
    producedBy: value-owner
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: context-base
    name: コンテキスト基盤(恒久層・案件層)
    description: 規約・設計標準・ドメイン用語・判断基準。AIと新規参加者への共通文脈。継続的に更新される
    producedBy: context-owner
    href: /process-compass/phase5-implementation/context-base/
  - id: spec
    name: 機能仕様書(検証可能な受入基準付き)
    description: "AI が起案し人が確定する。受入基準は検証可能な形式(例: EARS 記法)で書き、曖昧語を残さない"
    producedBy: ai-agent
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: plan
    name: 実装計画(タスク分解)
    description: AI がタスク分解・依存関係・並列可否を生成し、人が承認する
    producedBy: ai-agent
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: increment
    name: 検証済みインクリメント(コード+テスト)
    description: AI が生成し、CI と人の検証・独立レビューを通過したもの
    producedBy: ai-agent
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: decision-log
    name: 判断記録(ADR)
    description: 設計判断・技術選定・リスク受容の理由。コア機能では必須。コンテキスト基盤へ還流する
    producedBy: tech-lead
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: quality-report
    name: 品質レポート
    description: テスト消化率・欠陥状況・ゲート通過記録。出荷判定の入力。AIが生成しQAが確認する
    producedBy: qa-gatekeeper
    href: /process-compass/phase4-process-design/deliverable-templates/
  - id: debt-ledger
    name: 技術負債台帳
    description: 生成過程で検出・受容した負債の記録。返却計画とセットで管理し、運用フェーズで計画的に返す
    producedBy: dev-verifier
    href: /process-compass/phase4-process-design/deliverable-templates/
stages:
  - id: s-explore
    name: 探索
    label: S0
    alias: DR0
    goal: 事業仮説と技術的実現性を検証し、投資を継続する価値があるかを判断できる状態にする
    exitGate: sg-explore
    href: /process-compass/phase4-process-design/lifecycle/
  - id: s-validate
    name: 価値確立
    label: S1
    alias: DR1
    goal: 実利用者に価値が届くことを実証し、継続的に提供できる技術基盤を確立する
    exitGate: sg-validate
    href: /process-compass/phase4-process-design/lifecycle/
  - id: s-scale
    name: スケール
    label: S2
    alias: DR2
    goal: 対象利用者層の拡大に耐える品質・運用体制・再現性を確立する
    exitGate: sg-scale
    href: /process-compass/phase4-process-design/lifecycle/
gates:
  - id: sg-explore
    label: SG-0
    href: /process-compass/phase4-process-design/lifecycle/
    name: 探索完了(ステージ移行)
    kind: decision
    contractual: true
    deliverables: [検証結果報告, 事業仮説の更新, 技術的実現性の評価, 意思決定体制図(D-0)]
    criteria: [事業仮説が実証データで支持されている, 技術的実現性が確認されている, 次ステージの投資規模と体制が示されている]
    approver: ステアリングコミッティ(B-2)
    decisions: [S1へ移行 / 継続検証 / 中止]
    jpNote: 既存の投資決裁制度に載せる。判断は go / hold / kill の三択とし、判断しないまま継続する状態を作らない
  - id: sg-validate
    label: SG-1
    href: /process-compass/phase4-process-design/lifecycle/
    name: 価値確立完了(ステージ移行・部門間移管)
    kind: decision
    contractual: true
    deliverables: [利用実績と価値の実証データ, アーキテクチャ設計と判断記録, 恒久層コンテキスト, 移管記録]
    criteria: [実利用者における価値が実証されている, 拡大に耐えるアーキテクチャが確定している, 受入部門が要求を自らの言葉で再構成できている]
    approver: ステアリングコミッティ(B-2)および受入部門の責任者
    decisions: [S2へ移行 / 継続 / 中止]
    jpNote: 部門間移管を伴う場合、移管は文書の受け渡しでは完了しない。受入側の再構成完了をもって成立する
  - id: sg-scale
    label: SG-2
    href: /process-compass/phase4-process-design/lifecycle/
    name: スケール完了(定常運用へ移行)
    kind: decision
    deliverables: [運用実績, 運用体制と引き継ぎ文書, 技術負債台帳と返却計画]
    criteria: [対象利用者層に対する品質基準を満たしている, 運用体制が定常運用として成立している, 受容した負債の返却計画が承認されている]
    approver: 事業決裁者および運用責任者
    decisions: [定常運用へ移行 / 改善継続]
    jpNote: このゲートを設けない場合、プロジェクト体制のまま運用が続き、負債の返却主体が消える
  - id: g-plan-approval
    label: G-1
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 企画承認
    kind: decision
    contractual: true
    deliverables: [意思決定・エスカレーション体制図(D-0。承認済みであることが審議開始の前提条件), 企画書(事業意図), コンテキスト基盤の整備計画と予算]
    criteria: [投資対効果が事業基準を満たす, リスク受容が明示されている, コンテキスト基盤の初期整備コストが予算化されている, 指標の閾値と予算区分が合意され記録されている]
    approver: 事業決裁者(決裁権限規程どおりの職位)
    decisions: [承認 / 条件付き承認 / 見送り]
    jpNote: 既存の稟議・決裁制度をそのまま使う(ここは変えない)。頻度が低いゲートなので多段決裁の遅さを許容できる
  - id: g-req-agree
    label: G-2
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 要件合意
    kind: decision
    deliverables: [機能仕様書(受入基準付き), 更新済みコンテキスト基盤(案件層)]
    criteria: ["受入基準が検証可能な形式で記述されている(「適切に」「柔軟に」等の曖昧語ゼロ)", 暗黙の前提が案件層コンテキストに登録済み, スコープ外事項が明記されている]
    approver: 価値責任者(単独。目安48時間以内に判定)
    decisions: [合意 / 差し戻し]
    jpNote: 判定は単独(合議体にしない=G2対応)。関係者の意見は判定前の非同期コメントで集める(根回しの構造化)
  - id: g-tech-design
    label: G-3
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 技術設計判断
    kind: decision
    deliverables: [アーキテクチャ設計・技術選定案(AI生成+人レビュー済み), 判断記録(ADR)案]
    criteria: [非機能要件の充足見込みが示されている, 既存資産・コンテキスト基盤と整合している, 選択の可逆性が評価されている(戻せない選択は明示)]
    approver: 技術判断者(単独。目安48時間以内に判定)
    decisions: [承認 / 代替案の要求]
    jpNote: 事業決裁(予算)と完全に分離する(G3対応)。技術判断に決裁階層を通さない
  - id: g-spec-cycle
    label: G-4
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 機能仕様承認(反復内)
    kind: decision
    deliverables: [機能単位の仕様(AI起案), 実装計画(タスク分解)]
    criteria: [仕様に検証可能な受入基準が含まれる, タスク分解の粒度が検証可能(1タスク=1レビュー単位)]
    approver: 価値責任者(または明示的に委譲された機能責任者。委譲しても結果責任は価値責任者に残る)
    decisions: [承認して実装へ / 修正]
    jpNote: SDD 式の人間承認ゲート。ここを飛ばすと vibe coding 化する(統制強度の要)
  - id: g-ci
    label: G-5
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 自動検証(CI)
    kind: inspection
    deliverables: [コード+テスト一式]
    criteria: [全テストが GREEN, 静的解析・脆弱性スキャンで重大指摘 0 件, テストカバレッジが計画時に設定した基準値以上]
    approver: CI(機械判定)
    decisions: [通過 / 差し戻し(マージ不可)]
    jpNote: 合意済みルールはすべて機械化してここに載せる(人の目を通さない)。人間の検証帯域を判断業務に温存するための設計
  - id: g-indep-review
    label: G-6
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 独立レビュー
    kind: decision
    deliverables: [PR(コード・テスト・判断記録)]
    criteria: [仕様(受入基準)との一致, レビュアが挙動を自分の言葉で説明できる(理解可能性), コア機能の場合は設計意図の記録が完備]
    approver: 独立レビュア(作成指示者本人は承認不可。ブランチ保護で強制)
    decisions: [承認 / 差し戻し]
    jpNote: 日本の第三者レビュー文化をAI時代の統制として再利用する。レビューの目的は儀式でなく「人間側の理解の維持」(BCP)
  - id: g-ship
    label: G-7
    href: /process-compass/phase4-process-design/gate-criteria/
    name: 出荷判定
    kind: decision
    deliverables: [品質レポート, 技術負債台帳, 全ゲート通過記録]
    criteria: [計画したテストが消化されている, 未解決の欠陥が事業ステージ別のトリアージ基準を満たしている, 受容した負債がすべて台帳に記録済み, 運用引き継ぎ文書が完備]
    approver: 品質保証(第三者。署名する)
    decisions: [出荷可 / 出荷不可]
    jpNote: 既存の出荷判定制度を活かす。判定は「記録と基準の突合」に限定し、ここで再テスト・再レビューを始めない(滞留防止=G5対応)
  - id: g-release
    label: G-8
    href: /process-compass/phase4-process-design/gate-criteria/
    name: リリース決裁
    kind: decision
    contractual: true
    deliverables: [出荷判定結果, 事業影響評価]
    criteria: [事業リスクの受容判断(技術品質は g-ship で担保済みのため対象外)]
    approver: 事業決裁者
    decisions: [Go / Hold]
    jpNote: 技術判定の通過が前提なので、ここは純粋な事業判断のみ。目安48時間以内。技術品質を蒸し返さないことを規程に明記する
bodies:
  - id: b-it-investment
    label: B-1
    name: IT投資委員会
    layer: governance
    purpose: 案件を横断して投資枠を配分し、実施しない案件を決める
    decides: [案件の採否, 予算枠の配賦, 案件間の優先順位, 案件の中止]
    excludes: [個別案件の技術選択, 仕様の内容, 要員の日々の割当]
    approver: biz-approver
    gates: [g-plan-approval]
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: b-steerco
    label: B-2
    name: ステアリングコミッティ
    layer: governance
    purpose: 個別案件の進行を監視し、ステージ移行と逸脱への対処を決める
    decides: [ステージ移行の可否, 上程された逸脱の裁定, 案件内の予算・要員の再配分]
    excludes: [工程ゲートの判定, 技術設計の良否]
    approver: biz-approver
    gates: [sg-explore, sg-validate, sg-scale]
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: b-design-review
    label: B-3
    name: 設計審査会
    layer: implementation
    purpose: 単独の技術判断者では判定できない、部門をまたぐ設計の適合性を審査する
    decides: [複数部門の要求に影響する設計の採否, 外部インタフェースの確定, 安全・法規制に関わる設計の適合性]
    excludes: [実装の良否, テスト結果の合否]
    approver: tech-lead
    gates: [g-tech-design]
    href: /process-compass/phase4-process-design/roles-responsibilities/
  - id: b-release-board
    label: B-4
    name: リリース判定会
    layer: implementation
    purpose: 変更の区分規則を定め、会議体を通さずに出せる変更の範囲を維持する
    decides: [変更のリスク区分の判定規則, 標準変更カタログの登録と削除, 重大変更の実施可否, 重大事象後の是正確認]
    excludes: [標準変更の個別の可否, 通常変更の個別の可否]
    approver: qa-gatekeeper
    gates: [g-release]
    href: /process-compass/phase4-process-design/roles-responsibilities/
phases:
  - id: kickoff
    name: 企画・立ち上げ
    summary: 事業意図を言語化し、AIと人の共通文脈(コンテキスト基盤)を整備する。ここでの明文化投資が以降の全フェーズの速度を決める
    gatesAfter: [g-plan-approval]
    activities:
      - id: governance-setup
        name: 意思決定・エスカレーション体制の確定
        summary: 誰が何を決めるか、どこまで自分で決めてよいか、超えたらどこへ上げるかを企画書より先に確定させる
        roles: [value-owner, biz-approver, ai-agent]
        outputs: [d0-governance-chart]
        refs:
          - title: 成果物テンプレート(テンプレ0 意思決定・エスカレーション体制図)
            href: /process-compass/phase4-process-design/deliverable-templates/
          - title: 案件の立ち上げ手順
            href: /process-compass/phase4-process-design/lifecycle/
        tasks:
          - id: draft-d0
            name: 体制図(D-0)を起案する
            description: 決定の種類ごとの決定者・同意者・起案者・意見提出者・実行者を表に落とす。決定者の欄に2名以上を書かない。二重の指揮系統が実在する場合も、その事実を備考へ書いたうえで最終決定者を1名選ぶ。AI エージェントが組織図と既存の決裁権限規程から草案を生成できるが、決定者の指名は人が行う
          - id: set-tolerance
            name: 各層の権限境界(トレランス)を数値で確定する
            description: 日程・費用・AI実行予算・スコープ・品質・リスクの各領域について、チーム層・案件層・経営層が上位の承認なく動ける範囲を数値で書く。エスカレーション閾値および予算区分と同じ数値を用いる。数値の入っていない欄が残っていたら未完了
          - id: split-incident-path
            name: 平常時と障害時のエスカレーション経路を別表に分けて記述する
            description: 平常時は権限境界の超過を発火条件とし、通知先・応答期限・決裁権限を書く。障害時は重大度別に指揮者の指名方法と一次・二次・三次の対応を書く。障害時の指揮は職位ではなく事象の把握度で指名する。個人名は「役割と現任者の対応表」にのみ書き、他の表は役割名で記述する
          - id: approve-d0
            name: D-0 を承認し、承認記録を残す
            description: 投資の継続を決定する者が承認する。承認者・承認日時・承認の意味(何に合意したか)・次回レビュー期日を記録する。この承認が完了するまで企画承認(g-plan-approval)の審議を開始しない。承認記録は必須ステータスチェックで機械的に検査する
      - id: intent
        name: 事業意図の言語化
        summary: 価値仮説・目的・制約を、AIの支援を受けながら企画書に落とす
        roles: [value-owner, ai-agent]
        outputs: [intent-brief]
        refs:
          - title: 成果物テンプレート(テンプレ6 企画書)
            href: /process-compass/phase4-process-design/deliverable-templates/
          - title: ゲート判定チェックリスト(G-1 企画承認)
            href: /process-compass/phase4-process-design/gate-criteria/
        tasks:
          - id: draft-intent
            name: AI との対話で意図を構造化し企画書を起案する
            description: 事業背景・顧客課題・制約を AI に渡して壁打ちし、目的・価値仮説・概算予算・リスクの4項目で企画書を起案させる。価値仮説は「誰の・何が・どれだけ変わるか」の形まで具体化し、測れない表現を残さない。完了条件は、企画承認(g-plan-approval)の判定基準3項目に起案者自身が根拠つきで○を付けられること
          - id: risk-explicit
            name: リスクと受容方針を明示する
            description: 実現リスク・事業リスク・AI利用に伴うリスク(生成物の品質、機密情報の扱い、依存サービスの制約)を列挙し、1件ずつ「受容 / 低減 / 回避」の方針と判断者名を書く。受容するリスクは企画書に明記し、企画承認の判定で事業決裁者の合意を取り付ける。判断者名のないリスク項目が残っていたら未完了
      - id: context-setup
        name: コンテキスト基盤の初期整備
        summary: 恒久層(規約・用語・判断基準)を書き下ろす。従来「言わなくても分かる」で済ませてきた前提の棚卸し
        roles: [context-owner, dev-verifier]
        outputs: [context-base]
        refs:
          - title: コンテキスト基盤の実装
            href: /process-compass/phase5-implementation/context-base/
        tasks:
          - id: write-permanent
            name: コーディング規約・設計標準・ドメイン用語集を恒久層として整備する
            description: リポジトリの docs/context/ 配下(配置はフェーズ5「コンテキスト基盤の実装」のツリーに従う)に、コーディング規約・設計標準・ドメイン用語集・判断基準を Markdown で書き下ろす。棚卸しの出発点は「新人に口頭で説明していること」と「レビューで毎回指摘していること」。完了条件は、AI エージェントが恒久層だけを読んで用語と規約を間違えずに起案できること(実際に1本起案させて検証する)
          - id: assign-owner
            name: 各文脈ファイルに単一のオーナーを割り当てる
            description: CODEOWNERS に文脈ファイルごとのオーナーを1名ずつ設定する(フェーズ5「コンテキスト基盤の実装」の CODEOWNERS 実例に従う。共有・複数人は不可)。オーナーは記載内容の正しさと更新への責任者であり、以後の書き戻し PR のレビュアになる。オーナー未設定の文脈ファイルが残っていたら未完了
  - id: requirements
    name: 要件・仕様定義
    summary: AIの問いを人が検証する協働セッションで仕様を固め、受入基準を検証可能な形式にする。技術設計判断もここで行う(事業決裁とは分離)
    gatesAfter: [g-req-agree, g-tech-design]
    activities:
      - id: collab-spec
        name: 協働仕様化セッション
        summary: ドメインの知識を持つ人と開発者が同席し、AIが起案した仕様・問いをその場で検証する(Mob 式)
        roles: [value-owner, dev-verifier, ai-agent]
        inputs: [intent-brief, context-base]
        outputs: [spec]
        refs:
          - title: 成果物テンプレート(機能仕様書)
            href: /process-compass/phase4-process-design/deliverable-templates/
        tasks:
          - id: ai-draft-spec
            name: AI がコンテキスト基盤を参照して仕様を起案する
            description: セッション開始前に、AI へ企画書と恒久層・案件層コンテキストを読み込ませ、機能仕様書テンプレート(フェーズ4の成果物テンプレ1)の様式で初稿と「不明点・曖昧点の質問リスト」を出させておく。セッションはこの初稿と質問リストを画面共有して始める(白紙から議論しない)
          - id: resolve-ambiguity
            name: AI が明示した曖昧点を人がその場で解消する
            description: ドメイン知識を持つ人と開発者が同席し、AI の質問へその場で回答して仕様に即時反映する(Mob 式。持ち帰りは原則禁止)。その場で決められない事項は「未決」として残さず、スコープ外事項へ明記するか、判断者と期限を付けて仕様に記録する。目安は1セッション 60〜90 分・機能1〜3件
          - id: register-tacit
            name: 会話で出た暗黙の前提を案件層コンテキストへ登録する
            description: セッション中に「言わなくても分かる」で流れた前提(業務ルール・既存システムの制約・慣習)を、その場で案件層コンテキストのファイルへ追記する。完了条件は要件合意(g-req-agree)の判定基準「暗黙の前提が案件層に登録済み」を満たすこと。登録漏れはレビュー時に「なぜ AI がこれを知らないのか」という形で表面化する
      - id: formalize-criteria
        name: 受入基準の形式化
        summary: "受入基準を検証可能な形式(例: EARS 記法)で記述し、後工程の自動検証につなげる"
        roles: [dev-verifier, ai-agent]
        outputs: [spec]
        refs:
          - title: EARS 記法ガイド(受入基準の書き方)
            href: /process-compass/phase4-process-design/ears-guide/
          - title: ゲート判定チェックリスト(G-2 要件合意)
            href: /process-compass/phase4-process-design/gate-criteria/
        tasks:
          - id: ears
            name: 条件と期待動作の形式で受入基準を書き下す
            description: "各受入基準を「〜のとき(条件)、システムは〜すること(期待動作)」の形式(EARS 記法)へ書き直し、「適切に」「柔軟に」「なるべく」等の曖昧語をゼロにする。1基準につき正常系1本+境界・異常系を最低1本書く。完了条件は、各基準がそのままテストコードのテスト名になる粒度であること(変換できない基準は曖昧語が残っている)"
      - id: tech-design
        name: 技術設計
        summary: AI が設計案を生成し、技術判断者が判定する。判断理由は ADR に残す
        roles: [tech-lead, ai-agent]
        inputs: [spec, context-base]
        outputs: [decision-log]
        refs:
          - title: ADR の書き方と運用
            href: /process-compass/adr/
          - title: ゲート判定チェックリスト(G-3 技術設計判断)
            href: /process-compass/phase4-process-design/gate-criteria/
        tasks:
          - id: ai-design
            name: AI がアーキテクチャ・技術選定の代替案を生成する
            description: AI に仕様・非機能要件・恒久層コンテキスト(既存の設計標準)を渡し、代替案を2〜3案、トレードオフ比較表(性能・運用負荷・習熟コスト・可逆性)つきで生成させる。1案だけ出させると比較検討が形骸化するため、必ず複数案で出させて棄却理由も残す
          - id: judge-design
            name: 技術判断者がトレードオフを評価し ADR として記録する
            description: "技術判断者が比較表を評価し、採用案・棄却案とその理由を ADR(判断記録)として記録する。戻せない選択(データストア・外部サービス契約など)は「可逆性: 低」と明示し、代替への撤退条件も書く。目安48時間以内に単独で判定し、事業決裁の階層には回さない(技術設計判断ゲート g-tech-design の判定そのもの)"
  - id: construction
    name: 反復構築
    summary: 機能単位のAI協調サイクル(仕様承認 → AI実装 → 自動検証 → 独立レビュー)を数時間〜数日の粒度で反復する。3つのゲートはサイクルごとに機能単位で通過する
    gatesAfter: [g-spec-cycle, g-ci, g-indep-review]
    activities:
      - id: spec-cycle
        name: 機能仕様サイクル
        summary: 機能ごとに AI が仕様と実装計画を起案し、人が承認してから実装に入る(SDD 式)
        roles: [value-owner, ai-agent]
        inputs: [spec, context-base]
        outputs: [plan]
        refs:
          - title: ゲート判定チェックリスト(G-4 機能仕様承認)
            href: /process-compass/phase4-process-design/gate-criteria/
          - title: 成果物テンプレート
            href: /process-compass/phase4-process-design/deliverable-templates/
        tasks:
          - id: ai-propose
            name: AI が機能仕様と実装計画を起案する
            description: "機能単位で AI に仕様詳細と実装計画(タスク分解・依存関係・並列可否)を起案させる。タスクは「1タスク=1ブランチ=1PR=1レビュー単位」の粒度に分解させる(目安: 1タスクが数時間で完了し、レビュアが30分以内に読み切れる差分に収まること)。この粒度を超えるタスクは分割してから先へ進む"
          - id: human-approve
            name: 価値責任者(または委譲先)が承認する
            description: 価値責任者(または明示的に委譲された機能責任者)が、受入基準の検証可能性とタスク分解の粒度を確認して承認する。承認の記録は該当 Issue または PR のコメントとして残す(機能仕様承認 g-spec-cycle の通過記録)。修正指示は差分指摘の形で AI に戻し、再起案させる。ここを飛ばして実装に入ると vibe coding 化する
      - id: build-verify
        name: 実装と検証
        summary: AI が実装・テスト生成し、CI 通過後に開発者が挙動を検証して理解を記録する
        roles: [ai-agent, dev-verifier]
        inputs: [plan]
        outputs: [increment]
        refs:
          - title: Git 戦略リファレンス
            href: /process-compass/phase5-implementation/git-strategy/
          - title: PR 運用リファレンス
            href: /process-compass/phase5-implementation/pr-workflow/
          - title: CI/CD ゲート構成
            href: /process-compass/phase5-implementation/ci-gates/
          - title: AI 実行環境(自律度レベル)
            href: /process-compass/phase5-implementation/ai-environment/
        tasks:
          - id: ai-implement
            name: AI がコードとテストを生成する
            description: "承認済みの実装計画からタスクを1つ選び、feature/<機能ID>-task-<N> ブランチを切って AI に実装とテストを生成させる(ブランチ命名・保護はフェーズ5「Git 戦略」に従う)。コミットには Spec: / ADR: トレーラで仕様・判断記録への参照を付ける。タスク完了時点で PR を作成し(自律度 L1〜L2 では人が gh pr create を実行、L3 では AI が作成し人へ通知)、PR 本文に対応タスクと検証方法を書く"
          - id: ci-pass
            name: 自動検証(テスト・静的解析・脆弱性)を通過させる
            description: PR の必須ステータスチェック(テスト・静的解析・脆弱性スキャン。フェーズ5「CI ゲート」の gate-g5)がすべて GREEN になるまで修正を繰り返す。失敗は AI に修正させてよいが、基準値そのものの変更(カバレッジ引き下げ等)は CI 設定変更の PR として分離し、技術判断者の承認を必要とする。RED のままのマージはブランチ保護で物理的に不可
          - id: human-verify
            name: 開発者が挙動を実際に確認し、自分の言葉で説明できる状態にする
            description: 開発者が PR の挙動をローカルまたはプレビュー環境で実際に動かして確認し、「何をどう変えたか・なぜ動くか」を自分の言葉で PR 本文へ記録する(AI の説明の転記は不可)。説明できない差分が残っている場合は、理解できるまで AI に質問するか、差分を小さくやり直させる。この記録が独立レビューのインプットになる
      - id: independent-review
        name: 独立レビュー
        summary: 作成を指示した本人ではない人間がレビューする。人間側の理解を組織に分散させる工程でもある
        roles: [independent-reviewer]
        inputs: [increment]
        refs:
          - title: 独立レビュー実施ガイド(3パス方式・観点チェックリスト)
            href: /process-compass/phase4-process-design/review-guide/
          - title: PR 運用リファレンス
            href: /process-compass/phase5-implementation/pr-workflow/
          - title: ゲート判定チェックリスト(G-6 独立レビュー)
            href: /process-compass/phase4-process-design/gate-criteria/
        tasks:
          - id: review
            name: 仕様との一致と理解可能性を確認して承認する
            description: "作成指示者以外のレビュアが PR を確認する。順序は (1) 仕様の受入基準と差分の突合(基準にない変更が混ざっていないか)、(2) テストが受入基準を実際に検証しているかの確認、(3) 挙動の理解(自分の言葉で1〜3行の挙動要約を承認コメントに書く)。挙動要約を書けない場合は理解が足りていないので承認しない。作成指示者本人の承認はブランチ保護で不可"
      - id: core-understanding
        name: コア機能の理解維持
        summary: 企画時にコア指定した機能は、開発者が設計レベルまで読み解き、判断記録を残す(事業継続性の担保)
        roles: [dev-verifier, tech-lead]
        inputs: [increment]
        outputs: [decision-log]
        refs:
          - title: 内製/外注の再構成と事業継続性
            href: /process-compass/phase3-gap-analysis/insourcing-bcp/
        tasks:
          - id: deep-read
            name: コア機能の設計意図・障害時の挙動を読み解いて記録する
            description: 企画時にコア指定された機能について、開発者がデータフロー・依存関係・障害時の挙動を設計レベルまで読み解き、理解した内容と設計意図を判断記録(ADR)へ書く。マージ後スプリント内など、実装の記憶が新しいうちに実施する。完了条件は「この機能の障害に AI の支援なしで一次対応できる」と担当者が自認し、その根拠(障害シナリオと対応手順)が記録にあること
      - id: debt-recording
        name: 負債の記録
        summary: 生成過程で見つけた負債・受容した妥協を台帳に記録する(見なかったことにしない)
        roles: [dev-verifier, ai-agent]
        outputs: [debt-ledger]
        refs:
          - title: 成果物テンプレート(負債台帳)
            href: /process-compass/phase4-process-design/deliverable-templates/
        tasks:
          - id: record-debt
            name: 負債の内容・影響・返却目安を台帳へ記録する
            description: 実装・レビュー中に見つけた妥協(テスト不足・重複コード・仮実装・回避策)を、負債台帳テンプレート(フェーズ4の成果物テンプレート3)へ「内容・影響範囲・返却目安」の3点で記録する。受容の判断者(技術判断者または価値責任者)の名前をセットで残す。判断者名のない負債は「見なかったことにした負債」であり記録として無効
  - id: ship
    name: リリース準備
    summary: 統合検証と品質エビデンスの整備。出荷判定(第三者)とリリース決裁(事業)を分離して通過する
    gatesAfter: [g-ship, g-release]
    activities:
      - id: integration-verify
        name: 統合検証
        summary: 非機能要件・運用シナリオの検証。AI がテストを生成し人が結果を判定する
        roles: [dev-verifier, qa-gatekeeper, ai-agent]
        inputs: [increment]
        outputs: [quality-report]
        refs:
          - title: 統合検証(非機能テスト)リファレンス
            href: /process-compass/phase5-implementation/nonfunctional-verify/
          - title: ゲート判定チェックリスト(G-7 出荷判定)
            href: /process-compass/phase4-process-design/gate-criteria/
        tasks:
          - id: nonfunctional
            name: 性能・セキュリティ・運用シナリオのテストを実施する
            description: 技術設計時に定めた非機能要件(応答時間・同時接続・脆弱性・バックアップと復旧・監視の疎通)ごとに AI へテストを生成させ、実施結果を人が判定して品質レポートへ記録する。基準未達は欠陥として記録し、修正するか、受容する場合は判断者名つきで負債台帳へ移す。判定記録のない非機能要件が残っていたら出荷判定に進めない
      - id: evidence-prep
        name: 品質エビデンスの整備
        summary: 出荷判定に必要な記録(テスト消化・欠陥・負債・ゲート通過)を AI が集約し QA が確認する
        roles: [qa-gatekeeper, ai-agent]
        inputs: [quality-report, debt-ledger]
        outputs: [quality-report]
        refs:
          - title: CI/CD ゲート構成(エビデンス集約)
            href: /process-compass/phase5-implementation/ci-gates/
        tasks:
          - id: aggregate
            name: 全ゲートの通過記録と品質指標を集約する
            description: 出荷判定(g-ship)の判定基準4項目(テスト消化率 100%・重大欠陥 0 件・負債の台帳記録・引き継ぎ文書)に対応する記録を、CI の成果物・PR の承認記録・負債台帳から品質レポートへ集約する(集約は AI・CI に実行させ、人手で転記しない。フェーズ5「CI ゲート」のエビデンス集約を使う)。QA は集約結果と基準の突合だけを行い、ここで再テストや再レビューを始めない
  - id: operate
    name: 運用・改善
    summary: 運用しながら負債を計画的に返し、学びをコンテキスト基盤へ書き戻す。プロセス自体も検査と適応の対象
    activities:
      - id: operate-monitor
        name: 監視・インシデント対応
        summary: AI 支援での監視と一次対応。コア機能の障害は理解を維持した人間が対応する
        roles: [dev-verifier, ai-agent]
        refs:
          - title: インシデント対応とポストモーテム
            href: /process-compass/phase6-operation/incident-response/
          - title: 運用作業カタログ
            href: /process-compass/phase6-operation/operations-catalog/
        tasks:
          - id: incident
            name: インシデントの検知・一次分析(AI)と対処判断(人)
            description: 監視アラートを AI が一次分析(影響範囲・原因候補・過去の類似事例)し、対処の判断と実行は人が行う。コア機能の障害は理解を維持した担当者(deep-read の記録者)が対応する。復旧後は「発生・影響・対処・再発防止」の4点でインシデント記録を残し、学びは恒久層コンテキストへの書き戻し対象にする。記録のないインシデントは再発時にゼロから調査になる
      - id: debt-payback
        name: 負債返却サイクル
        summary: 台帳の負債を定常の作業として計画的に返す(生成が速い分、返却も計画に組み込む)
        roles: [dev-verifier, value-owner]
        inputs: [debt-ledger]
        refs:
          - title: 負債返却サイクル
            href: /process-compass/phase6-operation/debt-payback/
        tasks:
          - id: payback
            name: 負債台帳から優先度順に返却し記録を更新する
            description: 負債台帳を「影響の大きさ×放置コスト(利子)」で優先度づけし、開発容量の約20%を返却枠として毎スプリント・毎月の計画に組み込む(詳細はフェーズ6「負債返却サイクル」)。返却したら台帳の状態を更新し、返却時に得た学び(なぜこの負債が生まれたか)は恒久層コンテキストへ書き戻す。返却枠がゼロの期が2回続いたら価値責任者へエスカレーションする
      - id: context-writeback
        name: コンテキスト基盤への書き戻し
        summary: 運用で得た判断・学びを恒久層へ還流し、次の案件の明文化負担を減らす
        roles: [context-owner, ai-agent]
        outputs: [context-base]
        refs:
          - title: コンテキスト基盤の実装(書き戻しワークフロー)
            href: /process-compass/phase5-implementation/context-base/
        tasks:
          - id: writeback
            name: 判断記録・障害の学びを恒久層コンテキストへ反映する
            description: 運用・障害対応・レビューで繰り返し説明した内容を、恒久層コンテキストへの追記 PR として起票する(AI に下書きさせてよい)。ファイルのオーナーがレビューして取り込む(フェーズ5「コンテキスト基盤の実装」の書き戻しワークフロー)。完了条件は、同じ質問・同じ説明が AI への追加指示なしで解決するようになること。月1回、書き戻し PR がゼロなら形骸化のサイン
      - id: process-retro
        name: プロセスの振り返り
        summary: ゲートの滞留時間・差し戻し率などを計測し、プロセス自体を適応させる
        roles: [value-owner, tech-lead, qa-gatekeeper]
        refs:
          - title: 運用メトリクス
            href: /process-compass/phase6-operation/metrics/
          - title: プロセス改善サイクル
            href: /process-compass/phase6-operation/improvement-cycle/
        tasks:
          - id: measure-adapt
            name: ゲート滞留・差し戻し率を確認し運用ルールを調整する
            description: ゲートごとの滞留時間(判定依頼から判定までの時間)と差し戻し率を月次で確認し(指標と警戒サインはフェーズ6「運用メトリクス」)、警戒サインを超えたゲートは運用ルールを調整する(承認の委譲・基準値の見直し・レビュー体制の変更など)。プロセスの変更は ADR として記録し、次回の振り返りで効果を検証する。「測っているが何も変えていない」状態が3か月続いたら振り返り自体を見直す
assumptions:
  - 価値責任者・技術判断者に、名目でなく実際の決定権が委譲されている(組織がその決定を尊重する)
  - CI 基盤(自動テスト・静的解析・脆弱性スキャン)が整備されている(g-ci の前提)
  - 独立レビューを成立させる最小体制がある(作成指示者・独立レビュア・出荷判定者の3者分離。目安3名以上)
  - コンテキスト基盤の初期整備コストが企画時に予算化されている(明文化はただではない)
antiPatterns:
  - name: ゲートの合議化
    ideal: 各ゲートは単独の判定者が期限内に判定し、関係者の意見は判定前の非同期コメントで集める
    reality: 判定が会議体になり、全員の合意を待って滞留する
    why: 責任分散文化の慣性。単独判定への心理的抵抗
    harm: ギャップG5(承認滞留)の再発。AIの速度が意味を失う
  - name: 独立レビューの形骸化
    ideal: レビュアが挙動を自分の言葉で説明できる状態まで読み込む
    reality: 差分を眺めて即承認する(rubber stamp)
    why: レビュー量が増え、儀式として処理される
    harm: 人間側の理解が失われ、事業継続性(BCP)が崩れる
  - name: コア指定のインフレ / ゼロ化
    ideal: 事業上致命的な機能だけをコア指定し、理解維持コストを集中させる
    reality: 全部コア指定して理解維持が破綻するか、全部非コアにして BCP が崩壊する
    why: 線引きの判断を避け、一律にする方が楽だから
    harm: 理解維持が形骸化するか、障害時に誰も直せなくなる
  - name: コンテキスト基盤の放置
    ideal: オーナーが保守し、運用の学びが書き戻され続ける
    reality: 初期整備だけで放置され、実態と乖離した文脈をAIが参照し続ける
    why: オーナー不在(責任の割り当てを設計しなかった)
    harm: AI生成物の品質が静かに劣化し、原因が特定しにくい
jpRealities:
  - 既存制度を壊さない設計を意図している。稟議・決裁権限規程(企画承認・リリース決裁)と出荷判定制度(QA署名)はそのまま活かし、その間に AI 協調ループを挟む
  - 変えるのは2点のみ。(1)技術判断を決裁階層から分離して単独判定者に委ねる、(2)ゲート判定を合議でなく「単独判定+事前の非同期コメント」にする。この2点が既存文化との最大の交渉点になる
  - 独立レビュー・出荷判定という日本の第三者検証文化は、AI時代にはむしろ統制上の資産になる(生成AIは人が承認し責任を持つ構造を要求するため)
