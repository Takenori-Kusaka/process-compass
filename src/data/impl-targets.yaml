# 実行層の登録簿(#222)
#
# 標準の規定は、案件の実行層へ降りて初めて実行主体へ届く。ここは「降ろし先」の
# 一覧であり、実装マーク(<!-- impl ... -->)の target はこの id を指す。
# 書式と運用は community/implementation-marking.md による。
#
# kind:
#   config-key    — 準拠テンプレートが生成する process.config.json のキー。
#                   検査はサンプル回答から構成を生成し、キーの存在を確かめる
#   template-file — 準拠テンプレートに置くファイル。検査は存在を確かめる
schemaVersion: 0
targets:
  - id: config-gates
    name: process.config.json の gates
    kind: config-key
    keyPath: gates
    check: verify-gate-contract
    description: 有効なゲートと判定者。案件の CI と PROCESS-PROFILE.md はここを正本とする

  - id: config-roles
    name: process.config.json の roles[]
    kind: config-key
    keyPath: roles
    check: check-process-rules
    description: ロールごとの判定ゲート・担ってはならない工程・兼務の禁止(ADR-0035)

  - id: config-unmet
    name: process.config.json の unmet[]
    kind: config-key
    keyPath: unmet
    check: verify-gate-contract
    description: 目的を達成する構成を示せていないゲート(ADR-0028)

  - id: config-deviations
    name: process.config.json の deviations[]
    kind: config-key
    keyPath: deviations
    check: verify-gate-contract
    description: 実施するが標準の要求する属性を欠くゲート(ADR-0029)

  - id: config-seats
    name: process.config.json の seats[]
    kind: config-key
    keyPath: seats
    check: verify-gate-contract
    description: 席ごとの責任者・担い手の識別・運用形態(上限の宣言)・適合性確認・AI が使えないときの扱い(ADR-0054)

  - id: config-delegation
    name: process.config.json の delegation
    kind: config-key
    keyPath: delegation
    check: verify-gate-contract
    description: 委任を適用できる案件かどうかと、委任の範囲を定める機械の規則(ADR-0054 決定4)

  - id: config-change-log
    name: process.config.json の changeLog[]
    kind: config-key
    keyPath: changeLog
    check: verify-gate-contract
    description: 体制の変化点の記録。統制を緩める向きの変更は、決定した者の記名と理由を要する(ADR-0055)

  - id: claude-md
    name: CLAUDE.md の構成依存部分
    kind: template-file
    path: CLAUDE.md
    check: check-process-rules
    description: エージェントが起動時に読む文書。構成から導出した権限・禁止工程・受信箱

  - id: next-role
    name: 次の一手のスクリプト(ロールの詳細)
    kind: template-file
    path: scripts/gate/next.mjs
    description: 構成から導出するロールの詳細(判定するゲート・判定してはならないゲート・受信箱と引き渡しのラベル・エスカレーションの段階とラベル)。CLAUDE.md へ常駐させず、next.mjs --role で必要な時点に出す(#286)。構成から毎回導出するため、構成と乖離しない

  - id: gate-record-template
    name: 成果物テンプレート テンプレ4(ゲート判定記録)
    kind: template-file
    path: templates/04-gate-record.md
    check: aggregate-evidence
    description: 判定の成立要件となる記録の様式。判定の語彙と例外承認の扱い(ADR-0036)

  - id: debt-ledger-template
    name: 成果物テンプレート テンプレ3(技術負債台帳)
    kind: template-file
    path: templates/03-debt-ledger.md
    check: aggregate-evidence
    description: 受容した負債と未解決事項の置き場。7.3 由来と 7.3.2 由来を区分欄で分ける

  - id: gate-record-skill
    name: ゲート判定記録のスキル
    kind: template-file
    path: .claude/skills/gate-record/SKILL.md
    check: aggregate-evidence
    description: /gate の旧名(互換の入口)。中身は /gate への案内だけ(#286)。判定記録の手順は gate-skill

  - id: gate-skill
    name: ゲート判定記録の入口のスキル(/gate)
    kind: template-file
    path: .claude/skills/gate/SKILL.md
    check: aggregate-evidence
    description: 実行主体が判定記録を作る入口。判定の範囲(当該ゲートの判定基準と全ゲート共通の通過条件だけ)と、判定を人が行う境界。ゲートごとの補助ファイル(gates/)を1枚だけ読ませる(#286)

  - id: gate-skill-g6
    name: ゲート判定記録のスキルの G-6 の補助ファイル
    kind: template-file
    path: .claude/skills/gate/gates/G-6.md
    check: aggregate-evidence
    description: G-6 の判定記録の書き方。G-6 を事後へ移した委任の変更を通過として記録しないこと、開発者の席だけの委任の変更の事前の承認、独立した人の確認の条件(#286)

  - id: pr-checks
    name: G-5 の PR 単位の検査(pr-rules)
    kind: template-file
    path: scripts/gate/check-pr.mjs
    description: トレーラ Spec、変更規模の上限(基底ブランチの構成と台帳の例外承認)、閾値・除外設定と製品のコードの同時変更、既存のテストの変更の一覧(G-6 の材料)を、PR ごとに検査する(#286)。gate-g5.yml の pr-rules ジョブが呼び、test-check-pr.mjs がフィクスチャで試験する

  - id: process-change-skill
    name: 体制の変化点を反映するスキル
    kind: template-file
    path: .claude/skills/process-change/SKILL.md
    check: verify-gate-contract
    description: 変化点の種別を入力に取り、構成の差分・失効と発生の一覧・残作業を出力する手順(ADR-0055 決定8)

  - id: evidence-aggregation
    name: 出荷判定の証跡の集約(保証の開示)
    kind: template-file
    path: scripts/gate/aggregate-evidence.mjs
    check: aggregate-evidence
    description: G-7 の突合対象と、保証の開示の7項目を、構成と既存の記録から導出する(ADR-0056 決定6)

  - id: d0-template
    name: 成果物テンプレート D-0(体制図)
    kind: template-file
    path: templates/00-d0-governance.md
    check: check-d0
    description: 案件の体制・兼務・エスカレーションの経路を案件ごとに定める成果物

  - id: project-brief-template
    name: 成果物テンプレート テンプレ6(企画書)
    kind: template-file
    path: templates/06-project-brief.md
    description: G-1 の判定対象。品質の約束と保証範囲(層2)と、AI の利用の評価の3行を持つ欄の置き場(ADR-0057)

  - id: templates-index
    name: 成果物テンプレートの一覧
    kind: template-file
    path: templates/README.md
    description: 様式の一覧。新しい様式(テンプレ11 品質保証の方針と受容の基準など)は、ここへ載せてから templates/ に置く(ADR-0057)

  - id: qa-policy-template
    name: 成果物テンプレート テンプレ11(品質保証の方針と受容の基準)
    kind: template-file
    path: templates/11-quality-assurance-policy.md
    description: 層1 の様式。適用範囲の組織単位・記名者の権限・必須行・確認の周期と後継の欄の置き場(ADR-0057、#288 第2巡)

  - id: handover-template
    name: 成果物テンプレート テンプレ5(運用引き継ぎ文書)
    kind: template-file
    path: templates/05-handover.md
    description: コア機能の理解保持者と、本人以外の確認者・確認日の欄の置き場(第3章 3.4.3、#288 第2巡)

  - id: adoption-trial
    name: 導入前の検証のコマンド
    kind: template-file
    path: scripts/gate/adoption-trial.mjs
    description: 附属書I I.11 の導入前の検証を、採用者のリポジトリで準備・実行・集計し、様式の記録を出す1コマンド(init / seal / tally / run)。合否の基準の記入が実行の前であることを確かめてから実行する。next.mjs が記録の無い間に案内する(#288 第2巡)
