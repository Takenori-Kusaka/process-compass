# 実行層の登録簿(#222)
#
# 標準の規定は、案件の実行層へ降りて初めて実行主体へ届く。ここは「降ろし先」の
# 一覧であり、実装マーク(<!-- impl ... -->)の target はこの id を指す。
# 書式と運用は community/implementation-marking.md による。
#
# kind:
#   config-key    — 準拠テンプレートが生成する process.config.json のキー。
#                   検査はサンプル回答から構成を生成し、キーの存在を確かめる
#   template-file — 準拠テンプレートに置くファイル。検査は存在を確かめる
#   planned       — 準拠テンプレートにまだ無い実装の置き場(予定)。state=undelivered の
#                   マークだけが使える。state=delivered のマークで使うと検査が失敗する。
#                   path は予定の置き場であり、検査は実在を確かめない(Issue #292 / ADR-0076)。
#                   無関係の既存のファイルを、予定の降ろし先として書かない
#
# checker: 降ろし先を検査する準拠テンプレートのスクリプト(template/scripts/gate/<checker>.mjs)。実在を確かめる。
#          マークの属性 check(検査の手段 machine / presence / manual)とは別の事実である(#314 / ADR-0084 で check から改名)
#
# 逆向きの追跡(#314 / ADR-0084 決定6): 準拠テンプレートのゲートのスクリプト(scripts/gate・scripts/init)、フック(.claude/hooks)、
# ワークフロー(.github/workflows)の各ファイルは、この登録簿の path か checker に現れるか、src/data/impl-untraced.yaml に
# 理由(library / infra)つきで載っていなければならない。どちらにも無いファイルを scripts/check-impl.mjs が落とす
schemaVersion: 0
targets:
  - id: config-gates
    name: process.config.json の gates
    kind: config-key
    keyPath: gates
    checker: verify-gate-contract
    description: 有効なゲートと判定者。案件の CI と PROCESS-PROFILE.md はここを正本とする

  - id: config-roles
    name: process.config.json の roles[]
    kind: config-key
    keyPath: roles
    checker: check-process-rules
    description: ロールごとの判定ゲート・担ってはならない工程・兼務の禁止(ADR-0035)

  - id: config-unmet
    name: process.config.json の unmet[]
    kind: config-key
    keyPath: unmet
    checker: verify-gate-contract
    description: 目的を達成する構成を示せていないゲート(ADR-0028)

  - id: config-deviations
    name: process.config.json の deviations[]
    kind: config-key
    keyPath: deviations
    checker: verify-gate-contract
    description: 実施するが標準の要求する属性を欠くゲート(ADR-0029)

  - id: config-seats
    name: process.config.json の seats[]
    kind: config-key
    keyPath: seats
    checker: verify-gate-contract
    description: 席ごとの責任者・担い手の識別・運用形態(上限の宣言)・適合性確認・AI が使えないときの扱い(ADR-0054)

  - id: config-delegation
    name: process.config.json の delegation
    kind: config-key
    keyPath: delegation
    checker: verify-gate-contract
    description: 委任を適用できる案件かどうかと、委任の範囲を定める機械の規則(ADR-0054 決定4)

  - id: config-change-log
    name: process.config.json の changeLog[]
    kind: config-key
    keyPath: changeLog
    checker: verify-gate-contract
    description: 体制の変化点の記録。統制を緩める向きの変更は、決定した者の記名と理由を要する(ADR-0055)

  - id: config-standard
    name: process.config.json の standard
    kind: config-key
    keyPath: standard
    checker: verify-gate-contract
    description: 案件が従う本標準の版(第N版、または作業中の版を表す null)。切り替えは /process-change の edition の種別を経る(ADR-0083 決定1)

  - id: claude-md
    name: CLAUDE.md の構成依存部分
    kind: template-file
    path: CLAUDE.md
    checker: check-process-rules
    description: エージェントが起動時に読む文書。構成から導出した権限・禁止工程・受信箱

  - id: process-profile
    name: PROCESS-PROFILE.md(構成から生成するプロセスの要約)
    kind: template-file
    path: PROCESS-PROFILE.md
    description: 構成から生成する、人とエージェントが読む案件のプロセスの要約。ロールごとの判定ゲート・兼務の禁止・文脈の単位の規定の文を出す

  - id: next-role
    name: 次の一手のスクリプト(ロールの詳細)
    kind: template-file
    path: scripts/gate/next.mjs
    description: 構成から導出するロールの詳細(判定するゲート・判定してはならないゲート・受信箱と引き渡しのラベル・エスカレーションの段階とラベル)。CLAUDE.md へ常駐させず、next.mjs --role で必要な時点に出す(#286)。構成から毎回導出するため、構成と乖離しない

  - id: next-intake
    name: 次の一手のスクリプト(着手の前の判定記録の確認)
    kind: template-file
    path: scripts/gate/next.mjs
    description: 受信箱から拾った作業単位に、ラベルへの遷移の前提の判定記録が最新の判定としてあるかを確かめる(next.mjs --pickup <ラベル> <対象> [--from <前のラベル>])。無ければ「着手しない」と差し戻す先を出す。受け手のスキル(/pit・/implement・handoff.md)・next.mjs --role と CLAUDE.md の行が着手の前に実行させる(#368)

  - id: gate-record-template
    name: 成果物テンプレート テンプレ4(ゲート判定記録)
    kind: template-file
    path: templates/04-gate-record.md
    checker: aggregate-evidence
    description: 判定の成立要件となる記録の様式。判定の語彙と例外承認の扱い(ADR-0036)

  - id: debt-ledger-template
    name: 成果物テンプレート テンプレ3(技術負債台帳)
    kind: template-file
    path: templates/03-debt-ledger.md
    checker: aggregate-evidence
    description: 受容した負債と未解決事項の置き場。7.3 由来と 7.3.2 由来を区分欄で分ける

  - id: gate-record-skill
    name: ゲート判定記録のスキル
    kind: template-file
    path: .claude/skills/gate-record/SKILL.md
    checker: aggregate-evidence
    description: /gate の旧名(互換の入口)。中身は /gate への案内だけ(#286)。判定記録の手順は gate-skill

  - id: gate-skill
    name: ゲート判定記録の入口のスキル(/gate)
    kind: template-file
    path: .claude/skills/gate/SKILL.md
    checker: aggregate-evidence
    description: 実行主体が判定記録を作る入口。判定の範囲(当該ゲートの判定基準と全ゲート共通の通過条件だけ)と、判定を人が行う境界。ゲートごとの補助ファイル(gates/)を1枚だけ読ませる(#286)

  - id: gate-skill-g6
    name: ゲート判定記録のスキルの G-6 の補助ファイル
    kind: template-file
    path: .claude/skills/gate/gates/G-6.md
    checker: aggregate-evidence
    description: G-6 の判定記録の書き方。G-6 を事後へ移した委任の変更を通過として記録しないこと、開発者の席だけの委任の変更の事前の承認、独立した人の確認の条件(#286)

  - id: pr-checks
    name: G-5 の PR 単位の検査(pr-rules)
    kind: template-file
    path: scripts/gate/check-pr.mjs
    description: トレーラ Spec、変更規模の基準値(既定ブランチの構成。差分は PR の基底から取り、基準値・名簿・規則・台帳・停止の申し立ての解除は --policy-base の既定ブランチから読む。Issue #294。超過は規模の確認と区分の下限 R2 で扱い、既存の台帳の例外承認の行は有効)、閾値・除外設定と製品のコードの同時変更、既存のテストの変更の一覧(G-6 の材料)を、PR ごとに検査する(#286)。gate-g5.yml の pr-rules ジョブが呼び、test-check-pr.mjs がフィクスチャで試験する

  - id: spec-lint
    name: 受入基準の曖昧語の検査(spec-lint)
    kind: template-file
    path: scripts/gate/spec-lint.mjs
    description: G-5 基準4。第4章 G-2 の検出語の表(知識ベース ambiguousTerms)の語を、機能仕様の受入基準の節から検出する。gate-g5.yml の spec-lint ジョブが呼び、test-init-g5.mjs が試験する

  - id: process-change-skill
    name: 体制の変化点を反映するスキル
    kind: template-file
    path: .claude/skills/process-change/SKILL.md
    checker: verify-gate-contract
    description: 変化点の種別を入力に取り、構成の差分・失効と発生の一覧・残作業を出力する手順(ADR-0055 決定8)

  - id: evidence-aggregation
    name: 出荷判定の証跡の集約(保証の開示)
    kind: template-file
    path: scripts/gate/aggregate-evidence.mjs
    checker: aggregate-evidence
    description: G-7 の突合対象と、保証の開示の7項目を、構成と既存の記録から導出する(ADR-0056 決定6)。5.4.7 の記録なし・頻度超過の表示(IMPL-1022。予定)

  - id: exception-expiry
    name: 例外承認の回収の期限と範囲の件数の算出
    kind: template-file
    path: scripts/gate/exception-expiry.mjs
    checker: aggregate-evidence
    description: 状態が有効のまま回収の期限を過ぎた行と失効の行を、突合の日(引数)との比較で効力を失った行として数える。承認し直した元の行を除く。範囲の第7章の例外承認の件数(範囲・未回収・期限超過)を算出し、次の一手の注記を作る(#353 / ADR-0134)。集約と next.mjs が呼び、test-exception-expiry.mjs が試験する

  - id: d0-template
    name: 成果物テンプレート D-0(体制図)
    kind: template-file
    path: templates/00-d0-governance.md
    checker: check-d0
    description: 案件の体制・兼務・エスカレーションの経路を案件ごとに定める成果物。5.4.7 の AI を用いない実施の記録の表(IMPL-1023。予定)

  - id: project-brief-template
    name: 成果物テンプレート テンプレ6(企画書)
    kind: template-file
    path: templates/06-project-brief.md
    description: G-1 の判定対象。品質の約束と保証範囲(層2)と、AI の利用の評価の3行を持つ欄の置き場(ADR-0057)

  - id: templates-index
    name: 成果物テンプレートの一覧
    kind: template-file
    path: templates/README.md
    description: 様式の一覧。新しい様式(テンプレ11 品質保証の方針と受容の基準など)は、ここへ載せてから templates/ に置く(ADR-0057)

  - id: qa-policy-template
    name: 成果物テンプレート テンプレ11(品質保証の方針と受容の基準)
    kind: template-file
    path: templates/11-quality-assurance-policy.md
    description: 層1 の様式。適用範囲の組織単位・記名者の権限・必須行・確認の周期と後継の欄の置き場(ADR-0057、#288 第2巡)。5.4.7 の頻度の行(IMPL-1020。予定)

  - id: handover-template
    name: 成果物テンプレート テンプレ5(運用引き継ぎ文書)
    kind: template-file
    path: templates/05-handover.md
    description: コア機能の理解保持者と、本人以外の確認者・確認日の欄の置き場(第3章 3.4.3、#288 第2巡)

  - id: handover-guide
    name: 運用引き継ぎ文書(テンプレ5)の手引き
    kind: template-file
    path: .claude/skills/artifact/artifacts/05-handover.md
    description: テンプレ5 の手引き。理解保持者の数え方に加え、コンテキスト移管(標準 第2章 2.9)の H-1〜H-3 の記録の書き方を置く。H-1 の必須欄と予告期間別の H-2 の期限と範囲、H-3 の4課題と評価者の条件。専用の様式は作らず、記録の置き場は採用者が決める。機械の検査は無い(Issue #448。束 B16 U5)

  - id: ai-sla-template
    name: 成果物テンプレート テンプレ8(AI-SLA 合意確認書)
    kind: template-file
    path: templates/08-ai-sla.md
    description: 委託契約へ添付する確認書の様式。判定の置き先、判定の結果を受け取る者、G-2・G-8 と契約上の確認行為の対応づけ、保証の開示と委任の適用の欄の置き場(第8章 軸D、ADR-0069)。欄の存在は必須欄の検査(test:fields)が確かめる。記入の中身を検査する仕組みは無い

  - id: claude-md-resident
    name: CLAUDE.md の常駐の規則(構成依存部分の外)
    kind: template-file
    path: scripts/gate/claude-md-resident.json
    checker: check-process-rules
    description: 準拠テンプレートの CLAUDE.md が常駐させる規則の一覧(節と、規則ごとの識別子・核の文言)。check-process-rules が、案件の CLAUDE.md に各節の見出しと本文があり、規則ごとの核の文言が同じ節の行に含まれることを、正規化して照合する(#314 / ADR-0084 決定2)。案件が行の前後へ書き足すこと・並べ替えることは妨げない。一覧の作り直しは追加だけで、規則を除くのは強制層の縮小(state:needs-platform)。既存のリポジトリへ持ち込んだときに、常駐の規則を欠いたまま検査が通る経路を塞ぐ(#306、ADR-0068)

  - id: adoption-trial
    name: 導入前の検証のコマンド
    kind: template-file
    path: scripts/gate/adoption-trial.mjs
    description: 附属書I I.11 の導入前の検証を、採用者のリポジトリで準備・実行・集計し、様式の記録を出す1コマンド(init / seal / tally / run)。合否の基準の記入が実行の前であることを確かめてから実行する。next.mjs が記録の無い間に案内する(#288 第2巡)

  - id: rulesets-readme
    name: ブランチ保護のルールセットの説明
    kind: template-file
    path: .github/rulesets/README.md
    description: 既定ブランチと記録の置き場に掛ける強制層の構成(team / regulated / safety / checks-only)と、その説明。GitHub のルールセットはパス単位の免除を持たない(#321)ため、判定記録だけの PR(出荷の PR)にも承認 1 件が残る。その承認は転記の確認であり、判定の材料とする記録は承認の要件を外して入れない(#380 / ADR-0106)。id は、ルールセットの定義(rulesets。team.json)と重ねて定義されていたため分けた(#360。実装マークの照合は従前から後の定義の team.json を使っていた)
  - id: adoption-preflight
    name: 初期化の事前点検
    kind: template-file
    path: scripts/gate/preflight.mjs
    description: 既存のリポジトリで適用を始めるときの事前点検(第1章 1.10.1「既存のリポジトリで適用を始める場合」。#315 / ADR-0085)。何も書き込まずに、止める項目(CLAUDE.md の目印と常駐の規則、CODEOWNERS の置き場の重なりと @OWNER、フックの登録、既定ブランチへの push の契機の形(旧版の gate-g5.yml・gate-g5-push.yml の欠け。既定ブランチの名では止めない。#362)、共通の祖先の無い履歴の併合、資産の一覧の欠け)と、告げる項目(既存の統制の資産)を分けて出す。初期化(generate-profile.mjs)が同じ点検を行い、止める項目があれば構成を書かない。--draft で資産の一覧の下書きを出す(扱いと記名の欄は空ける)。test-adoption.mjs と test-init-g5.mjs が試験する

  - id: agent-settings
    name: エージェントの権限設定
    kind: template-file
    path: .claude/settings.json
    description: エージェントの読み込みと書き込みの権限。保管領域(context/_archive/)の読み込みを deny に置く(第3章 3.11.4 要求事項7)。構成の生成(generate-profile.mjs)が、ステージに依らずこの行を残す。test-init-g5.mjs が生成後の deny を確かめる

  - id: decisions-check
    name: 判断記録の状態と参照の検査
    kind: template-file
    path: scripts/gate/check-decisions.mjs
    description: 判断記録(context/decisions/ と context/_archive/decisions/)の状態の行と「置き換える決定」の欄を読み、置き換えの両側の参照の一致と、状態に応じた置き場を検査する。期限つきの実験の判断記録のうち、期限を過ぎて結果が状態に反映されていないものを一覧に出す(--overdue)。gate-g5.yml の contract ジョブが呼び、test-decisions.mjs が試験する(ADR-0071・ADR-0072)

  - id: adr-template
    name: 成果物テンプレート テンプレ2(判断記録)
    kind: template-file
    path: templates/02-adr.md
    description: 判断記録の様式。状態の語彙(採用 / 一部置き換え / 置き換え / 廃止)、置き換える決定の欄、可逆性の欄、期限つきの実験の期限の欄の置き場(第6章 テンプレ2、ADR-0071)

  - id: principles-template
    name: 成果物テンプレート テンプレ12(プロダクトの原則)
    kind: template-file
    path: templates/12-product-principles.md
    description: プロダクトの原則の様式。名前・文・理由・含意(反する選択の例)の4欄、記名、改廃の判断記録の欄の置き場(第6章 テンプレ12、ADR-0071)。置くことは義務ではない

  - id: defect-ledger-template
    name: 欠陥の台帳の様式
    kind: template-file
    path: templates/defect-ledger.md
    description: 出荷判定(G-7)基準2 の既知の欠陥の台帳。欠陥注入の見逃しと統制の弱化の検知を起点とする是正の記録(第4章 G-5)の様式は、節「是正の記録」にある。起点の記録と行の対応は機械が確かめない(IMPL-0497。#356 / ADR-0139)

  - id: bug-issue-template
    name: 不具合の報告の Issue の様式
    kind: template-file
    path: .github/ISSUE_TEMPLATE/bug.yml
    description: 不具合の報告の入口。欠陥の件数の算出元ではない(算出元は欠陥の台帳。ADR-0102)

  - id: incident-artifact
    name: 障害時に使う記録の補助ファイル
    kind: template-file
    path: .claude/skills/artifact/artifacts/incident.md
    description: 障害時の手順とポストモーテムの書き方。Sev1・Sev2 のポストモーテムが是正の起動(第4章 G-5)の記録を兼ね、4項目を書く

  - id: pr-template
    name: PR の本文の様式
    kind: template-file
    path: .github/PULL_REQUEST_TEMPLATE.md
    description: PR の本文の節(変更の概要・作成を指示した者・リスク区分・規模の確認・統制の設定の陰性の確認・トレーラ)。G-5 の PR 単位の検査(check-pr.mjs)が節を読む

  - id: gate-contract
    name: 契約検査と、G-5 の集約が合否に使う検査の読み方
    kind: template-file
    path: scripts/gate/g5-aggregate.mjs
    checker: verify-gate-contract
    description: G-5 の集約ジョブ(gate-g5)の needs に、判定基準を実装するジョブ(基準1〜5・7)と PR 単位の検査・契約検査のジョブがあり、集約がその結果を合否に使っているかを、ワークフローの定義から読む。契約検査(verify-gate-contract.mjs)が不備を失敗にし、出荷判定の証跡の集約が保証の開示 項目4 の「実施」をここから導く。test-g5-aggregate.mjs と test-init-g5.mjs が試験する(第4章 G-5「判定基準を実装する検査と集約」、ADR-0074)

  - id: stack-coverage
    name: 製品のすべてのスタックと宣言の突き合わせ
    kind: template-file
    path: scripts/gate/stack-coverage.mjs
    checker: verify-gate-contract
    description: 製品のコードのスタック(目印のファイルと拡張子の集計)を、宣言(アダプタのスタック × projectDir、adapters/none.json の stacks)と除外の一覧(.github/stack-exclusions.json)に突き合わせ、外れたスタックがあれば契約検査を失敗させる。除外の行のパス・区分・理由・人の記名を確かめる。test-stack-coverage.mjs が試験する(第4章 G-5「製品のすべてのスタック」、ADR-0121。Issue #363)

  - id: profile-generator
    name: プロセス構成の初期化(強制層の生成)
    kind: template-file
    path: scripts/init/generate-profile.mjs
    description: 回答から process.config.json・.claude/guard.json・.claude/settings.json を生成する。フックの保護と権限設定の遮断を、事業ステージに依らず有効にする(第8章 軸B、ADR-0050 決定1、ADR-0074)。外すのは構成の guard の上書き(期限と理由。契約検査が期限を確かめる)だけ。test-init-g5.mjs が S0 と S1 で確かめる

  - id: task-breakdown-skill
    name: 実装計画へ分解するスキル(/task-breakdown)
    kind: template-file
    path: .claude/skills/task-breakdown/SKILL.md
    description: 機能仕様を実装計画へ分解する手順。各受入基準をいずれかのタスクの「対応する受入基準」に書き、spec-lint --gate G-4 が出す、どのタスクにも現れない受入基準の一覧を確かめてから G-4 へ渡す(第4章 G-4 基準6、ADR-0075)

  - id: feature-spec-template
    name: 成果物テンプレート テンプレ1(機能仕様書)
    kind: template-file
    path: templates/01-feature-spec.md
    description: 機能仕様の様式。受入基準の識別子(機能の中で一意)、前提の表(前提 / 案件層の ID / 崩れたときの影響。前提の欄に書いたものは確かめていないものとして読む)、未確定事項の3つの閉じ方の置き場(第4章 G-2 基準3・6、G-4 基準6・7、ADR-0075)。欄の存在は必須欄の検査(test:fields)が確かめる

  - id: ai-review-workflow
    name: AI レビューのワークフロー(差し込み口)
    kind: template-file
    path: .github/workflows/ai-review.yml
    checker: ai-review-record
    description: AI レビューを差し込む口と、検出の層としての位置づけを PR へ明記するワークフロー。差し込み口の前に、ワークフローが列挙できる入力(指示ファイル・差分・SHA・自動読込の候補)をパスと sha256 で要約と成果物へ書き出し、差し込み口の後に、道具の側の入力の契約のファイルと構造化された指摘の欠落を表示する固定の手順を置く(scripts/gate/ai-review-record.mjs。合否に使わない。#360)。差し込む AI のレビューの実装は採用者が置く。指摘の中身(所在と根拠、実行の結果の記録の所在)の注記を差し込み口に置くまでで、出力は確かめない(附属書H H.4、ADR-0075)。pull_request_target で動き、AI レビューの指示(.github/ai-review/)を既定ブランチの版から読む。AI レビューのジョブは read だけで、PR へ書くジョブを分ける。test-base-judge-workflow.mjs が定義を静的に確かめる(Issue #369)

  - id: implement-skill
    name: 実装のスキル(/implement)
    kind: template-file
    path: .claude/skills/implement/SKILL.md
    description: 実装計画のタスクを実装する手順。テストを、受入基準だけを渡した別の文脈(サブエージェントか別のセッション)で実装より先に生成させ、テスト生成に実装コードを渡さない(第5章 5.8.4、Issue #292)。R1 の変更では人が受入基準を事前に定義し、生成されたテストの十分性を判定する。文脈を分けたことを確かめる機械は無い

  - id: guard-write-hook
    name: 書き込みの遮断のフック
    kind: template-file
    path: .claude/hooks/guard-write.mjs
    description: 強制層(設定・フック・ワークフロー・ルールセット・ゲートのスクリプト)への書き込みと、自己修正のロック中のテストへの書き込みを遮断し、拒否した操作を .claude/denied.log へ残す(第5章 5.8.5 禁止事項3)。Claude Code の Edit・Write だけを遮断する。試験は無い

  - id: guard-bash-hook
    name: ホスティングへの書き込みの操作の遮断のフック
    kind: template-file
    path: .claude/hooks/guard-bash.mjs
    description: AI の担い手が Bash で行う、ホスティングの上の承認・レビュー・マージ・書き込みの形の gh api・GraphQL の mutation・curl による書き込み・認証情報の読み出しを拒否し、.claude/denied.log へ残す(第3章 3.5.3「人と AI の担い手の名義」の要求事項4。#429)。抑止の層であり、名義の分離ではない

  - id: context-drift-workflow
    name: 恒久層コンテキストの陳腐化の記録のワークフロー
    kind: template-file
    path: .github/workflows/context-drift.yml
    description: 恒久層コンテキストと指示ファイルの最終更新からの経過日数を週次で記録し、Issue へ残す。PR の必須チェックにしない(第3章 3.11.4「乖離の検知でビルドを落としてはなりません」)

  - id: pre-review-automation
    name: 事前レビュー期間の検査と集計(予定)
    kind: planned
    path: scripts/pre-review/
    description: フェーズ5「事前レビュー期間の自動化」の判定資料の起票・締切の通知と未応答の記録・必須ステータスチェック(pre-review-closed・pre-review-all-responded)・意見の様式の欄の検査・指標の集計の置き場。準拠テンプレートに実装は無い(2026-10-23 確認。Issue #292)

  - id: attention-estimator
    name: 推定による注意の喚起の部品(採用者)
    kind: planned
    path: (採用者が置く)
    description: 指示・発話・作業の状態を分類して注意を出す部品(第5章 5.8.7)。準拠テンプレートは同梱しない(ADR-0103)。採用者が置く場合に、5.8.7 の要求事項1〜9 が掛かる

  - id: model-quality-monitor
    name: モデルの品質の監視(採用者の AI 実行基盤)
    kind: planned
    path: (採用者の AI 実行基盤)
    description: 第3章 3.12.4 の品質の監視と基準値。準拠テンプレートは AI 実行基盤と品質の監視を持たない(ADR-0104)

  - id: vendor-estimate-records
    name: 受注側の見積りの版の記録の置き場(予定・採用者)
    kind: planned
    path: docs/vendor-estimates/
    description: 第8章 軸D の受注側の行。顧客へ示した見積りを版ごとに残し書き換えない記録の置き場。受注側の社内の記録であり、準拠テンプレートに置き場は無い(2026-11-04 確認。Issue #414)

  - id: budget-escalation
    name: 予算の自動的な上程の置き場(予定・採用者)
    kind: planned
    path: scripts/budget/escalation.mjs
    description: 第7章 7.7.4 の自動的な上程。7.7.2 の指標を期ごとに測り、記録した閾値の超過を検知した時点で B-2 または B-1 への判定要求を起票する仕組みの置き場。予算の消化はリポジトリの外の記録に依るため、採用者が実装する(ADR-0096)。準拠テンプレートに実装は無い(2026-11-04 確認。Issue #419)

  - id: seeded-error-isolation
    name: 欠陥注入の隔離(第1層・第2層)の置き場(予定)
    kind: planned
    path: .github/rulesets/drill.json
    description: 演習用ブランチ(drill/)にマージ先を持たせない規則と、注入の標識(Seeded-Error トレーラ)を持つコミットを本番ブランチが拒否する規則の置き場。準拠テンプレートに実装は無い(Issue #292)

  - id: seeded-error-scan
    name: 欠陥注入の標識の走査(第3層)のスクリプト
    kind: template-file
    path: scripts/gate/seeded-error-scan.mjs
    description: 出荷の範囲(直前のタグから当該タグまで)の全コミットの本文に標識(Seeded-Error トレーラの行)があれば失敗させ、走査の記録 evidence/seeded-error-scan.json を作る。ship-evidence のタグの実行と verify ジョブが、集約の前に毎回無条件で走らせる。台帳の照合は、採用者がリポジトリの外の台帳を --ledger で渡したときだけ(任意の入力)。手で写した変更は対象外(#356 / ADR-0139)

  - id: seeded-error-drill
    name: 継続の欠陥注入の演習の置き場(予定)
    kind: planned
    path: scripts/drill/
    description: 運用中の継続の欠陥注入(事前周知の記録・頻度・停止の条件・注入に気づいたときの報告・見逃した類型の反映の経路・個人識別子を含めない台帳)の置き場。準拠テンプレートにあるのは附属書I I.11 の導入前の検証の 1 回の測定(adoption-trial)だけである(Issue #292)

  - id: agent-run-record
    name: 変更単位の生成の条件の記録(予定)
    kind: planned
    path: scripts/gate/agent-run-record.mjs
    description: フェーズ5「エージェントの操作の統制」の生成の条件(実行の識別子・指示資産の版)を、変更単位で自動で記録する仕組みの置き場。準拠テンプレートに実装は無い。モデルの識別はトレーラ Co-Authored-By による(Issue #292)

  - id: g5-local
    name: G-5 の手元の検査(g5-local)
    kind: template-file
    path: scripts/gate/g5-local.mjs
    description: G-5 の検査を、CI(gate-g5.yml)と同じ範囲で手元で実行する。結果を証跡の置き場へ書かず、結果が G-5 の判定の証跡にならないことと、マージを止めるのは CI の必須チェック gate-g5 であることを出力する(第4章 G-5「判定基準を実装する検査と集約」。Issue #293)

  - id: g5-adapter
    name: G-5 のアダプタの実行(adapter.mjs)
    kind: template-file
    path: scripts/gate/adapter.mjs
    description: gate-g5.yml の test・coverage・static-analysis・ip-clearance・secret-scan のジョブが、スタックごとのアダプタ(adapters/<stack>.json)のコマンドを実行する入口。構成・アダプタが無ければ失敗し、必須の検査のコマンドが空なら失敗する(Issue #293)

  - id: delegation-workflow
    name: 委任した変更のマージの経路(delegation.yml)
    kind: template-file
    path: .github/workflows/delegation.yml
    description: 委任の範囲への該当を基底ブランチの定義で判定し、組織が有効化した場合に限ってマージする。マージのトークンは、配備のブランチを既定ブランチに限った Environment delegated-merge の秘密情報から読む(ジョブの environment)。test-check-delegation.mjs がワークフローの定義を確かめる(フェーズ5「CI/CD ゲート構成」。Issue #293)

  - id: deploy-workflow
    name: 案件のデプロイのワークフローの置き場(予定)
    kind: planned
    path: .github/workflows/deploy.yml
    description: リリース決裁(G-8)の後の配備のワークフローの置き場。配備の資格情報を、配備を許す参照(既定ブランチ、またはリリースのタグ)に結び付けた形(参照に限った配備の環境の秘密情報、または参照・配備の環境を確かめる受け手が発行・受理する短命の資格情報)で得て、配備先は結び付かない資格情報(ジョブのトークンなど)からの書き込みを拒む。GITHUB_TOKEN の権限の宣言だけで配備先へ書き込む構成と、配備先の限定を欠く構成は未達。準拠テンプレートに実装は無い(意図した省略。2026-10-27 確認。Issue #346 / ADR-0090)

  - id: gate-g5-workflow
    name: G-5 のワークフロー(gate-g5.yml)
    kind: template-file
    path: .github/workflows/gate-g5.yml
    description: PR を契機に、契約検査を含む G-5 の検査を実行するワークフロー。既定ブランチへの push では gate-g5-push.yml から workflow_call で呼ばれる。必須ステータスチェックの名前は gate-g5(Issue #293・#362)

  - id: gate-g5-push-workflow
    name: 既定ブランチへの push の G-5 のワークフロー(gate-g5-push.yml)
    kind: template-file
    path: .github/workflows/gate-g5-push.yml
    checker: verify-gate-contract
    description: すべてのブランチへの push を契機とし、ジョブ default-push の条件(github.ref が既定ブランチ)で既定ブランチに限って gate-g5.yml を呼ぶ。既定ブランチの名に依らない。名も ID も gate-g5 のジョブを持たない(既定ブランチでないブランチへの push の skipped のジョブが、必須チェック gate-g5 を満たさないため)。形は push-trigger.mjs が確かめる(第3章 3.13.5、ADR-0123。Issue #362)

  - id: push-trigger
    name: 既定ブランチへの push の契機の形の検査
    kind: template-file
    path: scripts/gate/push-trigger.mjs
    checker: verify-gate-contract
    description: gate-g5.yml が push を契機に持たず workflow_call を持つこと、gate-g5-push.yml の契機・ジョブ・条件・呼び先、どのワークフローにも集約のほかに ID か名が gate-g5 のジョブが無いことを、ワークフローの定義から読む。契約検査(verify-gate-contract.mjs)と事前点検(preflight.mjs の止める項目 push-trigger)が使う。test-push-trigger.mjs と test-adoption.mjs が試験する(ADR-0123。Issue #362)

  - id: gate-g5-base-workflow
    name: G-5 の基底から読む判定のワークフロー(gate-g5-base.yml)
    kind: template-file
    path: .github/workflows/gate-g5-base.yml
    description: PR 単位の検査(check-pr.mjs)を、既定ブランチの定義・スクリプト・構成で行うワークフロー(pull_request_target。PR のコードを checkout せず、PR の先頭を fetch して差分と本文をデータとして読む)。統制の設定を変える PR に、AI維持管理者が本人のアカウントで出す承認のレビューを、名簿の数値の識別子で照らして求める。結果はジョブの結果(check run)の gate-g5-base で、ルールセットの必須チェックが指す。test-base-judge-workflow.mjs が定義を静的に確かめる(Issue #371 / ADR-0115)

  - id: rulesets
    name: ルールセット(ブランチ保護)の定義
    kind: template-file
    path: .github/rulesets/team.json
    description: 既定ブランチ(~DEFAULT_BRANCH)へのマージに掛ける必須チェック・承認・最後の push の承認。既定ブランチ以外を基底とする PR のマージは対象の外(Issue #294)

  - id: record-copy-workflow
    name: 承認レビューの写しのワークフロー(record-copy.yml)
    kind: template-file
    path: .github/workflows/record-copy.yml
    description: PR のマージを契機に、承認レビューの写しを記録用ブランチ records の records/reviews/ へ追記するワークフロー。写しの取り出しの時期と置き場を運ぶのはこのファイルだけである。ジョブのトークン(権限 contents の write)で書くため、同じ権限を持つ者とトークンは、記録用ブランチの写しと様式を新しいコミットで追記・変更できる。置き場は書き換えを防がず、出荷の集約が履歴の走査で検出する(IMPL-0353・IMPL-0432。#379 / ADR-0109)。既にある写しと不変の欄が食い違えば、衝突を記録して失敗する(IMPL-0437)(#321 との統合の突合 F-6・未解決4)。書き込みの権限を持つため、pull_request_target の closed で既定ブランチの定義で動き、既定ブランチを checkout する(IMPL-0459。#371 / ADR-0115)。写しには、マージの時点の head の gate-g5 の check run の結論(checks.gate_g5)も足す。読み取りだけの権限 checks を持ち、ホスティングと照合できない値で、G-5 の充足には数えない(IMPL-0244。#333 / ADR-0135)

  - id: ship-evidence-workflow
    name: 出荷の証跡のワークフロー(ship-evidence.yml)
    kind: template-file
    path: .github/workflows/ship-evidence.yml
    description: 出荷の範囲の証跡を集約して残すワークフロー。証跡の一式と digest の一覧(manifest.json)を、出荷の PR で基底ブランチの docs/evidence/<日付>-<範囲>/ へ写す。成果物 ship-evidence は、保持の日数を明示せずリポジトリの設定に従う一時置きで、保管ではない。写しは保管期間の充足を示さない(IMPL-0243。Issue #333 / ADR-0135)。2026-10-23 時点で通しでは確かめていない

  - id: coverage-check
    name: G-5 基準3 のカバレッジの判定(coverage-check.mjs)
    kind: template-file
    path: scripts/gate/coverage-check.mjs
    description: アダプタの集計ファイルから割合を読み、構成の coverageThreshold と比べる。測る範囲(構成 ci.coverageScope。変更で加えた・変えたコード / 全体)を読み、結果に範囲・分母・測っていない製品のファイルの数を書く。変更の範囲は行単位の被覆(coverageDetail)を持つアダプタ(node)だけが測れる(Issue #294・#296)

  - id: self-heal
    name: 自己修正ループの停止(self-heal.mjs)
    kind: template-file
    path: scripts/gate/self-heal.mjs
    description: 自己修正のロックの開始・反復・保留・解除。iterate が自らテストを実行し、失敗したテストの識別を記録し、連続失敗(反復の上限)と無進捗(同じ失敗の集合の連続)で保留にする。記録は docs/self-heal-log.tsv。解除は名簿の人の名義に限る。単一タスクの累積消費は測らない(Issue #296)

  - id: size-observation
    name: 規模の観測の集計(size-observation.mjs)
    kind: template-file
    path: scripts/gate/size-observation.mjs
    description: 出荷の範囲の PR の規模の分布・超過の理由の内訳・別集計の倍率の分布を、同じ入力から同じ出力で出す。出荷の証跡の集約が呼ぶ(Issue #296)

  - id: g1-check
    name: G-1 の企画書の様式の検査(check-g1.mjs)
    kind: template-file
    path: scripts/gate/check-g1.mjs
    description: 企画書(docs/project-brief.md)の必須の欄の有無を確かめる。G-5 基準3 のカバレッジの測る範囲の行を含む(Issue #296)

  - id: autonomy-derivation
    name: AI自律レベルの導出と停止(登録した変更種別)
    kind: template-file
    path: scripts/gate/autonomy.mjs
