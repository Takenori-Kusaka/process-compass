# 実装マークの対象の棚卸しの登録簿(Issue #292 / ADR-0076)
#
# 対象のページ(本文8章・規定の附属書)の節ごとの区分。フェーズ5・6 は参考(手引き)であり対象にしない(第1章 1.8。#316)。書式と手続は community/implementation-marking.md「対象の棚卸し」による。
# key    — 頁 + 「#」+ 見出しの経路(上位から「 > 」で連ねる。見出しの適用範囲の注記「(適用: …)」は外す)。見出しより前の本文は「(冒頭)」
# status — marked(節の、実行主体の挙動を制約する規定のすべてに、ids のマークがあると登録者が判断した)
#          kb(工程ゲートの判定基準の表。知識ベースへ降りる。ADR-0048)
#          none(対象にしない。category と reason が必須)
#          pending(未棚卸し。凍結した基準線 impl-inventory-baseline.yaml にある節だけ。棚卸し済みの節を pending へ戻さない)
# ids    — marked の節の中にあるマークの識別子(1件以上。節の外のマークは挙げない。突合 X-11)
# location — 節の外のマークで追う規定があるときの、その所在の節の鍵(marked・行の marked では任意、elsewhere では必須)
#          節の中にマークが無く、他の節のマークで追う節は none / elsewhere で登録する
# rows   — 番号つきの表(1列目の見出しが「#」で、行が番号の表)の行ごとの区分(marked の節で必須)。marked(ids)か none(category・reason)
# category — none の理由の区分: explanation(説明)/ org-design(制度設計)/ elsewhere(所在は他節。location が必須)/ not-imposed(課さない)
# note   — 登録者の判断の補足(検査は読まない)
