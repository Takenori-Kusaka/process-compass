# 軸D: 開発形態による調整規則
# 出典: /phase4-process-design/tailoring-guide/ の軸Dの表
schemaVersion: 0
name: 軸D 開発形態
rules:
  - id: r-d-outsourcer
    when:
      q-dev-form: [outsourcer]
    adjustments:
      - target: { type: role, id: value-owner }
        action: set
        param: location
        value: client-side
        note: 価値責任者は発注側に置く(必須。提案書の最大の交渉点)
      - target: { type: role, id: value-owner }
        action: note
        note: 契約で固定した範囲(受入基準の識別子)を締結時に記録し、それに触れる調整は層によらず契約変更の起点として B-2 へ送る。受注側の提案を見積り値の根拠にした場合は出所を企画書に書き、契約額を見積りの幅の上側として扱わない(標準 第8章 軸D、ADR-0100)
      - target: { type: gate, id: g-req-agree }
        action: set
        param: contractual
        value: true
        note: 要件合意(G-2)を契約上の確認行為に対応づけるかどうかと、対応づける先を、締結時に決めて記録する(テンプレ8 第9項)
      - target: { type: gate, id: g-release }
        action: set
        param: contractual
        value: true
        note: リリース決裁(G-8)を契約上の確認行為に対応づけるかどうかと、対応づける先を、締結時に決めて記録する(テンプレ8 第9項)
      - target: { type: practice, id: acceptance }
        action: note
        note: 契約が成果物の適否を確認する行為を定める場合、確認の基準を受入基準への適合に限定し、生成手段(人・AIの別)を問わないと契約に明記する
      - target: { type: practice, id: core-understanding }
        action: note
        note: 発注側にも理解保持者を置く(丸投げにしない)
    reason: 発注側が価値の責任を持たない外注は、AI時代には「誰も中身を理解していないシステム」を最速で生む
    source: /process-compass/phase4-process-design/tailoring-guide/
    priority: 20

  - id: r-d-vendor
    when:
      q-dev-form: [vendor]
    adjustments:
      - target: { type: role, id: value-owner }
        action: note
        note: 受注側は価値責任者になれない(担えるのは機能責任者まで)。価値責任者を発注側に置くことを契約時に合意する
      - target: { type: role, id: value-owner }
        action: note
        note: 顧客へ示した見積りを版ごとに残し書き換えない。変更の見積りは示した版との差として示す。契約で固定した範囲に触れる調整は契約変更の起点(標準 第8章 軸D、ADR-0100)
      - target: { type: gate, id: g-req-agree }
        action: set
        param: contractual
        value: true
        note: 要件合意(G-2)を契約上の確認行為に対応づけるかどうかと、対応づける先を、締結時に決めて記録する(テンプレ8 第9項)
      - target: { type: gate, id: g-release }
        action: set
        param: contractual
        value: true
        note: リリース決裁(G-8)を契約上の確認行為に対応づけるかどうかと、対応づける先を、締結時に決めて記録する(テンプレ8 第9項)
      - target: { type: practice, id: acceptance }
        action: note
        note: 契約が成果物の適否を確認する行為を定める場合、確認の基準を受入基準への適合に限定する構成を発注側へ提案する(生成手段を問わない)
      - target: { type: practice, id: handover }
        action: note
        note: 引き継ぎ文書の粒度を契約で規定する(委託解消時の理解の空白を防ぐ)
    reason: AI生成コードの契約不適合責任は未整備の論点。成果物の適否の確認の基準を受入基準への適合に限定すれば、既存の確認の実務に載せられる
    source: /process-compass/phase4-process-design/tailoring-guide/
    priority: 20
