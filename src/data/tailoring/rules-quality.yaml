# 軸C: 期待品質・規制による調整規則
# 出典: /phase4-process-design/tailoring-guide/ の軸Cの表
# 品質・規制の規則は事業フェーズの省略指示より優先する(priority 30)
schemaVersion: 0
name: 軸C 期待品質・規制
rules:
  - id: r-c-high
    when:
      q-quality: [quality-high]
    adjustments:
      - target: { type: gate, id: g-ci }
        action: strengthen
        note: CI基準を引き上げる(カバレッジ基準の強化)
      - target: { type: gate, id: g-indep-review }
        action: set
        param: coreReviewerCount
        value: 2
        note: コア機能の独立レビューは2名で実施する(コア機能は確約範囲・コア指定のパスと区分の下限の規則のパス。G-5 と出荷の証跡の集約が承認者の数を数える。パスが未宣言なら「確かめられない」と出る)
      - target: { type: gate, id: g-ship }
        action: strengthen
        note: 出荷判定に限定的な抜き取り確認を追加する
      - target: { type: practice, id: ai-usage }
        action: note
        note: コア機能の設計判断はAI単独で行わない(人の判断を必須にする)
    reason: 停止・誤動作が社会・金銭に影響する場合、検証の網を参照モデルより厚くする
    source: /process-compass/phase4-process-design/tailoring-guide/
    priority: 30

  - id: r-c-regulated
    when:
      q-quality: [quality-regulated]
    adjustments:
      - target: { type: gate, id: g-ci }
        action: strengthen
        note: CI基準を引き上げ、規制要件の自動チェックを追加する
      - target: { type: gate, id: g-indep-review }
        action: set
        param: reviewerCount
        value: 2
        note: 独立レビューは2名で実施する
      - target: { type: gate, id: g-indep-review }
        action: set
        param: recordFormat
        value: audit
        note: レビュー記録は監査対応書式で残す
      - target: { type: gate, id: g-ship }
        action: strengthen
        note: 出荷判定に規制当局向けエビデンスとAI関与範囲の明記を追加する
      - target: { type: practice, id: traceability }
        action: set
        param: required
        value: true
        note: AI生成箇所のトレーサビリティ(どこを生成し誰が承認したか)を必須にする
    reason: 規制業では「AIがどこを生成し、誰が承認したか」の追跡が監査要件になる。最初から監査書式で運用しないと後から再構成できない
    source: /process-compass/phase4-process-design/tailoring-guide/
    priority: 30

  # 1〜2名の体制で規制業は、構成そのものを認めない(第8章 軸A)。エンジンは構成を拒否しないため、
  # 認めない組み合わせであることを提案の注記として出す。準拠テンプレートは初期化で拒否する(#318 突合 X-12)
  - id: r-c-regulated-small-team-not-allowed
    when:
      q-team-size: [size-1-2]
      q-quality: [quality-regulated]
    adjustments:
      - target: { type: process }
        action: note
        note: 規制業を 1〜2名の体制で扱う構成は認めない。判定の時点そのものが監査要件になるため、3名以上の体制を確保する(第8章 軸A)
    reason: 規制業では判定の時点そのものが監査要件になり、1〜2名の体制では席を分けられない(ADR-0028)
    source: /process-compass/phase4-process-design/tailoring-guide/
    priority: 30
