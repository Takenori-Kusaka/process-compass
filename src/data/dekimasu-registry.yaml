# 文末の肯定の「できます/できる」の登録簿(#366 / ADR-0117)
#
# 規定の文書(本文8章と規定の附属書)の、文末が「できます」か「できる」の文の全件を、区分つきで登録する。
# 登録簿に無い文が現れると、npm run lint:dekimasu(scripts/check-dekimasu.mjs)が失敗する。本文から消えた登録も失敗する。
# 機械は、許容か能力かを判定しない。区分の当否は、登録の差分を人が読んで確かめる(第1章 1.7.4)。
# 書式と運用は community/provision-forms.md「文末の『できます』の登録簿」による。
#
# id    — #366 の抽出の識別子(K-NNN)。新しく登録する文は、空いている次の番号を振る。番号を再利用しない
# page  — src/content/docs/ からの相対パス(拡張子なし)
# class — capability(能力・可能性)/ criterion(判定基準・条件・力量要件の項目)/ other(命題など)。
#         許容(permission)は置けない。許容は「〜してよいものとします/〜してよい」の形で書く(第1章 1.7.1)
# basis — 区分の根拠。ai-blind: 文脈を分けた2つの AI の読み手が前後1文で振り分けた(一致 75/75)。
#         ai-context: AI の裁定役が頁の文脈(表の列の見出し・節の見出し)で確かめた。human: 人が読んで登録した。
#         ai-blind と ai-context の文は、人が読んでいない(第1章 1.7.4 の EV-0234)
# text  — 文。リンクを文字列に直し、末尾の句点・括弧・強調・読点を外した形。行番号では引かない(行は動く)
#
# 振り分けの記録は research/366-deliberation/(classification-366.json)にある。
