# 準拠テンプレートの様式が持つべき必須欄の対応表(ADR-0040 / #227)
#
# 正本は標準の第6章(src/content/docs/phase4-process-design/deliverable-templates.md)。
# テンプレートの様式は標準の部分集合とし、必須欄の存在だけを検査する。
#
# 検査は2方向で行う。
#   標準 → 対応表     : standard の文字列が標準の本文に実在するか
#   対応表 → テンプレート: template の文字列がテンプレートの様式に存在するか
# 片方向では、対応表が古い欄名を保持したまま通る。
#
# 欄を落とす場合は omit に理由を書く。標準側の実在の検査は続く。
# 標準と逆の指示を書く形は、omit で登録できない(ADR-0040 決定4)。
schemaVersion: 0

