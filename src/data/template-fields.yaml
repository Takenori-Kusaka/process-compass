# 準拠テンプレートの様式が持つべき必須欄の対応表(ADR-0040 / #227)
#
# 正本は標準の第6章(src/content/docs/phase4-process-design/deliverable-templates.md)。
# テンプレートの様式は標準の部分集合とし、必須欄の存在だけを検査する。
#
# 検査は2方向で行う。
#   標準 → 対応表     : standard の文字列が標準の本文に実在するか
#   対応表 → テンプレート: template の文字列がテンプレートの様式に存在するか
# 片方向では、対応表が古い欄名を保持したまま通る。
#
# 欄を落とす場合は omit に理由を書く。標準側の実在の検査は続く。
# 標準と逆の指示を書く形は、omit で登録できない(ADR-0040 決定4)。
schemaVersion: 0

forms:
  - id: t0
    name: テンプレ0 意思決定・エスカレーション体制図(D-0)
    file: templates/00-d0-governance.md
    fields:
      - standard: '## 表1: 決定の権限'
        template: 決定の権限
      - standard: '## 表2: 権限境界(トレランス)'
        template: 権限境界(トレランス)
      - standard: 市場・顧客仮説の検証の実施
        template: 市場・顧客仮説の検証の実施
      - standard: '## 表4: 障害時のエスカレーション'
        template: 障害時の指揮系統
      - standard: '## 表6: 独立性の確認'
        template: 独立性の確認

  - id: t1
    name: テンプレ1 機能仕様書
    file: templates/01-feature-spec.md
    fields:
      - standard: '## 受入基準(検証可能な形式で。曖昧語禁止)'
        template: 受入基準
      - standard: '## 未確定事項'
        template: 未確定事項
      - standard: NEEDS CLARIFICATION
        template: NEEDS CLARIFICATION

  - id: t2
    name: テンプレ2 判断記録(ADR)
    file: templates/02-adr.md
    fields:
      - standard: '## 比較した代替案(最低1つ)'
        template: 検討した選択肢
      - standard: 顕在化が分かる兆候
        template: 顕在化が分かる兆候
      - standard: 回復に要する時間
        template: 回復に要する時間
      - standard: 取り消しの可否
        template: 取り消しの可否
      - standard: 影響する必達基準
        template: 影響する必達基準

  - id: t3
    name: テンプレ3 技術負債台帳
    file: templates/03-debt-ledger.md
    fields:
      - standard: 受容理由
        template: 受容した理由
      - standard: 返却目安
        template: 返却の目安
      - standard: 区分は**負債 / 例外 / 未解決**のいずれか
        template: 未解決

  - id: t4
    name: テンプレ4 ゲート判定記録
    file: templates/04-gate-record.md
    fields:
      - standard: '## 挙動要約(G-6 独立レビューのみ必須)'
        template: 挙動要約
      - standard: '## 決断の記録(G-8・SG・例外承認で必須)'
        template: 決断の記録
      - standard: 確認していない事項
        template: 確認していない事項
