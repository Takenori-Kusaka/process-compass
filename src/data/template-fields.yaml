    fields:
      - standard: '## 2. 測定する指標'
        template: 測定する指標
      - standard: '## 5. 監査'
        template: 監査
      - standard: '## 7. 知財潔白性'
        template: 知財の扱い
      - standard: 事業者の知財補償の扱い
        template: 事業者の知財補償
      - standard: 結果責任を負う者
        template: 結果責任を負う者
        omit: 発注側・受注側の対応表(第2節)で判定の置き場所とともに定めるため、知財の表では重複させない

  - id: t9
    name: テンプレ9 AIエージェント安全リスクアセスメント表
    file: templates/09-safety-risk-assessment.md
    fields:
      - standard: Hz-nnn
