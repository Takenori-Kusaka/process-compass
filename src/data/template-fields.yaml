      - standard: '## 表9: 組織継続の状態の受容'
        template: 組織継続の状態の受容
      - standard: '| 状態 | 対象 | 受容した者 | 受容の期限 | 照らした層1 の版 |'
        template: '| 状態 | 対象 | 受容した者 | 受容の期限 | 照らした層1 の版 |'
      # --- #288 第6巡 ---
