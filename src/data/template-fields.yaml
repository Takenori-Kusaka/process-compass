# 準拠テンプレートの様式が持つべき必須欄の対応表(ADR-0040 / #227)
#
# 正本は標準の第6章(src/content/docs/phase4-process-design/deliverable-templates.md)。
# テンプレートの様式は標準の部分集合とし、必須欄の存在だけを検査する。
#
# 検査は2方向で行う。
#   標準 → 対応表     : standard の文字列が標準の本文に実在するか
#   対応表 → テンプレート: template の文字列がテンプレートの様式に存在するか
# 片方向では、対応表が古い欄名を保持したまま通る。
#
# 欄を落とす場合は omit に理由を書く。標準側の実在の検査は続く。
# 標準と逆の指示を書く形は、omit で登録できない(ADR-0040 決定4)。
schemaVersion: 0

forms:
  - id: t0
    name: テンプレ0 意思決定・エスカレーション体制図(D-0)
    file: templates/00-d0-governance.md
    fields:
      - standard: '## 表1: 決定の権限'
        template: 決定の権限
      - standard: '## 表2: 権限境界(トレランス)'
        template: 権限境界(トレランス)
      - standard: 市場・顧客仮説の検証の実施
        template: 市場・顧客仮説の検証の実施
      - standard: '## 表4: 障害時のエスカレーション'
        template: 障害時の指揮系統
      - standard: '## 表6: 独立性の確認'
        template: 独立性の確認
      # --- 席・責任者・担い手と運用形態(ADR-0054)、体制の変化点(ADR-0055) ---
      - standard: 責任者(現任者)
        template: 責任者(現任者)
      - standard: '## 表7: 担い手と運用形態'
        template: 担い手と運用形態
      - standard: 委任の範囲(機械の規則の所在)
        template: 委任の範囲
      - standard: 適合性確認の期限または失効条件
        template: 適合性確認
      - standard: AI が使えないときの扱い(人へ戻す / 止める)
        template: AI が使えないときの扱い
      - standard: '## 表8: 改訂履歴(体制の変化点の記録)'
        template: 改訂履歴
      - standard: 無効になった確認(やり直しの要否)
        template: 無効になった確認
      - standard: 失効した確認と例外(再確認の期日)
        template: 失効した確認
      # 即時の通知を要する事象では、通知先と通知日を変化点の記録へ残す(第3章 3.13.6)
      - standard: 通知先と通知日(即時の通知を要する事象)
        template: 通知先と通知日(即時の通知を要する事象)
      # 「D-0 体制図の決定の権限を持つ者」を1人に定める行(緩める向きの決定者、変更種別の登録者)
      - standard: 体制と運用形態(責任者の任免、運用形態の宣言、ステージの変更)
        template: 体制と運用形態(責任者の任免、運用形態の宣言、ステージの変更)
      - standard: 標準変更カタログへの登録(委任の範囲となる変更種別)
        template: 標準変更カタログへの登録(委任の範囲となる変更種別)

  - id: t1
    name: テンプレ1 機能仕様書
    file: templates/01-feature-spec.md
    fields:
      - standard: '## 受入基準(検証可能な形式で。曖昧語禁止)'
        template: 受入基準
      - standard: '## 未確定事項'
        template: 未確定事項
      - standard: NEEDS CLARIFICATION
        template: NEEDS CLARIFICATION

  - id: t2
    name: テンプレ2 判断記録(ADR)
    file: templates/02-adr.md
    fields:
      - standard: '## 比較した代替案(最低1つ)'
        template: 検討した選択肢
      - standard: 顕在化が分かる兆候
        template: 顕在化が分かる兆候
      - standard: 回復に要する時間
        template: 回復に要する時間
      - standard: 取り消しの可否
        template: 取り消しの可否
      - standard: 影響する必達基準
        template: 影響する必達基準

  - id: t3
    name: テンプレ3 技術負債台帳
    file: templates/03-debt-ledger.md
    fields:
      - standard: 受容理由
        template: 受容した理由
      - standard: 返却目安
        template: 返却の目安
      - standard: 区分は**負債 / 例外 / 未解決**のいずれか
        template: 未解決
      # 例外承認の記録が変更に対応づく条件(第4章 G-7 基準5、第7章 7.3)
      - standard: '| 対象 | 対象 | 例外を適用する変更または成果物'
        template: '| 対象 |'
      - standard: '| 承認した者 | 承認した者 | D-0 表1「例外承認」の決定者の記名'
        template: '| 承認した者 |'

  - id: t4
    name: テンプレ4 ゲート判定記録
    file: templates/04-gate-record.md
    fields:
      # 判定の語彙は第4章の2値(ADR-0036)。確定の形態は運用形態(ADR-0054)
      - standard: 通過 / 差し戻し
        template: 通過 / 差し戻し
      - standard: '## 確定の形態'
        template: 確定の形態
      # 体制の変化点の後に、改訂前の D-0 を参照した判定を検出する(ADR-0055 決定6)
      - standard: 参照した D-0 の版
        template: 参照した D-0 の版
      # リスク区分を確定した者の記名(第3章 3.8.1)。自己記載のままなら保証の開示へ出る(ADR-0056 決定6)
      - standard: 変更のリスク区分(変更を対象とする判定のみ)
        template: 変更のリスク区分
      - standard: 区分を確定した者を記名する
        template: リスク区分を確定した者
      - standard: '## 挙動要約(G-6 独立レビューのみ必須)'
        template: 挙動要約
      - standard: '## 決断の記録(G-8・SG・例外承認で必須)'
        template: 決断の記録
      - standard: 確認していない事項
        template: 確認していない事項
      - standard: 判断が変わる条件
        template: 判断が変わる条件
      # 異議の有無は必ず記載する。「異議なし」と未記載を区別する(ADR-0056 決定5)
      - standard: 出荷判定者の異議(リリース決裁 G-8 の記録に限る)
        template: 出荷判定者の異議(リリース決裁 G-8 の記録に限る)
      - standard: '## 比較した選択肢(R1 および例外承認で必須)'
        template: 比較した選択肢
      - standard: 残存リスク
        template: 残存リスク

  - id: t5
    name: テンプレ5 運用引き継ぎ文書
    file: templates/05-handover.md
    fields:
      - standard: '## 監視項目'
        template: 監視
      - standard: '## 復旧手順'
        template: 切り戻し
      - standard: '## 既知の負債・制約'
        template: 技術負債

  - id: t6
    name: テンプレ6 企画書
    file: templates/06-project-brief.md
    fields:
      - standard: '## 戦略整合(観点1)'
        template: 戦略整合(観点1)
      - standard: コンテキスト基盤の初期整備費
        template: コンテキスト基盤の初期整備費
      - standard: 期待効果(長期)
        template: 期待効果(長期)
      - standard: '## 中止条件(観点6)'
        template: 中止条件(観点6)
      - standard: 予算の4区分
        template: 予算の4区分
      - standard: 参照した過去案件
        template: 参照した過去案件

  - id: t7
    name: テンプレ7 実装計画
    file: templates/07-implementation-plan.md
    fields:
      - standard: '## 粒度チェック(G-4 提出前セルフチェック)'
        template: 粒度の確認
      - standard: '## スタック構成(依存する変更を積み上げる場合のみ)'
        template: スタック構成(依存する変更を積み上げる場合のみ)
      - standard: '## AIエージェントへ与える分割の指示'
        template: エージェントへ与える分割の指示

  - id: t8
    name: テンプレ8 AI-SLA 合意確認書
    file: templates/08-ai-sla.md
    fields:
      - standard: '## 2. 測定する指標'
        template: 測定する指標
      - standard: '## 5. 監査'
        template: 監査
      - standard: '## 7. 知財潔白性'
        template: 知財の扱い
      - standard: 事業者の知財補償の扱い
        template: 事業者の知財補償
      - standard: 結果責任を負う者
        template: 結果責任を負う者
        omit: 発注側・受注側の対応表(第2節)で判定の置き場所とともに定めるため、知財の表では重複させない

  - id: t9
    name: テンプレ9 AIエージェント安全リスクアセスメント表
    file: templates/09-safety-risk-assessment.md
    fields:
      - standard: Hz-nnn
        template: Hz-nnn
      - standard: SR1 / SR2 / SR3 / SR4
        template: SR1 / SR2 / SR3 / SR4
      - standard: '## 4. 隔離の対象外'
        template: 隔離の対象外
      - standard: RRS1
        template: RRS1
      - standard: '## 5. 残留リスクの受容'
        template: 残留リスクの受容
      - standard: '### 完全版で追加する項目'
        template: 完全版で追加する項目

  - id: t10
    name: テンプレ10 前提の台帳
    file: templates/10-assumption-ledger.md
    fields:
      - standard: AC-0 / AC-1 / AC-2
        template: AC-0
      - standard: 対処の参照先
        template: 対処の参照先
      - standard: 劣化時の進め方
        template: 劣化時の進め方
      - standard: 有効期限
        template: 有効期限
