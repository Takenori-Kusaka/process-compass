name: Auto-update Knowledge Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'graphify-out/**'

# 最上位は読み取りだけ。書き込みはジョブ単位で付ける(Issue #293 裁定 J-6 f)。
# このジョブのコミットは [skip ci] を持ち、CI・公開・配布を起動しない。対象(graphify-out/)はサイトと配布物に入らない
permissions:
  contents: read

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install graphifyy
        run: uv tool install graphifyy

      - name: Run graphify update
        run: graphify update .

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update knowledge graph [skip ci]"
          file_pattern: "graphify-out/* .gitattributes"
