name: Auto-update Knowledge Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'graphify-out/**'

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install graphifyy
        run: uv tool install graphifyy

      - name: Run graphify update
        run: graphify update .

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update knowledge graph [skip ci]"
          file_pattern: "graphify-out/* .gitattributes"
