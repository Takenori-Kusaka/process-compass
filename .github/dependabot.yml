# 依存関係の更新
#
# ------------------------------------------------------------------
# 見送りの規則
# ------------------------------------------------------------------
#
# 更新を取り込めない場合、**PR を放置しません**。次のいずれかを行います。
#
#   1. 直せるなら直す(例: 別の版へ上げる)
#   2. 直せないなら、下の ignore へ**理由と見直し期限を書いて**登録する
#
# 「あとで見る」で PR を開いたままにする運用を採りません。開いたままの PR は、
# 見送ったのか忘れたのかを区別できません。これは本標準の「宣言のない省略は
# 追跡できない」(第8章)と同じ理由によります。
#
# ignore へ書くときは、次を必ず添えます。
#
#   - 何が起きるのか(観測できる事象で書く。「動かない」だけでは足りない)
#   - いつ見直すのか(YYYY-MM。期限のない除外を作らない)
#   - 何が得られたら解除するのか(上流の修正、代替の版、など)
#
# 書式の例:
#
#   ignore:
#     # 7.1.6 でプリレンダ生成時に neotraverse の forEach が解決できずビルドが落ちる。
#     # 見直し 2026-11。上流が修正した版が出たら解除する。
#     - dependency-name: "astro"
#       versions: ["7.1.6"]
#
# 恒久的な除外を作りません。期限が来たら、解除できるかを確認します。
#
# ------------------------------------------------------------------
# 現在の見送り: なし
# ------------------------------------------------------------------
#
# astro 7.1.6 のビルド失敗は 7.2.0 へ上げて解消したため、ignore は不要です。

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-npm:
        patterns: ["*"]
    # 見送りが必要になったら、上の規則に従ってここへ書く
    ignore: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore: []
